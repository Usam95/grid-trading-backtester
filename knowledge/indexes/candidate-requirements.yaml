  requirement: 'The backtesting system shall load monthly CPI data (source: FRED,
    Eurostat, etc.), 10-year government bond yields, and equity index prices; compute
    fair-value regression models with 1) 15+ year monthly lookback, 2) 52-week weekly
    lookback, 3) 60-day daily lookback; and output model coefficients, R-squared,
    and confidence intervals (±1σ, ±2σ) for each horizon.'
  acceptance_tests:
  - Given EUR/USD historical data 1993-2009, system produces monthly regression model
    with F-stat > 10 and explainable R² > 0.2
  - Weekly and daily regressions recompute each period; coefficients and R² are logged
    and can be audited
  - Confidence bands widen from daily (tightest) to monthly (broadest) as specified
    in book
  failure_prevented: Incorrect regression implementation leads to wrong fair-value
    thresholds and entry signals; poor data ingestion leads to data misalignment.
  capability_enabled: Enables hypothesis HYP-001 backtest and fair-value-based entry/exit
    logic.
  assumptions:
  - Economic data (CPI, yields) are available from public sources (FRED, ECB, national
    treasuries) with acceptable latency
  - Historical data for 1993-2009 are continuous and reliable
  open_questions:
  - How to handle data revisions (e.g., CPI restatements) in backtests?
  - How to adapt regression for post-2008 era when yields fell to zero and QE distorted
    relationships?
  dependencies: Time-series data pipeline; statistical library (Python statsmodels
    or similar)
  verification_needed: Out-of-sample backtest on 2008-2009 period; compare model fair-value
    bands to actual price action and documented deviations in book (Iraq invasion
    dummy variable, 2008 bubble top).
  priority_hint: correctness
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: REQ-002
  title: System shall track CFTC non-commercial positioning with proper open-interest
    normalization
  status: proposed
  derived_from:
  - FXA-ch5-001
  derivation_type: direct_book_recommendation
  rationale: Book acknowledges that absolute CFTC positioning values are not directly
    comparable across time due to open-interest growth (24K avg 2000 vs. 109K avg
    2008). System must normalize positions as percentile or z-score relative to rolling
    historical median/std-dev so that extremes are comparable across eras.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - backtest
    asset_class:
    - crypto_futures
    concern:
    - data
  requirement: The system shall ingest CFTC non-commercial positioning data (net longs/shorts)
    weekly; compute rolling 52-week percentile ranks and z-scores; flag positioning
    as extreme when percentile > 90th or < 10th (or |z-score| > 1.5); output normalized
    positioning metric alongside raw positions for audit.
  acceptance_tests:
  - Given CFTC data 2000-2008, percentile normalization yields consistent thresholds
    (90th/10th) that do not drift as open-interest grows
  - Extreme positioning flags align with peaks/troughs in EUR/USD price deviations
    from trend (Figure 5.3 in book)
  failure_prevented: Using raw position counts as entry signals leads to false signals
    after 2004 when open-interest doubled; market structure change is not accommodated.
  capability_enabled: Enables hypothesis HYP-002 backtest (CFTC positioning extremes
    predict reversals).
  assumptions:
  - CFTC data are published as specified (weekly, non-commercial segregated)
  - Rolling 52-week window is sufficient for normalization
  open_questions:
  - Is 52-week or 36-month rolling window better for normalization?
  - Post-Dodd-Frank position limits changed extreme thresholds; should model retrain
    on newer baselines?
  dependencies: CFTC COT data feed (USDA WASDE or Bloomberg); statistical library
    for percentile/z-score computation
  verification_needed: 'Audit: compare percentile-normalized positioning to book''s
    Figure 5.2/5.3 illustrations; confirm peaks align with EUR/USD reversals.'
  priority_hint: correctness
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: REQ-003
  title: System shall detect market regime (trending vs. range-bound) to filter oscillator
    signals
  status: proposed
  derived_from:
  - FXA-ch8-001
  - FXA-ch8-005
  - FXA-risk-001
  derivation_type: agent_inference
  rationale: Book demonstrates that oscillators (RSI, stochastic) succeed in range-bound
    markets (>55% win rate) but fail in trending markets (<40% win rate, 20-30% drawdowns).
    Live trading and backtesting systems must distinguish regimes in real-time to
    avoid deploying oscillator signals in trending markets where they cause losses.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - backtest
    asset_class:
    - shared
    concern:
    - risk
  requirement: 'The system shall compute a real-time market regime indicator: trending
    (ATR > 1.5% of price or price outside 20-day Bollinger Bands for 2+ weeks) vs.
    range-bound (ATR < 1%, price within bands). When regime is detected as trending,
    suppress or reduce weight of oscillator-based signals. When regime is range-bound,
    enable oscillator signals at normal weight.'
  acceptance_tests:
  - Regime detection aligns with visual inspection of weekly charts (e.g., EUR/USD
    2006-2008 is tagged as trending; 2002-2004 is mixed)
  - Oscillator signal win rate is significantly higher in detected range-bound regimes
    than in trending regimes (difference > 15 percentage points)
  failure_prevented: Oscillator signals applied to trending markets produce large
    drawdowns and erode account; risk-management discipline is broken.
  capability_enabled: Enables hypothesis HYP-003 validation and risk-managed deployment
    of oscillator-based strategies.
  assumptions:
  - ATR and Bollinger Bands are standard technical indicators
  - Regime transitions are not so frequent as to disable strategies entirely
  open_questions:
  - What if a market is transitioning (e.g., breakout from range)? Should signals
    be gradually suppressed or switched instantly?
  - Should regime detection use multiple timeframes (daily, weekly) or just one?
  dependencies: TA-Lib or similar library for ATR and Bollinger Band computation
  verification_needed: 'Backtest EUR/USD 2006-2008 with regime filter: measure win
    rate with filter on vs. off; confirm filter removes most of the 20%+ drawdown
    periods.'
  priority_hint: correctness
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: REQ-004
  title: System shall implement combined fundamental-positioning-technical filter
    with configurable AND/OR logic
  status: proposed
  derived_from:
  - FXA-intro-001
  - FXA-case-001
  derivation_type: agent_inference
  rationale: 'Book case studies show that combining all three pillars (fundamental
    fair-value deviation, positioning extremes, technical signals) improves signal
    quality. System must allow configuration of how filters combine: AND (all three
    must be true), OR (any), or probabilistic (weighted). Enables testing of hypothesis
    HYP-004.'
  applies_to:
    strategy:
    - shared
    lifecycle:
    - backtest
    asset_class:
    - shared
    concern:
    - alpha
  requirement: 'The system shall accept a filter-combination specification: AND (all
    three pillars), OR (any one), or WEIGHTED (e.g., 0.5*fundamental + 0.3*positioning
    + 0.2*technical). For each trade signal, the system shall compute a combined score,
    log component scores for audit, and generate entry/exit signals based on combined
    score threshold.'
  acceptance_tests:
  - Given three independent signals (fundamental, positioning, technical), AND combination
    produces fewer but higher-quality signals
  - System logs all component scores so that signal quality can be audited (e.g.,
    fundamental was true, positioning was false, technical was false)
  failure_prevented: Monolithic signal logic cannot be tested in isolation; component
    failures are not debuggable.
  capability_enabled: Enables flexible strategy research and hypothesis HYP-004 testing
    (combined filter vs. single pillars).
  assumptions:
  - Components scores can be combined into a unified signal (e.g., 0-1 scale)
  open_questions:
  - What weights should each pillar receive? Should they be learned from data or set
    by rules?
  - How to handle component failure (e.g., regression model diverges; do we zero out
    fundamental signal or flag as error)?
  dependencies: Component implementations (REQ-001, REQ-002, oscillator signals)
  verification_needed: Backtest combined filter 2003-2008; measure Sharpe ratio and
    win rate improvement vs. single-pillar signals; confirm no overfitting.
  priority_hint: research_quality
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: REQ-005
  title: System shall log and alert on model divergence and parameter instability
  status: proposed
  derived_from:
  - FXA-ch4-001
  derivation_type: direct_book_recommendation
  rationale: Book documents that regression coefficients and correlations with EUR/USD
    change substantially over time (e.g., 10-year bond spread correlation flipped
    sign 2001-2003 and 2004-2007). Live trading must detect these changes to avoid
    applying stale models. System shall monitor rolling correlations and R-squared;
    alert when parameters shift significantly.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - live
    asset_class:
    - shared
    concern:
    - risk
  requirement: The system shall compute rolling 36-month correlations of each regression
    explanatory variable (CPI ratio, bond spread, equity index) with EUR/USD. When
    rolling correlation changes sign or drops below 0.1 in magnitude (indicating weak
    relationship), log alert and freeze trading with that model until retrained. When
    regression R-squared drops below 0.15 for two consecutive periods, flag model
    as unreliable.
  acceptance_tests:
  - System detects bond-spread sign flip in 2001-2003 period (illustrated in book)
    and alerts trader
  - Model R-squared tracked and logged weekly; freezing logic is transparent and auditable
  failure_prevented: Stale models with invalid coefficients produce false signals
    and losses; no early warning of model breakdown.
  capability_enabled: Enables robust, adaptive deployment of regression-based strategies
    with real-time risk monitoring.
  assumptions:
  - Parameter shifts are detectable within 2-4 week windows
  open_questions:
  - What is an acceptable drift before model re-training? 0.1 correlation change?
    0.05 R² drop?
  - Should model be automatically re-trained or require manual review?
  dependencies: Regression model implementation; alert logging system
  verification_needed: 'Backtesting: confirm alert logic catches documented structural
    breaks (Iraq invasion, 9/11, 2008 bubble) in near-real-time.'
  priority_hint: correctness
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: REQ-006
  title: System shall measure and report backtest metrics aligned with book case studies
  status: proposed
  derived_from:
  - FXA-ch8-001
  - FXA-ch8-005
  derivation_type: direct_book_recommendation
  rationale: 'Book provides specific case-study metrics: win rate (%), average gain/loss
    (%), cumulative return (%), maximum drawdown (%). Backtesting system must compute
    identical metrics to enable reproducible validation against book-era results and
    ensure no implementation gaps.'
  applies_to:
    strategy:
    - shared
    lifecycle:
    - backtest
    asset_class:
    - shared
    concern:
    - simulation
  requirement: 'The backtesting system shall compute and output, for each strategy:
    (1) win rate (% of closed trades that are profitable), (2) average winning trade
    size (%), (3) average losing trade size (%), (4) cumulative return (%), (5) maximum
    drawdown (%), (6) win:loss ratio. System shall report metrics separately for each
    currency pair and each time period (e.g., annual or quarterly).'
  acceptance_tests:
  - EUR/USD RSI backtest 1998-2008 produces 48.9% win rate, 3.8% avg gain, 2.6% avg
    loss, 28.9% cumulative return (matches book Figure 8.x)
  - GBP/USD stochastic backtest produces 39% win rate, 1.3% avg gain, 1.01% avg loss,
    -16.2% cumulative return (matches book)
  failure_prevented: Incorrect backtest metrics hide implementation errors or data
    misalignment; results cannot be compared to book baseline.
  capability_enabled: Enables validation and reproducibility of book case studies;
    ensures backtest credibility.
  assumptions:
  - Metrics are computed on closed trades only (no open P&L)
  - Trade entry/exit prices are specified in strategy rules
  open_questions:
  - Should drawdown be computed as maximum peak-to-trough in dollars, %, or number
    of std devs?
  - How to handle ties (break-even trades)?
  dependencies: Core backtest engine; P&L calculation
  verification_needed: Reproduce book case studies (EUR/USD RSI, GBP/USD stochastic,
    AUD/USD stochastic) with exact metrics matching.
  priority_hint: correctness
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: REQ-007
  title: System shall handle FX transaction costs and slippage in backtest execution
  status: proposed
  derived_from:
  - FXA-ch4-001
  - FXA-ch5-001
  derivation_type: agent_inference
  rationale: Book case studies do not explicitly deduct transaction costs. Real trading
    incurs bid/ask spreads (2-3 pips spot FX, 0.5 pips futures), slippage (1 pip avg),
    and potential commissions. Backtest must include these costs to match real-world
    P&L and avoid optimistic bias.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - backtest
    asset_class:
    - shared
    concern:
    - simulation
  requirement: 'The backtesting system shall apply configurable transaction costs
    on each trade entry and exit: (1) bid/ask spread (default 2 pips EUR/USD, 0.5
    pips futures), (2) slippage (default 1 pip), (3) commission/broker fee (default
    0 for spot, $2 per futures contract). System shall report backtest metrics net
    of costs and separately gross of costs for transparency.'
  acceptance_tests:
  - 'Given a strategy with 50 round-trip trades (100 fills) on EUR/USD, 2-pip spread
    applied at entry and exit: 4 pips × 50 = 200 pips total cost = ~0.5-1% of notional
    on 100K notional'
  - System reports gross P&L (before costs) and net P&L (after costs) side-by-side
  failure_prevented: Backtest results overstate profitability; live trading encounters
    worse-than-expected returns due to unaccounted costs.
  capability_enabled: Enables realistic backtest results and better trading decisions
    based on net profitability.
  assumptions:
  - Bid/ask spreads are consistent (actual spreads vary with liquidity; average is
    reasonable baseline)
  - Slippage is 1 pip on average (varies by order size, time of day, market vol)
  open_questions:
  - How to model slippage for large position sizes? Should slippage scale with volume?
  - Should overnight holding be charged an overnight financing cost (forex carry rates)?
  dependencies: Backtester; P&L calculator
  verification_needed: Backtest a high-turnover strategy; measure impact of costs
    on annual return (should reduce by 1-3% for typical strategies).
  priority_hint: correctness
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: REQ-008
  title: System shall validate strategy parameter sensitivity and out-of-sample robustness
  status: proposed
  derived_from:
  - FXA-ch8-006
  derivation_type: agent_inference
  rationale: Book demonstrates that technical indicators (RSI, stochastic) produce
    dramatically different results across currency pairs (EUR/USD 28.9%, GBP/USD -16.2%,
    AUD/USD +26.6% on same logic). System must compute parameter sensitivity (e.g.,
    RSI over different periods) and measure out-of-sample performance to detect over-fitting
    and improve generalization.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - research
    asset_class:
    - shared
    concern:
    - reproducibility
  requirement: 'The system shall support parameter sweeps: test strategies with multiple
    parameter values (e.g., RSI period 10, 12, 14, 16, 20) and measure performance
    on in-sample and out-of-sample periods. System shall report correlation of in-sample
    vs. out-of-sample performance to quantify over-fitting. When out-of-sample performance
    degrades >20%, flag parameter set as over-fit.'
  acceptance_tests:
  - 'Given RSI strategy on EUR/USD 1998-2008: test RSI periods 10-20; measure win
    rate on 1998-2005 (in-sample) and 2006-2008 (out-of-sample); report correlation
    and over-fit risk'
  - Strategy parameters that optimize for one currency pair (EUR/USD) are tested on
    another pair (GBP/USD) to measure transfer generalization
  failure_prevented: Over-fitted parameters work well in backtest but fail in live
    trading; hidden over-fitting is not detected.
  capability_enabled: Enables robust strategy development and reduces risk of parameter
    curve-fitting.
  assumptions:
  - Out-of-sample periods are truly held-out (not used for optimization)
  open_questions:
  - How many out-of-sample periods are needed for robust evaluation (1 year? 3 years?)?
  - Should random seeds be fixed to ensure reproducibility?
  dependencies: Backtester; parameter sweep tools; statistical analysis
  verification_needed: Test book EUR/USD RSI on different RSI periods; verify that
    optimal period on 1998-2005 has different performance on 2006-2008.
  priority_hint: research_quality
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: CODCAP-R1
  title: Backtesting framework shall support slippage and partial fill modeling
  status: proposed
  derived_from:
  - CODCAP-C6-002
  derivation_type: agent_inference
  rationale: Book backtesting chapter does not address fill assumptions; backtest-to-live
    gap is a known source of strategy failure. Framework must model latency-induced
    slippage and partial fills to match live execution.
  applies_to:
    strategy:
    - stock_signal
    - grid
    lifecycle:
    - backtest
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - simulation
    - data
  requirement: The backtesting framework shall accept configurable slippage parameters
    (fixed basis points, percentage-based, or latency-based model) and shall model
    partial order fills based on available liquidity at execution price, with results
    logged per-trade.
  acceptance_tests:
  - Execute a mock strategy in backtest with zero slippage; compare to live broker
    fills (if available)
  - Run same strategy with +5bp slippage; verify P&L decreased by expected amount
  - Test partial fill scenario; verify order queue and remaining size tracked correctly
  failure_prevented: Strategy deployed and fails live due to unmodeled slippage; trader
    blames backtest tool rather than strategy.
  capability_enabled: Realistic backtest P&L; reduced backtest-to-live divergence;
    more honest strategy performance assessment.
  assumptions:
  - Slippage model parameters can be estimated from broker data
  - Partial fill logic is deterministic and reproducible
  open_questions:
  - How to model slippage for illiquid venues?
  - Should slippage model include market impact?
  dependencies:
  - CODCAP-R2
  verification_needed: Audit broker logs to calibrate slippage model; compare backtest
    P&L to live P&L on same strategy.
  priority_hint: correctness
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-R2
  title: Data pipeline shall validate incoming ticks for staleness, out-of-order,
    and price anomalies
  status: proposed
  derived_from:
  - CODCAP-C12-001
  derivation_type: direct_book_recommendation
  rationale: Real-time data processing chapter discusses streaming architectures but
    does not specify data quality checks. Malformed or stale data poisons backtest
    and live signal quality.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - data
    - monitoring
  requirement: 'The data ingestion pipeline shall implement validation checks: (1)
    tick sequence is monotonically increasing by timestamp, (2) quote staleness (quote
    age > 10s triggers alert), (3) price anomaly detection (price move > 5% from last
    valid quote triggers review), and (4) duplicate tick rejection. All anomalies
    shall be logged for audit.'
  acceptance_tests:
  - Inject out-of-order ticks; verify rejected or reordered
  - Inject stale quotes; verify alert raised
  - Inject price spike (realistic market event); verify anomaly flagged and logged
  - Backtest with validation ON vs. OFF; document any P&L divergence
  failure_prevented: Bad data causes unexecutable orders, phantom fills, or incorrect
    risk calculations.
  capability_enabled: High-confidence data pipeline; audit trail for anomalies; early
    detection of broker/feed issues.
  assumptions:
  - Anomaly thresholds are calibrated to specific market and asset class
  - Validation does not introduce unacceptable latency
  open_questions:
  - How aggressive should price anomaly threshold be?
  - What is acceptable data loss rate due to validation?
  dependencies: []
  verification_needed: Audit incoming data for anomalies; compare detected rate to
    industry benchmarks; test live vs. historical quality.
  priority_hint: correctness
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-R3
  title: Risk management system shall halt trading if maximum drawdown threshold is
    exceeded
  status: proposed
  derived_from:
  - CODCAP-C8-001
  derivation_type: direct_book_recommendation
  rationale: Risk chapter identifies maximum drawdown as key control; system must
    enforce it operationally to prevent spiral losses during adverse market conditions.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - paper
    - live
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - risk
    - monitoring
    - operations
  requirement: The risk management system shall calculate rolling maximum drawdown
    (peak equity minus current equity) every trading cycle. If drawdown exceeds configured
    threshold (e.g., 20% of peak equity), system shall (1) flatten all open positions,
    (2) halt new trade entry, (3) alert operations, and (4) log decision with timestamp
    and reason.
  acceptance_tests:
  - Run strategy in backtest; artificially trigger drawdown scenario; verify halt
    executed at correct threshold
  - Paper trade with 20% drawdown threshold; simulate 25% adverse move; verify positions
    closed
  - Verify that halt decision is logged and retrievable for audit
  failure_prevented: Uncontrolled loss spiral; trader loses entire account before
    reacting.
  capability_enabled: Bounded loss protection; clear operational halt signal; auditability
    for regulatory compliance.
  assumptions:
  - Drawdown calculation is real-time and accurate
  - Position flatten is deterministic and does not introduce additional slippage
  open_questions:
  - Should drawdown be absolute or relative to initial account?
  - How long should halt persist (manual resume vs. automatic after fixed time)?
  dependencies: []
  verification_needed: Stress test with rapidly declining market; verify halt triggered
    within acceptable latency; audit log entries.
  priority_hint: safety
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-R4
  title: Execution layer shall support async I/O for multi-stream market data ingestion
  status: proposed
  derived_from:
  - CODCAP-C9-001
  derivation_type: direct_book_recommendation
  rationale: Python chapter on concurrency recommends async patterns; event-driven
    architecture enables low-latency handling of multiple concurrent market feeds
    without thread proliferation.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - execution
    - operations
  requirement: The market data ingestion layer shall use Python asyncio (or equivalent
    event-driven library) to multiplex multiple broker/feed connections onto a single
    event loop, with maximum latency from broker tick emission to algorithm receipt
    < 100ms and maximum CPU thread count <= 4 for 100+ concurrent streams.
  acceptance_tests:
  - 'Benchmark latency: emit test ticks from mock broker; measure time to algorithm
    receipt (p50, p99, p999)'
  - 'Load test: connect 100+ concurrent streams; verify CPU usage is linear, not exponential
    in thread count'
  - Verify no data loss or duplicate ticks under sustained high-frequency load
  failure_prevented: Naive synchronous multi-threading causes context-switch overhead
    and limits scalability; high latency misses trading opportunities.
  capability_enabled: Scalable low-latency data ingestion; efficient resource utilization;
    foundation for multi-asset strategies.
  assumptions:
  - Async client libraries are available for all broker APIs
  - Event loop does not block on any I/O operation
  open_questions:
  - Can we safely multiplex order execution on same event loop as data ingestion?
  - How to debug async race conditions in production?
  dependencies: []
  verification_needed: Latency benchmark on production broker connection; compare
    to existing synchronous implementation.
  priority_hint: operability
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-R5
  title: Backtesting framework shall implement walk-forward validation for parameter
    optimization
  status: proposed
  derived_from:
  - CODCAP-C13-002
  derivation_type: agent_inference
  rationale: Book discusses ML and overfitting but does not provide detailed validation
    methodology. Walk-forward testing is gold standard for detecting overfitting;
    framework must automate it.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - research
    - backtest
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - reproducibility
    - alpha
  requirement: 'The backtesting framework shall support walk-forward optimization:
    specify train window size, test window size, and step size; for each window, optimize
    parameters on train data, evaluate on held-out test data, and report per-window
    test performance (Sharpe, max drawdown, return). System shall track parameter
    stability across windows and flag overfitting (high in-sample performance, low
    out-of-sample performance).'
  acceptance_tests:
  - Define 5-year historical backtest; set train=3y, test=1y, step=6m; verify 10 windows
    generated
  - Optimize strategy parameters on first train window; evaluate on first test window;
    repeat for remaining windows
  - Compare parameter values across windows; if identical, flag as potential underfit;
    if highly variable, flag as potential overfit
  - Generate report showing test-set Sharpe per window; verify consistency
  failure_prevented: Strategy optimized on single backtest period; overfits to that
    period; fails in live trading.
  capability_enabled: Robust parameter discovery; early detection of overfitting;
    higher confidence in strategy generalization.
  assumptions:
  - Historical data is sufficient for multiple windows
  - Parameter optimization is deterministic and reproducible
  open_questions:
  - Optimal window sizes for different market regimes?
  - How to compare strategies with different parameter counts?
  dependencies: []
  verification_needed: Validate walk-forward implementation against academic literature;
    compare to industry standard tools.
  priority_hint: research_quality
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-R6
  title: Monitoring system shall alert on infrastructure health degradation (latency
    spikes, data loss)
  status: proposed
  derived_from:
  - CODCAP-C11-001
  derivation_type: direct_book_recommendation
  rationale: Infrastructure chapter emphasizes resilience and monitoring; system must
    proactively detect degradation before it causes trading failures.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - paper
    - live
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - monitoring
    - operations
  requirement: 'The monitoring system shall measure and alert on: (1) order execution
    latency (submission to fill, target < 500ms; alert if p99 > 1s), (2) data ingestion
    latency (broker tick to algorithm receipt, target < 100ms; alert if p99 > 500ms),
    (3) data loss (fractional ticks received vs. expected, target > 99.9%; alert if
    < 99%), and (4) infrastructure process health (CPU/memory usage, thread count,
    exception rate). Alerts shall be logged and sent to operations channel in real-time.'
  acceptance_tests:
  - Simulate latency spike; verify alert triggered within 1 minute
  - Simulate data loss scenario (dropped packets); verify < 99% threshold triggers
    alert
  - Verify alert contains actionable context (timestamp, metric value, threshold)
  failure_prevented: Degraded infrastructure goes unnoticed; strategy makes decisions
    on stale data; losses accumulate before remedy.
  capability_enabled: Early detection of system issues; rapid response; reduced mean
    time to recovery.
  assumptions:
  - Metrics can be collected without significant latency overhead
  - Alert thresholds are calibrated to strategy and market
  open_questions:
  - What latency is acceptable for different strategy types?
  - How to distinguish legitimate operational degradation from market anomalies?
  dependencies: []
  verification_needed: Audit alerting during live trading; verify responsiveness and
    accuracy.
  priority_hint: operability
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-R7
  title: Position sizing logic shall respect per-venue liquidity constraints to avoid
    failed fills
  status: proposed
  derived_from:
  - CODCAP-C10-001
  - CODCAP-C8-001
  derivation_type: direct_book_recommendation
  rationale: Multi-asset chapter emphasizes asset-class differences; risk chapter
    discusses position sizing but does not address liquidity. Position size must be
    calibrated to venue liquidity to avoid execution failure.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - execution
    - risk
  requirement: Position sizing logic shall query available liquidity (bid-ask volume
    at execution price) before finalizing order size. If desired position size exceeds
    available liquidity in a single tick, logic shall (1) split order across multiple
    price levels, (2) reduce position size to fit in best available liquidity, or
    (3) reject trade if position size cannot be met. Configuration shall specify venue-specific
    liquidity thresholds per asset class.
  acceptance_tests:
  - Query mock liquidity data; request position size > available; verify order is
    split or rejected per policy
  - Backtest with varying liquidity profiles; track fill rate (should be near 100%)
  - Paper trade with live liquidity data; verify no stuck orders or unexpected partial
    fills
  failure_prevented: Position size exceeds available liquidity; order times out or
    fills at much worse prices than expected.
  capability_enabled: Reliable execution; reduced slippage; fewer stuck orders.
  assumptions:
  - Liquidity data is available in real-time
  - Liquidity snapshot is reasonably stable over order lifetime
  open_questions:
  - How to handle intraday liquidity seasonality?
  - Should we prioritize execution speed or liquidity availability?
  dependencies:
  - CODCAP-R2
  verification_needed: Audit fill rates across different venues; compare backtest
    liquidity assumptions to live experience.
  priority_hint: correctness
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-R8
  title: Strategy shall not deploy without completed walk-forward backtest and positive
    out-of-sample Sharpe ratio
  status: proposed
  derived_from:
  - CODCAP-C13-002
  - CODCAP-C6-002
  derivation_type: agent_inference
  rationale: Book does not validate profitability claims; risk of deploying untested
    strategies is high. Require evidence of out-of-sample performance before live
    deployment.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - backtest
    - live
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - alpha
    - reproducibility
  requirement: Before deploying a strategy to paper or live trading, strategy shall
    have completed walk-forward backtest across at least 5 windows, with test-set
    (out-of-sample) Sharpe ratio >= 0.5 averaged across windows, and test-set maximum
    drawdown <= 25%. Backtest shall include slippage, transaction costs, and risk
    controls. Report shall be archived and linked to deployment.
  acceptance_tests:
  - Attempt to deploy strategy without walk-forward test; system rejects with clear
    error message
  - Run walk-forward test; generate compliance report with pass/fail criteria
  - Verify test-set metrics meet thresholds; deployment proceeds only if passed
  failure_prevented: Untested strategy deployed; fails live and causes losses.
  capability_enabled: Higher confidence strategy selection; documented decision trail;
    compliance audit trail.
  assumptions:
  - Test-set Sharpe is predictive of live Sharpe
  - Thresholds are reasonably calibrated
  open_questions:
  - Are Sharpe and max drawdown the right criteria?
  - Should we include other tests (e.g., calmar ratio, sortino)?
  dependencies:
  - CODCAP-R5
  verification_needed: Audit deployed strategies; correlate backtest metrics to live
    performance; refine thresholds based on experience.
  priority_hint: correctness
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: REGIME-REQ-001
  title: Real-time regime tracking must detect regime transitions within configurable
    latency threshold
  status: proposed
  derived_from:
  - REGIME-C5-001
  - REGIME-C5-002
  derivation_type: agent_inference
  rationale: For live trading and early-warning systems, regime transition detection
    must occur before drawdown onset or volatility spike. Unacceptable lag reduces
    edge and increases loss exposure.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - live
    asset_class:
    - equities
    - crypto_spot
    - shared
    concern:
    - monitoring
    - risk
    - execution
  requirement: The regime tracking system shall detect regime transitions (measured
    as Naive Bayes posterior probability crossing a threshold) within 60 seconds (configurable,
    defaults to 60 seconds) of the actual regime change onset, measured against ground-truth
    labels or secondary volatility indicators.
  acceptance_tests:
  - Given a regime transition event (marked by HMM state change or known market shock),
    when regime tracking pipeline runs, then Naive Bayes posterior probability for
    new regime exceeds threshold within 60 seconds.
  - Measured on backtests spanning at least 3 known regime transitions (Brexit June
    2016, COVID March 2020, another major event).
  - Out-of-sample validation on independent market data confirms latency within SLA
    for 95% of regime transitions.
  failure_prevented: Delayed regime detection would cause late entry/exit, missing
    the early-warning benefit and potentially locking in losses.
  capability_enabled: Early trade entry/exit based on regime changes; proactive risk
    management; edge capture before other market participants.
  assumptions:
  - Regime transitions are detectable before volatility spikes materialize (detection
    lag < realized volatility lag)
  - 60-second latency is acceptable for target trading strategies and markets
  - Latency budget is dominated by DC event accumulation and Naive Bayes inference,
    not I/O or network
  open_questions:
  - Is 60 seconds optimal, or should it be market-dependent (longer for equities,
    shorter for crypto)?
  - How does latency scale with market data volume (high-frequency vs. low-frequency
    instruments)?
  dependencies:
  - Requires data ingestion latency <5 seconds (other requirement)
  - Requires HMM/Naive Bayes model pre-trained and deployed (other requirement)
  verification_needed: Backtest latency measurement (compare timestamp of regime-change
    signal to timestamp of underlying market move); live system monitoring of latency
    distribution (mean, p95, p99).
  priority_hint: correctness
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-REQ-002
  title: DC indicator calculation must tolerate data quality gaps and edge cases
  status: proposed
  derived_from:
  - REGIME-C2-002
  - REGIME-C3-003
  derivation_type: agent_inference
  rationale: In production, tick data often has gaps (market halts, exchange downtime,
    data feed outages), duplicates, and outliers. Naive DC calculation would break
    or produce spurious indicators; robust handling is needed for operability.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - backtest
    - live
    asset_class:
    - equities
    - crypto_spot
    - shared
    concern:
    - data
    - simulation
    - operations
  requirement: The DC indicator calculation pipeline shall handle missing data points
    (>10-second gaps), duplicate ticks, zero-volume candles, and outlier prices (>5σ
    from rolling mean) by either interpolating/imputing or flagging as unreliable
    and skipping; shall not crash or produce NaN indicators. Shall document handling
    method and impact on regime signal reliability.
  acceptance_tests:
  - Given tick data with 5% missing points, when DC calculation runs, then indicator
    R is computed for all valid trends without crashing; no NaN or inf values in output.
  - Given tick data with duplicate timestamps, when DC calculation runs, then duplicates
    are deduplicated before trend calculation; R matches expected output.
  - Given tick data with outlier price spike (flash crash), when DC calculation runs,
    then spike is either flagged or handled via rolling median; regime signal does
    not flap erratically.
  - Test on real market data from multiple venues/assets with known data quality issues.
  failure_prevented: Production pipeline crashes on malformed data, leading to loss
    of regime signals and trading downtime.
  capability_enabled: Robust regime tracking across real market data with imperfect
    quality; operational resilience.
  assumptions:
  - Data gaps are random, not systematic (e.g., not correlated with regime transitions)
  - Imputation method (e.g., forward-fill, linear interpolation) does not systematically
    bias DC indicator
  - Outlier handling (flagging or median-filter) preserves signal while rejecting
    noise
  open_questions:
  - What imputation method minimizes bias in DC indicator for different asset classes?
  - Should data quality issues be logged and trigger manual review, or handled silently?
  dependencies:
  - Requires data validation and cleaning layer before DC calculation
  verification_needed: 'Test on real data with injected gaps and outliers; compare
    to clean-data baseline. Operational monitoring: track fraction of DC calculations
    that encounter data issues and recovery method.'
  priority_hint: operability
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-REQ-003
  title: HMM regime model must be calibrated and validated on representative data;
    out-of-sample validation required
  status: proposed
  derived_from:
  - REGIME-C3-001
  - REGIME-C3-002
  derivation_type: agent_inference
  rationale: HMM parameter fitting is prone to overfitting, especially on short datasets
    or during extreme market periods. Without rigorous out-of-sample validation, deployed
    models may fail in novel regimes. Prevents catastrophic underperformance.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - research
    - backtest
    asset_class:
    - equities
    - crypto_spot
    - shared
    concern:
    - reproducibility
    - risk
  requirement: 'For each market and asset class, the HMM regime model shall be trained
    on ≥2 years of representative data (including at least one normal and one stress
    period), then validated on held-out data (≥6 months, different calendar period).
    Model acceptance requires: (a) regime classification accuracy ≥75% on validation
    set, (b) detected regimes align with known market events (major volatility spikes),
    (c) out-of-sample performance within 20% of in-sample performance (no overfitting).
    Training/validation/test split and model parameters shall be documented in model
    card.'
  acceptance_tests:
  - Given training data for market X (2 years), when HMM is fitted via EM, then likelihood
    converges and parameters are stable (no EM divergence).
  - Given validation data (6 months, disjoint from training), when HMM regime inference
    runs, then regime transitions align with known volatility spikes or market events;
    accuracy ≥75%.
  - Measured across multiple markets (DJIA, FTSE 100, EUR-GBP, etc.); consistency
    indicates generalization.
  - Out-of-sample accuracy within 20% of in-sample; if accuracy drops >20%, model
    flagged for retraining.
  failure_prevented: Deployed model overfitted to backtest period; fails to detect
    regimes in live trading, undermining entire system.
  capability_enabled: Reliable regime detection in novel market conditions; confidence
    in model generalization.
  assumptions:
  - 2 years of data is sufficient for stable HMM fit (EM convergence)
  - Held-out validation data is representative of future market regimes (stationarity
    assumption, which may be violated)
  - Regime classification accuracy ≥75% is acceptable threshold (tradeoff between
    overfitting and underfitting)
  open_questions:
  - How to handle non-stationary markets where held-out validation data is from different
    regime distribution?
  - Should model be refit monthly/quarterly to adapt to regime drift, or is annual
    refit sufficient?
  dependencies:
  - Requires data quality/validation pipeline (REGIME-REQ-002)
  - Requires definition of ground-truth regime labels for validation
  verification_needed: 'Model card: document training data dates, validation dates,
    hyperparameters, accuracy metrics. Rolling-window backtest to assess model stability
    over time.'
  priority_hint: correctness
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-REQ-004
  title: DC threshold theta must be selected via principled tuning procedure or adaptive
    mechanism
  status: proposed
  derived_from:
  - REGIME-C3-003
  - REGIME-C2-002
  derivation_type: agent_inference
  rationale: The DC threshold theta significantly affects regime detection sensitivity.
    Arbitrary choice (e.g., theta=0.4% in book) may not generalize to new markets
    or time periods. Requires systematic selection or adaptation to prevent threshold
    misselection.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - research
    asset_class:
    - equities
    - crypto_spot
    - shared
    concern:
    - reproducibility
  requirement: 'For each market and asset class, the DC threshold theta shall be selected
    via one of: (a) grid search on validation data using regime classification accuracy
    as metric, or (b) adaptive mechanism (e.g., percentile of recent volatility) that
    adjusts theta quarterly. Tuning procedure shall be documented, reproducible, and
    tested on at least 3 markets. Sensitivity analysis shall report how regime detection
    results change with ±20% variation in theta.'
  acceptance_tests:
  - Given range of candidate thresholds (e.g., 0.2%, 0.4%, 0.6%, 0.8%), when grid
    search runs on validation data, then optimal theta identified with regime classification
    accuracy as criterion.
  - Given optimal theta for market X, when applied to market Y without retuning, then
    regime classification accuracy on Y is within 15% of accuracy when theta is tuned
    on Y (generalization test).
  - Given optimal theta, when ±20% perturbation applied, then regime transitions change
    by <5% (stability test).
  - 'Procedure is reproducible: same data + procedure → same theta.'
  failure_prevented: Threshold mismatch (too low → excessive false regimes; too high
    → missed transitions) leads to poor regime detection and trading performance.
  capability_enabled: Systematic, reproducible threshold selection; confidence in
    threshold applicability across markets.
  assumptions:
  - Optimal theta is stable within ±20% perturbation
  - Grid search or adaptive mechanism can identify reasonable theta in reasonable
    time
  - Threshold is transferable across related markets (e.g., EUR pairs) with 85%+ accuracy
  open_questions:
  - Is adaptive theta better than fixed, tuned theta? Does intra-market drift in theta
    require continuous adaptation?
  - Can machine learning (e.g., Bayesian optimization) improve threshold selection?
  dependencies:
  - Requires validation dataset with regime labels
  - Requires DC indicator computation (REGIME-REQ-002)
  verification_needed: 'Sensitivity analysis: plot regime classification accuracy
    vs. theta; report optimal and +/-20% values. Generalization test: tune theta on
    one market, test on another; report accuracy degradation.'
  priority_hint: research_quality
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-REQ-005
  title: Regime-aware trading strategies must include realistic transaction cost model
    and live trading validation
  status: proposed
  derived_from:
  - REGIME-C6-001
  - REGIME-C6-003
  derivation_type: agent_inference
  rationale: Proof-of-concept algorithms (JC1, JC2) are backtested without slippage,
    commissions, or market impact. In live trading, these costs often erase backtest
    gains. Strategies must be validated with realistic cost assumptions and live testing
    before capital deployment.
  applies_to:
    strategy:
    - stock_signal
    lifecycle:
    - backtest
    - live
    asset_class:
    - equities
    - crypto_spot
    concern:
    - execution
    - risk
    - alpha
  requirement: 'Before deploying a regime-aware trading strategy to live trading,
    the strategy shall be: (a) backtested with transaction cost model including bid-ask
    spread (realistic per-instrument), commissions (e.g., 2 bps), and estimated market
    impact (e.g., 0.5-2 bps depending on order size/venue), (b) forward-tested on
    live data (paper trading) for ≥3 months, reporting realized vs. backtest metrics
    (win rate, Sharpe ratio, drawdown, transaction costs), (c) deployed with position
    size ≤10% of single-instrument live P&L allocation until 100+ signal-driven trades
    accumulated and out-of-sample metrics confirm backtest assumptions.'
  acceptance_tests:
  - Given backtest with transaction costs included, when strategy runs, then out-of-sample
    Sharpe ratio ≥80% of in-sample (allowable degradation).
  - Given live paper-trading run (3 months), when results compared to backtest, then
    realized transaction costs within 20% of model; Sharpe ratio within 25% of backtest.
  - Given live deployment at reduced position size, when 100+ trades accumulated,
    then live Sharpe ratio ≥70% of paper trading, with no catastrophic loss events
    (max single-trade loss <2% of position size).
  failure_prevented: Strategies that work in backtest but fail in live trading due
    to underestimated costs; loss of capital and confidence.
  capability_enabled: Confidence that regime-based trading strategies have real-world
    edge; safe capital deployment.
  assumptions:
  - Backtest cost model reflects realistic market conditions for target venue/asset
  - Paper trading accurately reflects live execution
  - 100 trades in 3 months provides sufficient sample for statistical validation
  open_questions:
  - How to model market impact for different order sizes and market conditions?
  - Should position sizing adapt to regime or regime-change probability, or remain
    fixed?
  dependencies:
  - Requires live trading infrastructure (order execution, position tracking)
  - Requires regime tracking system deployed and validated (REGIME-REQ-001)
  verification_needed: 'Backtest: compare results with and without costs; report cost
    drag. Paper trading: log all signals, fills, costs; compare to backtest assumptions.
    Live deployment: monitor Sharpe ratio, drawdown, and costs; alert if out-of-sample
    performance degrades >30%.'
  priority_hint: safety
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-REQ-006
  title: Regime model must be retrained or re-validated periodically to detect regime-definition
    drift
  status: proposed
  derived_from:
  - REGIME-C7-001
  derivation_type: direct_book_recommendation
  rationale: Markets evolve over time. Regimes defined on 2016-2018 data may not apply
    to 2023-2024 markets due to regulatory changes, algorithmic trading proliferation,
    or structural shifts. Periodic retraining ensures regime definitions remain relevant;
    monitoring for drift provides early warning of model staleness.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - live
    asset_class:
    - equities
    - crypto_spot
    - shared
    concern:
    - monitoring
    - operations
    - risk
  requirement: Regime models shall be re-validated quarterly on recent data (past
    3-6 months, disjoint from training set). If regime classification accuracy drops
    >15% vs. previous validation (indicating drift), the model shall be flagged for
    retraining. Retraining shall incorporate recent market data and re-calibrate HMM
    parameters. Model versioning and change log shall be maintained. Any major market
    regime (e.g., crisis) not represented in training data shall trigger emergency
    retraining and alert.
  acceptance_tests:
  - Given quarterly validation run, when model accuracy is computed on recent data,
    then accuracy is compared to baseline; if drop >15%, retraining triggered.
  - Given retraining procedure, when new data and EM algorithm applied, then new model
    converges and accuracy on held-out validation data ≥75%.
  - Given model deployment, when accuracy metrics logged quarterly, then trend of
    accuracy degradation is visible; alerts triggered if trend crosses threshold.
  - Model version and change log maintained; retraining rationale and data periods
    documented.
  failure_prevented: 'Model staleness: regimes become obsolete, detection fails, trading
    strategy underperforms or incurs unexpected losses.'
  capability_enabled: Continuous model monitoring and updating; adaptive regime detection
    over time.
  assumptions:
  - Quarterly revalidation is sufficient frequency (tradeoff between monitoring overhead
    and drift detection)
  - 15% accuracy drop is detectable signal of meaningful regime drift (not just noise)
  - Retraining is feasible within 1-2 weeks; does not disrupt live operations
  open_questions:
  - What is appropriate retraining frequency? Should it be data-driven (adaptive)
    or calendar-driven (quarterly)?
  - How to detect emergent regimes (e.g., new regime type not seen in training data)?
  dependencies:
  - Requires model validation infrastructure and alerts (REGIME-REQ-003)
  - Requires data pipeline and HMM training setup
  verification_needed: 'Operational dashboard: display quarterly model accuracy, retraining
    triggers, model version history. Alerting: automated notification when accuracy
    drop triggers retraining.'
  priority_hint: operability
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: FINMAC-REQ-001
  title: Backtest harness shall validate transaction costs and slippage
  status: proposed
  derived_from:
  - FINMAC-C37-002
  - FINMAC-C42-001
  derivation_type: direct_book_recommendation
  rationale: Backtests without realistic costs overstate live returns; slippage and
    market impact are primary sources of strategy decay
  applies_to:
    strategy:
    - stock_signal
    - shared
    lifecycle:
    - backtest
    asset_class:
    - equities
    concern:
    - simulation
    - execution
  requirement: The backtest engine shall accept commission (% or fixed), market impact
    (linear or square-root of volume fraction), and slippage (bid-ask spread + execution
    price variance) as configurable parameters. The engine shall report realized transaction
    costs as separate line item in P&L.
  acceptance_tests:
  - Realistic cost model (0.1% round-trip) reduces Sharpe by X%; verify against paper
    trading data
  failure_prevented: Prevents overly-optimistic backtest results inflating expected
    live performance
  capability_enabled: Accurate simulation of execution reality
  assumptions:
  - Commission structure stable
  - Market impact model is reasonable
  open_questions: Market impact function form (linear vs. nonlinear)? Regime-dependent?
  dependencies: Market data quality; broker API latency modeling
  verification_needed: Compare backtest cost model to real paper trading costs
  priority_hint: correctness
  _book_id: financial-machina-machine-learning-for-finance-the-quintesse-2024
  _audit_grade: C
- id: FINMAC-REQ-002
  title: ML models shall be validated via walk-forward backtesting
  status: proposed
  derived_from:
  - FINMAC-C27-002
  derivation_type: direct_book_recommendation
  rationale: Walk-forward validation simulates live retraining and prevents look-ahead
    bias; critical for reproducible, trustworthy backtests
  applies_to:
    strategy:
    - stock_signal
    lifecycle:
    - backtest
    asset_class:
    - equities
    concern:
    - simulation
    - reproducibility
  requirement: 'The backtest framework shall support walk-forward mode: (1) Initialize
    train window (e.g., 2 years); (2) Train model; (3) Test on subsequent non-overlapping
    period (e.g., 6 months); (4) Expand train window, repeat. Hyperparameter tuning
    shall occur only on training data; no future data leakage.'
  acceptance_tests:
  - OOS Sharpe within 80% of training Sharpe; max DD not anomalous vs. rolling windows;
    code audit confirms no look-ahead
  failure_prevented: Prevents false confidence in strategies that only work in-sample
  capability_enabled: Realistic performance estimates; reproducibility
  assumptions:
  - Market regimes are locally stationary
  - Retraining captures drift
  open_questions: Optimal train/test window lengths? Auto-retraining frequency?
  dependencies: Reliable market data; stable signal construction
  verification_needed: Compare walk-forward OOS Sharpe to live paper trading Sharpe
  priority_hint: correctness
  _book_id: financial-machina-machine-learning-for-finance-the-quintesse-2024
  _audit_grade: C
- id: FINMAC-REQ-003
  title: Production models shall have automated retraining trigger and performance
    monitoring
  status: proposed
  derived_from:
  - FINMAC-C07-001
  derivation_type: direct_book_recommendation
  rationale: Models degrade as market regimes shift; automated monitoring and retraining
    catch deterioration and prevent cumulative losses
  applies_to:
    strategy:
    - shared
    lifecycle:
    - live
    asset_class:
    - shared
    concern:
    - monitoring
    - reproducibility
  requirement: The live trading system shall (1) Log model predictions and realized
    outcomes daily; (2) Compute rolling Sharpe ratio (30-day window) of live predictions
    vs. strategy performance; (3) Alert if rolling Sharpe falls 30% below baseline;
    (4) Trigger automatic retraining on alert (or hourly/daily schedule if specified);
    (5) Retain model version history and enable one-step rollback.
  acceptance_tests:
  - Model degradation detected within 5 trading days; rollback completes within 1
    minute; version history accurate
  failure_prevented: Prevents "zombie model" running silently while market regime
    changes
  capability_enabled: Adaptive strategy; reduced max drawdown in regime transitions
  assumptions:
  - Market drift is detectable within 5-30 days
  - Retraining pipeline is fast enough
  open_questions: Optimal degradation threshold? Retraining cost vs. model rot?
  dependencies: 'Infrastructure: job scheduler, model versioning, logging'
  verification_needed: Test on historical regime changes (2008 crisis, COVID, etc.)
  priority_hint: safety
  _book_id: financial-machina-machine-learning-for-finance-the-quintesse-2024
  _audit_grade: C
- id: FINMAC-REQ-004
  title: Feature engineering shall not introduce look-ahead bias
  status: proposed
  derived_from:
  - FINMAC-C06-002
