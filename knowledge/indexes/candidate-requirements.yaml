  failure_prevented: Margin call or unexpected costs due to incorrect commission/margin
    estimates
  capability_enabled: Pre-trade risk validation and cost estimation
  assumptions:
  - whatIf is supported by IB API version in production
  - whatIf responses are fast enough for high-frequency trading
  open_questions:
  - What is the latency of whatIf response? Is it suitable for high-frequency strategies?
  - Does whatIf response include all commission components (IB markup, exchange fees,
    clearing fees)?
  dependencies:
  - whatIf API support in IB API client library
  - Order state parsing to extract commission and margin fields
  verification_needed: Compare whatIf estimates to actual costs over 100+ trades;
    identify any systematic bias or outliers
  priority_hint: safety
  _book_id: account-management-users-guide-2015
  _audit_grade: B
- id: IBAPI-REQ-006
  title: System shall support order modification via order ID resubmission
  status: proposed
  derived_from:
  - IBAPI-C1-005
  derivation_type: direct_book_recommendation
  rationale: Order ID can be reused to modify price/quantity without cancellation;
    this is useful for dynamic price management in grid strategies.
  applies_to:
    strategy:
    - grid
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - crypto_spot
    - crypto_futures
    - equities
    - shared
    concern:
    - execution
    - operations
  requirement: The live trading system may resubmit an existing order using the same
    order ID with modified price or quantity to update the order in-place. System
    shall verify that only price and quantity fields are modified; order type and
    action shall not be changed via modification (requires cancel + replace).
  acceptance_tests:
  - Place order ID 1 with price P1/qty Q1; resubmit with price P2/qty Q1; verify order
