- id: HPTS-R-003
  title: Position sizing module shall implement fixed-dollar-risk formula
  status: proposed
  derived_from:
  - HPTS-C6-003
  derivation_type: direct_book_recommendation
  rationale: Book mandates position sizing inversely proportional to stop distance;
    ensures consistent dollar risk per trade
  applies_to:
    strategy:
    - stock_signal
    - grid
    - portfolio
    - shared
    lifecycle:
    - backtest
    - live
    asset_class:
    - equities
    - shared
    concern:
    - risk
    - alpha
    - reproducibility
  requirement: 'Position sizing module shall compute position size using formula:
    size = fixed_risk_amount / (entry_price - stop_price), where fixed_risk_amount
    is expressed as a percentage of account equity and updatable'
  acceptance_tests: Verify position size calculation matches formula with 0.1% precision;
    verify position size scales inversely with stop distance; verify position size
    is capped to not exceed max_position_size_pct of account
  failure_prevented: Oversized positions when stops are loose; portfolio drawdown
    exceeds intended level
  capability_enabled: Risk-normalized position sizing; consistent portfolio volatility
  assumptions:
  - Stop-loss is executed at specified price (no gap risk or slippage)
  - Portfolio equity is up-to-date and accurate
  - Account has sufficient margin/buying power for calculated size
  open_questions: Should fixed_risk_amount be adaptive (e.g., increase if portfolio
    grows, decrease if drawdown)? How to handle multi-position correlation when sizing?
  dependencies: Requires accurate entry and stop prices; Requires real-time portfolio
    equity tracking
  verification_needed: 'Backtest: verify max single-trade loss = fixed_risk_amount
    for all trades'
  priority_hint: safety
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-R-004
