- id: NTFL-REQ-006
  title: Backtester shall implement walk-forward validation and out-of-sample testing
  status: proposed
  derived_from:
  - NTFL-C1-004
  - NTFL-C7-001
  derivation_type: direct_book_recommendation
  rationale: 'Study guide warns that systems optimized on historical data self-destruct
    when markets change.

    Walk-forward and out-of-sample testing detect curve-fitting and reveal generalization
    ability.

    '
  applies_to:
    strategy:
    - grid
    - stock_signal
    lifecycle:
    - backtest
    asset_class:
    - equities
    - crypto_futures
    concern:
    - simulation
    - reproducibility
  requirement: 'The backtester shall support walk-forward validation: divide history
    into (1) training window (e.g., 2 years),

    (2) out-of-sample test window (e.g., 6 months), repeat with rolling windows. For
    each window, system shall:

    Optimize parameters on training data; apply fixed parameters to test data; report
    test performance separately.

    System shall also support bootstrap resampling of trades to estimate parameter
    sensitivity.

    '
  acceptance_tests:
  - Walk-forward report shows in-sample (training) vs out-of-sample (test) Sharpe
    ratio; out-of-sample ≥ 80% of in-sample indicates acceptable generalization
  - System can reorder trades randomly and measure P&L distribution (robustness check)
  - Parameter sensitivity report shows which parameters have outsized impact on returns
  failure_prevented: Trader deploys system believing backtest performance will persist,
    but system fails in live trading due to curve-fitting
  capability_enabled: Honest assessment of true strategy edge; detection of over-optimization
  assumptions:
  - Historical data is representative of future regime
  open_questions:
  - What ratio (in-sample / out-of-sample) indicates acceptable generalization?
  - How large should training and test windows be?
  dependencies:
  - Historical price and trade data
  verification_needed: Compare backtest out-of-sample returns to live trading returns
    for 20+ deployed systems; correlation >0.5
  priority_hint: correctness
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
- id: NTFL-REQ-007
  title: Trader shall pause trading and analyze losses after significant drawdown
  status: proposed
  derived_from:
  - NTFL-C1-003
  derivation_type: agent_inference
  rationale: 'Study guide recommends that trader stop trading after losing 20% of
    account and analyze causes.

    Continuing to trade without reflection increases risk of revenge trading and compulsive
    behavior.

    Implementation as system rule enforces discipline at critical moments.

    '
  applies_to:
