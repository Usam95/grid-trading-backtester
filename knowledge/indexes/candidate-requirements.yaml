- id: MLPRO-REQ-005
  title: ML pipeline component decomposition and unit-level validation
  status: proposed
  derived_from:
  - MLPRO-C11-003
  - MLPRO-C11-004
  derivation_type: agent_inference
  rationale: Book demonstrates ML pipeline decomposition (parking detection). Trading
    ML systems should similarly decompose into modular components and validate each
    independently to diagnose failures.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - research
    - backtest
    asset_class:
    - shared
    concern:
    - data
    - simulation
    - reproducibility
  requirement: ML signal generation pipeline shall be decomposed into distinct stages
    (feature extraction, model inference, trade logic); each stage shall have independent
    test suite measuring precision, recall, and latency; pipeline unit tests shall
    execute before each backtest run.
  acceptance_tests:
  - Each component has defined inputs, outputs, and acceptance criteria
  - Unit tests exist and pass for >80% of code paths
  - End-to-end backtest Sharpe correlates with component metrics (e.g., model accuracy
