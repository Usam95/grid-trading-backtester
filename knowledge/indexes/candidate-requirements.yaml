- id: SUPSTK-R2
  title: Backtester shall support out-of-sample validation and hold-out test set
  status: proposed
  derived_from:
  - SUPSTK-C6-005
  - SUPSTK-C6-006
  derivation_type: agent_inference
  rationale: In-sample overfitting is pervasive; without out-of-sample validation,
    inflated backtest returns will masquerade as robust strategies. Book recommends
    robustness testing across regimes and time periods
  applies_to:
    strategy:
    - stock_signal
    - grid
    - portfolio
    lifecycle:
    - backtest
    - research
    asset_class:
    - equities
    - shared
    concern:
    - reproducibility
    - simulation
  requirement: Backtester shall support configurable train/test splits, walk-forward
    analysis, and hold-out test set evaluation. User shall be able to partition historical
    data and run strategy on disjoint test periods
  acceptance_tests:
  - User can specify 70% train / 30% test split; backtest reports in-sample and out-of-sample
    Sharpe separately
  - Walk-forward backtest iterates over rolling windows (e.g., 1-year train + 3-month
    test)
  - Warning issued if in-sample Sharpe is >2x out-of-sample (likely overfitting)
  failure_prevented: Deployment of overfit strategies that fail in live trading
  capability_enabled: Confidence in strategy robustness and generalization
  assumptions:
  - Future market regimes resemble historical regimes
  - Out-of-sample period is representative of live conditions
  open_questions:
  - What is the minimum out-of-sample period for statistical significance?
  - How to handle regime transitions in walk-forward analysis?
  dependencies: []
  verification_needed: Compare backtest vs live performance; measure correlation
  priority_hint: correctness
  _book_id: super-stock-trading-pro-algorithmic-trading-with-python
  _audit_grade: B
