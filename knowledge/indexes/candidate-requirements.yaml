  requirement: Entry filter shall calculate risk (entry_price - stop_price) and reward
    (target_price - entry_price) for each setup; reject entry if (reward / risk) <
    min_risk_reward_ratio (default 2.0)
  acceptance_tests: Verify entry is rejected when R/R < configured minimum; verify
