  - MLAT-R-002
  verification_needed: Out-of-sample backtest vs. live execution comparison
  priority_hint: correctness
  _book_id: machine-learning-for-algorithmic-trading-predictive-models-t-2020
  _audit_grade: A
- id: MLAT-R-005
  title: Data validation layer shall enforce schema, completeness, and stationarity
