    - simulation
  requirement: The backtester shall provide a trend line detection module that identifies
    trend lines with 3+ contact points (price touches) and signals when price breaks
    the line, optionally requiring confirmation (new high/low following break).
  acceptance_tests: 'Trend line identified when 3+ swing points touch line with <0.2%
    error; Trend line break detected when price crosses by configured margin; Optional
    confirmation: new high/low after break; Multiple trend lines tracked simultaneously'
  failure_prevented: Arbitrary trend lines; false breakout signals without confirmation
  capability_enabled: Trend line-based confluence signals; reversal pattern detection
  assumptions:
  - Trend lines are useful despite subjectivity (author recommendation)
  - Confirmation (new extreme) materially improves signal quality
  open_questions:
  - How to handle multiple valid trend lines on same data?
  - Should trend line angle/steepness affect signal strength?
  dependencies:
  - TTAM-REQ-001
  - TTAM-REQ-003
  verification_needed: 'Unit test: trend line identification on synthetic and real
    data; Manual validation: compare against chart review'
  priority_hint: correctness
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-REQ-008
  title: Backtester performance shall not degrade with 5+ years of historical data
  status: proposed
  derived_from:
  - TTAM-C6-001
  derivation_type: agent_inference
  rationale: Hypothesis validation and robustness checks require 5+ years of historical
    data. Backtester must maintain acceptable performance with large datasets.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - backtest
    - research
    asset_class:
    - shared
    concern:
    - operations
  requirement: The backtester shall complete a full backtest on 5 years of daily OHLC
    data (1,250+ bars) for a typical signal strategy within 5 seconds on a standard
    development machine (8-core, 16GB RAM).
  acceptance_tests: 5-year backtest completes in <5 seconds; Memory usage stays under
    2GB for typical strategies; Indicator calculations do not introduce accumulating
    errors
  failure_prevented: Backtester unusable for validation-quality research; extended
    iteration time
  capability_enabled: Rapid hypothesis iteration; walk-forward testing feasibility
  assumptions:
  - Backtester is optimized (not naive loop)
  - Standard dev machine is baseline for performance
  open_questions:
  - Should performance requirements scale with data volume (daily vs 5-min bars)?
  - Is 5 seconds sufficient for interactive research?
  dependencies:
  - TTAM-REQ-001
  - TTAM-REQ-005
  verification_needed: 'Performance benchmark: 5-year backtest timing and memory profile'
  priority_hint: operability
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-REQ-009
  title: Risk management shall validate position sizing for maximum drawdown constraint
  status: proposed
  derived_from:
  - TTAM-C1-001
  derivation_type: agent_inference
  rationale: Book emphasizes trading is about managing risk. Risk control system must
    validate that position sizing respects maximum drawdown constraints.
  applies_to:
    strategy:
    - stock_signal
    - grid
    - shared
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - equities
    - shared
    concern:
    - risk
  requirement: The risk management module shall calculate maximum drawdown for each
    trade position (initial capital to lowest point) and reject trades that would
    cause portfolio drawdown to exceed configured limit (e.g., 20%).
  acceptance_tests: Trade approved if portfolio remains within max drawdown limit;
    Trade rejected if drawdown would exceed limit; Running drawdown tracked and reported;
    Drawdown constraint reduces maximum observed loss
  failure_prevented: Uncontrolled drawdown; account ruin from over-leveraged positions
  capability_enabled: Capital preservation; controlled risk exposure
  assumptions:
  - Drawdown constraint is enforced before trade entry (not reactive)
  - Position sizing is adjusted to meet constraint
  open_questions:
  - Should drawdown constraint be portfolio-level or per-strategy?
  - How to handle overnight gaps in live trading?
  dependencies:
  - TTAM-REQ-001
  verification_needed: 'Unit test: drawdown calculation accuracy; Integration test:
    position sizing respects constraints'
  priority_hint: safety
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-REQ-010
  title: Backtester shall report results stratified by signal type and confluence
    factor count
  status: proposed
  derived_from:
  - TTAM-C6-003
  - TTAM-INF-001
  derivation_type: agent_inference
  rationale: To validate hypotheses about signal effectiveness and confluence impact,
    backtester must provide stratified reporting showing results by signal type and
    confluence count.
  applies_to:
    strategy:
    - shared
    lifecycle:
    - backtest
    - research
    asset_class:
    - shared
    concern:
    - reproducibility
  requirement: 'The backtester report shall include tables stratifying results by:
    (1) signal type (candlestick pattern, S/R, trend line, indicator), (2) confluence
    factor count (1, 2, 3+), and (3) market regime (trending, consolidating), showing
