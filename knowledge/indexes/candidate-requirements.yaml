- id: IBAPI-REQ-001
  title: System shall maintain monotonically-increasing order ID counter
  status: proposed
  derived_from:
  - IBAPI-C1-002
  - IBAPI-C1-005
  derivation_type: direct_book_recommendation
  rationale: IB API semantics require order ID to be strictly increasing; failure
    to maintain this will cause order modifications instead of new orders.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - crypto_spot
    - crypto_futures
    - equities
    - shared
    concern:
    - execution
    - operations
  requirement: The live trading system shall maintain a per-account order ID counter
    that increments by at least 1 for each new order placement; the counter shall
    be persisted across API reconnects and never be reset without explicit manual
    intervention.
  acceptance_tests:
  - Place 10 orders sequentially; verify each order ID is > previous ID
  - Disconnect API and reconnect; verify next order ID is > last order ID before disconnect
  - Run two grid strategies on same account; verify order IDs do not collide (requires
    coordination mechanism)
  failure_prevented: Unintended order modifications (e.g., cancel buy when intending
    to place new sell)
  capability_enabled: Reliable order placement with clear separation between new orders
    and order modifications
  assumptions:
  - Order ID counter starts at 1 or is initialized from last known order ID
  - No external system is placing orders with the same IDs
  open_questions:
  - How to initialize order ID counter for new account or after extended downtime?
  - What happens if order ID counter exceeds maximum integer value?
  dependencies:
  - Persistent state management (database/log) for order ID counter
  verification_needed: Run production trading for N days; audit order ID sequence
    for gaps or resets
  priority_hint: correctness
  _book_id: account-management-users-guide-2015
  _audit_grade: B
- id: IBAPI-REQ-002
  title: System shall calculate position size from Available Funds metric, not Buying
    Power
  status: proposed
  derived_from:
  - IBAPI-C2-001
  - IBAPI-C2-002
  derivation_type: direct_book_recommendation
  rationale: Available Funds accounts for account equity and initial margin requirement;
    using Buying Power (4x leverage) may lead to overleverage and margin calls.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - equities
    - shared
    concern:
    - risk
    - execution
    - operations
  requirement: The live trading system shall use Available Funds (not Buying Power
    or gross equity) as the hard constraint for new position size calculations. Maximum
    position size shall be <= Available Funds / (expected_price * contract_multiplier
    * margin_buffer_factor).
  acceptance_tests:
  - Query account Available Funds; place order consuming 95% of Available Funds; verify
    order accepted
  - Attempt order exceeding Available Funds; verify order rejected with margin error
  - 'Verify Available Funds formula against account snapshot: For securities, Available
    Funds == Equity with Loan Value - Initial Margin'
  failure_prevented: Oversized orders leading to margin calls or forced liquidation
  capability_enabled: Consistent position sizing across market conditions and account
    states
  assumptions:
  - Available Funds is reported accurately and updated in real-time
  - Margin buffer factor (e.g., 20% safety margin) is tunable and not hardcoded
  open_questions:
  - What is the appropriate margin buffer factor for different asset classes?
  - How often does Initial Margin requirement change intraday?
  dependencies:
  - Real-time account state API (getCurrentAccountInfo or equivalent)
  verification_needed: Backtest and live trading with position size constraints; verify
    no margin calls over N months
  priority_hint: safety
  _book_id: account-management-users-guide-2015
  _audit_grade: B
- id: IBAPI-REQ-003
  title: System shall check Day Trades Remaining before executing intraday round-trip
    trades
  status: proposed
  derived_from:
  - IBAPI-C2-003
  derivation_type: direct_book_recommendation
  rationale: Pattern-day-trader regulation limits intraday round-trips; violating
    this limit can result in account restrictions or forced liquidation.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - equities
    concern:
    - risk
    - operations
  requirement: For US equity accounts with Day Trades Remaining > 0 field, the live
    trading system shall check this field before submitting any order that would constitute
    a day trade (buy and sell of same security within same trading day). If Day Trades
    Remaining == 0, the system shall not execute day trades and shall log a warning.
  acceptance_tests:
  - Query Day Trades Remaining; confirm it is > 0
  - Execute day trade (buy + sell same day); verify Day Trades Remaining decrements
  - Execute 3 day trades on non-PDT account; verify allowed. Attempt 4th day trade
    on PDT-flagged account; verify rejected
  failure_prevented: Violation of PDT rules leading to account restrictions or forced
    liquidation
  capability_enabled: Safe intraday trading within regulatory limits
  assumptions:
  - PDT rule is consistently enforced by IB
  - Day trade definition matches SEC/FINRA definition
  open_questions:
  - How are complex orders (spreads, collars) counted in PDT logic?
  - Does extended-hours trading (pre-market/post-market) count toward day trades?
  dependencies:
  - Real-time Day Trades Remaining metric from IB API
  - Trade classification logic to identify day trades
  verification_needed: Backtesting with PDT rules enforced; live trading with monitoring
    for PDT violations
  priority_hint: safety
  _book_id: account-management-users-guide-2015
  _audit_grade: B
