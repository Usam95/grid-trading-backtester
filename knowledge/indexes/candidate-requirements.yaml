  - TTAM-C4-002
  derivation_type: direct_book_recommendation
  rationale: Book emphasizes price waves and swing points as fundamental chart components.
    Backtester must decompose price series into trends, corrections, consolidations,
    breakouts, and reversals.
  applies_to:
