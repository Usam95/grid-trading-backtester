- id: FOREX-REQ-004
  title: Broker API connection resilience and reconnection logic
  status: proposed
  derived_from:
  - FOREX-C4-003
  derivation_type: agent_inference
  rationale: Automated systems depend on real-time connectivity; connection failures
    cause missed trades or orphaned positions.
  applies_to:
    strategy:
    - grid
    lifecycle:
    - live
    asset_class:
    - shared
    concern:
    - execution
    - operations
  requirement: 'System shall implement: (1) heartbeat/ping to broker every 10s, (2)
    automatic reconnect with exponential backoff (1s, 2s, 4s, 8s up to 60s), (3) limit
    on reconnect attempts (e.g., 30), (4) alert if disconnected > 60s, (5) disable
    new order submission if disconnected > 120s, (6) log all connection events.'
  acceptance_tests:
  - Brief disconnection (<10s) triggers automatic reconnect without alert
  - Disconnection >60s triggers alert to user
  - Disconnection >120s blocks new orders but allows cancel/modify existing
  - Log contains all connection state changes with timestamps
  failure_prevented: Orphaned trades, missed risk management, silent failures
  capability_enabled: Robust live trading with graceful degradation
  assumptions:
  - Broker API provides disconnect detection
  - Network failures are transient (most resolve within seconds)
  open_questions:
  - Should orders be cached and replayed on reconnect?
  - Should position-closing orders be prioritized on reconnect?
  dependencies: []
  verification_needed: Integration test with simulated broker disconnections; measure
    reconnect latency
  priority_hint: safety
