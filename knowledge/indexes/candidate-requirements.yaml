- id: MLPRO-REQ-001
  title: Options Greeks computation and hedging framework
  status: proposed
  derived_from:
  - MLPRO-C26-007
  derivation_type: direct_book_recommendation
  rationale: Book claims Greeks (delta, theta, gamma, vega) quantify option exposures.
    Live trading system must compute Greeks and use them to hedge portfolio risk.
  applies_to:
    strategy:
    - stock_signal
    lifecycle:
    - live
    asset_class:
    - equities
    concern:
    - risk
  requirement: System shall compute option Greeks (delta, theta, gamma, vega) for
    all open positions using industry-standard models (e.g., Black-Scholes); shall
    support delta-hedging and Greeks-based rebalancing on configurable intervals.
  acceptance_tests:
  - Greeks computed match market sources (e.g., broker API) within 1% for liquid options
  - Delta-hedge rebalance executes within 1 minute of trigger event
  - Portfolio delta remains within +/-5% of target after rebalance
  failure_prevented: Unhedged directional exposure in large portfolio; gamma risk
    accumulation; vega risk from IV changes.
  capability_enabled: Automated risk management; systematic hedging without manual
    intervention.
  assumptions:
  - Greeks are computed under Black-Scholes assumptions
  - Liquidity is sufficient for delta-hedging at minimal cost
  open_questions:
  - Should Greeks use broker-supplied IV or independently computed IV?
  - How to handle options with no liquid price history?
  dependencies:
  - Real-time market data feed for option prices and implied volatility
  - Order execution system capable of rapid entry/exit
  verification_needed: Unit tests for Greeks calculations; integration test with live
    option prices; backtesting delta-hedging performance.
  priority_hint: safety
  _book_id: machine-learning-for-algorithm-trading-master-as-a-pro-appli
