- id: OPTBEG-REQ-001
  title: System shall implement position-size calculator per 1% rule
  status: proposed
  derived_from:
  - OPTBEG-C7-001
  derivation_type: direct_book_recommendation
  rationale: Book explicitly prescribes 1% risk per trade as essential survival rule;
    this is foundational to loss containment and must be enforced before live trading
  applies_to:
    strategy:
    - stock_signal
    - grid
    - other
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - equities
    - crypto_futures
    - shared
    concern:
    - risk
    - execution
    - operations
  requirement: System shall accept entry_price, stop_loss_price, and account_risk_dollars;
    compute max_position_size = account_risk / abs(entry - stop); reject orders exceeding
    computed size
  acceptance_tests:
  - Given account=10k, entry=100, stop=99, system computes max_size=10000 shares (10k
    risk / 1 loss)
  - Given account=100k, entry=50, stop=48, system computes max_size=50000 shares (50k
    risk / 2 loss)
  - System rejects any position order with size > computed max_size
  failure_prevented: Uncontrolled position sizing leads to account ruin on loss streaks
  capability_enabled: Trader can confidently place trades knowing loss is bounded
  assumptions:
  - Stop-loss price is firm (not advisory)
  - Account risk is in same currency as position
  - No slippage beyond stop-loss price
  open_questions:
  - Should system allow partial stops?
  - How to handle gap risk past stop-loss?
  dependencies:
  - Market data feed must provide current price
  - Order management system must track stop-loss orders
  verification_needed: Live trading small account; verify no position exceeds 1% loss
    on execution
  priority_hint: safety
  _book_id: options-trading-for-beginners-a-crash-course-on-how-to-build-2021
