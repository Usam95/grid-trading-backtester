- id: IBAPI-REQ-005
  title: System shall validate order feasibility using whatIf flag before submission
  status: proposed
  derived_from:
  - IBAPI-C3-001
  - IBAPI-C3-002
  derivation_type: direct_book_recommendation
  rationale: whatIf flag allows pre-trade margin and commission estimation without
    market impact; system should validate orders before submission to catch errors
    early.
  applies_to:
    strategy:
    - grid
    - stock_signal
    - portfolio
    - shared
    lifecycle:
    - backtest
    - paper
    - live
    asset_class:
    - crypto_spot
    - crypto_futures
    - equities
    - shared
    concern:
    - risk
    - execution
  requirement: The live trading system may use whatIf=true on orders to request pre-trade
    commission and margin impact. System shall verify returned OrderState contains
    valid commission and margin fields. System shall reject orders if whatIf response
    indicates margin violation or cost exceeds expected threshold.
  acceptance_tests:
  - Send whatIf order; verify OrderState returned with commission and margin fields
  - Compare whatIf commission/margin to actual execution; verify variance < 1%
  - Send whatIf order exceeding available funds; verify rejection or error flag in
