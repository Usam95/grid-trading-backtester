    - live
    asset_class:
    - shared
    concern:
    - risk
    - alpha
  requirement: 'The trading system shall implement a mandatory trading pause rule:
    if peak-to-trough drawdown exceeds threshold (e.g., 20%),

    the system shall automatically halt new trade entries for N days (configurable,
    default 7 days).

    During pause, system shall generate drawdown analysis report: list of losing trades,
    common patterns, rule violations.

    Trader shall review report before resuming. System shall log trader acknowledgment
    before re-enabling entries.

    '
  acceptance_tests:
  - After 20% drawdown triggered, system rejects new entry signals for 7 days
  - System generates report of all trades in drawdown period with entry signal, exit
    signal, and loss amount
  - System flags any trades that violated money management rules (e.g., over-sized)
    or stop loss discipline
  failure_prevented: Trader continues compulsive trading during drawdown period, escalating
    losses
  capability_enabled: Automatic circuit breaker prevents catastrophic account blowup;
    forces reflection
  assumptions:
  - Drawdown calculation is accurate
  - Trader will comply with pause and analysis requirement
  open_questions:
  - Optimal pause length?
  - Should pause be system-enforced or manual?
  dependencies:
  - Real-time account equity tracking
  verification_needed: 'A/B test: compare accounts with auto-pause vs without; measure
    time-to-recovery and subsequent 12-month returns'
  priority_hint: safety
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
