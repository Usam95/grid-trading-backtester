  failure_prevented: Trader builds excessive leverage; drawdown triggers margin call;
    forced liquidation spirals
  capability_enabled: Risk limits enforced automatically; trader cannot exceed policy
  dependencies:
  - Real-time position tracking
  - Margin requirement data from broker
  - Order submission gateway
  verification_needed: 'Live trading: monitor leverage spikes; confirm rejections
    prevent over-leverage'
  priority_hint: safety
  _book_id: options-trading-for-beginners-a-crash-course-on-how-to-build-2021
  _audit_grade: C
