- id: NTFL-REQ-001
  title: Backtester shall account for round-trip execution costs (commissions + slippage)
  status: proposed
  derived_from:
  - NTFL-C0-001
  - NTFL-C0-003
  derivation_type: direct_book_recommendation
  rationale: 'Study guide emphasizes that commissions and slippage form a "minus-sum
    game" tax on trades.

    Backtest results that ignore these costs are misleading and will not transfer
    to live trading.

    '
  applies_to:
    strategy:
    - grid
    - stock_signal
    lifecycle:
    - backtest
    asset_class:
    - equities
    - crypto_futures
    concern:
    - simulation
    - execution
  requirement: 'The backtester shall deduct from gross P&L: (1) round-trip commissions
    per trade,

    calculated as (commission_per_share × shares × 2) or (commission_percent × notional
    × 2);

    (2) slippage as (execution_price - mid_quote_at_order_time) on both entry and
    exit.

    Slippage shall be configurable per asset class and market condition regime.

    '
  acceptance_tests:
  - Backtest result shows negative P&L when trading 100 shares of $20 stock with $10
    round-trip commission and $0.10 per-share average slippage
  - 'Backtest allows per-trade commission configuration: flat ($X), per-share ($X),
    percentage (Y%)'
  - Slippage can be set to 0 (pessimistic), historical calibration (realistic), or
    optimistic (conservative)
  failure_prevented: Trader discovers live trading profitability is lower than backtest,
    leading to reduced allocation
  capability_enabled: Accurate forecasting of live trading performance based on backtest
  assumptions:
  - Commission rates from broker are accurate
  - Slippage distribution is stable over time
  open_questions:
  - Should slippage be per-trade fixed or stochastic distribution?
  - How to calibrate slippage for instruments without historical execution data?
  dependencies:
  - Trade execution log with timestamps and prices
  verification_needed: Compare backtest P&L (with costs) to live trading P&L for 20+
    trades per instrument
  priority_hint: correctness
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
- id: NTFL-REQ-002
  title: Trading system shall implement fixed-risk position sizing
  status: proposed
  derived_from:
  - NTFL-C9-001
  - NTFL-C9-002
  derivation_type: direct_book_recommendation
  rationale: 'Study guide emphasizes position sizing discipline as non-negotiable
    risk management.

    Fixed risk percentage per trade ensures drawdown is bounded and predictable.

    '
  applies_to:
    strategy:
    - grid
    - stock_signal
    lifecycle:
    - backtest
    - live
    asset_class:
    - equities
    - crypto_spot
    - crypto_futures
    concern:
    - risk
    - execution
  requirement: 'The trading system shall calculate position size as: shares = (account_equity
    × risk_percent) / stop_loss_points.

    The system shall enforce that no single trade risks more than (risk_percent) of
    current account equity,

    where risk_percent is configurable (default 2%). Position size shall adjust as
    account equity changes.

    '
  acceptance_tests:
  - 'For $100k account, 2% risk, $20 stock, 50¢ stop loss: system calculates position
    = (100k × 0.02) / 0.50 = 4000 shares'
  - After profit, account becomes $105k; next trade calculates position based on $105k,
    not $100k
  - If calculated position exceeds maximum shares allowed, system reduces risk_percent
    proportionally or skips trade
  failure_prevented: Trader oversizes after winning streak, incurring unexpected large
    drawdown
  capability_enabled: Predictable maximum drawdown; trader can pre-calculate margin
    requirements and capital requirements
  assumptions:
  - Stop loss level is predetermined before trade entry
  - Account equity is accurately reported
  open_questions:
  - Should system use account equity at previous day's close or real-time equity?
  - How to handle margin requirements vs equity-based sizing?
  dependencies:
  - Entry signal with predetermined stop loss
  verification_needed: Backtest 100+ trades; verify max observed drawdown ≤ (# max
    consecutive losses × risk_percent × 1.2)
  priority_hint: safety
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
