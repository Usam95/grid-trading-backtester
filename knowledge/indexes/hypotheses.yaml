  statement: Trading price channel breakouts generates positive expected return greater
    than transaction costs and slippage.
  proposed_mechanism: Breakout signals exhaustion of supply/demand equilibrium; new
    directional trend follows with persistence.
  applicable_markets_and_regimes: Effective in trending and breakout regimes; fails
    in range-bound or whipsaw environments.
  assumptions:
  - Channel boundaries reflect significant support/resistance
  - Breakouts are followed by continuation moves (not reversals)
  - Breakout magnitude is exploitable above transaction costs
  data_requirements:
  - OHLCV bars at entry timeframe (4-hour, daily, or higher)
  - At least 500 trades for statistical significance
  baseline_or_null_hypothesis: Random entries achieve same return as channel breakouts
    (null) or breakouts achieve 50% win rate.
  validation_approach: Backtest breakout entries with defined channel parameters;
    measure PnL, win rate, Sharpe ratio.
  transaction_cost_and_fill_considerations: 1-2 pips entry slippage, 1-2 pips exit
    slippage, 1-2 pip spread; assume 4-5 pips round-trip cost.
  robustness_checks:
  - Test with different channel definitions (Donchian, regression bands)
  - Test with different breakout confirmation rules
  - Test on multiple pairs and timeframes
  rejection_criteria: Hypothesis rejected if backtest win rate < 45%, Sharpe < 0.3,
    or PnL < transaction costs * N_trades.
  failure_modes:
  - False breakouts that reverse immediately
  - Gaps overnight that skip entry level
  - Low volatility periods with few breakouts
  freshness_concerns: Forex volatility and mean-reversion characteristics have changed
    since 2020.
  unresolved_questions:
  - What is the optimal channel lookback period?
  - Should breakout entries be filtered by ATR or volatility regime?
  _book_id: forex-trading-2020-2020
  _audit_grade: B
- id: FOREX-HYP-004
  title: COT report positioning predicts short-term forex moves
  status: proposed
  derived_from:
  - FOREX-C5-003
  statement: CFTC COT report net positioning of commercial vs. non-commercial traders
    predicts next-week forex returns.
  proposed_mechanism: Large institutional traders lead price discovery; COT positioning
    reflects their directional bias and predicts short-term moves.
  applicable_markets_and_regimes: Applicable to major currency pairs with deep COT
    data; less effective in crisis periods.
  assumptions:
  - COT positioning is public by Friday close for previous Tuesday
  - Institutional traders' positioning leads retail and predicts direction
  - COT effect persists week-to-week with lag
  data_requirements:
  - CFTC COT reports (weekly)
  - OHLCV forex data for next 5 trading days post-report
  - At least 3+ years of paired COT/price data
  baseline_or_null_hypothesis: COT positioning has zero predictive power; returns
    are random walk.
  validation_approach: 'Build linear/logistic model: COT net position → next-week
    return direction. Measure R^2, correlation, win rate on holdout test set.'
  transaction_cost_and_fill_considerations: Entry Friday close, exit end of next Friday;
    2-3 pips round-trip cost; assume entry fill at Friday close.
  robustness_checks:
  - Test with different lag structures (report → same-day entry vs. Monday entry)
  - Test with different position size weighting schemes
  - Test on different pairs
  rejection_criteria: Hypothesis rejected if correlation < 0.1 or if backtest Sharpe
    < 0.2 (after costs).
  failure_modes:
  - COT data is lagged (report is for Tuesday; published Friday)
  - Extreme volatility or geopolitical events override COT signal
  - Regime change invalidates historical relationships
  freshness_concerns: COT positioning patterns may have changed post-2020; cryptocurrency
    growth has shifted market structure.
  unresolved_questions:
  - Is the COT effect immediate (Friday) or delayed (Monday)?
  - Does the effect vary by currency pair or regime?
  _book_id: forex-trading-2020-2020
  _audit_grade: B
- id: FOREX-HYP-005
  title: Carry trade interest erodes low-volatility position returns
  status: proposed
  derived_from:
  - FOREX-C4-004
  statement: Forex pairs with negative carry (e.g., long USDJPY) lose money to overnight
    swap costs if price moves are insufficient.
  proposed_mechanism: Overnight swap rates reflect interest rate differentials; negative
    carry reduces profitability unless price move exceeds swap cost.
  applicable_markets_and_regimes: Applies to low-volatility regimes where swap costs
    are material relative to daily ranges.
  assumptions:
  - Broker swap rates are stable and publicly quoted
  - Swap cost is accrued daily at quoted rate
  - Low volatility regime persists for multiple days
  data_requirements:
  - Broker swap rates for each pair
  - Daily ATR (Average True Range) for price move estimation
  baseline_or_null_hypothesis: Swap costs are negligible and do not affect strategy
    selection.
  validation_approach: Calculate expected daily swap cost vs. average daily PnL; measure
    if negative-carry pairs underperform positive-carry pairs in same regime.
  transaction_cost_and_fill_considerations: 'Typical swap rates: 1-5 pips per night
    per million units; varies by pair and broker.'
  robustness_checks:
  - Test across currency pairs with different interest rate differentials
  - Test in low-volatility vs. high-volatility regimes
  - Verify swap rates across different brokers
  rejection_criteria: Hypothesis rejected if carry cost differential < 5% of strategy
    PnL.
  failure_modes:
  - Swap rates change due to central bank policy shifts
  - Broker suspends carry (e.g., during crisis)
  - Strategy timing changes during carry-sensitive periods
  freshness_concerns: Swap rates and central bank policy have changed materially since
    2020.
  unresolved_questions:
  - Should strategies filter for positive-carry pairs only?
  - How much volatility is needed to overcome swap costs?
  _book_id: forex-trading-2020-2020
  _audit_grade: B
- id: FTFB-HYP-001
  title: Trend and timeframe alignment improves entries
  status: proposed
  derived_from:
  - FTFB-C1-001
  - FTFB-C8-018
  statement: Entries that align a lower-timeframe signal with a higher-timeframe trend
    beat equivalent unsynchronized entries after costs.
  proposed_mechanism: Multi-timeframe agreement filters noise.
  applicable_markets_and_regimes: Major FX pairs in identifiable trends.
  assumptions:
  - Trend state is measurable
  - Confirmation delay does not erase edge
  data_requirements:
  - Multi-timeframe OHLC data
  - Cost model
  - Trend labels or rules
  baseline_or_null_hypothesis: Timeframe alignment offers no advantage.
  validation_approach: Backtest synchronized and unsynchronized versions of the same
    entry logic.
  transaction_cost_and_fill_considerations: Confirmation may worsen fill price.
  robustness_checks:
  - Walk-forward test
  - Subsample by pair and year
  rejection_criteria: No net expectancy improvement after costs.
  failure_modes:
  - Late entries
  - False trend classification
  freshness_concerns: Low conceptual freshness risk.
  unresolved_questions:
  - Best timeframe pair?
  _book_id: forex-trading-for-beginners-simple-strategies-to-make-money--2021
  _audit_grade: C
- id: FTFB-HYP-002
  title: RSI recovery improves pullback timing
  status: proposed
  derived_from:
  - FTFB-C4-007
  statement: Trend-aligned entries triggered when RSI leaves an extreme zone outperform
    simple continuation entries.
  proposed_mechanism: Extreme recovery may mark pullback exhaustion.
  applicable_markets_and_regimes: Liquid FX pairs in trends.
  assumptions:
  - RSI thresholds are informative
  data_requirements:
  - OHLC data
  - RSI series
  - Trend filter
  baseline_or_null_hypothesis: RSI filter adds no value.
  validation_approach: Backtest RSI-recovery entries against price-only entries.
  transaction_cost_and_fill_considerations: Delayed entries may give up edge.
  robustness_checks:
  - Alternative RSI lengths
  - Different thresholds
  rejection_criteria: No improvement after costs.
  failure_modes:
  - Whipsaws
  - Persistent extremes
  freshness_concerns: Low.
  unresolved_questions:
  - Need extra structure filter?
  _book_id: forex-trading-for-beginners-simple-strategies-to-make-money--2021
  _audit_grade: C
- id: FTFB-HYP-003
  title: Range entries work only in true sideways regimes
  status: proposed
  derived_from:
  - FTFB-C6-012
  statement: Buying support and selling resistance has positive expectancy only when
    an objective range detector confirms a sideways regime.
  proposed_mechanism: Mean reversion repeats inside bounded zones until breakout.
  applicable_markets_and_regimes: Major FX pairs in low-trend conditions.
  assumptions:
  - Ranges can be detected without look-ahead
  data_requirements:
  - Range detector
  - OHLC data
  - Cost model
  baseline_or_null_hypothesis: Range entries do not outperform random or breakout
    rules.
  validation_approach: Backtest only on pre-identified ranges and compare alternatives.
  transaction_cost_and_fill_considerations: Frequent trades make spread critical.
  robustness_checks:
  - Different range detectors
  - Different stop widths
  rejection_criteria: Non-positive expectancy after costs.
  failure_modes:
  - False range detection
  - Sudden breakout
  freshness_concerns: Broker execution quality matters.
  unresolved_questions:
  - How wide must the range be?
  _book_id: forex-trading-for-beginners-simple-strategies-to-make-money--2021
  _audit_grade: C
- id: FTFB-HYP-004
  title: Daily inside-bar continuation is reproducible
  status: proposed
  derived_from:
  - FTFB-C6-013
  statement: Daily inside-bar breakouts aligned with prior trend outperform generic
    daily breakout entries.
  proposed_mechanism: Compression inside a mother bar precedes continuation.
  applicable_markets_and_regimes: Daily FX data in trending conditions.
  assumptions:
  - Pattern rarity still leaves enough sample
  data_requirements:
  - Daily OHLC data
  - Pattern detector
  - Trend filter
  baseline_or_null_hypothesis: Inside-bar continuation has no advantage over generic
    breakouts.
  validation_approach: Test breakout-entry and retest-entry variants on rolling windows.
  transaction_cost_and_fill_considerations: Daily frequency lowers cost burden but
    increases stop size.
  robustness_checks:
  - Alternative pattern definitions
  - Out-of-sample test
  rejection_criteria: No positive out-of-sample expectancy.
  failure_modes:
  - False breakout
  - Trend exhaustion
  freshness_concerns: Low.
  unresolved_questions:
  - Daily only, or also 4H?
  _book_id: forex-trading-for-beginners-simple-strategies-to-make-money--2021
  _audit_grade: C
- id: FTFB-HYP-005
  title: Filtered pin bars outperform unfiltered pin bars
  status: proposed
  derived_from:
  - FTFB-C6-014
  statement: Pin bars traded only with trend, structure, and value-area context outperform
    unfiltered pin-bar trades.
  proposed_mechanism: Context removes many low-information candles.
  applicable_markets_and_regimes: FX and other liquid candlestick markets.
  assumptions:
  - Pin-bar geometry and structure can be coded
  data_requirements:
  - OHLC data
  - Pin-bar detector
  - Structure labels
  baseline_or_null_hypothesis: Context filters do not improve pin-bar performance.
  validation_approach: Compare filtered and unfiltered pin-bar trades.
  transaction_cost_and_fill_considerations: Tail-based stops may be wide.
  robustness_checks:
  - Different tail/body ratios
  - Volatility splits
  rejection_criteria: No cost-adjusted improvement.
  failure_modes:
  - Subjective structure rules
  freshness_concerns: Low.
  unresolved_questions:
  - Best value-area definition?
  _book_id: forex-trading-for-beginners-simple-strategies-to-make-money--2021
  _audit_grade: C
- id: FTFB-HYP-006
  title: Confirmed breakouts beat blind breakout chasing
  status: proposed
  derived_from:
  - FTFB-C6-015
  statement: Breakout entries that wait for retest or confirmation outperform immediate
    breakout chasing after costs.
  proposed_mechanism: Confirmation reduces false-breakout losses.
  applicable_markets_and_regimes: Liquid FX pairs during volatility expansion.
  assumptions:
  - Confirmation does not arrive too late
  data_requirements:
  - OHLC data
  - Support/resistance detector
  - Volume proxy if used
  baseline_or_null_hypothesis: Immediate breakout entry performs as well or better.
  validation_approach: Run side-by-side backtests for immediate and confirmed entries.
  transaction_cost_and_fill_considerations: Breakout bars often have worse spreads
    and slippage.
  robustness_checks:
  - Retest vs volume confirmation
  - Different stop anchors
  rejection_criteria: No reduction in false-breakout loss rate after costs.
  failure_modes:
  - Retest never arrives
  - Noisy volume proxy
  freshness_concerns: Broker and venue dependent.
  unresolved_questions:
  - 'Retest or volume: which is better?'
  _book_id: forex-trading-for-beginners-simple-strategies-to-make-money--2021
  _audit_grade: C
- id: FTFB-HYP-007
  title: Fixed 1%-2% sizing lowers drawdown versus larger sizing
  status: proposed
  derived_from:
  - FTFB-C8-020
  - FTFB-C11-024
  statement: Consistent fixed-fraction sizing near 1%-2% of equity per trade lowers
    drawdown severity and ruin probability versus larger or escalating risk fractions.
  proposed_mechanism: Smaller stable bets slow compounding of losses.
  applicable_markets_and_regimes: Any stop-based trading program.
  assumptions:
  - Risk cap is actually enforced
  data_requirements:
  - Trade sequence or simulations
  - Sizing engine
  - Gap-loss assumptions
  baseline_or_null_hypothesis: Higher or adaptive fractions are not meaningfully worse
    on a drawdown-adjusted basis.
  validation_approach: Monte Carlo and historical replay under several risk schedules.
  transaction_cost_and_fill_considerations: Small accounts may hit minimum lot-size
    constraints.
  robustness_checks:
  - Sensitivity to win rate
  - Gap-loss stress tests
  rejection_criteria: Higher-risk schedules dominate on return and drawdown after
    constraints.
  failure_modes:
  - Gap losses exceed stop estimates
  freshness_concerns: Broker leverage and lot-size rules vary by jurisdiction.
  unresolved_questions:
  - How should correlated trades share risk?
  _book_id: forex-trading-for-beginners-simple-strategies-to-make-money--2021
  _audit_grade: C
- id: GFIN-H001
  title: Interest-rate parity holds in developed FX markets
  status: proposed
  derived_from:
  - GFIN-C2-006
  statement: Covered interest-rate arbitrage enforces parity between spot, forward,
    and interest rates
  proposed_mechanism: Arbitrage prevents profitable deviation; transaction costs permit
    small deviations
  applicable_markets_and_regimes: Developed FX markets with low transaction costs
  assumptions:
  - Transaction costs are low
  - Capital is mobile
  data_requirements:
  - Spot FX rates
  - Forward FX rates
  - Interest rates
  baseline_or_null_hypothesis: IRP does not hold
  validation_approach: Test for persistent violations; measure vs transaction costs
  transaction_cost_and_fill_considerations: Bid-ask spreads, funding costs
  robustness_checks:
  - Test across currency pairs
  - Test during crises
  - Test in emerging markets
  rejection_criteria: Persistent violations not explained by transaction costs
  failure_modes: Capital controls, liquidity crises
  freshness_concerns: Regulatory framework may change
  unresolved_questions:
  - How do central banks affect IRP?
  _book_id: guide-to-financial-markets
  _audit_grade: B
- id: HYP-GARCH-VOL-001
  title: GARCH conditional volatility improves risk-adjusted returns
  status: proposed
  derived_from:
  - HOML-C8-009
  statement: A volatility-adjusted position sizing strategy using GARCH-predicted
    volatility will achieve higher Sharpe ratio than equal-weighted baseline over
    2+ year OOS period
  proposed_mechanism: GARCH captures heteroskedasticity and volatility clustering;
    conditional positions reduce portfolio volatility during high-vol regimes
  applicable_markets:
  - equities
  - index_futures
  - commodity_futures
  assumptions:
  - GARCH parameters remain stable across market regimes
  - Conditional volatility forecast has predictive power > 0.05 IC
  - Position adjustment is executable without excessive costs
  data_requirements:
  - Daily/intraday price series (2+ years)
  - 'GARCH model: p=1, q=1 baseline'
  - 'Training window: 252+ trading days'
  baseline_hypothesis: Equal-weighted portfolio achieves Sharpe of 0.8
  proposed_improvement: GARCH-adjusted portfolio achieves Sharpe of 1.1+
  validation_approach: 'Walk-forward: train GARCH on 1Y window, apply vol-adjusted
    sizing to next 3M; repeat quarterly'
  transaction_cost_considerations: Position changes proportional to vol changes; estimated
    2-5 bps daily rebalancing cost
  robustness_checks:
  - Test across market regimes (low/high vol periods)
  - Measure sensitivity to GARCH lag order
  - Validate on out-of-sample period (2019-2024)
  rejection_criteria: OOS Sharpe < baseline or IC of vol forecast < 0.01
  priority_hint: correctness
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-PURGED-CV-002
  title: Purged cross-validation prevents backtest look-ahead bias
  status: proposed
  derived_from:
  - HOML-C6-007
  - HOML-C5-005
  statement: A ML model trained with purged time-series CV will achieve OOS Sharpe
    within 10-20% of backtest Sharpe; without purging, degradation exceeds 50%
  proposed_mechanism: Purged CV prevents training on overlapping periods with test
    set, eliminating look-ahead bias in model selection
  applicable_markets:
  - equities
  - crypto_spot
  assumptions:
  - Decision lag (embargoing period) is correctly specified
  - Purging threshold can be enforced in cross-validation loop
  - Sufficient data remains after purging
  data_requirements:
  - Time-indexed factor and return data (5+ years daily)
  - Known decision lag (e.g., 1-day for earnings factors)
  baseline_hypothesis: Standard 5-fold CV shows Sharpe of 1.5, OOS Sharpe drops to
    0.6 (60% degradation)
  proposed_improvement: Purged CV shows Sharpe of 1.2, OOS Sharpe of 1.0 (17% degradation)
  validation_approach: 'Compare: (1) standard CV, (2) purged CV, (3) walk-forward
    OOS; measure Sharpe gap'
  transaction_cost_considerations: CV cost is offline; no live trading cost impact
  robustness_checks:
  - Vary embargo period (1, 2, 5 days); measure Sharpe stability
  - Test on different factor types (momentum, value, quality)
  rejection_criteria: OOS Sharpe degradation with purged CV still > 40% or Sharpe
    variance across embargoing periods too high
  priority_hint: correctness
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-RF-FACTOR-003
  title: Random Forest feature importance ranks factors more stably than linear regression
  status: proposed
  derived_from:
  - HOML-C10-011
  - HOML-C10-026
  statement: Top-10 factors by RF permutation importance will correlate >0.7 across
    consecutive 1-year windows; linear regression factor weights will correlate <0.5
  proposed_mechanism: RF handles non-linear relationships and interactions; captures
    factor importance independent of multicollinearity
  applicable_markets:
  - equities
  assumptions:
  - Factor definitions are stable
  - Permutation importance captures true relevance
  - Linear model coefficient ranking is unstable due to collinearity
  data_requirements:
  - 20-50 candidate factors
  - 5+ years of daily data
  baseline_hypothesis: Linear regression factor weights rank correlation = 0.4 (unstable)
  proposed_improvement: RF permutation importance rank correlation = 0.75 (stable)
  validation_approach: Train RF and regression on each 1-year rolling window; correlate
    factor rankings across windows
  transaction_cost_considerations: Feature selection is offline; no live cost
  robustness_checks:
  - Measure RF importance sensitivity to hyperparameters
  - Compare to Ridge/Lasso coefficient rankings
  rejection_criteria: RF rank correlation < 0.6 or gap to linear regression < 0.2
  priority_hint: research_quality
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-DEFLATED-SR-004
  title: Deflated Sharpe Ratio predicts backtest-to-live performance gap
  status: proposed
  derived_from:
  - HOML-C5-006
  statement: Strategies with deflated SR > in-sample SR will achieve live Sharpe within
    30% of backtest; those with deflated SR < 0.5*in-sample SR will underperform live
    by >50%
  proposed_mechanism: Deflated SR accounts for multiple testing bias; low deflated
    SR indicates overfitting risk
  applicable_markets:
  - equities
  assumptions:
  - Number of trials and autocorrelation can be estimated
  - Deflated SR formula (Bailey et al.) is appropriate
  - Live performance does not suffer from unmodeled regime shift
  data_requirements:
  - Backtest results from multiple strategy variations (N > 100)
  - Estimated autocorrelation of returns
  baseline_hypothesis: Arbitrary backtest Sharpe of 1.5 with deflated SR of 0.8
  proposed_improvement: Deflated SR > 1.2 predicts live underperformance < 30%
  validation_approach: 'Retrospectively: apply deflated SR to published strategies;
    compare to subsequent live performance'
  transaction_cost_considerations: Analysis offline; no live cost
  robustness_checks:
  - Sensitivity to trial count estimate
  - Cross-validate across strategy styles
  rejection_criteria: Deflated SR does not correlate with live performance or does
    not provide actionable thresholds
  priority_hint: correctness
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-IC-SHARPE-005
  title: Factor IC > 0.02 (Rank IC) correlates with Sharpe > 0.5 for stock-level strategies
  status: proposed
  derived_from:
  - HOML-C4-014
  - HOML-C4-003
  statement: Factors with out-of-sample Rank IC > 0.02 will generate stock-level portfolios
    with Sharpe > 0.5; IC < 0.01 will yield Sharpe < 0.2
  proposed_mechanism: IC directly measures factor predictive power; portfolio Sharpe
    scales approximately with IC given typical turnover and costs
  applicable_markets:
  - equities
  assumptions:
  - IC measurement covers full cross-section (>500 stocks)
  - Portfolio is 130/30 or similar turnover
  - Costs are <5 bps per trade
  data_requirements:
  - Factor values and next-period returns (5+ years)
  - Measured via Alphalens tearsheet
  baseline_hypothesis: Typical factor IC = 0.015, portfolio Sharpe = 0.4
  proposed_improvement: IC = 0.03 achieves Sharpe = 1.0
  validation_approach: Backtest multiple factors; plot IC vs. portfolio Sharpe; fit
    regression
  transaction_cost_considerations: Sharpe estimate must include realistic costs
  robustness_checks:
  - Test across sectors and market caps
  - Measure IC decay with universe size
  rejection_criteria: IC-Sharpe correlation < 0.5 or regression R^2 < 0.4
  priority_hint: correctness
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-CROWDING-006
  title: Factor crowding reduces IC by 50% within 3-5 years of academic publication
  status: proposed
  derived_from:
  - HOML-C4-025
  statement: A factor IC measured in year 1 after publication will decay to 50% of
    original by year 3-5; decay correlates with proxy AUM in factor ETFs
  proposed_mechanism: Crowding increases capital seeking same signal, reducing alpha
    per unit AUM; crowding effect measurable via IC decay
  applicable_markets:
  - equities
  assumptions:
  - Factor IC can be measured consistently post-publication
  - Factor ETF AUM is valid crowding proxy
  - Decay is monotonic and predictable
  data_requirements:
  - Factor IC time series post-publication (Fama-French factors, recent academic papers)
  - Factor ETF AUM time series
  baseline_hypothesis: Academic factors (Fama-French) show IC decay ~50% over 15 years
  proposed_improvement: IC decay predictable within 3-5 year window; enables optimal
    deployment timing
  validation_approach: Measure IC of 5-10 published factors; plot against time since
    publication and ETF AUM
  transaction_cost_considerations: Timing strategy deployment based on crowding estimates
  robustness_checks:
  - Test across factor families (momentum, value, quality)
  - Exclude confounding effects (regime changes)
  rejection_criteria: No significant correlation between time and IC decay or weak
    AUM relationship
  priority_hint: research_quality
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-ENSEMBLE-007
  title: Stacked ensemble of RF, GBM, Linear Reg achieves higher OOS Sharpe than individual
    models
  status: proposed
  derived_from:
  - HOML-C11-037
  statement: A stacked ensemble (meta-learner = Ridge) of base models (RF, GBM, Ridge)
    will achieve OOS Sharpe 10-20% higher than best individual model
  proposed_mechanism: Ensemble combines complementary strengths of diverse models;
    meta-learner learns optimal weighting
  applicable_markets:
  - equities
  assumptions:
  - Base models are sufficiently decorrelated (pairwise correlation < 0.7)
  - Meta-learner does not overfit
  - Computational cost is acceptable
  data_requirements:
  - Factor and return data for base model training
  - Holdout validation set for meta-learner (20% of data)
  baseline_hypothesis: Best individual model (GBM) achieves Sharpe = 1.0
  proposed_improvement: Stacked ensemble achieves Sharpe = 1.15+
  validation_approach: Train base models on train set; evaluate on validation holdout;
    train meta-learner on validation; test on OOS set
  transaction_cost_considerations: Ensemble execution cost similar to single best
    model
  robustness_checks:
  - Measure base model correlation; remove highly correlated models
  - Test meta-learner overfitting via nested CV
  rejection_criteria: Ensemble Sharpe < best individual model or meta-learner highly
    overfit
  priority_hint: research_quality
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-COST-IMPACT-008
  title: Realistic cost modeling (commissions + spreads + impact) reduces Sharpe by
    40-60%
  status: proposed
  derived_from:
  - HOML-C5-017
  statement: Backtest Sharpe without costs vs. with realistic costs (2 bps comm, 1
    bps spread, impact model) will differ by 40-60% for typical daily rebalancing
    strategy
  proposed_mechanism: Transaction costs directly reduce returns; impact scales nonlinearly
    with position size; most backtests omit or underestimate costs
  applicable_markets:
  - equities
  - crypto_spot
  assumptions:
  - Cost model is market-realistic
  - Position sizes and rebalancing frequency are representative
  - Impact model captures market microstructure
  data_requirements:
  - Backtest with and without cost model
  - Market microstructure data (spreads, volume)
  baseline_hypothesis: Cost-free backtest Sharpe = 1.5
  proposed_improvement: With costs, Sharpe = 0.6-0.9 (40-60% reduction)
  validation_approach: Run backtest two ways; compare Sharpe
  transaction_cost_considerations: This test is specifically about cost impact
  robustness_checks:
  - Vary cost parameters (1-3 bps, 0.5-2 bps spread)
  - Test across rebalancing frequencies (daily, weekly)
  rejection_criteria: Cost impact < 20% or cost model deemed unrealistic
  priority_hint: correctness
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-LIQUIDITY-009
  title: Restricting to highly liquid stocks improves strategy IC and Sharpe despite
    smaller universe
  status: proposed
  derived_from:
  - HOML-C2-030
  statement: Strategy using top-500 most liquid stocks will achieve IC 5-10% higher
    than full 3000-stock universe; Sharpe impact depends on turnover
  proposed_mechanism: Liquid universe has better factor-return relationship (less
    noise, lower costs); reduced universe size adds diversification drag only if turnover
    is high
  applicable_markets:
  - equities
  assumptions:
  - Liquidity measured by daily dollar volume or spread
  - Liquid stocks have cleaner factor-return relationship
  - Diversification loss from smaller universe is modest
  data_requirements:
  - Factor IC measured on full vs. liquid-only universe
  - Backtest results on both universes
  baseline_hypothesis: 'Full 3000-stock universe: IC = 0.015, Sharpe = 0.5'
  proposed_improvement: 'Top-500 liquid universe: IC = 0.020, Sharpe = 0.65'
  validation_approach: Measure Alphalens IC; compare to full backtest Sharpe
  transaction_cost_considerations: Liquid universe reduces execution cost and slippage
  robustness_checks:
  - Define liquidity threshold sensitivity
  - Test across market caps and sectors
  rejection_criteria: IC improvement in liquid universe < 2% or Sharpe worsens significantly
  priority_hint: research_quality
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HYP-SENTIMENT-010
  title: Sentiment from news correlates with next-day returns with IC > 0.01 OOS
  status: proposed
  derived_from:
  - HOML-C13-020
  statement: Daily sentiment score from news aggregator will have Rank IC > 0.01 with
    next-day stock returns on OOS data; add sentiment to baseline factor model, improve
    Sharpe by 5-15%
  proposed_mechanism: News sentiment captures investor psychology; lagged correlation
    with returns exists but decays with crowding
  applicable_markets:
  - equities
  assumptions:
  - Sentiment extraction is reliable
  - Sentiment is not widely arbitraged
  - Integration with other factors is additive
  data_requirements:
  - Daily news sentiment scores (year 1+)
  - Next-day returns for IC calculation
  baseline_hypothesis: Sentiment IC = 0.005 (modest signal)
  proposed_improvement: Sentiment IC = 0.015, Sharpe improvement = 10%
  validation_approach: Measure sentiment IC via Alphalens; backtest sentiment-augmented
    strategy
  transaction_cost_considerations: Sentiment data cost ~$1-5K/month; integration into
    strategy modest
  robustness_checks:
  - Measure sentiment IC decay over time (crowding effect)
  - Test across news sources and aggregators
  rejection_criteria: Sentiment IC < 0.003 OOS or Sharpe improvement < 2%
  priority_hint: alpha
  _book_id: hands-on-machine-learning-for-algorithmic-trading-2018
  _audit_grade: A
- id: HPTS-H-001
  title: Dual timeframe momentum alignment predicts trend continuation
  status: proposed
  derived_from:
  - HPTS-C2-001
  - HPTS-C2-002
  - HPTS-C2-003
  statement: When momentum indicator on a longer timeframe (daily) and shorter timeframe
    (hourly) both show same direction, the probability of immediate continuation in
    that direction exceeds 55% over the next 5-10 bars
  proposed_mechanism: Alignment of two timeframe indicators reduces noise and false
    signals; single-timeframe signals have high false-signal rate
  applicable_markets_and_regimes: Trending markets; breaks down in choppy/consolidation
    regimes
  assumptions:
  - Momentum indicators are independent signals
  - Past momentum relationships predict forward returns
  data_requirements:
  - Price OHLC data at dual timeframes
  - Momentum indicator values (RSI or MACD)
  - Trade entry/exit times and prices
  baseline_or_null_hypothesis: Random direction; 50% probability of continuation
  validation_approach: Backtest on 5+ years of equity data; measure win rate and Sharpe
    ratio on dual-timeframe alignment trades vs. baseline
  transaction_cost_and_fill_considerations: Assume 1-2 bp bid-ask spread; slippage
    0-2 bp on entry; exit at limit orders
  robustness_checks:
  - Test on multiple securities and sectors
  - Test on different timeframe pairs (1-hr/4-hr, 1-hr/daily, 15-min/1-hr)
  - Test across market regimes (bull, bear, range-bound)
  rejection_criteria: Win rate < 52% or Sharpe ratio < 0.5 after costs
  failure_modes:
  - Momentum divergences may persist for extended periods (oversold/overbought rebounds)
  - Indicators may be correlated or leading/lagging at different speeds
  freshness_concerns: Indicator effectiveness may vary with market structure changes;
    2008 book may not reflect modern market behavior
  unresolved_questions:
  - Are specific timeframe pairs (daily/hourly) optimal, or does relative ratio matter?
  - How sensitive is the rule to indicator parameter selection?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-002
  title: Elliott Wave overlap guideline accurately identifies trend reversals
  status: proposed
  derived_from:
  - HPTS-C3-001
  - HPTS-C3-002
  statement: When price action overlaps into the range of prior wave 1 (in Elliott
    Wave context), the trend has reversed into a correction; the overlap guideline
    has 60%+ accuracy in identifying such reversals within 3-5 bars
  proposed_mechanism: Overlap into prior wave range violates Elliott Wave trend rules;
    signals shift from trend mode to correction mode
  applicable_markets_and_regimes: Works in trending markets; requires clear wave identification
  assumptions:
  - Elliott Wave framework accurately describes price structure
  - Wave boundaries are objectively identifiable
  data_requirements:
  - High-resolution OHLC data (1-min to hourly)
  - Subjective wave annotation (manual or via pattern recognition)
  baseline_or_null_hypothesis: Trend reversal occurs at random times; 50% probability
  validation_approach: Backtest by identifying Elliott Wave patterns retrospectively;
    measure % of overlaps that precede 3-5 bar reversals vs. non-overlaps
  transaction_cost_and_fill_considerations: Overlap-based entries require tight execution;
    assume 1 bp slippage
  robustness_checks:
  - 'Blind backtest: have independent analyst identify waves without knowing outcomes'
  - Test across markets and timeframes
  rejection_criteria: Accuracy < 55%; too subjective to automate profitably
  failure_modes:
  - Wave identification is highly subjective; different analysts disagree
  - Overlap can occur in early moves that later reverse (whipsaws)
  freshness_concerns: Elliott Wave theory is not quantitative; vulnerable to curve-fitting
    and selection bias
  unresolved_questions:
  - Can wave identification be automated with sufficient accuracy?
  - Does order-flow or volume provide objective confirmation of wave transitions?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-003
  title: Price projections from prior move magnitude predict future targets
  status: proposed
  derived_from:
  - HPTS-C4-002
  statement: When a new price move begins after a completed swing, projecting the
    new move to 1.0x, 1.618x, or 2.0x the prior move length predicts the final target
    with 50%+ accuracy within 3-5 bars
  proposed_mechanism: Market structure creates Fibonacci-based geometric relationships;
    new moves often complete at Fibonacci-related distances
  applicable_markets_and_regimes: Trend-following; less effective in choppy/ranging
    markets
  assumptions:
  - Prior move magnitude predicts new move magnitude
  - Fibonacci ratios describe market structure
  data_requirements:
  - Prior swing high/low and magnitude
  - Projected targets at Fibonacci multiples
  baseline_or_null_hypothesis: Target reached at random multiple; 33% chance of hitting
    any given target
  validation_approach: 'Backtest: measure % of moves that reach projected Fibonacci
    targets within 3-5 bars after move starts'
  transaction_cost_and_fill_considerations: Use limit orders at projected targets;
    assume 1-2 bp slippage
  robustness_checks:
  - Test on multiple timeframes (1-hour, daily, weekly)
  - Test on equities, futures, forex
  rejection_criteria: Accuracy < 48%; statistically indistinguishable from random
  failure_modes:
  - Projections assume prior move is complete; false assumptions lead to missed targets
  - Fibonacci ratios are mathematical; no causal relationship to market structure
  freshness_concerns: Price targets are backward-looking; prone to selection bias
    in worked examples
  unresolved_questions:
  - Which Fibonacci multiple (1x, 1.618x, 2x) is most predictive in different market
    conditions?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-004
  title: Time bands calculated from prior cycles identify reversal windows
  status: proposed
  derived_from:
  - HPTS-C5-001
  - HPTS-C5-002
  statement: When price reaches multiple converging time bands (derived from Fibonacci
    ratios of prior cycle durations), the probability of a reversal within ±2 bars
    of that convergence exceeds 55%
  proposed_mechanism: Markets exhibit cyclical time patterns; Fibonacci time ratios
    create confluence zones of high reversal probability
  applicable_markets_and_regimes: Strongest in liquid markets with clear cyclical
    structure
  assumptions:
  - Prior cycle durations predict future cycle durations
  - Fibonacci time ratios have predictive value
  data_requirements:
  - Identified prior cycle durations (manual or automatic)
  - Calculated Fibonacci time projections
  baseline_or_null_hypothesis: Reversals occur at random times; 2 bars out of every
    N bars average contains a reversal
  validation_approach: 'Backtest: count reversals occurring within ±2 bars of time-band
    convergence vs. random dates'
  transaction_cost_and_fill_considerations: Time-based exits use market orders; assume
    2 bp slippage
  robustness_checks:
  - Test on multiple markets and timeframes
  - Sensitivity to prior cycle selection (which cycles to include?)
  rejection_criteria: Reversal rate within ±2 bars < 54%; not significantly better
    than random
  failure_modes:
  - Cycle identification is subjective; different analysts pick different reference
    cycles
  - Time targets rarely produce exact-date reversals; edge is small and inconsistent
  freshness_concerns: Time analysis is speculative; limited academic support; highly
    vulnerable to overfitting
  unresolved_questions:
  - Which prior cycles should be included in time-band calculations?
  - Is the edge large enough to exceed transaction costs?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-005
  title: Trailing-bar entry with tight stop captures momentum with controlled risk
  status: proposed
  derived_from:
  - HPTS-C6-001
  statement: Entering on new 1-bar high (buying 1 tick above prior bar high) with
    stop 1 tick below prior bar low generates at least 52% win rate and 1.5:1 average
    risk/reward
  proposed_mechanism: One-bar breakout captures momentum initiation; tight stop limits
    losses on false breaks
  applicable_markets_and_regimes: Works in trending markets; high-frequency whipsaws
    in choppy markets
  assumptions:
  - 1-bar breakouts are valid momentum signals
  - Stops are executed at specified prices (no slippage)
  data_requirements:
  - Prior-bar high/low for each bar
  - Entry and exit prices
  baseline_or_null_hypothesis: Random entry with 50% win rate; 1:1 average risk/reward
  validation_approach: 'Backtest: measure win rate, average win/loss, Sharpe ratio
    over 3+ years on multiple securities'
  transaction_cost_and_fill_considerations: Assume 2 bp bid-ask spread; 1-2 bp slippage
    on fills; 0.1-0.5 bp commission
  robustness_checks:
  - Test on multiple timeframes (5-min, 15-min, hourly, daily)
  - Test on multiple asset classes
  rejection_criteria: Win rate < 51% or Sharpe < 0.3 after costs
  failure_modes:
  - Breakouts frequently whipsaw (false breaks); stop-outs are common
  - Tight stops are often hit by intra-bar noise before reversal
  freshness_concerns: Modern markets may have faster reversals due to automation;
    2008 methodology may not adapt
  unresolved_questions:
  - Is 1-tick stop placement realistic, or does slippage reduce edge to zero?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-006
  title: Swing entry on Fibonacci retracements improves risk/reward over trailing-bar
    entry
  status: proposed
  derived_from:
  - HPTS-C6-002
  statement: Entering on 38.2% or 50% Fibonacci retracement of prior swing with stop
    below prior swing low generates higher average risk/reward (1:3 to 1:5) than trailing-bar
    entry, with only slightly lower win rate (50-52%)
  proposed_mechanism: Retracement entry occurs after partial pullback, allowing larger
    stop without excessive risk; reduces whipsaw probability
  applicable_markets_and_regimes: Trending markets with clear swings
  assumptions:
  - Fibonacci retracement levels are significant support/resistance
  - Retracement entries have fewer false breaks than breakout entries
  data_requirements:
  - Prior swing high/low and 38.2%, 50% levels
  - Entry and exit prices
  baseline_or_null_hypothesis: Random entry with 50% win rate; 1:1 average risk/reward
  validation_approach: Compare win rate and risk/reward of retracement entries vs.
    trailing-bar entries over same period
  transaction_cost_and_fill_considerations: Limit orders at retracement levels; assume
    1-2 bp slippage
  robustness_checks:
  - Test on multiple timeframes and markets
  - Compare 38.2% vs. 50% retracements
  rejection_criteria: Average risk/reward < 2:1 or win rate < 49%
  failure_modes:
  - Retracement may not materialize; price may reverse before hitting target level
  - Entry is slower (order may not fill until retracement is complete)
  freshness_concerns: Depends on Fibonacci level validity; subjective interpretation
  unresolved_questions:
  - Are 38.2% or 50% retracements optimal, or market-dependent?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-007
  title: Fixed-dollar-risk position sizing maintains consistent portfolio drawdown
  status: proposed
  derived_from:
  - HPTS-C6-003
  statement: Position size = fixed_risk / (entry - stop), where fixed_risk is constant
    dollar amount, maintains maximum single-trade drawdown at 1-2% of portfolio across
    different setups with varying stop distances
  proposed_mechanism: Proportional sizing normalizes risk exposure; prevents over-concentration
    when stops are tight
  applicable_markets_and_regimes: Universal; applies to all strategies
  assumptions:
  - Stops are executed at specified prices
  - Portfolio is sufficiently diversified
  data_requirements:
  - Entry price, stop price, fixed risk amount, portfolio size
  baseline_or_null_hypothesis: Fixed share count; single-trade risk varies with stop
    distance; potential for large drawdown on tight-stop trade with large move against
    position
  validation_approach: 'Backtest: compare max drawdown and portfolio volatility of
    fixed-risk vs. fixed-share sizing over multiple years'
  transaction_cost_and_fill_considerations: Assumed in sizing formula
  robustness_checks:
  - Test with different fixed-risk levels (0.5%, 1%, 2% of portfolio)
  - Test with correlated positions
  rejection_criteria: Max drawdown > 15% or portfolio volatility increases significantly
  failure_modes:
  - Does not account for correlation; multiple correlated losses can exceed intended
    drawdown
  - Assumes stops are executed; may fail during gap events
  freshness_concerns: Position sizing is well-understood; no freshness risk
  unresolved_questions:
  - What is the optimal fixed-risk percentage? Does it vary with market volatility?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-008
  title: Minimum 1:2 risk/reward ratio ensures positive expectancy with moderate win
    rate
  status: proposed
  derived_from:
  - HPTS-C7-002
  statement: Enforcing minimum 1:2 risk/reward (target is 2x the stop distance) ensures
    positive expected value at 50% win rate; median win rate in real trading is 45-55%
  proposed_mechanism: Expected value = (win_rate * reward) - (1 - win_rate) * risk;
    with 1:2 ratio and 50% win rate, EV = +0.5 units per trade
  applicable_markets_and_regimes: Universal filter; applies to all strategies
  assumptions:
  - Average win rate is at least 50%
  - Risk and reward are accurately estimated
  data_requirements:
  - Entry, stop, and target prices
  baseline_or_null_hypothesis: Trade without risk/reward filter; average win rate
    45%; negative expectancy
  validation_approach: Calculate realized win rate and average risk/reward on historical
    trades; verify EV is positive
  transaction_cost_and_fill_considerations: Included in target calculation (reduce
    target by 2-3 bp for costs)
  robustness_checks:
  - Test different minimum risk/reward ratios (1:1.5, 1:2, 1:3)
  rejection_criteria: Realized win rate < 48% or realized R/R < 1.8:1
  failure_modes:
  - Win rate often lower than 50% in live trading due to slippage and selection bias
  - Target placement may be overly optimistic
  freshness_concerns: Basic expectancy concept; no freshness risk
  unresolved_questions:
  - What is the realistic win rate for different entry types (breakout, retracement,
    momentum)?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-009
  title: Multiple-unit exits (partial profit-taking) improve trading psychology without
    reducing edge
  status: proposed
  derived_from:
  - HPTS-C7-001
  statement: Exiting 50% of position at 50% of target, then remaining 50% at full
    target improves risk/reward perception and reduces early-exit pressure, with no
    degradation of final outcome vs. single exit at full target
  proposed_mechanism: Locking in partial gains reduces emotional pressure to exit
    early; remaining half can reach full target without psychological interference
  applicable_markets_and_regimes: Behavioral benefit; mathematics are neutral
  assumptions:
  - Traders can avoid early exit once first tranche is profitable
  - Transaction costs on partial exit are acceptable
  data_requirements:
  - Entry, first exit (50% target), second exit (full target) prices
  baseline_or_null_hypothesis: Single exit at full target; no intermediate exits
  validation_approach: Compare final outcome (total P&L) of multi-unit exits vs. single
    exit on same trades; should be similar minus transaction costs
  transaction_cost_and_fill_considerations: Assume 1 bp cost per partial exit
  robustness_checks:
  - Test different exit splits (30/70, 40/60, 50/50)
  rejection_criteria: Net cost of multiple exits > 0.5% of average trade profit
  failure_modes:
  - Partial exits lock in suboptimal profits; remaining position size may be too small
    to capture remaining move
  - Psychological benefit is subjective; does not apply to discretion-free automated
    systems
  freshness_concerns: Psychological concepts; no freshness risk
  unresolved_questions:
  - Is the psychological benefit quantifiable? Can it be measured?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HPTS-H-010
  title: Confluence of momentum, pattern, price, and time signals identifies higher-probability
    setups
  status: proposed
  derived_from:
  - HPTS-C7-004
  - HPTS-C1-001
  statement: Trades with 3+ confluent signals (e.g., momentum aligned, Elliott pattern
    complete, price at Fibonacci level, time band converge) have 55%+ win rate; trades
    with 1-2 signals have 48-50% win rate
  proposed_mechanism: Multiple independent signals reduce noise and false-signal probability;
    higher confluences indicate genuinely high-probability setup
  applicable_markets_and_regimes: All strategies; confluence is always beneficial
  assumptions:
  - Signal types are independent indicators
  - Signal types are truly predictive (not hindsight-biased)
  data_requirements:
  - Classification of each trade by number of confluent signals
  - Realized outcome and win rate for each group
  baseline_or_null_hypothesis: All signals equally predictive; no win rate difference
    by confluence
  validation_approach: 'Backtest: stratify trades by confluence count; measure win
    rate differential and calculate Sharpe impact'
  transaction_cost_and_fill_considerations: Higher-confluence trades may have more
    specific entry prices (limit order execution risk)
  robustness_checks:
  - Verify that signal types are not correlated artifacts
  - Test different confluence thresholds (2, 3, 4 signals)
  rejection_criteria: Win rate difference < 3% or gain insufficient to compensate
    for missed opportunities
  failure_modes:
  - Confluence can be subjective (was the signal truly present?)
  - Overly selective approach may miss many tradeable moves
  freshness_concerns: Confluence concept is sound; no freshness risk
  unresolved_questions:
  - How to objectively measure and weight different signal types?
  - Is there an optimal confluence threshold?
  _book_id: high-probability-trading-strategies-2008
  _audit_grade: B
- id: HDTFL-001
  title: 2% Risk Rule Correlation with Survival
  status: proposed
  derived_from:
  - HDTFL-003
  - HDTFL-004
  statement: Traders who enforce 2% max loss per trade have statistically longer survival
    and lower max drawdown than rule violators.
  proposed_mechanism: Position sizing constrains per-trade loss magnitude
  applicable_markets_and_regimes: U.S. equities intraday
  assumptions:
  - Tight stops executable
  - Trader enforces rule
  - Fee structure stable
  data_requirements: 6+ months trade logs
  baseline_or_null_hypothesis: No correlation between adherence and survival
  validation_approach: Monte Carlo with/without rule
  transaction_cost_and_fill_considerations: Gap risk exists
  robustness_checks:
  - Account size sensitivity
  - Volatility regime test
  rejection_criteria:
  - No correlation
  - Catastrophic loss despite rule
  failure_modes:
  - Gap below stop
  - Broker halt
  freshness_concerns: Market structure evolved since 2018
  unresolved_questions:
  - Optimal stop method?
  _book_id: how-to-day-trade-for-a-living-tools-tactics-money-management-2018
  _audit_grade: B
- id: HDTFL-002
  title: Stocks in Play Improve Expected Payoff
  status: proposed
  derived_from:
  - HDTFL-001
  - HDTFL-006
  statement: High-volume low-float stocks show higher payoff than random universe
  proposed_mechanism: Low-float reduces HFT, creates supply/demand imbalance
  applicable_markets_and_regimes: U.S. equities intraday
  assumptions:
  - Criteria remain predictive
  - Prices achievable
  data_requirements: 1-2 years OHLCV, float/cap history
  baseline_or_null_hypothesis: SiP and random identical payoff
  validation_approach: Backtest paired comparison
  transaction_cost_and_fill_considerations: Lower liquidity increases slippage
  robustness_checks:
  - Market cap buckets
  - Volume thresholds
  rejection_criteria:
  - Win rate <45%
  - Info ratio <0.4
  failure_modes:
  - Criteria degraded
  - Algo adoption
  freshness_concerns: HFT landscape evolved
  unresolved_questions:
  - Optimal volume threshold?
  _book_id: how-to-day-trade-for-a-living-tools-tactics-money-management-2018
  _audit_grade: B
- id: HDTFL-003
  title: ABCD Pattern Positive Expected Payoff
  status: proposed
  derived_from:
  - HDTFL-012
  - HDTFL-013
  statement: ABCD breakout entries achieve reward >= 2x risk on 5-min
  proposed_mechanism: Pullback reversal + breakout signals trend resumption
  applicable_markets_and_regimes: 5-minute intraday Stocks in Play
  assumptions:
  - Fibonacci holds
  - Volume is real
  - Stops executable
  data_requirements: 1-2 years 5-min OHLCV
  baseline_or_null_hypothesis: Win rate <45% or Sharpe <0.6
  validation_approach: Mechanical ABCD detection + backtest
  transaction_cost_and_fill_considerations: Slippage on breakout
  robustness_checks:
  - Fib threshold variance
  - Volume filter tuning
  rejection_criteria:
  - Win rate <45%
  - Sharpe <0.6
  - DD >15%
  failure_modes:
  - False breakouts
  - Fib not predictive
  freshness_concerns: Algos may front-run Fib levels
  unresolved_questions:
  - Optimal Fib range?
  _book_id: how-to-day-trade-for-a-living-tools-tactics-money-management-2018
  _audit_grade: B
- id: HDTFL-004
  title: Bull Flag Momentum Continuation
  status: proposed
  derived_from:
  - HDTFL-014
  statement: Flag breakouts signal continuation with positive expectancy
  proposed_mechanism: Consolidation = accumulation; volume breakout = confirmation
  applicable_markets_and_regimes: 5-min to 15-min intraday
  assumptions:
  - Flag objective
  - Volume real
  - Breakouts follow-through
  data_requirements: 1-2 years intraday OHLCV
  baseline_or_null_hypothesis: Breakouts reverse >40% or win rate <50%
  validation_approach: Mechanical flag + volume + breakout test
  transaction_cost_and_fill_considerations: Slippage on volume breakout
  robustness_checks:
  - Consolidation length tuning
  - Volume multiplier
  rejection_criteria:
  - Win rate <50%
  - Reversals >40%
  failure_modes:
  - False volume
  - Algo front-run
  freshness_concerns: Volume may be algorithmic noise
  unresolved_questions:
  - Optimal range duration?
  _book_id: how-to-day-trade-for-a-living-tools-tactics-money-management-2018
  _audit_grade: B
- id: HDTFL-005
  title: VWAP Bounce Mean Reversion
  status: proposed
  derived_from:
  - HDTFL-017
  - HDTFL-018
  statement: VWAP bounces with vol >2x achieve payoff >=1.5x risk
  proposed_mechanism: VWAP = fair value; reversal = overshoot; high vol = conviction
  applicable_markets_and_regimes: 5-min intraday VWAP resets daily
  assumptions:
  - VWAP correct
  - Vol threshold predictive
  - Bounces mean-revert
  data_requirements: 1-2 years 5-min OHLCV + daily vol avg
  baseline_or_null_hypothesis: Win rate <50% or Sharpe <0.5
  validation_approach: VWAP + vol filter + exit at 1.5x target
  transaction_cost_and_fill_considerations: Slippage at VWAP, zero-commission now
  robustness_checks:
  - Vol threshold tuning
  - VWAP tolerance tuning
  rejection_criteria:
