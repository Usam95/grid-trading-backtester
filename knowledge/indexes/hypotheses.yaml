  _audit_grade: B
- id: IBKRPY-H-001
  title: Turtle Trading System Profitability in Current Equities Market
  status: proposed
  derived_from:
  - IBKRPY-C13-012
  statement: Turtle trend-following system (20-day breakout + ATR stop) produces positive
    risk-adjusted returns in US equities when tested on 2024-2026 data with current
    commission/slippage costs.
  proposed_mechanism: Trend persistence in equities captured by breakout; ATR-scaled
    stops adapt to regime; lower commissions (post-2019) improve edge.
  applicable_markets_and_regimes: US equities (SPY constituents); valid in trending
    regimes; may fail in range-bound markets.
  assumptions:
  - Trends persist at 20-day scale in current market regimes
  - ATR captures effective volatility for stop placement
  - Slippage on entry/exit <5 bps average
  - No regime shift in correlation structure
  data_requirements:
  - Daily OHLCV for 500+ liquid US equities, 2000-2026
  - Corporate actions (splits, dividends) adjusted
  - Survivorship bias corrected (all tickers including delisted)
  baseline_or_null_hypothesis: Random entry/exit produces zero alpha; Turtle outperforms
    by >5% annualized after costs.
  validation_approach: Walk-forward backtest (5Y in-sample, 1Y out-of-sample, rolling);
    measure Sharpe, max drawdown, hit rate; compare 2019 baseline results to 2024-2026.
  transaction_cost_and_fill_considerations: 'Commission: 0.5-1.0 bps (IB current);
    slippage: 5-10 bps on breakout entries, 2-5 bps on ATR stops; liquidity filter
    (volume > 1M shares/day).'
  robustness_checks:
  - 'Parameter sensitivity: window from 15-30 days, ATR multiple from 1.5-3.0'
  - 'Subsample testing: test on deciles by market cap'
  - 'Regime filtering: test only in VIX regimes >15 vs <15'
  - Comparison to buy-and-hold and random entry benchmarks
  rejection_criteria: Out-of-sample Sharpe < 0.5 or max drawdown > 30% or hit rate
    < 45%; strategy curves upward in out-of-sample (overfitting).
  failure_modes:
  - Regime shift to mean-reversion dominance; breakouts reversed
  - Increased correlations reduce diversification benefit across stocks
  - Slippage increases due to reduced liquidity or wider spreads
  - Systematic gap between backtested fills and live execution
  freshness_concerns: Market structure and speed changed since 2019; latency of entry
    signals may have increased; retail participation increased; Turtle signals may
    be frontrun
  unresolved_questions:
  - How do Turtle returns vary by sector or market cap tier?
  - 'What is the optimal rebalance frequency: daily, weekly, or adaptive?'
  - How does the system perform during regime changes (e.g., 2020 COVID crash)?
  _book_id: algorithmic-trading-with-interactive-brokers-python
  _audit_grade: A
