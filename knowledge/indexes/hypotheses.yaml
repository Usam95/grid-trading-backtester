  applicable_markets_and_regimes: Intraday 1-5 min charts; trending markets with volatility
  assumptions:
  - ABCD extrema can be reliably identified within 1% of true extreme
  - Fibonacci tolerance is ±5% of calculated levels
  data_requirements:
