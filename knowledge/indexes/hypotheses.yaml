- id: HYP-001
  title: EUR/USD Fair Value Deviation from Monthly Regression Predicts 3-6 Month Reversion
  status: proposed
  derived_from:
  - FXA-ch4-001
  statement: When EUR/USD trades >1.5 standard deviations above or below the monthly
    fair-value regression model (using inflation ratio, bond spreads, S&P 500 as explanatory
    variables), the pair reverts toward the mean within 3-6 months with >60% probability.
  proposed_mechanism: Macro fundamentals (inflation, yield differentials) anchor exchange
    rates over medium horizons. Transient sentiment shocks push prices beyond fair-value
    bands, but mean reversion occurs as fundamental drivers reassert.
  applicable_markets_and_regimes: EUR/USD currency pair; mid-to-long-term (3-6 month)
    trading horizons; non-crisis regimes. Model assumes stable capital flows and macro
    policy.
  assumptions:
  - Regression coefficients remain stable within 1-2 year windows
  - Explanatory variables (CPI, yields, equity prices) lead exchange rates
  - No structural breaks from geopolitical/policy shocks
  - Margin financing available to hold positions through drawdowns
  data_requirements:
  - Monthly CPI data (Europe, USA)
  - 10-year government bond yields (German, US)
  - S&P 500 Index monthly closes
  - EUR/USD monthly closes 1993-present
  baseline_or_null_hypothesis: EUR/USD follows a random walk; fair-value bands have
    no predictive power.
  validation_approach: 'Train regression on data through 2008Q2. Backtest 2008Q3-2009
    period: track percentage of trades where >1.5σ deviations preceded reversion within
    3-6 months. Measure annualized return if pairs were entered at extreme levels
    with 3-6 month hold and exited at mean.'
  transaction_cost_and_fill_considerations: Assume 2-3 pips bid/ask spread on EUR/USD.
    Slippage on entry/exit ~1 pip. Transaction costs reduce annual return by ~0.5-1%.
  robustness_checks:
  - Test on other currency pairs (USD/CAD, GBP/USD) with pair-specific regressions
  - Vary regression window (monthly vs. weekly vs. daily models) and compare reversion
    timing
  - Stress test in crisis periods (2008 Q4, 2011 euro crisis) to measure failure rates
  - Validate R-squared threshold for entry (e.g., only enter if regressor R² > 0.20)
  rejection_criteria:
  - If reversion occurs in <20% of instances at >1.5σ deviation, hypothesis is rejected
  - If drawdown before reversion exceeds 3% on average, hypothesis is rejected for
    practical trading
  - If model R² drops below 0.15 in any 12-month period, validate before re-deployment
  failure_modes:
  - Structural breaks (e.g., Iraq invasion 2003, 9/11) invalidate model for weeks/months
  - QE policy (2008+) violates assumption that yields anchor rates
  - Capital-flow reversals (financial crises) cause deviations to widen before reverting
  freshness_concerns: Post-2008 macro policy (negative rates, QE, currency intervention)
    has altered fundamental relationships. Regression coefficients may not transfer
    forward.
  unresolved_questions:
  - How to adapt model in zero/negative yield environment?
  - How to detect structural breaks in real-time?
  - Should commodity prices be added as regressors for commodity-linked currencies
    (CAD, AUD, NZD)?
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: HYP-002
  title: CFTC Non-Commercial Positioning Extremes Precede Trend Reversal by 2-4 Weeks
  status: proposed
  derived_from:
  - FXA-ch5-001
  statement: When CFTC non-commercial net long EUR/USD position reaches >120K contracts
    (>90th percentile) or <-20K (<10th percentile), a reversal in EUR/USD direction
    is likely within 2-4 weeks with elevated probability.
  proposed_mechanism: Speculators drive trends via carry trades and momentum strategies.
    Crowded positioning indicates exhaustion. When speculators have pushed positions
    to extremes, few are left to buy (in long crowding) or sell (in short crowding),
    setting up reversal as position liquidation begins.
  applicable_markets_and_regimes: EUR/USD futures; 2-4 week tactical horizons. Works
    best in non-crisis periods (normal backwardation, carry stable). Breaks down in
    VaR-driven sell-offs (2008, 2011).
  assumptions:
  - CFTC non-commercial trader cohort is reasonably stable
  - Position extremes reflect crowding, not just open-interest growth
  - Reversals are not masked by other fundamental developments (Fed announcements,
    ECB policy)
  data_requirements:
  - CFTC COT report (non-commercial positions EUR) weekly
  - EUR/USD weekly closes and daily closes for intra-week management
  - Historical open-interest levels to normalize for scale
  baseline_or_null_hypothesis: CFTC positioning is noise; peaks/troughs are not predictive
    of reversals.
  validation_approach: Identify all instances of positioning >90th or <10th percentile
    2000-2008. Count reversal occurrences within 2-4 weeks (define reversal as >2%
    move opposite the crowded direction). Measure win rate and average time-to-reversal.
    Compare to random walk.
  transaction_cost_and_fill_considerations: Futures spread ~0.5 pips; entry/exit slippage
    ~1 pip. Cost per round-turn ~0.15% of notional.
  robustness_checks:
  - Test on other currency pairs with CFTC data (GBP, JPY)
  - Vary percentile thresholds (80th/20th, 95th/5th) to find optimal entry level
  - Measure impact of CFTC data lag (3 days) on entry timing
  - Validate against different market regimes (range-bound vs. trending)
  rejection_criteria:
  - If win rate <40% across all pairs and periods, reject
  - If average reversal time >6 weeks, reject (too slow for 2-4 week thesis)
  - If drawdown to reversal exceeds 2%, reject for risk-management purposes
  failure_modes:
  - CFTC data 3 days old; reversals may already be underway by Friday release
  - Position extremes can persist for weeks in strong trends (EUR/USD 2006-2008)
  - Open-interest growth (2x from 2000 to 2008) changes meaning of absolute position
    sizes
  - In crisis, positioning liquidation is violent and unidirectional (2008, 2011);
    reversal hypothesis breaks
  freshness_concerns: Post-Dodd-Frank 2010, position limits capped speculative net
    longs. CFTC positions no longer reach 2008 extremes. Thresholds need re-calibration.
  unresolved_questions:
  - How to normalize positioning for open-interest growth?
  - Should positioning extremes be relative (e.g., >1 std from rolling median) rather
    than absolute?
  - Can positioning extremes be detected intra-week from options market risk reversals
    (real-time proxy)?
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: HYP-003
  title: Oscillator Overbought/Oversold in Range-Bound Markets Predicts Reversal;
    Fails in Trends
  status: proposed
  derived_from:
  - FXA-ch8-001
  - FXA-ch8-005
  - FXA-risk-001
  statement: RSI > 70 or Stochastic > 80 in range-bound (volatile but non-trending)
    markets predicts reversal within 3-5 days with >55% win rate. The same signals
    in trending markets produce <40% win rate and large drawdowns (20-30%).
  proposed_mechanism: Oscillators measure momentum exhaustion. In range-bound markets,
    reversions to mean are frequent. In trending markets, oscillators can stay extreme
    for weeks while prices continue trending, causing repeated whipsaws.
  applicable_markets_and_regimes: 'Multi-currency (EUR/USD, GBP/USD, AUD/USD shown);
    3-5 day to 1-week trading horizons. Regime-dependent: works in Bollinger Band
    ranges (±2σ), fails in sustained trends (>2 weeks, >2% directional move).'
  assumptions:
  - Trend regime can be detected in real-time (e.g., >2 week trend = exclude oscillator
    signals)
  - Oscillators are calculated identically across currency pairs
  - Volatility (ATR) is available to define range-bound regime
  data_requirements:
  - Weekly/daily RSI (14-period) and Stochastic (5,3) for EUR/USD, GBP/USD, AUD/USD
  - Average True Range (ATR) for volatility measurement
  - Price levels and highs/lows for range identification
  baseline_or_null_hypothesis: Oscillator signals have no predictive power across
    all market regimes.
  validation_approach: 'Classify each trading week as range-bound (ATR <1%, price
    within Bollinger Bands) or trending (ATR >1.5% or price outside bands). Test oscillator
    signals separately in each regime. In range-bound: measure % signals that lead
    to reversal within 3-5 days. In trending: measure % signals that are whipsaws.
    Compute Sharpe ratio for each regime.'
  transaction_cost_and_fill_considerations: 'Spot FX: 2-3 pips bid/ask; futures: 0.5
    pips. Assume 1 pip slippage on entry/exit.'
  robustness_checks:
  - Test on 1-hour, 4-hour, daily, and weekly timeframes to measure robustness to
    timeframe
  - Measure out-of-sample performance on rolling 6-month test windows
  - Vary oscillator thresholds (RSI > 65, > 75; Stochastic > 75, > 85) to optimize
    for regime
  rejection_criteria:
  - If range-bound win rate <50% across pairs, reject
  - If drawdown in trending regime >15%, reject (unacceptable for position sizing)
  - If parameters over-fit to one pair and fail to transfer to others, reject generalizability
  failure_modes:
  - 'Regime detection lag: markets transition from range to trend; oscillator signals
    cluster just before transition, leading to large drawdowns'
  - Oscillator settings vary by pair; ETH/BTC may require 7-period vs. 14-period RSI
  - Tick-by-tick whipsaws and slippage erode small 0.5-1% trades in real execution
  freshness_concerns: Post-2010, algorithmic trading and HFT increased intraday volatility
    and noise. Oscillator signals may be noisier than in 2009 book-era.
  unresolved_questions:
  - Can regime shifts be predicted 1-2 days ahead to avoid whipsaws during transitions?
  - Should oscillator signals be weighted by volume or market depth?
  - How to set stop-loss below oscillator reversal trades given non-linear risk?
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: HYP-004
  title: Combined Fundamental-Positioning-Technical Filter Reduces False Signals vs.
    Any Single Pillar
  status: proposed
  derived_from:
  - FXA-intro-001
  - FXA-case-001
  statement: 'A combined signal (all three filters active: fair-value deviation >1σ,
    CFTC positioning extreme, AND oscillator overbought/oversold) produces win rate
    >60% and drawdown <10% on EUR/USD medium-term trades. Single-pillar signals produce
    <50% win rate and >15% drawdowns.'
  proposed_mechanism: Fundamental fair value provides context; positioning shows sentiment
    extremes; technical signals provide entry timing. Requiring all three reduces
    false positives that occur when one pillar is misaligned.
  applicable_markets_and_regimes: EUR/USD and other major pairs; medium-term (2-4
    week) tactical trades; normal market regimes (no crisis, currency intervention
    stable).
  assumptions:
  - The three pillars are sufficiently uncorrelated to reduce false signals through
    AND logic
  - Position sizing and stops can accommodate >10% drawdowns
  data_requirements: All data required for HYP-001, HYP-002, HYP-003
  baseline_or_null_hypothesis: Single-pillar signals are sufficient; combining them
    adds complexity without improving returns.
  validation_approach: 'Backtest 2003-2008 on EUR/USD: count all instances of combined
    signal (all three filters). Measure win rate (price moves >100 pips in expected
    direction within 2-4 weeks). Measure maximum drawdown. Compare to win rates for
    each pillar independently. Report Sharpe ratio improvement.'
  transaction_cost_and_fill_considerations: 2-3 pips per trade; assume 1-2 trades
    per signal.
  robustness_checks:
  - Test on other pairs (GBP/USD, USD/JPY) with same filter logic
  - Measure robustness to parameter changes (fair-value threshold 1.0σ vs. 1.5σ, etc.)
  - Test on crisis periods (2008 Q4, 2011) to measure failure rates and drawdowns
  rejection_criteria:
  - If combined filter win rate <55%, reject
  - If combined filter drawdown >15%, reject
  - If combined filter frequency <1-2 signals per month (too infrequent to trade),
    reject
  failure_modes:
  - All three pillars can align during bubble peaks (e.g., 2008 EUR/USD 1.60 spike),
    leading to catastrophic signal failure
  - Correlation of pillars increases in crises; AND logic breaks down
  - 'Signal lag: by time all three filters align, entry point has passed and momentum
    exhausted'
  freshness_concerns: Book-era market structure and correlations have evolved. Fundamentals,
    positioning, and technicals may be less orthogonal post-2010.
  unresolved_questions:
  - What weights should each pillar receive? Equally 1/3 each, or should technical
    have lower weight?
  - Should we use OR (any signal) vs. AND (all signals) logic, or weighted probability?
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: HYP-005
  title: Moving Average Crossovers Identify Trend Onset; Lag Limits Scalability to
    Intraday
  status: proposed
  derived_from:
  - FXA-ch7-001
  statement: 13/26-week moving average crossovers on weekly EUR/USD identify trend
    onset with 3-5 week lead time on average. Daily 5/20-day MA crossovers have <2
    day lead time and are too lagged for intraday scalping but useful for swing trades
    (3-5 day holds).
  proposed_mechanism: Moving averages smooth price noise and reveal sustained directional
    bias. Crossover indicates acceleration. Lag increases with MA period; 52-week
    MA is most lagged but most reliable.
  applicable_markets_and_regimes: All currency pairs; 3-5 day (swing) and 1-4 week
    (tactical) trading horizons. Less useful for intraday scalping or very short-term
    (hours).
  assumptions:
  - Trends persist for weeks/months (not reversing intra-week)
  - Lag cost is acceptable relative to trend size
  data_requirements: Weekly and daily closing prices for EUR/USD, GBP/USD, USD/JPY,
    etc.
  baseline_or_null_hypothesis: Moving average crossovers are lagged noise; they do
    not predict trends significantly better than flipping a coin.
  validation_approach: Identify all 13/26-week MA crossovers on EUR/USD 1999-2008.
    Measure % of crossovers followed by >100 pips move in crossover direction within
    3-5 weeks. Measure average time-to-entry (lag) and average winning trade size.
    Compare Sharpe ratio to buy-and-hold.
  transaction_cost_and_fill_considerations: 2-3 pips per trade; assume 1 trade per
    crossover.
  robustness_checks:
  - Test on all major pairs (GBP, JPY, CHF)
  - Vary MA periods (12/24, 13/26, 20/50) to find optimal lag/signal trade-off
  - Measure performance in different volatility regimes (normal vs. high vol)
  rejection_criteria:
  - If win rate <55%, reject
  - If average lag >2 weeks, reject for intraday strategies
  failure_modes:
  - 'MA lag: entry is 2-3 weeks late; by then, 50% of trend has already occurred'
  - Choppy markets cause repeated false crossovers (death by a thousand cuts)
  - Sharp reversals cause large drawdowns before MA lags are realized as losses
  freshness_concerns: Low; moving averages are algorithmic and stable over time.
  unresolved_questions:
  - Should moving averages be adjusted for volatility (adaptive MAs) rather than fixed
    periods?
  - Can entry be accelerated by detecting momentum before MA crossover?
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: HYP-006
  title: Risk-Reversal Skew Extremes Precede Options-Market Reversals by 1-3 Days
  status: proposed
  derived_from:
  - FXA-ch6-001
  statement: When 1-month EUR/USD risk-reversal skew reaches >2% (calls >2% more expensive
    than puts) or <-2%, the options market is off-balance and reverts within 1-3 days
    with >60% probability, as hedging demand unwinds.
  proposed_mechanism: Risk reversals reflect options traders' skewed directional view.
    Extreme skew indicates one-sided positioning. Unwinding/covering of extreme skew
    leads to quick reversals.
  applicable_markets_and_regimes: Currency options market (1-month implied volatility
    skew); 1-3 day intraday/overnight trading horizons. Real-time data, no publication
    lag unlike CFTC.
  assumptions:
  - Options market risk-reversal skew is observable and tradeable (tight bid/ask)
  - Skew extremes are rare and reliable predictors
  data_requirements: 1-month EUR/USD implied volatility for calls and puts (25-delta
    conventions)
  baseline_or_null_hypothesis: Risk-reversal skew extremes are noise; no predictive
    power for reversals.
  validation_approach: Collect daily 1-month call/put IV for EUR/USD 2005-2008. Identify
    days when skew >2% or <-2%. Measure % of such days followed by reversal (>0.5%
    opposite-direction move) within 1-3 days. Measure average reversal size and entry
    profitability.
  transaction_cost_and_fill_considerations: 'Options spreads: 0.05-0.10 vol point;
    FX spot slippage ~1 pip on reversal entry.'
  robustness_checks:
  - Test on other pairs (GBP, JPY)
  - Vary skew threshold (1.5%, 2.0%, 2.5%) to find optimal entry level
  - 'Compare to CFTC positioning extremes: are they correlated?'
  rejection_criteria:
  - If win rate <55%, reject
  - If data availability is limited (options pricing may not be public), mark as high-uncertainty
  failure_modes:
  - Options market can be illiquid away from ATM; execution slippage may eliminate
    edge
  - Skew extremes can persist (sticky strike effect) rather than quickly reverting
  freshness_concerns: High. Options market structure, retail access, and vol surface
    dynamics have changed post-2008.
  unresolved_questions:
  - How to trade risk-reversal skew directionally (is skew a directional signal or
    just a volatility signal)?
  - Should skew be combined with implied-vol level (elevated vol + extreme skew =
    stronger signal)?
  _book_id: bloomberg-professional-forex-analysis-and-trading-effective--2010
  _audit_grade: B
- id: CODCAP-H1
  title: Position sizing based on account percentage reduces drawdown volatility
  status: proposed
  derived_from:
  - CODCAP-C8-001
  statement: Allocating a fixed fraction of account equity to each position (e.g.,
    2% of account per trade) produces lower equity curve volatility and more predictable
    maximum drawdown than fixed-size position allocation.
  proposed_mechanism: Fractional position sizing automatically reduces size during
    drawdown periods, curtailing compounding losses and slowing account erosion.
  applicable_markets_and_regimes: All markets with sufficient liquidity to accommodate
    fractional sizing; more effective in trending or momentum-driven regimes where
    drawdowns are gradual.
  assumptions:
  - Account equity is observable and updated in real-time
  - Position sizing constraints honor maximum allocation rules
  - Broker supports fractional share/contract sizing
  data_requirements:
  - Historical account equity curve
  - Historical trade-by-trade P&L and position sizes
  - 'Comparison: same strategy with fixed position size vs. fractional sizing'
  baseline_or_null_hypothesis: Fixed-size position allocation performs equally or
    better; fractional sizing adds no benefit.
  validation_approach: Backtest same strategy with fixed 1-lot sizing vs. 2% fractional
    sizing; measure Sharpe ratio, max drawdown, and drawdown duration.
  transaction_cost_and_fill_considerations: Fractional sizing may increase round-lot
    fragmentation; verify that smaller position sizes do not incur higher per-unit
    commissions.
  robustness_checks:
  - Walk-forward test across multiple market periods
  - Test with different percentage allocations (1%, 2%, 5%)
  - Verify performance across different asset classes
  rejection_criteria:
  - Fractional sizing produces higher Sharpe ratio or lower max drawdown than fixed
    sizing
  - Equity curve is not smoother; volatility similar to fixed sizing
  failure_modes:
  - Fractional sizing fails if account is heavily depleted; position sizes become
    too small to execute
  - Sizing rule interacts with portfolio constraints; may cause unintended underutilization
  freshness_concerns: Low; position sizing math does not depend on current market
    data.
  unresolved_questions:
  - What is the optimal fraction (Kelly, half-Kelly, 2% rule)?
  - Does fractional sizing interact with entry/exit logic to reduce alpha?
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-H2
  title: Real-time data quality validation prevents stale and corrupt data from poisoning
    backtest
  status: proposed
  derived_from:
  - CODCAP-C12-001
  statement: Implementing data quality checks (stale quote detection, out-of-order
    tick rejection, gap detection, price anomaly flagging) in the real-time data pipeline
    reduces backtest-to-live divergence due to bad data.
  proposed_mechanism: Streaming data validation identifies and filters or quarantines
    malformed ticks before algorithm consumption; bad data never enters strategy or
    risk calculations.
  applicable_markets_and_regimes: All markets with streaming data feeds; particularly
    important in volatile or illiquid markets with higher anomaly rates.
  assumptions:
  - Data anomalies are deterministic (e.g., out-of-order, stale, price spike)
  - Validation rules correctly identify anomalies without false positives
  - Quarantined or filtered data is logged for audit
  data_requirements:
  - Historical data samples with known anomalies
  - Broker/data vendor documentation of expected tick sequence and timing
  - Backtest results with and without validation applied
  baseline_or_null_hypothesis: Accepting all incoming ticks without validation is
    sufficient; data quality is high enough that filtering adds no material benefit.
  validation_approach: Audit incoming real-time data for anomalies; measure fraction
    detected; compare backtest P&L with validation ON vs. OFF; verify live data matches
    historical quality.
  transaction_cost_and_fill_considerations: Filtering data may cause temporary blind
    spots during anomaly windows; verify strategy does not inadvertently benefit from
    data gaps.
  robustness_checks:
  - Inject synthetic anomalies (duplicates, reversals, stale quotes); verify detection
  - Test on multiple data vendors; check if anomaly signatures differ
  - Compare detected anomalies to broker logs; verify ground truth
  rejection_criteria:
  - Data validation produces high false positive rate; legitimate ticks are rejected
  - Strategy performance unchanged; validation detects no material anomalies
  failure_modes:
  - Overly aggressive filtering removes valid edge cases; strategy becomes blind
  - Validation logic has bug; rejects correct data or accepts bad data
  freshness_concerns: MEDIUM; broker data formats and anomaly signatures may change.
  unresolved_questions:
  - What is the cost of missed ticks during anomaly quarantine?
  - How do we coordinate validation with order execution (e.g., reject trade if quote
    is flagged anomalous)?
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-H3
  title: Async I/O concurrency reduces market data ingestion latency by 50%+ vs. synchronous
    polling
  status: proposed
  derived_from:
  - CODCAP-C9-001
  statement: Event-driven async I/O (asyncio, aiohttp) handles market data subscriptions
    with lower thread count and reduced wake-latency compared to thread-per-stream
    synchronous polling.
  proposed_mechanism: Async I/O multiplexes multiple network streams onto a single
    OS thread; event loop wakes when data arrives, avoiding scheduler delays from
    thread context switching.
  applicable_markets_and_regimes: All market feed scenarios with multiple concurrent
    data streams (multiple tickers, multiple brokers, multi-asset).
  assumptions:
  - Async implementation is correct (no blocking I/O in event loop)
  - Python version supports asyncio natively
  - Broker APIs support async client libraries
  data_requirements:
  - 'Baseline latency measurement: synchronous multi-threaded client'
  - Async implementation latency measurement
  - CPU and memory usage comparison
  baseline_or_null_hypothesis: Synchronous threading is sufficiently fast; async adds
    complexity without latency benefit.
  validation_approach: 'Benchmark ingestion latency and CPU/memory usage on same hardware:
    100-stream synchronous vs. 100-stream async; measure time from broker emission
    to strategy receipt.'
  transaction_cost_and_fill_considerations: Low; latency improvement does not affect
    fill quality directly but enables faster order response.
  robustness_checks:
  - Test with 10, 100, 1000 concurrent streams
  - Measure latency tail (p99, p999)
  - Verify no data loss or duplicates under high load
  rejection_criteria:
  - Async implementation is slower than threading or uses more memory
  - Latency improvement is < 10%
  failure_modes:
  - Async I/O implementation blocks or deadlocks; event loop stalls
  - Broker API async client is buggy or unmaintained
  freshness_concerns: LOW; async I/O patterns are stable.
  unresolved_questions:
  - Can we pipeline market data ingestion with order execution in a single async event
    loop safely?
  - How does latency scale with number of streams?
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-H4
  title: Walk-forward backtesting detects overfitting more reliably than static train/test
    split
  status: proposed
  derived_from:
  - CODCAP-C6-001
  - CODCAP-C13-002
  statement: Rolling train-test windows (e.g., train on 3 years, validate on 1 year,
    step forward 6 months) reveal overfitting earlier than single train/test split
    because model is re-trained on different data repeatedly.
  proposed_mechanism: As model is re-fitted across different train windows, parameter
    values shift if they were overfit to specific historical data; if strategy has
    true edge, parameters should be stable across windows.
  applicable_markets_and_regimes: All strategy types; especially important for parameter-rich
    strategies and ML-based approaches.
  assumptions:
  - Strategy parameters are tracked across windows
  - Test windows are hold-out (no information leakage from test back to training)
  - Market periods are reasonably independent (e.g., do not use overlapping train/test
    windows)
  data_requirements:
  - Historical data spanning multiple years
  - Time series of fitted parameters per window
  - Per-window test performance metrics (Sharpe, max drawdown, return)
  baseline_or_null_hypothesis: Static train/test split is sufficient; walk-forward
    adds computational cost without material improvement in overfitting detection.
  validation_approach: Backtest same strategy with both methods; measure stability
    of fitted parameters across walk-forward windows; compare test-set Sharpe across
    windows.
  transaction_cost_and_fill_considerations: Walk-forward requires more backtesting
    runs (e.g., 10 windows vs. 1 split); computational cost increases.
  robustness_checks:
  - Verify test-set metrics are consistent across windows (low variance)
  - Check that out-of-sample period is truly unseen at training time
  - Test with multiple window sizes and step sizes
  rejection_criteria:
  - Walk-forward performance is more volatile than single train/test
  - Parameter stability is same across methods
  failure_modes:
  - Walk-forward windows are too small; insufficient data for reliable estimation
  - Windows overlap; information leakage occurs
  freshness_concerns: LOW; walk-forward methodology is stable.
  unresolved_questions:
  - Optimal window size and step size for different asset classes?
  - How to handle strategies with long lookback periods?
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: CODCAP-H5
  title: Infrastructure redundancy and failover detection reduce trading outage duration
    to < 1 minute
  status: proposed
  derived_from:
  - CODCAP-C11-001
  statement: Trading infrastructure with redundant order gateways, automatic failover
    detection (heartbeat timeout), and backup data connections recovers from single
    component failure with < 1 minute service interruption.
  proposed_mechanism: Primary system fails; health check times out (e.g., 10s heartbeat
    missing); failover logic switches to backup system; orders resume on backup, no
    additional market impact.
  applicable_markets_and_regimes: All live trading scenarios; critical for strategies
    that scale and cannot tolerate outages.
  assumptions:
  - Backup system is synchronized with primary (order state, account positions)
  - Failover detection is deterministic (no false positives)
  - Backup system has capacity to handle full load
  data_requirements:
  - Historical outage logs
  - Failover detection latency measurements
  - Recovery time from primary to backup (order replay, connection re-establishment)
  baseline_or_null_hypothesis: Single system is sufficient; redundancy adds cost without
    material outage reduction.
  validation_approach: Inject component failures (kill primary order gateway, simulate
    network partition); measure time to failover and order resumption; verify no orders
    are lost or duplicated.
  transaction_cost_and_fill_considerations: Failover may incur slippage if orders
    are re-submitted; verify market conditions have not changed during outage window.
  robustness_checks:
  - Test failover during market hours (high volume, volatility)
  - Verify order state consistency between primary and backup
  - Measure false positive rate of health checks
  rejection_criteria:
  - Failover latency > 1 minute
  - Orders are lost or duplicated during failover
  failure_modes:
  - 'Split-brain: both primary and backup active; orders doubled'
  - Backup system is also down; no failover target
  freshness_concerns: LOW; failover patterns are stable.
  unresolved_questions:
  - How to maintain consistency of order state across primary and backup?
  - Can we failover without re-submitting orders or risk-checks?
  _book_id: coding-capital-the-art-of-algorithmic-trading-a-comprehensiv-2024
  _audit_grade: B
- id: REGIME-H1
  title: DC indicator R better captures high-frequency regime transitions than daily
    realized volatility
  status: proposed
  derived_from:
  - REGIME-C3-002
  - REGIME-C2-002
  statement: When monitoring financial markets at intra-day frequencies, the Directional
    Change indicator R (log-transformed, combining price movement and duration) detects
    regime transitions faster and with fewer false negatives than daily realized volatility
    computed from fixed-interval returns.
  proposed_mechanism: DC sampling occurs at event-driven times (price thresholds),
    capturing intra-day regime shifts before they manifest in next-day volatility.
    RV requires full trading day of data before calculation. Thus DC is inherently
    faster.
  applicable_markets_and_regimes: High-frequency markets (FX, crypto spot, micro-cap
    equities); applicable in both normal and abnormal regimes; more relevant during
    regime transitions.
  assumptions:
  - Threshold theta is chosen appropriately for target market volatility
  - Log-transformation of R yields approximately normal distribution for HMM
  - Two-state HMM captures market regime complexity for observation window
  - Intra-day regime transitions are economically meaningful (not noise)
  data_requirements:
  - Second-by-second or tick-level price data
  - At least 3-6 months of historical data for HMM calibration
  - Known regime transition dates or events for validation (e.g., policy announcements,
    market shocks)
  baseline_or_null_hypothesis: Daily realized volatility is as effective as DC indicator
    for regime detection; intra-day regime transitions are undetectable or economically
    insignificant.
  validation_approach: Compare detection lag by measuring time between regime onset
    (market event date) and detection via DC vs. RV; compare false-positive rate by
    counting erroneous regime transitions flagged by each method on stable periods;
    test on multiple currency pairs, equity indices, time periods to ensure generalization;
    use Receiver Operating Characteristic (ROC) curves to evaluate trade-off between
    sensitivity and specificity.
  transaction_cost_and_fill_considerations: Faster regime detection (DC) allows earlier
    trade entry/exit, potentially reducing slippage costs. More false alarms (especially
    if DC threshold too low) may incur unnecessary bid-ask spreads. Benefit of early
    detection must exceed transaction cost increase from higher trading frequency.
  robustness_checks:
  - Validate threshold theta on out-of-sample periods (different market regimes, crises,
    quiet periods)
  - Test sensitivity to HMM initialization and number of states
  - Compare performance across asset classes (FX, equities, crypto)
  - Assess stability of regime boundaries under different sampling frequencies
  rejection_criteria:
  - If DC detection lag is not statistically significantly faster than RV (p > 0.05)
  - If DC false-positive rate exceeds RV false-positive rate by >20%
  - If regime transitions detected via DC do not align with known market events or
    HMM posterior probabilities drop below 60%
  failure_modes:
  - DC threshold transfer between markets fails; theta=0.4% optimal for FX but not
    equities
  - HMM overfitting to backtest period; regimes do not generalize
  - Lag in Naive Bayes inference negates early-detection advantage
  - High volatility regime exhibits power-law tail; Gaussian HMM assumption violated
  freshness_concerns: Market microstructure changes (tick size regulation, trading
    hours, venue consolidation) may alter DC indicator properties. Regimes themselves
    may shift post-2020 (e.g., impact of algorithmic trading proliferation, central
    bank policies).
  unresolved_questions:
  - Is theta universal or market-specific? How to select theta for novel assets?
  - Does DC provide edge in practice or only in backtest? What are realistic transaction
    costs?
  - Can regime detection be made fully automatic, or does human judgment remain essential?
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-H2
  title: Normal-regime vs. abnormal-regime classification generalizes across independent
    markets
  status: proposed
  derived_from:
  - REGIME-C4-001
  - REGIME-C4-002
  statement: Market regimes identified via DC+HMM can be reliably classified as Normal
    (lower volatility, stable pricing) or Abnormal (crisis, high volatility) using
    a threshold on DC indicator R; this classification generalizes across equity indices,
    currency pairs, and even asset classes without retraining.
  proposed_mechanism: Regime 1 (lower R mean/variance) corresponds to normal trading;
    Regime 2 (higher R mean/variance) corresponds to abnormal/stressed market conditions.
    If R distributions are invariant across markets, a global threshold can classify
    regimes universally.
  applicable_markets_and_regimes: 'All tested equity indices (DJIA, FTSE 100, S&P
    500) and FX pairs (EUR-GBP, GBP-USD, EUR-USD); assumption: hypothesis extends
    to commodities, crypto.'
  assumptions:
  - Regime 1 and 2 have distinct and non-overlapping R distributions
  - R distribution is stationary across time and does not depend on asset or market
    microstructure
  - A single global R threshold (or bounded set of thresholds) is sufficient for 90%+
    accuracy across markets
  - Normal regime corresponds to lower risk/drawdown; abnormal to higher risk (testable
    assumption)
  data_requirements:
  - Historical DC indicator R values from multiple independent markets
  - Known labels for regime transitions (financial crises, policy events, or ground-truth
    HMM labels from large training set)
  - At least 1 year of data per market to capture both normal and abnormal periods
  baseline_or_null_hypothesis: Regime classification must be tuned per market; R distributions
    are market-specific. No universal threshold exists.
  validation_approach: Train HMM on N markets and extract R quantiles for Regime 1
    and 2; set global classification threshold at, e.g., 70th percentile of pooled
    Regime 2 R distribution; apply threshold to held-out market or asset class and
    measure classification accuracy; report precision, recall, F1 score for abnormal-regime
    detection.
  transaction_cost_and_fill_considerations: If classification is accurate, can reduce
    risk by tightening stops or reducing exposure in abnormal regimes. False abnormal-regime
    predictions trigger unnecessary hedging costs. False normal-regime predictions
    expose traders to unhedged stress events.
  robustness_checks:
  - Test on different time periods (pre-2008, 2008-2009 crisis, 2010-2015 recovery,
    2016-2020)
  - Test on multiple asset classes (equities, bonds, FX, commodities, crypto)
  - Vary theta and HMM parameters; assess sensitivity
  - Compare to alternative regime definitions (e.g., volatility-based thresholds,
    Hamilton model)
  rejection_criteria:
  - If classification accuracy drops below 75% on held-out data
  - If abnormal-regime detection precision < 70% (too many false alarms)
  - If regimes fail to align with known crisis dates or market events
  - If R distributions significantly overlap across Regime 1 and 2
  failure_modes:
  - Regimes are market-specific due to different market structures, trading hours,
    liquidity profiles
  - Abnormal regime labels are contaminated (some 'abnormal' periods are not stressful)
  - R indicator biased by asset-class-specific microstructure (e.g., crypto fragmentation
    vs. equity consolidation)
  - Regime definitions collapse during truly unprecedented events (black swans)
  freshness_concerns: Crisis definition may change; systemic risk may evolve (e.g.,
    pandemic, geopolitical). Regulatory changes (circuit breakers, position limits)
    alter volatility dynamics. Technological advances (algorithmic trading, flash
    crashes) may create new regime types.
  unresolved_questions:
  - Is there a universal R-threshold, or do effective thresholds form a distribution?
  - Do asset classes have fundamentally different regime dynamics (commodities, crypto)
    or are differences superficial?
  - Can machine learning (e.g., anomaly detection on R) improve classification accuracy
    over fixed thresholds?
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-H3
  title: Real-time regime tracking via Naive Bayes is predictive of 1-hour-ahead price
    moves
  status: proposed
  derived_from:
  - REGIME-C5-001
  - REGIME-C5-002
  statement: When market regime (Normal vs. Abnormal) is tracked in real-time using
    Naive Bayes classifier on DC indicators, regime transitions are predictive of
    next-hour returns or volatility; specifically, transitions to Abnormal regime
    precede volatility spikes by 15-60 minutes on average.
  proposed_mechanism: Collective trader behavior (reflected in DC events) shifts before
    volatility formally manifests in returns. Naive Bayes detects probability shift;
    lag between detection and volatility spike creates arbitrage opportunity.
  applicable_markets_and_regimes: Equity indices, currency pairs, intra-day frequencies
    (1-hour horizon). Most relevant during regime transitions.
  assumptions:
  - Regime transitions are causal precursors of volatility moves, not artifacts
  - Naive Bayes conditional independence assumption holds for regime features (e.g.,
    DC return, trend duration)
  - Historical regime-label probabilities are predictive (stationarity assumption)
  - Lag between detection and volatility spike is consistent and exploitable (15-60
    min); not random
  data_requirements:
  - Intra-day price data (minute-level or better) for equity and FX instruments
  - Trained Naive Bayes classifier with posterior probabilities for regime membership
  - Aligned regime labels (HMM-derived) and realized volatility (RV) or returns for
    1-hour forward window
  - At least 1-2 years of continuous data to capture regime transitions
  baseline_or_null_hypothesis: Regime transitions are not predictive of next-hour
    volatility; lag is random or regime labels have no information content.
  validation_approach: Compute Naive Bayes posterior probability of regime transition
    at each time step; group observations by regime transition type (Normal-Abnormal,
    Abnormal-Normal, no change); measure average realized volatility in next hour
    for each transition type; calculate information coefficient (IC) between transition
    probability and forward volatility; perform statistical significance test (e.g.,
    t-test) on lag between probability shift and volatility realization.
  transaction_cost_and_fill_considerations: If predictive lag is only 5-10 minutes,
    transaction costs (bid-ask, commissions) may erase edge. If lag is 30-60 minutes,
    strategy has time to establish positions and benefit from volatility move. Optimal
    trade sizing depends on lag and signal strength (posterior probability).
  robustness_checks:
  - Cross-validate on different time periods and markets
  - Vary Naive Bayes tuning (prior probabilities, feature selection, smoothing)
  - Test different forward-looking windows (30 min, 1 hour, 2 hours, 1 day) to find
    optimal horizon
  - Control for obvious volatility drivers (option expiry, economic data releases,
    news events)
  rejection_criteria:
  - If information coefficient < 0.1 (weak signal)
  - If lag distribution has high variance (>50% of mean); too unpredictable for trading
  - If realized volatility in Normal and Abnormal regimes not significantly different
    (p > 0.05)
  - If out-of-sample performance degrades by >30% compared to in-sample
  failure_modes:
  - Regime transition precedes volatility, but leads are too short to trade profitably
  - Abnormal regime definition includes benign, non-volatile periods (false positives)
  - Transition detection itself introduces lag due to Naive Bayes inference; effective
    predictive power is zero
  - Regime changes are simultaneous with volatility spikes, not predictive; no lag
    to exploit
  freshness_concerns: Algorithm trading may have eliminated predictability; regimes
    may now be instantly priced. Market microstructure changes (e.g., faster order
    execution, tick-size changes) may compress lag. Regime definitions may drift post-crisis
    periods.
  unresolved_questions:
  - Is the lag truly exploitable after costs, or is it a statistical artifact?
  - Do different market conditions (quiet, trending, crisis) have different lag distributions?
  - Can machine learning improve forecast vs. Naive Bayes baseline?
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
- id: REGIME-H4
  title: Regime-aware trading strategies reduce maximum drawdown by 15-30% without
    sacrificing returns
  status: proposed
  derived_from:
  - REGIME-C6-001
  - REGIME-C6-002
  statement: Algorithmic trading strategies that incorporate regime-change signals
    (entry/exit on Normal↔Abnormal transitions) achieve 15-30% lower maximum drawdown
    than buy-and-hold or regime-agnostic strategies, with no significant reduction
    in total returns (annualized return within ±10% of baseline).
  proposed_mechanism: When regime shifts to Abnormal (high volatility), regime-aware
    algorithm reduces exposure (exits longs or tightens stops); this avoids peak drawdowns.
    Transition back to Normal allows re-entry; total return captured by timing entry/exit
    around regime dips.
  applicable_markets_and_regimes: Equity indices, FX, and other trending/mean-reverting
    instruments; most benefit during market stress or regime-heavy periods (e.g.,
    2008 crisis, Brexit, COVID crash).
  assumptions:
  - Regime transitions are detectable before major drawdowns occur (detection lag
    < 1 day)
  - Normal regime correlates with favorable trading conditions (low risk); Abnormal
    with high drawdown risk
  - Money management (fixed lot sizing, stops) is appropriate; regime signal is incremental
    risk control
  - Backtest assumptions (no slippage, instant fills, fixed costs) are not wildly
    unrealistic
  data_requirements:
  - Multi-year equity or FX data spanning at least one market crash or stress period
  - Daily or intra-day OHLC prices; high-frequency data preferred for accuracy
  - Trained HMM and Naive Bayes regime classifier
  - Ground-truth drawdown periods (e.g., 2008-2009, 2016 Brexit, 2020 COVID) for validation
  baseline_or_null_hypothesis: Regime signals provide no incremental drawdown reduction;
    any benefit is random or due to overfitting. Risk-adjusted returns are not improved.
  validation_approach: Backtest regime-aware algorithms (JC1, JC2) on historical data
    and compute maximum drawdown, Sharpe ratio, Calmar ratio; compare to buy-and-hold
    and regime-agnostic trading strategies; measure drawdown reduction as (Drawdown_Regime_Agnostic
    - Drawdown_Regime_Aware) / Drawdown_Regime_Agnostic; perform statistical significance
    test (e.g., bootstrap, permutation test) on drawdown differences; cross-validate
    on out-of-sample periods and independent datasets.
  transaction_cost_and_fill_considerations: 'Regime-aware strategies trigger additional
    trades on regime transitions; transaction costs (bid-ask, commissions) must be
    accounted. If trading frequency increases 5x, and transaction costs are 10 bps
    per round trip, cost drag could offset benefit. Assume realistic costs: 2 bps
    bid-ask spread, 2 bps commission, 1-2 bps market impact for non-flash-execution
    orders.'
  robustness_checks:
  - Backtest on multiple time periods (bull, bear, crisis, quiet)
  - Vary entry/exit rules (immediate vs. lagged regime transitions)
  - Test sensitivity to HMM parameters and regime threshold
  - Compare to other drawdown-reduction techniques (e.g., volatility-scaled position
    sizing, volatility targeting)
  - Walk-forward optimization to avoid overfitting
  rejection_criteria:
  - If maximum drawdown reduction < 10% (insufficient practical benefit)
  - If annualized return drops >15% (too much alpha forfeited)
  - If out-of-sample performance degrades >25% vs. in-sample (overfitting signal)
  - If Calmar ratio (return / max drawdown) not significantly improved vs. baseline
    (p > 0.05)
  failure_modes:
  - Backtests ignore realistic transaction costs; actual benefit disappears in live
    trading
  - Regime signals lag actual drawdown onset; exits occur too late
  - Regime definition overfitted to specific crises; fails in novel market conditions
  - Money management and regime signals are not independent; collinearity inflates
    perceived benefit
  freshness_concerns: Regime definitions may be unstable post-2020; market conditions
    and participant behavior have changed. Increased algo trading and machine learning
    adoption may have eliminated regime-based edge. New asset classes (crypto, ESG,
    thematic ETFs) have different regime dynamics.
  unresolved_questions:
  - Is the benefit real or an artifact of backtest assumptions?
  - What is the optimal lag between regime transition detection and actual entry/exit?
  - How does benefit scale with position size, leverage, or portfolio complexity?
  _book_id: detecting-regime-change-in-computational-finance-2020
  _audit_grade: B
