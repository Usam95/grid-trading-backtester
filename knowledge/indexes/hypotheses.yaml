- id: TRADEVO-H01
  title: Systematic testing validates trading ideas better than discretionary judgment
  status: proposed
  derived_from:
  - TRADEVO-C2-001
  - TRADEVO-C12-001
  statement: Testing trading rules through backtesting on historical data reveals
    which patterns have predictive value; systematic testing outperforms relying on
    subjective market folklore or personal intuition.
  proposed_mechanism: Backtesting provides objective performance measurement; comparing
    strategy results quantitatively prevents confirmation bias and emotional reasoning
  applicable_markets_and_regimes: All equities and commodity markets; should hold
    across bull/bear regimes
  assumptions:
  - Historical relationships persist or regime changes are identifiable
  - Backtest assumptions (slippage, commission, liquidity) are accurate
  - Strategy rules are fully specified without lookahead bias
  data_requirements:
  - Daily or intraday price data with sufficient history (5+ years recommended)
  - Corporate action adjustments (splits, dividends) applied correctly
  - Commission and slippage data from execution venue
  baseline_or_null_hypothesis: Discretionary trading or random strategy selection
    produces comparable Sharpe ratio and max drawdown
  validation_approach: Compare systematic strategy backtest results to benchmark strategies
    (buy-and-hold, equal-weight, random); conduct forward walk-forward analysis; compare
    backtest to live execution results
  transaction_cost_and_fill_considerations: Must include realistic commission costs,
    bid-ask spread, market impact for position size; verify that Sharpe ratio survives
    after all costs
  robustness_checks:
  - Parameter sensitivity analysis (momentum lookback, rebalancing frequency)
  - Out-of-sample validation on periods not used for model development
  - Stress testing on market regimes with high drawdowns or volatility
  - Cross-asset validation (test ETF model on different ETF universes)
  rejection_criteria:
  - Out-of-sample Sharpe ratio significantly lower than in-sample
  - Strategy breaks down in high-volatility or crisis periods
  - Results cannot be reproduced with documented assumptions
  failure_modes:
  - Overfitting to historical data not repeating forward
  - Look-ahead bias in signal generation
  - Insufficient sample size producing false significance
  - Regime changes invalidating historical patterns
  freshness_concerns: None for hypothesis itself; validation depends on current data
    and market conditions
  unresolved_questions: What sample size is sufficient to establish statistical significance?
    How long must out-of-sample period be?
  _book_id: trading-evolved-anyone-can-build-killer-trading-strategies-i-2021
  _audit_grade: A
- id: TRADEVO-H02
  title: Momentum signals on systematically-selected universes generate positive alpha
  status: proposed
  derived_from:
  - TRADEVO-C10-001
  - TRADEVO-C12-001
  - TRADEVO-C19-001
  statement: Selecting ETFs showing recent price momentum (e.g., highest 6-month returns)
    and holding until momentum weakens produces positive risk-adjusted returns after
    costs on diversified ETF portfolios.
  proposed_mechanism: Trend continuation on intermediate timeframes; momentum strategies
    capture directional moves while avoiding mean reversion traps through disciplined
    exit rules
  applicable_markets_and_regimes: Equity ETF universe; should work in trending bull/bear
    markets; may underperform in choppy/mean-reverting regimes
  assumptions:
  - Momentum lookback period (e.g., 6 months) is optimal for ETF trends
  - Rebalancing frequency balances signal freshness vs. transaction costs
  - ETF expense ratios and bid-ask spreads remain consistent
  - Momentum strategies remain uncorrelated over time
  data_requirements:
  - Daily price data for equity ETFs (SPY, QQQ, IWM, EFA, AGG, etc.)
  - 10+ years historical data for robust backtesting
  - Monthly rebalancing data to validate assumptions
  baseline_or_null_hypothesis: Equal-weight ETF portfolio or buy-and-hold SPY produces
    comparable Sharpe ratio
  validation_approach: Backtest momentum selection on rolling 5-year windows; walk-forward
    validation; compare to market cap-weighted and equal-weight baselines
  transaction_cost_and_fill_considerations: Include ETF bid-ask spread (typically
    1-5 bps for major ETFs); monthly rebalancing costs; potential slippage on large
    rebalances
  robustness_checks:
  - Test different momentum lookback periods (3mo, 6mo, 12mo)
  - Vary rebalancing frequency (monthly, quarterly)
  - Test on subsets of ETF universe (US only, with bonds, with alternatives)
  - Check drawdown distribution in crisis periods (2008, 2020)
  rejection_criteria:
  - Out-of-sample Sharpe ratio below 0.5 or comparable to buy-and-hold
  - Max drawdown significantly worse than benchmark
  - Strategy breaks down in any 3-year rolling period
  failure_modes:
  - Momentum reversion after selection causing immediate drawdown
  - Regime change to mean-reversion causing frequent whipsaws
  - Correlation breakdown in crisis causing portfolio concentration
  - ETF closures or changes affecting data integrity
  freshness_concerns: ETF universe, expense ratios, and liquidity conditions have
    evolved since 2021 publication; must validate current assumptions
  unresolved_questions: Does momentum work on dynamic vs. static universe? How sensitive
    is performance to rebalancing frequency?
  _book_id: trading-evolved-anyone-can-build-killer-trading-strategies-i-2021
  _audit_grade: A
- id: TRADEVO-H03
  title: Volatility-adjusted position sizing equalizes risk across uncorrelated strategies
  status: proposed
  derived_from:
  - TRADEVO-C4-001
  - TRADEVO-C15-001
  - TRADEVO-C19-001
  statement: Adjusting position size inversely to volatility (e.g., position_size
    = target_risk / volatility) produces more stable and consistent returns across
    different assets and strategies.
  proposed_mechanism: Assets and strategies with different volatility profiles require
    different position sizes to maintain equal risk contribution; volatility-adjusted
    sizing prevents high-volatility positions from dominating portfolio drawdowns
  applicable_markets_and_regimes: Across equities, futures, and crypto; especially
    valuable in diversified portfolios mixing uncorrelated strategies
  assumptions:
  - Volatility is predictable or mean-reverting (e.g., can use trailing 20-day volatility)
  - Adjusted sizing doesn't hit liquidity constraints
  - Risk target is pre-defined (e.g., 2% per trade)
  data_requirements:
  - Daily returns and volatility for portfolio assets
  - Position size and realized volatility comparison
  - Historical volatility spikes to stress-test sizing assumptions
  baseline_or_null_hypothesis: Equal position sizing or market-cap weighting produces
    comparable Sharpe ratio and smoother drawdown curve
  validation_approach: Compare cumulative returns and max drawdown with equal vs.
    volatility-adjusted sizing; verify that high-volatility periods don't produce
    outsized drawdowns
  transaction_cost_and_fill_considerations: Frequent rebalancing of position sizes
    increases costs; must evaluate trade-off between sizing precision and frictional
    costs
  robustness_checks:
  - Test different volatility windows (10-day, 20-day, 60-day)
  - Verify sizing doesn't hit position limit constraints
  - Stress test during volatility spikes (2008 financial crisis, COVID-19)
  rejection_criteria:
  - Volatility-adjusted sizing produces higher max drawdown than simple sizing
  - Sizing precision isn't achievable within liquidity constraints
  - Transaction costs from rebalancing exceed benefits
  failure_modes:
  - Volatility measure lags true volatility causing underestimated risk
  - Size constraints prevent achieving target sizing
  - Volatility spikes larger than historical range breaking model
  freshness_concerns: None for hypothesis; validation requires current volatility
    data
  unresolved_questions: What is optimal volatility estimation window? Should sizing
    adapt to market regime?
  _book_id: trading-evolved-anyone-can-build-killer-trading-strategies-i-2021
  _audit_grade: A
- id: TRADEVO-H04
  title: Data quality issues (survivorship bias, corporate actions) cause inflated
    backtest returns
  status: proposed
  derived_from:
  - TRADEVO-C23-001
  - TRADEVO-C21-001
  statement: Backtests using flawed historical data (e.g., survivorship bias from
    missing delisted stocks, incorrect dividend adjustments) systematically overestimate
    strategy returns by 0.5-2% annually depending on universe.
  proposed_mechanism: Survivorship bias includes only successful stocks; excluding
    delisted/bankrupt stocks overstates historical returns. Incorrect corporate action
    adjustments distort entry/exit prices.
  applicable_markets_and_regimes: Equity strategies; less relevant for futures/crypto
  assumptions:
  - Data bias is significant and measurable
  - Correct data sources are available for comparison
  data_requirements:
  - Unadjusted historical price data
  - Data with survivorship bias (e.g., current constituents only)
  - Corporate action history (splits, dividends, distributions)
  baseline_or_null_hypothesis: Data quality has no material impact on backtest results
    (Sharpe ratio difference <0.1)
  validation_approach: Compare backtest results using biased data vs. clean data;
    measure Sharpe difference; quantify impact per source type
  transaction_cost_and_fill_considerations: Not directly relevant; data quality is
    pre-processing step
  robustness_checks:
  - Test on multiple equity universes (large-cap, small-cap, sectors)
  - Compare data from multiple vendors
  - Measure delisting frequency and typical loss on delisted stock
  rejection_criteria:
  - Data bias impact is <0.2% annual return
  - Clean data unavailable for comparison
  failure_modes:
  - Biased data sources are only available
  - Delisted stocks are not available for analysis
  freshness_concerns: Data vendor quality and correction procedures may have improved
    since 2021; must validate current data quality
  unresolved_questions: What is acceptable data quality threshold? How to quantify
    total data quality impact?
  _book_id: trading-evolved-anyone-can-build-killer-trading-strategies-i-2021
  _audit_grade: A
- id: TRADEVO-H05
  title: Risk management through stop losses or volatility bands reduces tail drawdowns
  status: proposed
  derived_from:
  - TRADEVO-C4-001
  - TRADEVO-C15-001
  statement: Implementing mechanical stop losses (e.g., exit if position down 5%)
    or volatility-based bands reduces maximum drawdown on individual positions by
    30-50% at the cost of occasionally exiting winning trades early.
  proposed_mechanism: Stops prevent single positions from incurring catastrophic losses;
    volatility bands adapt stop distance to market conditions
  applicable_markets_and_regimes: All strategies; particularly valuable for tail-risk
    management during crises
  assumptions:
  - Stops are executable at specified prices (liquidity exists)
  - Stop distances are optimal (not too tight or loose)
  data_requirements:
  - Intra-period price extremes (high/low, not just close) for accurate stop trigger
    modeling
  - Stop execution assumptions (market order, limit order timing)
  baseline_or_null_hypothesis: Strategies without stops produce comparable Sharpe
    ratios and drawdowns
  validation_approach: Compare backtest with and without stops; measure tail loss
    reduction; calculate cost of early exits
  transaction_cost_and_fill_considerations: Stop executions incur market impact; must
    include estimated slippage on stop orders
  robustness_checks:
  - Test different stop distances
  - Verify stops work during liquidity crises
  - Compare static vs. volatility-adjusted stops
  rejection_criteria:
  - Stops don't reduce tail drawdowns by at least 20%
  - Stop costs exceed benefits from tail protection
  failure_modes:
  - Stop hunts by market makers or larger traders
  - Gaps prevent stop execution at target price
  - Stops set too tight causing excessive whipsaws
  freshness_concerns: None for hypothesis; validation on current data
  unresolved_questions: Optimal stop distance given market regime? How to prevent
    stop hunts?
  _book_id: trading-evolved-anyone-can-build-killer-trading-strategies-i-2021
  _audit_grade: A
- id: TRADEGR-H001
  title: Gamma scalping edge exists in high-volatility regimes
  status: proposed
  derived_from:
  - TRADEGR-C2-002
  - TRADEGR-C5-002
  - TRADEGR-C10-001
  statement: In equity markets with realized volatility >30%, delta-neutral gamma
    scalping generates positive alpha net of costs.
  proposed_mechanism: High volatility triggers frequent rebalancing; small profits
    lock in from each trade.
  applicable_markets_and_regimes: Equities with liquid options; high-vol regimes
  assumptions:
  - Transaction costs are low
  - Options priced near Black-Scholes
  data_requirements: High-frequency option bid-ask data; realized volatility; transaction
    costs
  baseline_or_null_hypothesis: Gamma scalping alpha is indistinguishable from zero.
  validation_approach: Backtest gamma scalping on historical options data.
  transaction_cost_and_fill_considerations: Bid-ask spreads and commissions must be
    factored in.
  robustness_checks:
  - Test across multiple stocks
  - Vary rehedging frequency
  rejection_criteria: Sharpe ratio < 1.0 in majority of years.
  failure_modes:
  - Gaps violate continuous hedging
  - Vol smile shifts destroy P&L
  freshness_concerns: Post-2008 commission changes may eliminate edge.
  unresolved_questions:
  - Optimal rehedging frequency?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H002
  title: Calendar spread profits correlate with IV backwardation
  status: proposed
  derived_from:
  - TRADEGR-C2-004
  - TRADEGR-C6-001
  statement: Long calendar spreads generate positive alpha when IV term structure
    is backwardated.
  proposed_mechanism: Front-month theta decays faster; combined with IV contraction,
    favors long front.
  applicable_markets_and_regimes: Equity options near ATM; elevated near-term uncertainty
  assumptions:
  - Backwardation persists during holding period
  - Spot stays near strike
  data_requirements: IV term structure history; front/back-month option prices
  baseline_or_null_hypothesis: Calendar spreads are break-even.
  validation_approach: Backtest; measure profitability by term structure regime.
  transaction_cost_and_fill_considerations: Spread entry/exit costs on both legs.
  robustness_checks:
  - Vary strike and expiration
  - Test across volatility regimes
  rejection_criteria: Negative alpha in backwardated regimes.
  failure_modes:
  - Term structure inverts
  - Spot moves away from strike
  freshness_concerns: QE has compressed term structure volatility.
  unresolved_questions:
  - Minimum backwardation threshold?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H003
  title: Put skew predicts near-term downside volatility
  status: proposed
  derived_from:
  - TRADEGR-C4-002
  - TRADEGR-C7-001
  statement: IV skew increases forecast higher realized downside volatility within
    5-20 trading days.
  proposed_mechanism: Options market prices jump risk; skew steepening signals hedging
    demand.
  applicable_markets_and_regimes: Equities and indices with liquid options
  assumptions:
  - Options reflect information faster than spot
  data_requirements: Intraday IV surface; realized volatility
  baseline_or_null_hypothesis: Skew changes are unpredictable.
  validation_approach: Measure correlation between skew changes and realized vol.
  transaction_cost_and_fill_considerations: NA - this is a prediction hypothesis.
  robustness_checks:
  - Test across multiple stocks
  - Measure predictive decay over time
  rejection_criteria: Correlation < 0.2.
  failure_modes:
  - Skew driven by liquidity flows, not information
  freshness_concerns: Circuit breakers may have altered dynamics.
  unresolved_questions:
  - Cross-sectional or time-series predictability?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H004
  title: Theta harvesting outperforms in low-vol regimes
  status: proposed
  derived_from:
  - TRADEGR-C2-004
  - TRADEGR-C6-001
  statement: Short premium strategies (strangles, calendar spreads) generate positive
    returns when realized vol < 30%.
  proposed_mechanism: Theta decay accelerates; if spot doesn't move much, sellers
    capture premium.
  applicable_markets_and_regimes: Stable stocks; low-vol regimes
  assumptions:
  - Realized vol stays below implied
  data_requirements: Historical and implied volatility
  baseline_or_null_hypothesis: Short premium returns are random.
  validation_approach: Backtest; measure returns conditional on vol regime.
  transaction_cost_and_fill_considerations: Commission and bid-ask on entry/exit.
  robustness_checks:
  - Test across different regimes
  rejection_criteria: Returns negative or Sharpe < 0.5.
  failure_modes:
  - Vol spikes; losses exceed theta collected
  freshness_concerns: Post-2008 vol volatility has increased.
  unresolved_questions:
  - Optimal strike width for strangles?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H005
  title: Delta-hedging costs decrease with vol clustering
  status: proposed
  derived_from:
  - TRADEGR-C2-001
  - TRADEGR-C2-002
  - TRADEGR-C5-001
  statement: Delta hedges cost less in high-clustering regimes due to convex transaction
    cost structure.
  proposed_mechanism: Clustering = frequent small rehedges vs infrequent large rehedges;
    convex costs favor many small trades.
  applicable_markets_and_regimes: Any delta-hedged book
  assumptions:
  - Transaction costs are convex in size
  data_requirements: Intraday prices; delta rebalance logs
  baseline_or_null_hypothesis: Clustering has no impact on costs.
  validation_approach: Compare hedging costs in high vs low clustering periods.
  transaction_cost_and_fill_considerations: Model convex cost as f(order_size).
  robustness_checks:
  - Test multiple underlying assets
  rejection_criteria: No significant cost difference.
  failure_modes:
  - Liquidity decreases with clustering; spreads widen
  freshness_concerns: E-trading may have reduced clustering.
  unresolved_questions:
  - Clustering threshold to trigger benefit?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H006
  title: Dividend-adjusted early-exercise boundary predicts assignment
  status: proposed
  derived_from:
  - TRADEGR-C3-002
  - TRADEGR-C9-001
  statement: American calls near ex-dates have >50% assignment probability if spot
    > early-exercise boundary.
  proposed_mechanism: Exercise captures dividend; incentive strong if dividend > time
    value.
  applicable_markets_and_regimes: High-dividend stocks; pre-ex-dividend period
  assumptions:
  - Dividends known
  - No surprises
  data_requirements: Dividend schedule; option assignment history
  baseline_or_null_hypothesis: Assignment is random.
  validation_approach: Compute boundary; measure assignment correlation.
  transaction_cost_and_fill_considerations: NA.
  robustness_checks:
  - Cross-validate on multiple stocks
  rejection_criteria: No correlation between boundary and assignment.
  failure_modes:
  - Special dividends
  freshness_concerns: Dividend policies have changed; buybacks now more common.
  unresolved_questions:
  - Scaling with dividend size?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H007
  title: Vega-neutral rehedging captures IV mean reversion alpha
  status: proposed
  derived_from:
  - TRADEGR-C2-003
  - TRADEGR-C11-001
  statement: Vega-neutral portfolios capture alpha when IV surface rotations mean-revert.
  proposed_mechanism: Rehedging at elevated IV captures subsequent mean reversion.
  applicable_markets_and_regimes: Options on equities; high-vol regimes
  assumptions:
  - IV mean-reverts over 5-30 day horizons
  data_requirements: IV surface history
  baseline_or_null_hypothesis: Rehedging P&L is random.
  validation_approach: Measure rehedge P&L vs IV changes.
  transaction_cost_and_fill_considerations: Option bid-ask spreads.
  robustness_checks:
  - Test across time periods
  rejection_criteria: Rehedge P&L not significantly positive.
  failure_modes:
  - Volga effects not captured
  freshness_concerns: Central bank intervention altered IV dynamics.
  unresolved_questions:
  - Optimal hedge ratio?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H008
  title: IV term structure steepness drives calendar spread alpha
  status: proposed
  derived_from:
  - TRADEGR-C4-002
  statement: Calendar spreads outperform when IV term structure is steeper than historical
    realized term structure.
  proposed_mechanism: Excess steepness means-reverts; long back-month benefits.
  applicable_markets_and_regimes: Indices and single stocks
  assumptions:
  - Term structure steepness mean-reverts
  data_requirements: IV term structure; realized volatility history
  baseline_or_null_hypothesis: Steepness is unrelated to returns.
  validation_approach: Backtest calendar spreads conditional on steepness.
  transaction_cost_and_fill_considerations: Bid-ask on both legs.
  robustness_checks:
  - Test multiple time periods
  rejection_criteria: No correlation.
  failure_modes:
  - Steepness reflects genuine vol expectations
  freshness_concerns: Central bank policy altered term structure.
  unresolved_questions:
  - Optimal steepness metric?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H009
  title: Portfolio gamma concentration predicts tail risk
  status: proposed
  derived_from:
  - TRADEGR-C2-002
  - TRADEGR-C12-001
  statement: High gamma concentration increases vulnerability to extreme down-moves.
  proposed_mechanism: Gamma is convex; concentrated gamma magnifies tail losses.
  applicable_markets_and_regimes: Any derivatives portfolio
  assumptions:
  - Rehedging not possible during extreme move
  data_requirements: Portfolio gamma distribution; stress scenarios
  baseline_or_null_hypothesis: Gamma concentration uncorrelated with tail losses.
  validation_approach: Stress test in extreme scenarios.
  transaction_cost_and_fill_considerations: NA.
  robustness_checks:
  - Historical stress scenarios (2008, 2020)
  rejection_criteria: No correlation.
  failure_modes:
  - Higher-order Greeks matter
  freshness_concerns: Circuit breakers may interrupt hedging.
  unresolved_questions:
  - Concentration metric?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H010
  title: Bid-ask spread widening correlates with gamma losses
  status: proposed
  derived_from:
  - TRADEGR-C2-002
  - TRADEGR-C13-001
  statement: Hedging losses increase on days when option spreads widen significantly.
  proposed_mechanism: Wide spreads force worse execution; hedge cost increases.
  applicable_markets_and_regimes: All options markets
  assumptions:
  - Spread widening is exogenous
  data_requirements: Bid-ask spread history; hedging P&L
  baseline_or_null_hypothesis: Spreads uncorrelated with hedging losses.
  validation_approach: Measure correlation.
  transaction_cost_and_fill_considerations: Spread is a direct cost.
  robustness_checks:
  - Test multiple assets
  rejection_criteria: Weak correlation.
  failure_modes:
  - Spread widening and vol spikes simultaneous
  freshness_concerns: Market structure evolved.
  unresolved_questions:
  - Predictable spreads?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H011
  title: Implied correlation overstates realized correlation in crises
  status: proposed
  derived_from:
  - TRADEGR-C8-001
  statement: During crises, realized equity correlations exceed implied correlations
    from options.
  proposed_mechanism: Crisis spreads correlations faster than options reprice.
  applicable_markets_and_regimes: Equity portfolios
  assumptions:
  - Options market not perfectly efficient
  data_requirements: Single-stock and index options; realized correlations
  baseline_or_null_hypothesis: Options market is efficient.
  validation_approach: Measure gap in crisis periods.
  transaction_cost_and_fill_considerations: NA.
  robustness_checks:
  - Test multiple crisis periods
  rejection_criteria: Gap not significant.
  failure_modes:
  - Convergence too quick
  freshness_concerns: Post-2008 circuit breakers may have reduced surprises.
  unresolved_questions:
  - Early detection possible?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TRADEGR-H012
  title: Optimal delta-hedging frequency balances gamma and theta
  status: proposed
  derived_from:
  - TRADEGR-C2-002
  - TRADEGR-C2-004
  statement: Optimal rehedging frequency is ~weekly in normal vol, daily in high vol.
  proposed_mechanism: Frequency trades off transaction costs vs gamma/theta.
  applicable_markets_and_regimes: Any delta-hedged position
  assumptions:
  - Costs proportional to size
  data_requirements: Gamma, theta, transaction costs
  baseline_or_null_hypothesis: Frequency has no optimal value.
  validation_approach: Backtest different frequencies; optimize total cost.
  transaction_cost_and_fill_considerations: Model costs explicitly.
  robustness_checks:
  - Test across vol regimes
  rejection_criteria: No clear optimum.
  failure_modes:
  - Optimal frequency varies with regime
  freshness_concerns: E-trading reduced costs; optimal frequency higher now.
  unresolved_questions:
  - Regime-dependent optimization?
  _book_id: trading-options-greeks-how-time-volatility-and-other-pricing-2013
  _audit_grade: A
- id: TPAR-H001
  title: Reversal probability increases with trend line break + signal bar strength
  status: proposed
  derived_from:
  - TPAR-C1-002
  - TPAR-C2-003
  statement: After a clear break of established trend line, a strong signal bar (large
    body, close in reversal direction, opposite tail) predicts 55-65% reversal continuation
    within 5 bars
  proposed_mechanism: Trend line break signals institutional shift; strong signal
    bar confirms conviction; weak bars suggest uncertain reversal
  applicable_markets_and_regimes: High-volume equities; intraday 5-60min charts; trending
    (not range-bound) markets
  assumptions:
  - Trend line correctly drawn
  - Strong bar = body > 50th percentile 20-bar avg; close > median
  - No news/earnings risk
  data_requirements:
  - 5-min OHLCV bars
  - Trend line slope/intercept
  - Historical backtesting 2+ years
  baseline_or_null_hypothesis: Random entry after trend line break = 50% probability
    (coin flip)
  validation_approach: 'Backtest: count reversals after (trend break + strong signal
    bar) vs after (trend break + weak signal bar); compute empirical probability'
  transaction_cost_and_fill_considerations: Assume 1 tick slippage on entry/exit;
    bid-ask 2 ticks typical; 0.001% commission
  robustness_checks: Test across multiple stocks, time periods, timeframes; measure
    Sharpe/Sortino net of costs
  rejection_criteria: If continuation probability < 52% or Sharpe < 0.5 net of costs
    over 2-year backtest
  failure_modes:
  - Gap breakout overnight above trend line
  - Trend line redraw on next bar
  - Whipsaw on close reversal
  freshness_concerns: Market microstructure changed 2011-2025; HFT frontrunning may
    invalidate timing
  unresolved_questions:
  - How sensitive to trend line slope?
  - Does stock beta affect probability?
  - Does overall market momentum filter help?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H002
  title: Climactic bar (2x range, extreme close) predicts reversal within 2-3 bars
  status: proposed
  derived_from:
  - TPAR-C4-004
  - TPAR-C4-005
  statement: A bar with range > 1.8x recent 20-bar average range, open at extreme,
    close at opposite extreme signals exhaustion; next 1-3 bars likely reverse 70-80%
    of bar range
  proposed_mechanism: Climactic bar represents weak trader capitulation; once weak
    longs/shorts exit, institutions take other side; vacuum accelerates reversal
  applicable_markets_and_regimes: Extended trending markets; after 3+ days of strong
    directional bias; typically first 2 hours or final hour
  assumptions:
  - Range is 2x+ normal
  - Close is within 10% of bar extreme opposite open
  - No major news during bar
  - Not first bar of day
  data_requirements:
  - 1-5min OHLCV
  - 20-bar rolling avg range
  - Volume profile ideally
  baseline_or_null_hypothesis: After any large bar, next 2 bars reverse 50-60% of
    range (random)
  validation_approach: Identify climactic bars; measure actual 2-3 bar move direction
    and magnitude; compute reversal win rate and avg magnitude
  transaction_cost_and_fill_considerations: 2 tick slippage typical during climax
    volatility; use market orders
  robustness_checks: Test across market regimes (uptrend, downtrend, range); filter
    by volume
  rejection_criteria: If reversal probability < 65% or average reversal magnitude
    < 50% of climactic bar range
  failure_modes:
  - Climactic bar is start of new trend leg
  - not reversal
  - Overnight gap invalidates entry
  - Second climactic bar in same direction
  freshness_concerns: Volatility regime changed post-COVID; compression/expansion
    patterns may differ
  unresolved_questions:
  - Is 1.8x threshold optimal or should vary by ATR regime?
  - Does volume profile help identify true climax?
  - Does this work in options chains?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H003
  title: Failed breakout predicts reversal to opposite direction at 60-70% probability
  status: proposed
  derived_from:
  - TPAR-C9-009
  statement: A bar that closes outside recent swing high (by >2 ticks) but then reverses
    back below that high within 1-3 bars predicts continued selling 60-70% of the
    time
  proposed_mechanism: Failed breakout shows weak buyer commitment; no institutional
    follow-through; offers short entry at failed high
  applicable_markets_and_regimes: Swing high within last 5-20 bars; break must be
    significant (>2 ticks, not noise); intraday timeframes
  assumptions:
  - Swing high is recent support
  - Breakout close > high by 2+ ticks
  - Reversal back below high within 3 bars
  - No earnings/news
  data_requirements:
  - Recent swing high/low data
  - Intraday 5-60min bars
  - 2+ years backtesting
  baseline_or_null_hypothesis: After any failed breakout, 50% go up, 50% go down
  validation_approach: Identify failed breakouts (open > swing high, close < swing
    high, or reverse bar closes < swing high); track next N bars direction
  transaction_cost_and_fill_considerations: 'Entry: sell stop 1 tick below failed
    high; 2 tick slippage; 0.1% commission'
  robustness_checks: Filter by volume on failed bar; test by timeframe; measure win
    rate and avg loss when wrong
  rejection_criteria: If reversal probability < 55% or avg profit < 2x avg loss
  failure_modes:
  - False failure: breakout bar rejected but next day new high
  - Multiple failed attempts then true breakout
  - Stop hit on wick
  freshness_concerns: Algorithmic market makers may absorb failed breakouts faster
    than 2011 era
  unresolved_questions:
  - Is 3-bar window optimal?
  - Does order book depth matter?
  - How to distinguish weak breakout from capitulation?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H004
  title: Double-top/bottom structure filters reversal entries for 60%+ win rate
  status: proposed
  derived_from:
  - TPAR-C8-008
  statement: After identifying double-top (two highs within 2% price level), subsequent
    pullback to 50-80% of the two-bar range predicts downtrend entry at 60-70% success
  proposed_mechanism: Double-top shows institutional resistance twice; pullback proves
    commitment to sell; continuation captures new downtrend
  applicable_markets_and_regimes: Established uptrends; double top within last 5-50
    bars; pullback depth 30-80% retracement
  assumptions:
  - Double tops formed at similar levels
  - Pullback does not exceed first high
  - Pullback is 2-5 bars
  - Trend was uptrend before double top
  data_requirements:
  - Swing high/low identification
  - Price retracement %
  - Multi-day backtesting
  baseline_or_null_hypothesis: Sell after pullback in any downtrend; 50% win rate
  validation_approach: Identify double-tops; measure pullback depth and structure;
    track subsequent downtrend success rate and magnitude
  transaction_cost_and_fill_considerations: Sell on signal bar break below pullback
    low; expect 1-2 tick slippage
  robustness_checks: Vary double-top distance (5 bars vs 50 bars); test pullback retracement
    thresholds; measure Sharpe
  rejection_criteria: If win rate < 55% or Sharpe < 0.4 net of costs
  failure_modes:
  - Double top not at same level (looks similar but different resistance)
  - Pullback exceeds original high = false double-top
  - Pullback extends into prior trend
  freshness_concerns: Support/resistance levels may be more discretionary now with
    passive flows
  unresolved_questions:
  - How close must highs be?
  - Does volume matter?
  - Does this work in crypto or only equities?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H005
  title: Opening range breakout predicts day direction continuation at 55-60% probability
  status: proposed
  derived_from:
  - TPAR-C19-017
  statement: If first 30-60 min (opening range) establishes high and low, breakout
    of either boundary in first 120 min predicts 55-60% continuation through close
  proposed_mechanism: Opening range aggregates overnight positioning; breakout indicates
    institutional direction consensus; morning momentum continues until profit-taking
  applicable_markets_and_regimes: Day trading, first 4 hours of session; equities
    and index futures; normal volatility days
  assumptions:
  - Opening range formed in first 60 min
  - Breakout is on higher volume than opening range
  - No major news before 120min
  - Tight opening range suggests larger move
  data_requirements:
  - First 60 min high/low
  - Volume data
  - Daily direction outcome
  - 1-3 year backtesting
  baseline_or_null_hypothesis: Breakout of range predicts either direction 50% each
  validation_approach: Identify opening ranges; track breakout direction vs actual
    close direction; compute win rate
  transaction_cost_and_fill_considerations: Buy breakout of range high (or sell low);
    assume 2-3 tick slippage in first hour
  robustness_checks: Filter by opening range size (too tight, too wide); measure by
    stock beta; test tight vs wide opening correlation
  rejection_criteria: If directional win rate < 53% or Sharpe < 0.3
  failure_modes:
  - Fake breakout then reversal within first 2 hours
  - Opening range extends across lunch
  - Multiple breakout attempts
  freshness_concerns: Pre-market activity has grown; gap dynamics changed
  unresolved_questions:
  - Should opening range be 30 min or 60 min?
  - Does opening range size predict continuation magnitude?
  - How to filter fake openings?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H006
  title: Pullback depth after trend break predicts reversal strength
  status: proposed
  derived_from:
  - TPAR-C2-015
  - TPAR-C2-003
  statement: After trend line break, pullback retracement of <50% of last 5-bar range
    predicts strong reversal (>3R profit target); retracement >75% predicts weak reversal
    (<1.5R)
  proposed_mechanism: Shallow pullback = institutional support at higher level = strong
    reversal; deep pullback = institutional supply/support uncertain = weak reversal
  applicable_markets_and_regimes: Intraday swing trades; 5-60min timeframes; established
    prior trends (3+ days)
  assumptions:
  - Trend line break is significant
  - Pullback length 2-5 bars
  - Last 5-bar range is relevant volatility baseline
  data_requirements:
  - Trend line slope
  - Retracement % calculation
  - Prior bar range stats
  baseline_or_null_hypothesis: Pullback depth independent of reversal strength; 50%
    win rate
  validation_approach: Bin pullbacks by retracement %; measure avg reversal magnitude
    and success rate for each bin
  transaction_cost_and_fill_considerations: Entry on pullback break; 1-2 tick slippage;
    set stop based on pullback depth
  robustness_checks: Test retracement thresholds (30%, 50%, 75%); measure by stock
  rejection_criteria: If Sharpe (shallow pullback) <= Sharpe (deep pullback)
  failure_modes:
  - Deep pullback that sustains reversal (false negative)
  - Shallow pullback that fails (false positive)
  - Pullback overshoot into prior trend
  freshness_concerns: Volatility compression/expansion cycles may change retracement
    norms
  unresolved_questions:
  - Does VIX level affect optimal retracement threshold?
  - Does stock beta change threshold?
  - Is 5-bar baseline optimal?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H007
  title: Multi-timeframe alignment (intraday entry aligned with daily trend) increases
    edge by 5-10%
  status: proposed
  derived_from:
  - TPAR-C22-016
  statement: Intraday short entries on 5-min chart in daily downtrend have 5-10% higher
    win rate and 10-20% larger avg profit than intraday shorts in daily uptrend
  proposed_mechanism: Daily trend represents institutional longer-term positioning;
    intraday pullbacks that align with daily trend get better fill and follow-through
  applicable_markets_and_regimes: Equities, indexes; intraday timeframes (5-60min)
    aligned with daily/4hr trend
  assumptions:
  - Daily trend is established (>3 bars)
  - Intraday timeframe is 10x smaller than daily
  - No news overnight
  data_requirements:
  - Daily OHLCV
  - Intraday OHLCV
  - Trend identification (EMA/slope)
  - Win/loss statistics
  baseline_or_null_hypothesis: Intraday entry success is independent of daily trend
    alignment; 50% win rate both directions
  validation_approach: Filter intraday trades by daily trend; compute win% and avg
    profit for aligned vs anti-aligned; measure statistical significance
  transaction_cost_and_fill_considerations: Same as intraday; assumes institutional
    liquidity in daily trend direction
  robustness_checks: Test across multiple stocks, years, timeframe combinations
  rejection_criteria: If difference in win rate < 3% or Sharpe difference < 0.2
  failure_modes:
  - Daily trend reverses mid-day
  - Intraday move exhausts before daily alignment helps
  - Gap overnight changes context
  freshness_concerns: Algorithmic factors now more important than daily trend
  unresolved_questions:
  - What is optimal daily timeframe?
  - Does this work in 1-day rapid reversals?
  - How strong must daily trend be?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H008
  title: Fixed dollar risk position sizing outperforms fixed share sizing
  status: proposed
  derived_from:
  - TPAR-C25-013
  statement: Position sizing inversely proportional to stop distance (shares = max_risk_$
    / stop_distance_ticks) produces 10-15% better Sharpe than fixed share sizing
  proposed_mechanism: Market volatility varies by regime; fixed risk sizing maintains
    consistent loss magnitude; fixed shares expose trader to volatility swings
  applicable_markets_and_regimes: All timeframes and market regimes
  assumptions:
  - Max risk per trade is constant and sustainable
  - Stop placement scales with volatility
  - Account size sufficient to accommodate
  data_requirements:
  - Account equity
  - Stop loss distance stats
  - Position sizing calculations
  baseline_or_null_hypothesis: Fixed share sizing; same win rate and profit distribution
    as fixed risk sizing
  validation_approach: Backtest same trades with both sizing methods; compute Sharpe,
    max drawdown, median profit
  transaction_cost_and_fill_considerations: Fixed risk assumes slippage absorbed by
    risk budget
  robustness_checks: Vary max risk per trade (1%, 2%); test across market conditions
  rejection_criteria: If Sharpe improvement < 5% or max drawdown not reduced
  failure_modes:
  - Position size becomes too small in high-volatility regimes
  - Too-large position in low-volatility regimes
  - Account blowup if risk is set too high
  freshness_concerns: Low, position sizing is universal
  unresolved_questions:
  - What is optimal % risk per trade?
  - How to handle correlation across positions?
  - Does this account for slippage properly?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAR-H009
  title: Always-in discipline (staying in trends, re-entering pullbacks) increases
    profit capture vs profit-taking exits
  status: proposed
  derived_from:
  - TPAR-C15-011
  statement: Traders who maintain "always-in" position discipline (stay long in bull
    trends, re-enter on pullbacks, exit only on stop or trend break) capture 20-40%
    larger average trade profit and higher Sharpe ratio than traders who exit on reaching
    1R or 2R profit targets
  proposed_mechanism: Always-in discipline removes emotion-driven early exits; allows
    rides on large moves when institutions accumulate; re-entry on pullbacks prevents
    missing continuation; trend line breaks provide objective exit discipline
  applicable_markets_and_regimes: Strong extended trends (3+ days of directional bias);
    intraday/swing trading; higher-volume equities
  assumptions:
  - Trend is correctly identified
  - Stop placement is disciplined
  - Trader psychology supports holding
  - No black-swan events interrupt trend
  data_requirements:
  - Trade-by-trade records with entry/exit timing
  - P&L per trade
  - Policy adherence log (always-in vs profit-taking)
  - Daily trend context
  baseline_or_null_hypothesis: Profit-taking at fixed R:R ratio (e.g., 1:1) yields
    typical Sharpe ~0.3; always-in yields similar or worse
  validation_approach: Backtest sample of strong trends with both disciplines; measure
    average profit per trade, max profit per trade, Sharpe, win rate for each discipline;
    test on paper trading first
  transaction_cost_and_fill_considerations: Re-entries may accumulate slippage; assume
    cumulative slippage tracked per trade
  robustness_checks: Test across different trend lengths, exit timing windows, re-entry
    frequency; measure psychological factors (drawdown tolerance)
  rejection_criteria: If always-in discipline produces lower average profit, lower
    Sharpe (<0.3), or lower median profit than profit-taking, or if trader psychology
    failure rate > 30%
  failure_modes:
  - Trend reverses sharply
  - trapping large position; Trader misses trend break and exits late; Re-entry costs
    accumulate; Account blowup from holding through gap
  freshness_concerns: Market structure changed (HFT, passive flows); trend persistence
    may be lower than 2011
  unresolved_questions:
  - What trend strength threshold triggers always-in mode?
  - Optimal re-entry frequency on pullbacks?
  - How to distinguish trend reversal from pullback?
  - Does this work in choppy/range-bound markets?
  _book_id: trading-price-action-reversals-2011
  _audit_grade: B
- id: TPAB-HYP-001
  title: Reversal signal bar patterns predict next-bar trend reversal at >55% accuracy
  status: proposed
  derived_from:
  - TPAB-C5-010
  - TPAB-C1-003
  statement: "When a bar with specific reversal morphology (small body, large wick\
    \ on reversal side) \nappears after strong trend continuation bars, the following\
    \ bar will breakout in the \nreversal direction with >55% frequency (vs 50% random).\n"
  proposed_mechanism: "Reversal signal bar represents price extremes where weak traders\
    \ (shorts in downtrend, \nlongs in uptrend) are forced to exit, triggering stop\
    \ cascades that propel the market \nthrough the signal bar range on the next bar.\n"
  applicable_markets_and_regimes: "Equities intraday (1-60min timeframes); most liquid\
    \ contracts where institutional \nvolume dominates; strong directional trends\
    \ (not tight ranges).\n"
  assumptions:
  - Signal bar definition precise and objectively identifiable (body/wick ratios)
  - Pattern persists despite 15+ years of algorithm evolution since 2011
  - Stop placement at prior swing extremes is conventional behavior (not obsolete)
  - No algorithm specifically front-runs reversal signal bars
  data_requirements:
  - OHLC bars with 1-60min resolution
  - Volume data to confirm bar morphology not anomaly
  - High-fidelity intraday fills
  baseline_or_null_hypothesis: "Null: Next bar closes outside prior bar range 50%\
    \ of the time (random walk); reversal \nsignal bars offer no predictive edge.\n"
  validation_approach: "Backtest on 5+ years equities data (2020-2025): for every\
    \ reversal signal bar (per \ndefined morphology), measure frequency next bar closes\
    \ in predicted direction. \nRequire >55% win rate with >=1:1 reward/risk and net\
    \ positive expectancy.\n"
  transaction_cost_and_fill_considerations: "Assuming 1-2 tick round-trip slippage\
    \ and commissions; entry at signal bar high/low \n(market order risk); stop at\
    \ prior extreme; profit target >=1x stop distance.\n"
  robustness_checks:
  - 'Sensitivity: test with +/- 10% variation in body/wick definitions'
  - 'Walk-forward backtest: train on 2020-2023, test on 2024-2025'
  - 'Cross-asset: validate on 3+ currency pairs and index futures'
  - 'Regime test: separate strong trend vs choppy market performance'
  rejection_criteria:
  - Win rate <52% on any asset class or regime
  - Sharpe ratio <0.5 across walk-forward periods
  - Drawdown >3x average win size
  failure_modes:
  - Pattern degraded by market microstructure (dark pools, HFT)
  - Institutions learned and exploit reversal bar traders
  - Definition overfitting; pattern not robust across timeframes
  freshness_concerns: "Significant: Book published 2011, algorithm/venue landscape\
    \ drastically changed. \nReversal bar definitions may need threshold recalibration\
    \ for 2024+ market structure.\n"
  unresolved_questions:
  - Do reversal bars perform differently across market regimes (trending vs ranging)?
  - Is next-bar breakout more predictive than multi-bar follow-through?
  - How do algorithmic trading venues affect reversal bar frequency?
  _book_id: trading-price-action-trends-technical-analysis-of-price-char-2011
  _audit_grade: C
- id: TPAB-HYP-002
  title: Pullbacks during strong trends are bought by institutions at >60% frequency
  status: proposed
  derived_from:
  - TPAB-C2-004
  - TPAB-C0-001
  statement: "When price pulls back (bar closes below prior bar low) during an established\
    \ uptrend, \nthe pullback stops at or near a prior support level (previous swing\
    \ low, moving average, \nor channel line) and resumes uptrend with >60% frequency.\n"
  proposed_mechanism: "Institutional money uses pullbacks as accumulation zones; weak-hand\
    \ retail stops below \nprior bars trigger liquidations that provide liquidity;\
    \ institutions absorb supply and \ntrend resumes.\n"
  applicable_markets_and_regimes: "Strongly trending markets (equities, index futures);\
    \ intraday to daily timeframes; \nhigh institutional volume periods.\n"
  assumptions:
  - Pullback depth follows identifiable distribution around support
  - Institutional dominance (>60% volume) persists
  - Support levels (prior swings, moving averages) are respected
  - No fundamental news breaks market structure during pullback
  data_requirements:
  - OHLC bars on relevant timeframe
  - Volume profile around support levels
  - Identified support levels (prior swings, key moving averages)
  baseline_or_null_hypothesis: "Null: Pullbacks lead to reversal 50% of the time;\
    \ support levels are no more significant \nthan random price areas.\n"
  validation_approach: "Backtest: identify strong uptrends; mark pullback entries\
    \ at support; measure frequency \ntrend resumes (next N bars close above entry).\
    \ Target >60% resumption rate with \nfavorable risk/reward.\n"
  transaction_cost_and_fill_considerations: "Entry at support level (limit order);\
    \ stop below support; target = next resistance or \nN-period high; 1-2 tick slippage;\
    \ commissions per trade.\n"
  robustness_checks:
  - Vary support level definitions (swing low, 20/50 MA, channel line)
  - Cross-asset test on equities, forex, commodities
  - 'Regime separation: test during high-trend vs choppy periods'
  - 'Volatility sensitivity: compare low/high volatility regimes'
  rejection_criteria:
  - Resumption frequency <55%
  - Average loss exceeds average gain
  - Drawdown clusters during certain market conditions
  failure_modes:
  - Support breaks; trend reversal complete
  - Multiple stops before resumption (cumulative loss)
  - Gap through support (overnight or news event)
  freshness_concerns: "Moderate: Pullback structures may be more erratic due to algorithmic\
    \ rebalancing; \nmean reversion assumptions need validation.\n"
  unresolved_questions:
  - Are pullbacks shallower/deeper in 2024 vs 2011?
  - Do pullbacks hold better at certain hours or volatility levels?
  - How do earnings announcements affect pullback reliability?
  _book_id: trading-price-action-trends-technical-analysis-of-price-char-2011
  _audit_grade: C
- id: TPAB-HYP-003
  title: Outside bars predict breakouts in close direction with >55% accuracy
  status: proposed
  derived_from:
  - TPAB-C7-008
  - TPAB-C1-003
  statement: "An outside bar (high > prior bar high AND low < prior bar low) followed\
    \ by a close \nabove/below the bar's midpoint predicts breakout in that direction\
    \ (i.e., if outside bar \ncloses in upper half, next 5 bars close higher than\
    \ entry) >55% of the time.\n"
  proposed_mechanism: "Outside bar engulfs prior bar; stops triggered on both sides;\
    \ close direction determines \nwhich institutional stops (bulls or bears) were\
    \ run; breakout follows in close direction.\n"
  applicable_markets_and_regimes: "All liquid markets (equities, index futures, crypto);\
    \ intraday and swing timeframes; \nperiods following consolidation (prior 5-20\
    \ bars range-bound).\n"
  assumptions:
  - 'Outside bar definition objective: high > prior high, low < prior low'
  - Close at bar midpoint or beyond is meaningful directional signal
  - Stops exist at prior bar extremes (conventional trader behavior)
  data_requirements:
  - OHLC bars with verified close data
  - Volume spike data to confirm outside bar significance
  - Identified prior consolidation zone
  baseline_or_null_hypothesis: 'Null: Outside bar close direction uncorrelated with
    next breakout; random entry.

    '
  validation_approach: "Backtest: identify outside bars; enter long/short based on\
    \ close; measure next 5-bar \nclose vs entry close. Require >55% Win-frequency\
    \ with meaningful breakout distance \n(e.g., min 0.5% move).\n"
  transaction_cost_and_fill_considerations: "Entry at outside bar close or next open;\
    \ stop at prior bar extreme (= outside bar \nwicks); target range typically 0.5-2%\
    \ move; 1-2 tick slippage.\n"
  robustness_checks:
  - Vary lookback for consolidation zone prior to outside bar
  - Test on trending vs range-bound markets
  - 'Cross-timeframe: 5min, 15min, 60min bars'
  - Separate by volatility regime
  rejection_criteria:
  - Win rate <52%
  - Profit factor <1.2
  - Drawdown >2x largest win
  failure_modes:
  - 'False breakout: outside bar breakout fails; reversal inside bar range'
  - Gap-and-reverse overnight
  - 'Crowded trade: algorithm predicts and reverses at outside bar levels'
  freshness_concerns: "Moderate to High: Outside bar patterns may be crowded/front-run\
    \ by algorithms; \nfill quality at breakout levels may degrade.\n"
  unresolved_questions:
  - Has outside bar effectiveness degraded since 2011?
  - Are outside bars more/less common in current market?
  - Do dark pools interfere with outside bar fill execution?
  _book_id: trading-price-action-trends-technical-analysis-of-price-char-2011
  _audit_grade: C
- id: TPAB-HYP-004
  title: Trend line breaks predict >50% continuation in break direction within 5 bars
  status: proposed
  derived_from:
  - TPAB-C13-013
  - TPAB-C14-014
  statement: "When price breaks through a trend line (uptrend line break = close below\
    \ line; \ndowntrend line break = close above line) drawn from 2+ points, the market\
    \ continues \nin the break direction for at least 3 bars (no reversal back above/below\
    \ line) >50% \nof the time.\n"
  proposed_mechanism: "Trend line represents institutional support/resistance; break\
    \ through line signals \ninstitutional intent shift; market gravitates to next\
    \ support/resistance level \n(continuation) or reverses sharply (fakeout).\n"
  applicable_markets_and_regimes: "Trending markets (not tight ranges); all asset\
    \ classes; intraday to weekly timeframes; \nestablished trend (min 10+ bars, clear\
    \ slope).\n"
  assumptions:
  - Trend line drawn objectively from 2+ swing points, no hindsight bias
  - Line slope representative of true trend, not noise
  - Continuation occurs without fundamental shock
  data_requirements:
  - OHLC bars on analyzed timeframe
  - Identified swing points to draw lines
  - Volume confirmation of breakout
  baseline_or_null_hypothesis: 'Null: Trend line breaks have 50% probability of continuation
    vs reversal; random signal.

    '
  validation_approach: "Backtest: draw trend lines on historical data; at each break,\
    \ enter in break direction; \nmeasure 3-bar, 5-bar, 10-bar continuation. Target\
    \ >50% continuation with \nrisk/reward favorable (stop at trend line, target at\
    \ next level).\n"
  transaction_cost_and_fill_considerations: "Entry at trend line close or next bar;\
    \ stop above/below trend line (retest distance); \ntarget = next support/resistance\
    \ or measured move projection; 1-2 tick slippage.\n"
  robustness_checks:
  - Vary trend line definition (strict vs permissive breakage)
  - Test walk-forward to avoid overfitting to line selection
  - Cross-asset and cross-timeframe validation
  - Separate strong vs weak trends by slope steepness
  rejection_criteria:
  - Continuation rate <48%
  - Average loss exceeds average gain
  - Fakeouts cluster (high false-break frequency)
  failure_modes:
  - Line breaks then reverses (false breakout)
  - Hindsight bias in line selection during backtest
  - Fundamental news invalidates trend continuation
  freshness_concerns: "Moderate: Trend persistence may reduce; algorithmic mean-reversion\
    \ may counter \ninstitutional continuation.\n"
  unresolved_questions:
  - How do trend slopes affect continuation probability?
  - Does continuation vary by market volatility regime?
  - Are trend lines still viable in 2024 high-frequency environment?
  _book_id: trading-price-action-trends-technical-analysis-of-price-char-2011
  _audit_grade: C
- id: TPAB-HYP-005
  title: Range-bound trading range breakouts are fakeouts >45% of the time; mean reversion
    >55%
  status: proposed
  derived_from:
  - TPAB-C15-015
  - TPAB-C1-006
  statement: "When price breaks above or below a trading range (defined by 10+ touches\
    \ of high/low \nboundaries over 20+ bars), the market reverts back inside the\
    \ range >55% of the time \nwithin 5 bars; continued breakout (false breakout or\
    \ fakeout) occurs >45% of the time.\n"
  proposed_mechanism: "Trading ranges are accumulation/distribution zones where institutional\
    \ money enters \npositions; breakouts often trigger stop orders; however, lack\
    \ of conviction (weak \nvolume) leads to reversion back into range as institutional\
    \ orders absorb breakout \ndemand/supply.\n"
  applicable_markets_and_regimes: "Range-bound markets (non-trending periods); intraday\
    \ and swing timeframes; after \nconsolidation phases.\n"
  assumptions:
  - Range boundaries identifiable (multiple touches) and not arbitrary
  - Mean reversion dynamic governs ranges
  - No fundamental trend emerging during reversion
  data_requirements:
  - OHLC bars defining range boundaries
  - Volume profile showing range accumulation
  - Identified breakout bar
  baseline_or_null_hypothesis: 'Null: Breakout = 50% chance continuation, 50% mean
    reversion.

    '
  validation_approach: "Backtest: identify ranges (10+ touches, 20+ bars); at breakout,\
    \ enter; measure \n5-bar reversion vs continued breakout. Validate >55% mean reversion\
    \ rate; \ndesign trades to capture high-probability range snapback.\n"
  transaction_cost_and_fill_considerations: "Entry at range boundary on breakout attempt;\
    \ stop beyond breakout extreme; target = \nrange midpoint or opposite boundary;\
    \ 1-2 tick slippage; scale position (smaller \nbreakout, larger range-fade).\n"
  robustness_checks:
  - Vary range definition (touch count, time window)
  - Test across asset classes and timeframes
  - Volatility regime separation
  - Range duration sensitivity (short vs long ranges)
  rejection_criteria:
  - Mean reversion rate <52%
  - Drawdown on breakout-continuation trades >2x average win
  - Profit factor <1.3
  failure_modes:
  - Breakout continues (no mean reversion; range boundary penetrated)
  - Overnight gap past reversion target
  - Fundamental trend emerges; range becomes new support
  freshness_concerns: "High: Mean reversion dynamics may be suppressed by algorithmic\
    \ trend-following; \nranges may break out more frequently than 2011 market.\n"
  unresolved_questions:
  - Has mean reversion degraded in 2024?
  - Do longer ranges behave differently than shorter ranges?
  - How do news events affect range-breakout probabilities?
  _book_id: trading-price-action-trends-technical-analysis-of-price-char-2011
  _audit_grade: C
- id: TTAM-H1
  title: Pinbar at support/resistance predicts short-term reversal
  status: proposed
  derived_from:
  - TTAM-C3-002
  statement: A Pinbar (small body, long wick rejecting price extreme) appearing at
    a confirmed support or resistance level will result in a reversal within the next
    1-3 bars with win rate >55% and reward/risk ratio >1.5:1.
  proposed_mechanism: Extreme price rejection combined with known price level creates
    high-probability reversal setup; order cluster at level provides technical resistance.
  applicable_markets_and_regimes: Equities (mid-cap and large-cap), FX pairs (major);
    effective in trending regimes, less in choppy consolidations.
  assumptions:
  - Support/resistance identified using 3+ historical reversals
  - Pinbar has lower wick at least 2x the body size
  - Entry taken on close of pinbar or following bar
  data_requirements:
  - OHLC data at signal timeframe (1hr, 4hr, daily)
  - Historical price levels (3+ touch points) to identify support/resistance
  baseline_or_null_hypothesis: Random entry at support/resistance (no pinbar) has
    win rate ~50%.
  validation_approach: Backtest pinbar entries at support/resistance across 5+ years
    of data for 3+ assets; measure win rate, average profit factor, and Sharpe ratio.
  transaction_cost_and_fill_considerations: 1-2 pip slippage assumed; sufficient liquidity
    at identified levels; commission impact on small moves.
  robustness_checks:
  - Test across different timeframes (1hr, 4hr, daily)
  - Test across different asset classes (equities, FX, commodities)
  - Walk-forward validation (80/20 train/test split)
  rejection_criteria:
  - Win rate <50%
  - Profit factor <1.2:1
  - Sharpe ratio <0.5
  - Drawdown >25% of initial capital
  failure_modes:
  - Failed breakouts (level breaks decisively, pinbar was bear trap)
  - Reversal does not initiate within 3 bars
  - High slippage in low-liquidity regimes
  freshness_concerns: Technical patterns may evolve with algorithmic trading dominance;
    market microstructure shifts may reduce effectiveness.
  unresolved_questions:
  - Does pinbar effectiveness vary by asset class or market regime?
  - What is optimal timeframe for pinbar trading?
  - Should confluence factors (MA, trend line) improve win rate?
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-H2
  title: Head-and-Shoulders neckline break predicts reversal to opposite trend
  status: proposed
  derived_from:
  - TTAM-C5-001
  statement: A Head-and-Shoulders formation with confirmed neckline (3 touches) will
    result in trend reversal with entry on neckline break, achieving win rate >55%
    and profit factor >1.5 over 1-6 months.
  proposed_mechanism: Diminishing upwave peaks (left shoulder < head > right shoulder)
    indicate buyer exhaustion; neckline break confirms sellers' control shift.
  applicable_markets_and_regimes: Equities, indices, FX (trending markets); less effective
    in range-bound or choppy regimes.
  assumptions:
  - Head-and-Shoulders components correctly identified
  - Neckline is horizontal or slightly sloped
  - Right shoulder forms after head, not during
  data_requirements:
  - Daily or higher OHLC data
  - Multiple touch points to confirm neckline
  baseline_or_null_hypothesis: Random entry at neckline level (no HAS pattern context)
    has 50% win rate.
  validation_approach: Identify all HAS formations on historical charts; backtest
    entry on neckline break; measure win rate, move magnitude, and time to reversal
    confirmation.
  transaction_cost_and_fill_considerations: 2-5 pip slippage; sufficient volume at
    neckline to absorb orders.
  robustness_checks:
  - Test across bull and bear contexts
  - Test across market regimes (trending vs choppy)
  - Measure time to reversal confirmation
  rejection_criteria:
  - Win rate <50%
  - Average move after neckline break <2x the neckline depth
  - False breakouts (neckline holds, reversal fails)
  failure_modes:
  - Neckline acts as resistance and bounces back into consolidation
  - Reversal initiates but stalls before target (premature false break)
  - Whipsaw after neckline break
  freshness_concerns: Head-and-Shoulders may be less reliable in highly algorithmic
    markets; pattern recognition by algos may front-run retail traders.
  unresolved_questions:
  - Does inverse HAS (downtrend reversal) have same effectiveness?
  - What is optimal profit target based on HAS depth?
  - Does volume confirmation at neckline improve success rate?
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-H3
  title: Ascending Triangle breakout predicts continuation of prevailing uptrend
  status: proposed
  derived_from:
  - TTAM-C5-003
  statement: An Ascending Triangle (horizontal resistance with rising support floor)
    will break upward with entry on resistance break, achieving win rate >60% and
    average move >1.5x triangle height within 2 weeks.
  proposed_mechanism: Rising lows indicate increasing buyer interest; horizontal resistance
    represents buyer supply exhaustion point; upside break confirms trend continuation.
  applicable_markets_and_regimes: Equities, indices, FX; effective in uptrending markets;
    less in downtrends or consolidations.
  assumptions:
  - Ascending Triangle components correctly identified
  - At least 3 touches on horizontal resistance
  - At least 3 contact points on rising support
  data_requirements:
  - 4hr or daily OHLC data
  - Confirmed horizontal resistance with multiple touches
  baseline_or_null_hypothesis: Random entry at resistance level (no triangle context)
    has 50% win rate.
  validation_approach: Identify all Ascending Triangle formations on historical charts;
    backtest entry on resistance break; measure win rate, move magnitude, and time
    to target.
  transaction_cost_and_fill_considerations: 1-3 pip slippage; volume confirmation
    at breakout crucial.
  robustness_checks:
  - Test across different timeframes
  - Test across different market regimes
  - Measure average move vs triangle height ratio
  rejection_criteria:
  - Win rate <55%
  - Average move <1.2x triangle height
  - High false-breakout rate (>30% of breakouts reverse)
  failure_modes:
  - Downside breakdown instead of upside breakout (bearish reversal)
  - Breakout lacks follow-through (exhaustion)
  - Consolidation continues despite breakout
  freshness_concerns: Chart pattern effectiveness may decline with algorithmic pattern
    recognition; market structure changes affect breakout dynamics.
  unresolved_questions:
  - Does volume confirmation at breakout improve win rate?
  - What is optimal profit target based on triangle height?
  - Does confluence with moving averages or trend lines improve success?
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-H4
  title: Confluence of multiple technical signals increases entry success
  status: proposed
  derived_from:
  - TTAM-C6-003
  statement: Entries with 3+ concurrent technical signals (e.g., trend line break
    + candlestick pattern + support/resistance + indicator divergence) will achieve
    win rate 65%+ and profit factor 2.0+ compared to single-signal entries (~50% win
    rate).
  proposed_mechanism: Multiple converging signals increase trader awareness and order
    clustering, making support/resistance levels more sticky and reversals more reliable.
  applicable_markets_and_regimes: All equities and FX; effective across all timeframes
    and regimes.
  assumptions:
  - Signals are correctly identified
  - Signals are relatively independent (not measuring the same concept)
  - Confluence factors occur within 1-2 bars of each other
  data_requirements:
  - Indicator data (MA, RSI, MACD, Bollinger Bands)
  - Chart pattern and support/resistance data
  - Trend line data
  baseline_or_null_hypothesis: Single-signal entries have ~50-52% win rate based on
    historical analysis.
  validation_approach: Categorize all historical entries by signal count (1, 2, 3+);
    compare win rates, profit factors, and Sharpe ratios.
  transaction_cost_and_fill_considerations: Standard slippage and commissions; higher
    signal counts may indicate tighter areas with better fills.
  robustness_checks:
  - Test confluence across different signal combinations
  - Measure win rate degradation as signals become correlated
  - Test across market regimes
  rejection_criteria:
  - Win rate improvement <5% vs single-signal entries
  - Profit factor <1.5:1
  - Over-optimization to specific signal combinations
  failure_modes:
  - False signals from multiple sources simultaneously (coincidence, not causation)
  - Signal correlation increases in certain market regimes
  - Bias toward high-signal-count entries that may be false
  freshness_concerns: Confluence concept relies on human trader behavior; algorithmic
    execution may not respect the same levels, reducing confluence effect.
  unresolved_questions:
  - Which signal combinations are most effective?
  - Is there a diminishing return beyond 3 signals?
  - How do signals correlate in different market regimes?
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-H5
  title: RSI divergence predicts momentum reversal within 2-5 bars
  status: proposed
  derived_from:
  - TTAM-C7-003
  statement: RSI divergence (price makes new high/low but RSI does not) will result
    in trend reversal within 2-5 bars with win rate >58% and average reversal move
    >2 ATR.
  proposed_mechanism: Divergence indicates weakening momentum despite price movement;
    suggests exhaustion of prevailing move and imminent reversal.
  applicable_markets_and_regimes: Equities, FX, commodities; effective at local highs/lows;
    less effective in strong trending regimes.
  assumptions:
  - RSI divergence correctly identified (price extreme vs RSI extreme)
  - Divergence occurs at recognizable support/resistance level
  - RSI period is optimized (typically 14)
  data_requirements:
  - RSI indicator (14-period standard)
  - Price highs/lows for divergence identification
  baseline_or_null_hypothesis: Random entry at price extremes (no RSI context) has
    50% win rate.
  validation_approach: Identify all RSI divergences on historical data; backtest entry
    on confirmed divergence; measure win rate, move magnitude, and time to reversal.
  transaction_cost_and_fill_considerations: Standard slippage; entries often at extremes
    where liquidity may be lower.
  robustness_checks:
  - Test across different RSI periods
  - Test at local vs global extremes
  - Measure win rate by market regime
  rejection_criteria:
  - Win rate <55%
  - Average reversal move <1.5 ATR
  - High false-signal rate (divergence persists without reversal)
  failure_modes:
  - Divergence can persist for extended periods without reversal
  - Strong trends override divergence signals
  - False divergences from price/RSI misalignment
  freshness_concerns: RSI lagging in fast-moving markets; divergence may be identified
    too late for profitable entry.
  unresolved_questions:
  - Should divergence confirmation require price break of recent swing?
  - Does volume confirmation at divergence improve success rate?
  - What is optimal holding period for divergence trades?
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: TTAM-H6
  title: Trend line break followed by new swing extreme signals trend reversal
  status: proposed
  derived_from:
  - TTAM-C6-001
  - TTAM-C6-005
  statement: Trend line break (3+ contact points) combined with formation of new swing
    high/low will result in trend reversal with win rate >62% and profit factor >1.8
    when confirmed by additional confluence.
  proposed_mechanism: Trend line break indicates structure shift; preceding swing
    extreme change confirms weakening of prevailing trend; confluence increases signal
    reliability.
  applicable_markets_and_regimes: Equities, FX, indices; effective across all timeframes;
    more reliable in trending markets.
  assumptions:
  - Trend line correctly drawn with 3+ contact points
  - Swing points correctly identified
  - Confluence factors (support/resistance, candlestick patterns) present
  data_requirements:
  - Correct trend line identification (subjective but with rules)
  - Swing point data
  - Support/resistance levels and candlestick patterns
  baseline_or_null_hypothesis: Trend line break alone has ~55% win rate; confluence
    addition improves to 62%+.
  validation_approach: Identify all trend line breaks with preceding swing changes;
    test with and without confluence; compare win rates and profit factors.
  transaction_cost_and_fill_considerations: Entries at trend line breaks may face
    slippage; confluence confirmation may delay entry but improve reliability.
  robustness_checks:
  - Test across different trend line types (steep vs shallow)
  - Test impact of each confluence factor separately
  - Measure win rate improvement from confluence
  rejection_criteria:
  - Win rate <58%
  - Profit factor <1.5:1
  - Confluence does not materially improve win rate (>5% improvement)
  failure_modes:
  - Trend line break is minor retest, not full reversal
  - Whipsaw after line break
  - Over-reliance on subjective trend line drawing
  freshness_concerns: Subjectivity of trend line drawing may lead to over-optimization;
    trend lines may be less effective in algorithmic markets.
  unresolved_questions:
  - Should confluence be present at break or develop after?
  - What is optimal holding period for trend line break trades?
  - How sensitive is this pattern to trend line angle?
  _book_id: trading-technical-analysis-masterclass-master-the-financial--2021
  _audit_grade: C
- id: VGF-H1
  title: Interest rate differentials across maturities reflect risk and time value,
    enabling tactical curve positioning
  status: proposed
  derived_from:
  - VGF-C2-001
  - VGF-C2-002
  statement: "Government yield curves reflect investor expectations about future rates,\
    \ inflation, and risk. \nAbnormally steep or inverted curves signal economic regime\
    \ changes. Tactical positioning along \nthe curve can outperform buy-and-hold\
    \ if curve shape reverts to historical norms.\n"
  proposed_mechanism: "Yield curve steepness is mean-reverting; extreme slopes are\
    \ temporary. Positioning short duration \nwhen curves are unusually flat and long\
    \ duration when curves are steep capture mean-reversion alpha.\n"
  applicable_markets_and_regimes: "Fixed income markets, periods of extreme monetary\
    \ policy (zero rates, negative rates), \npre/post recession environments\n"
  assumptions:
  - Yield curve shape mean-reverts over 6-24 month horizons
  - Transaction costs and bid-ask spreads do not eliminate alpha
  - Curve adjustments are not perfectly efficient
  data_requirements: 'Daily historical yield curves, transaction costs, borrowing
    costs for positioning

    '
  baseline_or_null_hypothesis: 'Yield curve is an efficient summary of available information;
    no tactical alpha exists

    '
  validation_approach: "Backtest positioning strategies (duration/convexity trades)\
    \ against historical yield curve data. \nCompare strategy returns to curve momentum\
    \ and mean-reversion periods.\n"
  transaction_cost_and_fill_considerations: "Treasury market liquidity is high; bid-ask\
    \ spreads are tight (1-5 bps depending on maturity). \nRepo financing is available\
    \ at low cost, enabling leveraged positioning.\n"
  robustness_checks: "Test across multiple recession/expansion cycles. Vary curve\
    \ positioning thresholds. \nAccount for regime change (e.g., unconventional monetary\
    \ policy).\n"
  rejection_criteria: 'Curve mean-reversion does not occur or occurs too slowly (>3
    years) to justify trading costs

    '
  failure_modes:
  - Regime shift (e.g., permanent low rates, negative rates) breaks mean-reversion
  - Liquidity evaporation during crises widens bid-ask spreads
  freshness_concerns: "Book published 2013. Post-2020 monetary policy (QE, negative\
    \ rates, yield-curve control) has altered \ncurve dynamics. Current applicability\
    \ uncertain.\n"
  unresolved_questions: "How have curves behaved in 2020-2026 low-rate environment?\
    \ Are historical mean-reversion patterns \nreproducible post-COVID? What is the\
    \ optimal rebalancing frequency?\n"
  _book_id: visual-guide-to-financial-markets-by-david-wilson-z-lib-org-2013
  _audit_grade: B
- id: VGF-H2
  title: Stock market indexes efficiently aggregate individual security prices; passive
    index funds should match market returns
  status: proposed
  derived_from:
  - VGF-C5-001
  statement: "If indexes accurately aggregate individual security prices and index-based\
    \ funds charge low fees, \nthen passive index funds should replicate market returns\
    \ over long periods, underperforming only \nby the amount of their fees.\n"
  proposed_mechanism: "Index construction captures market-wide price discovery. Passive\
    \ funds minimizing turnover and costs \ncan match index returns. Most active managers\
    \ underperform due to fees and turnover costs.\n"
  applicable_markets_and_regimes: 'Equity markets in developed countries with transparent
    pricing and low trading costs (U.S., Europe, etc.)

    '
  assumptions:
  - Index construction is efficient and stable
  - Fee competition keeps passive fund costs low
  - Markets are sufficiently efficient that outperformance is rare after costs
  data_requirements: 'Historical fund returns, index returns, fee schedules, turnover
    data

    '
  baseline_or_null_hypothesis: 'Some active managers outperform indexes after fees
    due to skill or informational advantages

    '
  validation_approach: "Compare returns of passive index funds to underlying indexes\
    \ and to active funds over 10+ year periods. \nMeasure fee impact and turnover\
    \ costs.\n"
  transaction_cost_and_fill_considerations: "Index rebalancing costs (turnover) vary\
    \ by methodology. Standard indices (S&P 500) have low turnover \n(5-10% annual);\
    \ factor indices can have higher turnover (20-50% annual).\n"
  robustness_checks: "Test across different index types (large-cap, small-cap, factor-based).\
    \ Vary measurement periods. \nAccount for survivorship bias in fund datasets.\n"
  rejection_criteria: 'Significant fraction (>20%) of active funds persistently outperform
    after fees

    '
  failure_modes:
  - Index concentration in mega-cap names reduces diversification
  - Passive flows destabilize markets during crises
  freshness_concerns: "Passive management has grown substantially since 2013 book\
    \ publication. \nImpact on index-based fund returns and market efficiency is an\
    \ open question.\n"
  unresolved_questions: "How has the rise of passive investing (2013-2026) changed\
    \ market efficiency and index returns? \nAre factor-based indices sufficiently\
    \ stable? What is the cost of index rebalancing?\n"
  _book_id: visual-guide-to-financial-markets-by-david-wilson-z-lib-org-2013
  _audit_grade: B
- id: VGF-H3
  title: Derivatives pricing reflects underlying asset volatility; changes in volatility
    regime drive realized vs. implied volatility divergence
  status: proposed
  derived_from:
  - VGF-C10-001
  - VGF-C10-003
  statement: "Option prices reflect market expectations of future volatility (implied\
    \ volatility). \nWhen realized volatility deviates from implied volatility, traders\
    \ can profit from the divergence.\n"
  proposed_mechanism: "Option premium incorporates expected volatility; realized volatility\
    \ often differs from expectations. \nLong volatility positioning profits when\
    \ realized > implied; short volatility profits when realized < implied.\n"
  applicable_markets_and_regimes: 'Options on equities, indices, futures; periods
    of regime change, earnings announcements, crisis events

    '
  assumptions:
  - Implied volatility reflects market expectations fairly
  - Realized volatility is measurable and tractable
  - Volatility mean-reverts to long-term averages
  data_requirements: 'Daily option prices (implied volatility surfaces), realized
    volatility, underlying asset prices

    '
  baseline_or_null_hypothesis: 'Options are priced efficiently; no systematic alpha
    from vol trading

    '
  validation_approach: "Backtest vol trading strategies (straddles, strangles, vol\
    \ swaps) on historical option data. \nMeasure P&L from realized vs. implied vol\
    \ divergence.\n"
  transaction_cost_and_fill_considerations: "Option bid-ask spreads are higher than\
    \ equities (1-5% depending on moneyness and liquidity). \nGamma losses from rehedging\
    \ can erode vol trading profits.\n"
  robustness_checks: "Test across different underlying assets, maturities, moneyness\
    \ levels. Account for transaction costs \nand market impact. Vary holding periods.\n"
  rejection_criteria: 'Realized volatility is random and unpredictable; alpha disappears
    after transaction costs

    '
  failure_modes:
  - Gamma losses (rehedging costs) exceed vol trading profits
  - Implied volatility skews systematically; vol trading is biased
  - Extreme events cause gap moves that invalidate hedges
  freshness_concerns: "Option pricing models and volatility regimes have evolved post-2013.\
    \ \nModel risk and vol surface dynamics may differ from book's simplified treatment.\n"
  unresolved_questions: "How has market structure (HFT, option flow) changed vol trading\
    \ since 2013? \nAre simple vol strategies still profitable? What role does tail\
    \ risk play?\n"
  _book_id: visual-guide-to-financial-markets-by-david-wilson-z-lib-org-2013
  _audit_grade: B
- applicable_markets_and_regimes: Developed-market carry pairs (AUD/JPY, NZD/JPY,
    USD/JPY, EUR/GBP); most pronounced during transition from low-rate to hiking cycle
  assumptions:
  - Interest rate expectations are priced into forex markets efficiently
  - Carry trade positioning is significant enough to trigger contagion
  baseline_or_null_hypothesis: Interest rate differentials are already fully priced
    in; no predictive power beyond efficient-market expectations
  data_requirements:
  - Real-time central bank guidance and inflation data
  - Carry trade positioning data
  derived_from:
  - WTFTC-C1-001
  - WTFTC-C5-001
  failure_modes:
  - Carry unwind without rate shock (e.g., risk-off event)
  - Rate hikes priced in gradually without sharp deleveraging
  freshness_concerns: 2015 rate environment near-zero; current 3.5%+ and QT may alter
    carry dynamics substantially
  id: HYP-001
  proposed_mechanism: Central bank hawkish pivot or inflation surge triggers expectation
    of interest rate hikes, narrowing carry trade appeal; investors systematically
    exit, triggering forced deleveraging and correlated currency sell-offs in high-yield
    pairs (JPY, CHF strength).
  rejection_criteria: Correlation <0.3 or signal lead <1 week
  robustness_checks:
  - Cross-validate against 2015 taper tantrum, 2019 repo crisis, 2022 rate shock
  - Check if inflation forecast surprises matter more than levels
  statement: Interest rate differentials and changes in forward guidance predict carry
    trade unwind cycles. Rising inflation pressure signals impending carry deleveraging
    and currency mean reversion.
  status: proposed
  title: Interest rate regime shifts trigger carry unwinds
  transaction_cost_and_fill_considerations: Macro carry unwind signals are low-frequency;
    entry/exit execution costs low but slippage during contagion high
  unresolved_questions:
  - How much of Feb 2007 yen carry crash driven by rate expectations vs. credit crisis?
  - Do hedge fund leverage limits reduce unwind severity today?
  validation_approach: 'Backtest: correlate changes in OIS/rate-forward guidance with
    next-week carry-pair currency moves; measure hit rate and average return per carry
    unwind signal'
  _book_id: wiley-trading-forex-trading-course-a-self-study-guide-to-bec-2015
  _audit_grade: B
- applicable_markets_and_regimes: UK, Australia, Canada; especially post-crisis recovery
    periods when housing rebounds
  assumptions:
  - Housing wealth effect magnitude is stable
  - MEWs data available with <3 month lag
  - Central banks respond predictably to inflation signals
  baseline_or_null_hypothesis: Housing prices coincident with consumption; currency
    markets price MEW effects instantly
  data_requirements:
  - Quarterly housing price indices and MEW flows
  - Consumer spending and CPI lagged against housing data
  derived_from:
  - WTFTC-C1-002
  - WTFTC-C5-002
  failure_modes:
  - Housing wealth effect weaker post-2008
  - MEWs replaced by other savings drawdowns
  freshness_concerns: Post-2008 lending standards changed; recent US housing collapse
    not covered
  id: HYP-002
  proposed_mechanism: Rising house prices increase household net worth, encouraging
    MEWs via refinancing; MEWs boost consumer spending, driving inflation and central
    bank rate expectations; higher rates attract capital inflows and currency appreciation.
  rejection_criteria: MEW-to-inflation lag >3 months or inconsistent across countries
  robustness_checks:
  - Control for house-price cycles independent of MEWs
  - Cross-country validation
  - Check if relationship broke post-2008
  statement: Housing MEWs (Mortgage Equity Withdrawals) lead consumer spending and
    inflation by 1-3 months; elevated housing wealth predicts currency appreciation
    in economies with strong housing asset correlation.
  status: proposed
  title: Housing MEWs lead consumption and currency appreciation
  transaction_cost_and_fill_considerations: MEWs released quarterly with lag; decision
    window 6-8 weeks; high signal-to-noise if surprises used
  unresolved_questions:
  - How did MEW elasticity change post-Dodd-Frank?
  - Is 0.20 elasticity empirically sourced or asserted?
  validation_approach: 'Regression: MEW growth (t) vs consumer spending, inflation,
    currency returns (t+1, t+2, t+3); Granger causality test'
  _book_id: wiley-trading-forex-trading-course-a-self-study-guide-to-bec-2015
  _audit_grade: B
- applicable_markets_and_regimes: Safe-haven pairs (JPY, CHF, USD) during high-volatility
    regimes; pronounced in 5-8% equity drawdowns
  assumptions:
  - Web search volume is reliable sentiment proxy
  - Risk sentiment shifts uncorrelated with macro surprises
  - Sentiment-driven moves are mean-reverting over 1-5 days
  baseline_or_null_hypothesis: Web search volume is noise; currency markets driven
    by fundamentals
  data_requirements:
  - Google Trends data for fear/greed terms
  - VIX or MOVE index
  - Hourly forex data
  derived_from:
  - WTFTC-C1-006
  - WTFTC-C5-003
  failure_modes:
  - Sentiment spikes coincide with fundamental news
  - Mean reversion too fast to capitalize
  freshness_concerns: Google Trends API and crypto/social-media sentiment evolved;
    2015 baseline may not generalize
  id: HYP-003
  proposed_mechanism: Investor fear spikes (high Google search volume for fear terms,
    VIX >20) trigger capital flight to safety; JPY, CHF, USD appreciate; inversely,
    risk-on drives carry-pair strength.
  rejection_criteria: Win rate <52% or reversal size <3 pips after costs
  robustness_checks:
  - Separate sentiment spikes from macro news
  - Validate on 2008, 2011, 2015 crises
  - Measure alpha after transaction costs
  statement: Risk-on/risk-off sentiment shifts, measured via web search volume or
    VIX, predict 1-5 day currency reversals in safe-haven vs. risk pairs.
  status: proposed
  title: Risk-on/off sentiment predicts 1-5 day safe-haven reversals
  transaction_cost_and_fill_considerations: Sentiment moves highest in RTH; execution
    costs low but move amplitude small (2-5 pips average)
  unresolved_questions:
  - Which search terms best correlate with forex moves?
  - Is sentiment validation empirical or qualitative?
  validation_approach: 'Event study: identify anomalous search volume spikes; measure
    average forex move direction and reversal rate over next 1-5 days'
  _book_id: wiley-trading-forex-trading-course-a-self-study-guide-to-bec-2015
  _audit_grade: B
- applicable_markets_and_regimes: Major pairs (EUR/USD, GBP/USD, USD/JPY) during sideways
    or near resistance; breakout-regime filters reduce noise
  assumptions:
  - Technical levels reflect non-random order clustering
  - Indicators have predictive power independent of momentum
  baseline_or_null_hypothesis: Technical levels are reflections of history, not predictive;
    indicators lag price
  data_requirements:
  - Multi-timeframe analysis (daily, 1H, 15m); RSI, Stochastic, MAs, Fibonacci levels
  derived_from:
  - WTFTC-C2-002
  - WTFTC-C6-001
  failure_modes:
  - Breakout extensions penetrate Fibonacci without reversing
  - Indicators lag rather than lead
  freshness_concerns: Pre-crypto, pre-HFT; market microstructure evolved
  id: HYP-004
  proposed_mechanism: Technical overshooting signals potential reversal; confluence
    on multiple timeframes increases probability; reversals mean-revert to support/resistance
    zones.
  rejection_criteria: Hit rate <55% or Sharpe <0.5 after costs
  robustness_checks:
  - Walk-forward validation
  - Separate by regime (trending vs. sideways)
  - Validate on all four archetypes
  statement: Technical indicators (RSI >70, Stochastic overbought, price at Fibonacci
    61.8%) predict 3-5 day mean reversions when confirmed by multi-timeframe alignment
    (daily downtrend, 1H overbought).
  status: proposed
  title: Multi-timeframe technical confluence predicts reversals
  transaction_cost_and_fill_considerations: Reversal signals high-frequency in choppy
    markets; costs non-trivial; need tight stops (3-5 pips)
  unresolved_questions:
  - Which 14 indicators have highest predictive power?
  - Does book provide backtesting or validation?
  validation_approach: 'Backtest: RSI>70 + price>Fibonacci 61.8% + daily MA slope
    <0; measure hit rate and 3-5 day returns; separate by regime'
  _book_id: wiley-trading-forex-trading-course-a-self-study-guide-to-bec-2015
  _audit_grade: B
- applicable_markets_and_regimes: Risk-on regimes; commodity boom/bust cycles; China-dependent
    economies
  assumptions:
  - China PMI predictive for commodity demand
  - Commodity-currency correlation >0.6
  baseline_or_null_hypothesis: Jointly determined; no exploitable lead-lag signal
  data_requirements:
  - WTI, copper, iron-ore prices; China PMI; AUD/USD, CAD/USD, NZD/USD
  derived_from:
  - WTFTC-C1-004
  - WTFTC-C1-005
  failure_modes:
  - Safe-haven episodes dominate commodity flows
  - Correlation breaks
  freshness_concerns: China reserve management and PMI weighting evolved
  id: HYP-005
  proposed_mechanism: China growth (PMI) drives commodity demand; higher commodity
    prices lift capital inflows; correlated long commodity-currency/short safe-haven
    reduces single-factor risk.
  rejection_criteria: Granger lead >2 weeks or correlation <0.5
  robustness_checks:
  - Validate across 2008-2015 and 2015-2026
  - Check correlation breaks during safe-haven flights
  statement: Commodity prices (WTI crude oil) and China manufacturing PMI lead commodity-currency
    strength (AUD, CAD, NZD) by 1-2 weeks; correlation pairs reduce regime dependence.
  status: proposed
  title: Commodity prices and China PMI lead commodity currencies
  transaction_cost_and_fill_considerations: Pair trades lower volatility; larger position
    size needed for same notional risk
  unresolved_questions:
  - Quantitative PMI-to-commodity correlation provided?
  - Is 1-2 week lag empirical or qualitative?
  validation_approach: 'Granger causality: PMI -> commodity prices -> commodity currencies;
    measure lead times and correlation stability'
  _book_id: wiley-trading-forex-trading-course-a-self-study-guide-to-bec-2015
  _audit_grade: B
