- id: STKTWIT-H1
  title: Price-change labeling thresholds partition StockTwits messages into separable
    signal groups
  status: proposed
  derived_from:
  - STKTWIT-C1-003
  - STKTWIT-C1-004
  statement: Labeling StockTwits messages based on stock price movements with a 0.5%
    threshold creates message classes with distinct linguistic patterns that supervised
    classifiers can discriminate.
  proposed_mechanism: The correlation between stock price changes and public sentiment
    means messages coinciding with larger price moves (≥0.5%) share linguistic markers;
    messages around neutral price moves (-0.5% to +0.5%) are ambiguous; threshold
    selection maximizes inter-class separation.
  applicable_markets_and_regimes: FAANG equities, 2015-2017; may not hold in highly
    correlated or meme-driven regimes.
  assumptions:
  - Retail social media sentiment lags institutional price discovery
  - 0.5% threshold is calibrated appropriately (not data-snooped)
  - Message-date alignment is precise
  data_requirements:
  - Historical StockTwits messages with timestamps
  - Daily OHLCV data from Yahoo Finance or equivalent
  baseline_or_null_hypothesis: Random labeling or sentiment-based labels produce worse
    class separation than price-change labels.
  validation_approach: Compare F1 scores across three label schemes (binary, 2-label,
    3-label threshold, sentiment-based). Test on held-out companies and time periods
    not used to calibrate threshold.
  transaction_cost_and_fill_considerations: Not applicable to this hypothesis; focuses
    on classification task, not execution.
  robustness_checks:
  - 'Threshold sensitivity: vary 0.5% to ±1%, ±2%, measure F1 change'
  - 'Cross-period generalization: train on 2015-2016, test on 2017'
  - 'Cross-company generalization: train on 4 FAANG, test on fifth'
  rejection_criteria: If percentage-change labels underperform random labels or sentiment-based
    labels across multiple models.
  failure_modes:
  - Threshold optimized on test set (data snooping)
  - 'Survivorship bias: only succeeded companies studied'
  - 'Regime change: retail sentiment loses correlation with price'
  freshness_concerns: Social media sentiment dynamics may have shifted post-2017 due
    to algorithmic changes and user behavior evolution.
  unresolved_questions:
  - Is 0.5% optimal or arbitrary? How to validate threshold without test-set leakage?
  - Does threshold vary across volatility regimes?
  - How persistent is correlation over 10-year span?
  _book_id: text-mining-of-stocktwits-data-for-predicting-stock-prices-2021
  _audit_grade: B
- id: STKTWIT-H2
  title: Traditional ML with TF-IDF features is more cost-effective than transformers
    for price-change classification
  status: proposed
  derived_from:
  - STKTWIT-C1-006
  - STKTWIT-C1-011
  statement: For the task of predicting same-day stock price movement labels from
    StockTwits text, Naive Bayes with TF-IDF feature extraction achieves comparable
    F1 scores to BERT with ~180x less training time, and outperforms transformer-based
    models due to the output label being independent of text semantics.
  proposed_mechanism: Transformers learn bidirectional context and semantic relationships,
    optimized for tasks like sentiment or intent prediction. Price-change prediction
    requires memorizing text-price correlations that are not semantic properties;
    simple word-frequency models (Naive Bayes + TF-IDF) capture this correlation equally
    well without gradient computation overhead.
  applicable_markets_and_regimes: FAANG 2015-2017; most likely applies when target
    outcome (price) is externally determined and not text-semantic.
  assumptions:
  - Training infrastructure cost is relevant constraint
  - Inference latency is acceptable (~seconds to minutes)
  - Price-change task is not sequence-dependent (each message labeled independently)
  data_requirements:
  - Historical StockTwits messages
  - Preprocessed and TF-IDF vectorized
  baseline_or_null_hypothesis: Transformer models outperform simpler models on this
    task due to superior representation learning.
  validation_approach: Train both Naive Bayes (TF-IDF) and BERT on identical train/test
    splits; measure F1, accuracy, and wall-clock training time. Repeat across labeling
    schemes (binary, 2-label, 3-label). Evaluate on out-of-sample periods.
  transaction_cost_and_fill_considerations: 'Relevant for production: faster training
    allows more frequent retraining and A/B testing.'
  robustness_checks:
  - 'Cross-validation: 5-fold CV on both models'
  - 'Hyperparameter sweep: grid search for both architectures'
  - 'Feature ablation: compare TF-IDF vs Count Vectorizer'
  rejection_criteria: If transformer F1 exceeds traditional ML by >5% or if deployment
    cost dominates benefits.
  failure_modes:
  - Newer social media conventions could favor semantic models
  - Regime change where contextual information becomes important
  - Inference cost becomes bottleneck if real-time decision-making required
  freshness_concerns: Social platform evolution; text preprocessing requirements may
    change.
  unresolved_questions:
  - How do ensemble methods (traditional + transformer) perform?
  - Is cost-benefit analysis tied to specific hardware (GPU availability)?
  - How do performance and cost scale with dataset size?
  _book_id: text-mining-of-stocktwits-data-for-predicting-stock-prices-2021
  _audit_grade: B
- id: STKTWIT-H3
  title: Domain-specific pre-training requires sufficient data volume and training
    steps to exceed generic models
  status: proposed
  derived_from:
  - STKTWIT-C1-005
  - STKTWIT-C1-010
  statement: FinALBERT, an ALBERT model pre-trained on financial domain text (Reuters-21578,
    AG News, 10% BookCorpus), underperforms general-domain BERT when fine-tuned on
    price-change labels due to smaller pre-training corpus (7.4M sentences, 10k steps
    vs 2.5B words, 125k steps for BERT). Domain-specific pre-training would exceed
    generic models if scaled to equivalent data and training budget.
  proposed_mechanism: Transformer models benefit from large pre-training corpora that
    build rich vocabulary and linguistic patterns. Domain-specific pre-training is
    effective only when domain corpus is large relative to fine-tuning task and training
    steps are sufficient for convergence. Under-training on small domain corpus results
    in poor generalization.
  applicable_markets_and_regimes: Financial text classification with limited domain
    data; applicable to trading, risk, compliance NLP tasks.
  assumptions:
  - 125k steps is sufficient convergence threshold for ALBERT on domain data
  - 7.4M sentences is materially smaller than 2.5B words
  - Domain vocabulary from Reuters+AG_News is representative of target task
  data_requirements:
  - Large financial corpus (>=50M sentences equivalent)
  - Compute budget for 125k+ pre-training steps on GPU/TPU
  baseline_or_null_hypothesis: Domain-specific pre-training provides no benefit over
    generic models regardless of data size.
  validation_approach: 'Scale FinALBERT pre-training to 50M sentence corpus and 125k
    steps; compare F1 on held-out StockTwits test set vs BERT. Ablation: vary corpus
    size (7.4M, 20M, 50M) and steps (10k, 50k, 125k) to quantify scaling laws.'
  transaction_cost_and_fill_considerations: Pre-training cost is fixed; amortized
    across many downstream tasks; not directly relevant to trading execution.
  robustness_checks:
  - 'Cross-domain test: fine-tune scaled FinALBERT on FinancialPhraseBank, Reuters
    sentiment tasks'
  - 'Sensitivity: measure F1 vs corpus size and training steps'
  - 'Ensemble: combine scaled FinALBERT with BERT'
  rejection_criteria: If scaled FinALBERT still underperforms BERT; indicates data
    quality or task mismatch, not quantity.
  failure_modes:
  - Financial domain corpus is qualitatively different from trading task; domain-specific
    irrelevant
  - 7.4M sentence corpus sufficient after all; problem is hyperparameter tuning, not
    data
  freshness_concerns: Financial vocabulary evolves (e.g., new trading instruments,
    regulations); corpus must be refreshed.
  unresolved_questions:
  - What is minimum corpus size for domain-specific advantage?
  - Is FinancialPhraseBank success (F1 0.83) due to sentiment task better-suited to
    transformers, or proof-of-concept that domain pre-training works?
  - How to separate domain-vocab benefit from larger pre-training budget?
  _book_id: text-mining-of-stocktwits-data-for-predicting-stock-prices-2021
  _audit_grade: B
- id: STKTWIT-H4
  title: Neutral class from threshold-based labeling introduces noise; binary or 2-label
    schemes reduce noise
  status: proposed
  derived_from:
  - STKTWIT-C1-003
  - STKTWIT-C1-009
  statement: The neutral class created by three-label threshold-based labeling (price
    change between -0.5% and +0.5%) represents ambiguous or noisy target labels, not
    a real phenomenon. Models trained with binary or 2-label schemes achieve higher
    F1 (0.54-0.60) than 3-label (0.21-0.41); imbalance is secondary factor.
  proposed_mechanism: Threshold range [-0.5%, +0.5%] captures random walk noise and
    intra-day volatility, not meaningful price movements. Messages labeled neutral
    have no clear relationship to price trajectory; including them as a target class
    adds label noise, degrading gradient-based learning.
  applicable_markets_and_regimes: Low-volatility regimes where 0.5% threshold captures
    noise; high-volatility regimes may have genuine neutral pattern.
  assumptions:
  - Price movements < 0.5% are noise, not signal
  - Neutral messages are linguistically ambiguous, not distinct
  data_requirements:
  - Historical price/message data to measure signal-to-noise ratio in threshold range
  baseline_or_null_hypothesis: Neutral class is a genuine third outcome; three-label
    scheme has equal or higher F1 than two-label.
  validation_approach: Analyze linguistic properties of messages in neutral window
    vs positive/negative. Train models with neutral class downweighted, removed, or
    re-labeled as positive/negative based on stronger threshold. Compare F1 curves.
  transaction_cost_and_fill_considerations: 'For trading: three-way signal (buy/sell/hold)
    could be useful; but empirical evidence suggests hold signal unreliable.'
  robustness_checks:
  - 'Threshold sensitivity: vary neutral window from ±0.3% to ±1%'
  - 'Class weight adjustment: apply sample_weight to neutral class during training'
  - 'Alternative labeling: map neutral to stochastic positive/negative'
  rejection_criteria: If three-label F1 exceeds two-label by >5% or if neutral class
    F1 is comparable to positive/negative.
  failure_modes:
  - Neutral class is valid and market regime dependent; threshold too narrow
  - Linguistic analysis reveals neutral messages are genuinely distinct (e.g., high
    uncertainty)
  freshness_concerns: Volatility regime may shift; neutral window should be adaptive.
  unresolved_questions:
  - Is neutral class problem universal or FAANG-specific?
  - Does dynamically adjusting threshold per stock improve three-label performance?
  _book_id: text-mining-of-stocktwits-data-for-predicting-stock-prices-2021
  _audit_grade: B
- id: STKTWIT-H5
  title: FinALBERT hyperparameter sensitivity and labeling bias reflect insufficient
    pre-training rather than architectural flaw
  status: proposed
  derived_from:
  - STKTWIT-C1-008
  - STKTWIT-C1-010
  statement: FinALBERT exhibited labeling bias (collapsing to majority class) during
    fine-tuning and required careful hyperparameter tuning (learning_rate=1e-05, batch_size=32,
    weight_decay) to stabilize. These issues are symptoms of under-trained foundation
    model, not ALBERT architecture defect. With adequate pre-training (125k steps
    vs 10k), hyperparameter sensitivity would reduce.
  proposed_mechanism: Under-trained models have unstable loss landscape; small changes
    in learning rate cause optimization to diverge. Larger pre-training converges
    to broader loss minima, increasing fine-tuning robustness. Weight decay acts as
    implicit regularization to compensate for weak pre-training.
  applicable_markets_and_regimes: Applies to any transformer fine-tuning scenario
    with limited pre-training budget.
  assumptions:
  - 125k pre-training steps reaches convergence for ALBERT on domain corpus
  - Learning_rate coupling issue is not task-specific but pre-training related
  data_requirements:
  - Large financial domain corpus (50M+ sentences)
  - Adequate compute for 125k+ pre-training steps
  baseline_or_null_hypothesis: ALBERT architecture is unsuitable for financial text;
    BERT is structurally superior.
  validation_approach: Retrain FinALBERT with 125k steps; hold fine-tuning hyperparameters
    fixed; measure F1 and label-bias absence. Compare with fixed hyperparameter BERT
    as control.
  transaction_cost_and_fill_considerations: Pre-training cost; amortized across tasks.
  robustness_checks:
  - Hyperparameter grid search on both under-trained (10k) and properly-trained (125k)
    FinALBERT
  - 'Sensitivity analysis: plot F1 vs learning_rate, batch_size, weight_decay for
    both pre-training regimes'
  rejection_criteria: If properly-trained FinALBERT still requires hyperparameter
    fiddling or exhibits instability.
  failure_modes:
  - ALBERT architecture has fundamental limitations (e.g., parameter sharing reduces
    capacity)
  - Financial domain corpus insufficient regardless of steps
  freshness_concerns: Newer ALBERT variants or training methods may improve stability.
  unresolved_questions:
  - What pre-training step count minimizes hyperparameter sensitivity?
  - Is parameter-sharing in ALBERT the root cause, or just pre-training insufficiency?
  _book_id: text-mining-of-stocktwits-data-for-predicting-stock-prices-2021
  _audit_grade: B
- id: hyp-01-no-divergence-pullback
  title: No-divergence pullback continuation
  status: proposed
  derived_from:
  - AGSOTA-C3-002
  - AGSOTA-C3-004
  - AGSOTA-C3-006
  - AGSOTA-C6-003
  applicable_markets_and_regimes: Liquid equities, index futures, and major FX pairs
    in established trends.
  baseline_hypothesis: A qualified pullback with no momentum divergence and reduced
    activity reaches +1R before -1R more often than comparable pullbacks with divergence
    or sharp countertrend momentum.
  baseline_or_null_hypothesis: A qualified pullback with no momentum divergence and
    reduced activity reaches +1R before -1R more often than comparable pullbacks with
    divergence or sharp countertrend momentum.
  statement: A qualified pullback with no momentum divergence and reduced activity
    reaches +1R before -1R more often than comparable pullbacks with divergence or
    sharp countertrend momentum.
  validation_approach: Define trend with swing structure plus sloped intermediate
    average; use MACD or equivalent for divergence; trigger on pullback reversal or
    lower-timeframe breakout; compare conditioned vs unconditioned samples across
    at least 200 trades.
  rejection_criteria: Reject if +1R-before-stop improves by less than 5 percentage
    points or median MAE is not at least 0.10R smaller.
  transaction_cost_and_fill_considerations: Include spread, slippage, and gap-through-stop
    events.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-02-failure-test-reversal
  title: Failure test reversal after level probe
  status: proposed
  derived_from:
  - AGSOTA-C5-003
  - AGSOTA-C6-001
  - AGSOTA-C6-002
  applicable_markets_and_regimes: Extended trends or extended consolidations near
    clear levels.
  baseline_hypothesis: A failure test that pierces a level and closes back through
    it should produce faster follow-through than a generic countertrend reversal at
    the same location.
  baseline_or_null_hypothesis: A failure test that pierces a level and closes back
    through it should produce faster follow-through than a generic countertrend reversal
    at the same location.
  statement: A failure test that pierces a level and closes back through it should
    produce faster follow-through than a generic countertrend reversal at the same
    location.
  validation_approach: Enter on reversal close, stop beyond the excursion, and record
    whether price reaches +1R or +1.5R before stop and whether trade turns positive
    within three bars.
  rejection_criteria: Reject if fewer than 55 percent of trades show positive excursion
    within three bars or if +1R-before-stop is less than 5 percentage points better
    than baseline.
  transaction_cost_and_fill_considerations: Model spread crossing, overnight gaps,
    and smaller size in gap-prone markets.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-03-multiple-tests-weaken-levels
  title: Third-plus tests break more often than early tests
  status: proposed
  derived_from:
  - AGSOTA-C4-002
  - AGSOTA-C4-003
  - AGSOTA-C4-004
  applicable_markets_and_regimes: Trading ranges and pullbacks with repeated tests
    of the same zone.
  baseline_hypothesis: First- and second-test range-edge trades with rejection hold
    more often than third-or-later tests of the same zone.
  baseline_or_null_hypothesis: First- and second-test range-edge trades with rejection
    hold more often than third-or-later tests of the same zone.
  statement: First- and second-test range-edge trades with rejection hold more often
    than third-or-later tests of the same zone.
  validation_approach: Cluster nearby swing highs/lows into zones, count tests, classify
    rejection, and compare hold/break and +1R-before-stop by test number.
  rejection_criteria: Reject if third-plus tests are not at least 1.2x as likely to
    break within five bars or if early tests do not outperform later ones by at least
    5 percentage points on hold rate.
  transaction_cost_and_fill_considerations: Use realistic spread assumptions on spikes
    into the zone and zone-based, not tick-based, stop logic.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-04-prebreak-compression
  title: Pre-break compression improves breakout quality
  status: proposed
  derived_from:
  - AGSOTA-C5-001
  - AGSOTA-C5-002
  applicable_markets_and_regimes: Range breakouts with clear support or resistance.
  baseline_hypothesis: Breakouts preceded by higher lows into resistance, lower highs
    into support, or tight edge compression have lower immediate failure rates than
    unfiltered breakouts.
  baseline_or_null_hypothesis: Breakouts preceded by higher lows into resistance,
    lower highs into support, or tight edge compression have lower immediate failure
    rates than unfiltered breakouts.
  statement: Breakouts preceded by higher lows into resistance, lower highs into support,
    or tight edge compression have lower immediate failure rates than unfiltered breakouts.
  validation_approach: Detect triangle pressure or terminal micro-range near the range
    edge; compare immediate failure, breakout pullback stability, and +1R-before-stop
    versus all other breakouts.
  rejection_criteria: Reject if immediate failure rate is not at least 5 percentage
    points lower and +1R-before-stop is not at least 5 percentage points higher than
    baseline.
  transaction_cost_and_fill_considerations: Account for stop-entry slippage, queue
    position, and wider spreads at breakout levels.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-05-failed-breakout-pullback
  title: First pullback after breakout failure continues against the break
  status: proposed
  derived_from:
  - AGSOTA-C5-003
  - AGSOTA-C5-005
  applicable_markets_and_regimes: Confirmed failed upside and downside breakouts.
  baseline_hypothesis: After a breakout fails back through the level, the first pullback
    in the opposite direction continues more often than an ordinary pullback lacking
    trapped breakout traders.
  baseline_or_null_hypothesis: After a breakout fails back through the level, the
    first pullback in the opposite direction continues more often than an ordinary
    pullback lacking trapped breakout traders.
  statement: After a breakout fails back through the level, the first pullback in
    the opposite direction continues more often than an ordinary pullback lacking
    trapped breakout traders.
  validation_approach: Require reversal back through the level within two to three
    bars, then enter on the first pullback against the original breakout direction;
    compare against ordinary pullbacks.
  rejection_criteria: Reject if +1R-before-stop is 50 percent or lower or if continuation
    rate is less than 5 percentage points better than ordinary pullbacks.
  transaction_cost_and_fill_considerations: Include fast-market slippage and borrow/short-sale
    constraints where relevant.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-06-htf-exhaustion-filter
  title: Higher-timeframe exhaustion filter reduces lower-timeframe continuation failures
  status: proposed
  derived_from:
  - AGSOTA-C3-003
  - AGSOTA-C7-003
  - AGSOTA-C7-004
  applicable_markets_and_regimes: Lower-timeframe continuation signals that occur
    against higher-timeframe overextension or divergence.
  baseline_hypothesis: Skipping lower-timeframe continuation entries during higher-timeframe
    exhaustion reduces immediate failure and adverse excursion.
  baseline_or_null_hypothesis: Skipping lower-timeframe continuation entries during
    higher-timeframe exhaustion reduces immediate failure and adverse excursion.
  statement: Skipping lower-timeframe continuation entries during higher-timeframe
    exhaustion reduces immediate failure and adverse excursion.
  validation_approach: Define higher-timeframe exhaustion with channel overextension
    plus divergence or climax-like expansion; compare accepted versus filtered-out
    continuation trades.
  rejection_criteria: Reject if the filter does not reduce immediate failure by at
    least 5 percentage points or median MAE by at least 0.10R.
  transaction_cost_and_fill_considerations: Track opportunity cost separately from
    spread, slippage, and gap risk.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-07-band-fade-extreme-only
  title: Band fades work only from genuine extension
  status: proposed
  derived_from:
  - AGSOTA-C7-002
  - AGSOTA-C7-003
  applicable_markets_and_regimes: Mean-reversion attempts using calibrated channels
    or bands.
  baseline_hypothesis: A fade entered only after a close outside the band, and excluded
    during equilibrium chop or band slides, reverts to the channel midpoint more often
    than a fade on any touch.
  baseline_or_null_hypothesis: A fade entered only after a close outside the band,
    and excluded during equilibrium chop or band slides, reverts to the channel midpoint
    more often than a fade on any touch.
  statement: A fade entered only after a close outside the band, and excluded during
    equilibrium chop or band slides, reverts to the channel midpoint more often than
    a fade on any touch.
  validation_approach: Compare close-outside-band versus any-touch rules; tag band-slide
    conditions separately; measure midpoint-touch-before-stop, MAE, and time to reversion.
  rejection_criteria: Reject if midpoint-touch-before-stop is 55 percent or lower
    for the conditioned set or if it fails to beat the any-touch baseline by at least
    5 percentage points.
  transaction_cost_and_fill_considerations: Ensure mean-reversion distance is large
    enough relative to spread and slippage.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-08-stop-design
  title: Volatility or structure stops outperform fixed-percent stops
  status: proposed
  derived_from:
  - AGSOTA-C8-002
  - AGSOTA-C9-001
  applicable_markets_and_regimes: Cross-market portfolios with differing volatility
    profiles.
  baseline_hypothesis: ATR-based or structure-based initial stops, combined with fixed-fraction
    sizing, produce fewer noise stop-outs than generic fixed-percentage stops.
  baseline_or_null_hypothesis: ATR-based or structure-based initial stops, combined
    with fixed-fraction sizing, produce fewer noise stop-outs than generic fixed-percentage
    stops.
  statement: ATR-based or structure-based initial stops, combined with fixed-fraction
    sizing, produce fewer noise stop-outs than generic fixed-percentage stops.
  validation_approach: Run matched-entry tests with fixed-percent, ATR, and swing-structure
    stops while normalizing account risk per trade.
  rejection_criteria: Reject if ATR/structure stops do not reduce noise stop-outs
    by at least 5 percentage points or if realized loss per failed trade is worse
    by more than 0.10R.
  transaction_cost_and_fill_considerations: Measure spread, slippage, and gap-through-stop
    separately because farther stops imply smaller size.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-09-fixed-fraction-drawdown
  title: Lower fixed-fraction risk materially reduces drawdown severity
  status: proposed
  derived_from:
  - AGSOTA-C9-002
  - AGSOTA-C9-003
  applicable_markets_and_regimes: Any strategy with enough historical trades for Monte
    Carlo resampling.
  baseline_hypothesis: Risking 0.5 to 1.0 percent of equity per trade yields materially
    smaller severe-drawdown outcomes than risking 3 percent on the same trade sequence.
  baseline_or_null_hypothesis: Risking 0.5 to 1.0 percent of equity per trade yields
    materially smaller severe-drawdown outcomes than risking 3 percent on the same
    trade sequence.
  statement: Risking 0.5 to 1.0 percent of equity per trade yields materially smaller
    severe-drawdown outcomes than risking 3 percent on the same trade sequence.
  validation_approach: Bootstrap or shuffle realized net R-multiples and compare maximum
    drawdown, drawdown duration, and probability of 25 percent and 50 percent drawdowns.
  rejection_criteria: Reject if 95th-percentile maximum drawdown is not at least 30
    percent smaller at 0.5 to 1.0 percent risk.
  transaction_cost_and_fill_considerations: Use net R after commissions, spread, and
    slippage.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: hyp-10-setup-tagging
  title: Categorized records reveal material setup dispersion
  status: proposed
  derived_from:
  - AGSOTA-C11-002
  - AGSOTA-C12-002
  applicable_markets_and_regimes: Discretionary or hybrid programs that mix multiple
    setup families and regimes.
  baseline_hypothesis: Outcome distributions differ materially by setup tag, initial
    R, and regime tag, so pooled results hide which setups help or hurt.
  baseline_or_null_hypothesis: Outcome distributions differ materially by setup tag,
    initial R, and regime tag, so pooled results hide which setups help or hurt.
  statement: Outcome distributions differ materially by setup tag, initial R, and
    regime tag, so pooled results hide which setups help or hurt.
  validation_approach: Record every trade with setup family, regime/context, entry
    type, and initial R; compare category distributions using nonparametric tests
    and practical effect sizes.
  rejection_criteria: Reject if between-category differences are not detectable at
    p < 0.10 and no category differs from the pooled median by at least 0.15R per
    trade.
  transaction_cost_and_fill_considerations: Use broker-confirmed net results because
    high-turnover categories can look better gross than net.
  _book_id: the-art-science-of-technical-analysis-market-structure-price-2014
  _audit_grade: A
- id: NTFL-HYP-001
  title: Stopping trading after 20% drawdown improves long-term returns vs continuous
    trading
  status: proposed
  derived_from:
  - NTFL-C1-003
  statement: 'After a drawdown of 20% or greater, traders who stop trading for 5-10
    days to analyze

    losing trades will achieve better returns over subsequent 12 months than traders
    who

    continue trading without interruption.

    '
  proposed_mechanism: Reflection period allows identification of systematic errors;
    prevents revenge trading and emotional escalation
  applicable_markets_and_regimes: All markets; most applicable in trend-following
    and mean-reversion strategies
  assumptions:
  - Drawdown is accurately measured
  - Trader can objectively analyze losses
  - Trading opportunity set is same before and after pause
  data_requirements:
  - 50+ individual trades per strategy per test period
  - Trade-level entry/exit records with timestamps
  - Account equity over time
  baseline_or_null_hypothesis: Continuous trading produces equal or better returns
    than trading with reflective pauses
  validation_approach: 'Randomized controlled trial on simulated account:

    (1) Trade using strategy for 12 months

    (2) Randomly select 50% of 20%+ drawdowns as "treatment" (forced pause 7 days)

    (3) Compare returns post-treatment vs control drawdowns

    '
  transaction_cost_and_fill_considerations: Pause eliminates all trading costs during
    analysis window; opportunity cost depends on trend
  robustness_checks:
  - Test across market regimes (trending, ranging, volatile)
  - Test with different pause lengths (3, 7, 14 days)
  - Test with different drawdown thresholds (10%, 15%, 20%, 30%)
  rejection_criteria: If pause-group returns are not significantly higher (p<0.05)
    after adjusting for market beta, hypothesis is rejected
  failure_modes:
  - Pause occurs before market reversal; trader misses recovery
  - Drawdown continues beyond pause period
  - Systematic analysis reveals no fixable errors
  freshness_concerns: none
  unresolved_questions:
  - Optimal pause length?
  - Drawdown threshold for triggering pause?
  - Does pause effectiveness vary by strategy type?
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
- id: NTFL-HYP-002
  title: Fixed risk percentage per trade prevents drawdowns exceeding predicted level
  status: proposed
  derived_from:
  - NTFL-C9-002
  statement: 'If a trader maintains fixed risk percentage per trade (e.g., 2% of account
    equity),

    the maximum observed drawdown will not exceed the product of (# consecutive losses)
    × (risk percentage),

    with 95% confidence.

    '
  proposed_mechanism: 'Mathematical: max_loss = n_losses × risk_percentage.

    If losses are random, distribution of drawdowns follows binomial/geometric patterns.

    '
  applicable_markets_and_regimes: All markets, all strategies; holds under any win/loss
    distribution
  assumptions:
  - Risk limit is strictly enforced (no exceptions)
  - Stop losses are honored at designated levels
  - Position sizing scales with account equity changes
  data_requirements:
  - 100+ trades with documented entry, exit, risk per trade
  - Account equity measurements (daily minimum)
  baseline_or_null_hypothesis: Fixed risk percentage does not control drawdown; other
    factors dominate
  validation_approach: '(1) Backtest strategy with fixed-risk sizing across 20+ year
    history

    (2) Calculate realized max drawdown

    (3) Compare to predicted max given win rate and loss count

    (4) Run bootstrap resampling: permute trade sequence, measure max drawdown distribution

    '
  robustness_checks:
  - Test with different risk percentages (0.5%, 1%, 2%, 5%)
  - Test across different market regimes
  - Test with different win rates (40%, 50%, 60%)
  rejection_criteria: If 5+ instances where realized drawdown > 1.5× predicted drawdown,
    hypothesis rejected
  failure_modes:
  - Gap risk: loss size exceeds initial stop level
  - Highly correlated losses (regime shift) exceed prediction
  - Slippage on stops worse than assumed
  freshness_concerns: Gap risk has changed with market microstructure; modern circuit
    breakers reduce but do not eliminate
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
- id: NTFL-HYP-003
  title: Commercial trading systems fail within 2 years after purchase due to regime
    shift
  status: proposed
  derived_from:
  - NTFL-C1-004
  - NTFL-C7-001
  statement: 'A trading system purchased with historical backtest track record will
    underperform its

    backtest by >20% within 12-24 months of deployment, due to market regime change

    and/or curve-fitting.

    '
  proposed_mechanism: 'Systems are optimized on historical data; parameters capture
    both signal and noise.

    When regime shifts, noise disappears but signal patterns may also invalidate.

    '
  applicable_markets_and_regimes: All markets; applies to all curve-fit systems; least
    applicable to robust factor-based systems
  assumptions:
  - System is traded exactly as specified in documentation
  - Backtest quality is industry-standard (not deliberately misleading)
  - Market regime does change over 12-24 month period
  data_requirements:
  - Backtest record (equity curve, trades)
  - Live deployment record (same timeframe post-launch)
  baseline_or_null_hypothesis: Commercial systems continue to perform as backtested;
    regime stability
  validation_approach: '(1) Collect 30+ commercial systems with 5+ year live records

    (2) Extract backtest-reported returns

    (3) Compare to first 24 months live returns

    (4) Calculate performance degradation distribution

    '
  transaction_cost_and_fill_considerations: Backtest often uses unrealistic slippage/commission
    assumptions; live execution costs higher
  robustness_checks:
  - Stratify by system type (momentum, mean-reversion, machine learning)
  - Stratify by asset class (stocks, futures, forex)
  - Control for market regime using regime detection indicator
  rejection_criteria: If >50% of systems maintain 80%+ of backtest performance in
    live trading, hypothesis rejected
  failure_modes:
  - System designer adapts parameters during live period
  - Buy-and-hold market returns confound (system performance worse but market also
    down)
  - System seller stops marketing and data disappears
  freshness_concerns: High; machine learning and AI-based systems may have different
    curve-fitting behavior than traditional technical systems
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
- id: NTFL-HYP-004
  title: Limit orders reduce entry slippage by >50% vs market orders
  status: proposed
  derived_from:
  - NTFL-C10-001
  statement: 'Using limit orders for trade entries reduces average slippage vs market
    orders by 50% or more,

    with tradeoff of occasional missed entries.

    '
  proposed_mechanism: 'Limit orders execute only at or better than specified price;
    market orders accept best available.

    Slippage = (execution_price - market_price_at_order). Limit orders eliminate upside
    slippage.

    '
  applicable_markets_and_regimes: Stocks, ETFs; less applicable in low-liquidity instruments
    or fast-moving markets
  assumptions:
  - Limit price is set at reasonable distance from market price (not too far, not
    too tight)
  - Broker does not internalize or delay execution
  - Trader does not cancel unfilled orders too quickly
  data_requirements:
  - 100+ trade entries with (bid-ask spread, limit price, execution price, fill status)
  - If unfilled, market price at end of trading session
  baseline_or_null_hypothesis: Limit and market orders produce equivalent slippage
  validation_approach: "(1) Run same entry signal on same dates with two algorithms:\n\
    \    A: Market orders\n    B: Limit orders at mid-quote - 0.5 × spread\n(2) Measure\
    \ average fill price vs market price at order time\n(3) Measure fill rates (%\
    \ of orders executed)\n(4) Compare net slippage accounting for missed fills\n"
  robustness_checks:
  - Test with different limit price offsets (0.25×, 0.5×, 1.0× spread)
  - Test across market conditions (liquid, illiquid, volatile)
  - Test with different order sizes
  rejection_criteria: If limit order slippage is not >40% less than market order slippage,
    hypothesis rejected
  failure_modes:
  - Limit too tight: many missed fills, subsequent re-entry at worse price
  - Limit too loose: no slippage improvement
  - Fast market: limit orders obsolete before fill
  freshness_concerns: Very high; modern market microstructure (high-speed trading,
    maker-taker fees) may eliminate edge
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
- id: NTFL-HYP-005
  title: Traders replicating personal irresponsibility experience trading losses
  status: proposed
  derived_from:
  - NTFL-C1-002
  statement: 'Traders who exhibit low personal discipline in life (missed deadlines,
    poor financial record-keeping,

    traffic violations, tax delinquency) will show higher trading losses and shorter
    trading survival

    than traders with high personal discipline, independent of trading system quality.

    '
  proposed_mechanism: Impulsive behavior and poor planning transfer to trading decisions;
    lack of accountability prevents learning
  applicable_markets_and_regimes: All markets; applies to all trader populations
  assumptions:
  - Personal discipline is accurately measured (e.g., credit score, employment history)
  - Trading performance is accurately measured
  - Causality is not reverse (trading losses don't cause personal irresponsibility)
  data_requirements:
  - 100+ traders with (personal discipline proxy, trading account P&L, trading history
    length)
  baseline_or_null_hypothesis: Personal discipline uncorrelated with trading outcomes
  validation_approach: '(1) Develop personal discipline score from credit history,
    employment records, tax compliance

    (2) Correlate vs trading P&L over 2-year period

    (3) Survival analysis: time to 50% account loss by discipline quartile

    '
  rejection_criteria: If correlation between discipline and returns is <0.3 or not
    significant (p>0.05), hypothesis rejected
  failure_modes:
  - Personal discipline data not available or unreliable
  - Survivorship bias: high-discipline traders may self-select out of trading earlier
  - Reverse causality: trading losses drive personal stress and irresponsibility
  freshness_concerns: Behavioral measurement and access to historical personal data
    limited
  unresolved_questions:
  - Can trading-only discipline (plan adherence, journaling) substitute for life discipline?
  - How is causality established?
  _book_id: the-new-trading-for-a-living-study-guide-2014
  _audit_grade: A
- id: OPTCOURSE-HYP-001
  title: Vertical spreads outperform naked positions
  status: proposed
  derived_from:
  - OPTCOURSE-ch5-008
  - OPTCOURSE-ch5-009
  statement: Vertical spreads produce risk-adjusted returns superior to naked calls/puts
    due to premium reduction and defined risk capital.
  proposed_mechanism: Defined risk limits drawdowns; reduced premium outlay improves
    win rate
  applicable_markets_and_regimes:
  - ranging
  - trending
  assumptions: []
  data_requirements:
  - price
  - volume
  - implied_volatility
  baseline_or_null_hypothesis: Returns match random walk expectations
  validation_approach: backtest_with_regime_detection
  transaction_cost_and_fill_considerations: requires_broker_spread_data
  robustness_checks:
  - out_of_sample
  - regime_change
  - volatility_spike
  rejection_criteria: below_market_returns_after_costs
  failure_modes: []
  freshness_concerns: broker_fees_and_market_structure_changes
  unresolved_questions: []
  _book_id: the-options-course-high-profit-and-low-stress-trading-method-2005
  _audit_grade: B
- id: OPTCOURSE-HYP-002
  title: Volatility mean reversion exploitable
  status: proposed
  derived_from:
  - OPTCOURSE-ch7-015
  statement: Implied volatility spikes create short-selling opportunities; IV contractions
    create buying opportunities.
  proposed_mechanism: Mean-reverting IV attracts contrarian traders
  applicable_markets_and_regimes:
  - high_volatility
  - low_volatility
  assumptions: []
  data_requirements:
  - implied_volatility_history
  - volatility_percentile
  baseline_or_null_hypothesis: IV random walk; no reversion
  validation_approach: statistical_mean_reversion_test
  transaction_cost_and_fill_considerations: requires_broker_spread_data
  robustness_checks:
  - regime_filtering
  - vol_percentile_thresholds
  rejection_criteria: IV shows random walk characteristics
  failure_modes:
  - regime_change_persists_high_vol
  freshness_concerns: null
  unresolved_questions: []
  _book_id: the-options-course-high-profit-and-low-stress-trading-method-2005
  _audit_grade: B
- id: OPTCOURSE-HYP-003
  title: Theta-positive short strategies outperform
  status: proposed
  derived_from:
  - OPTCOURSE-ch7-014
  statement: Short straddles and spreads produce superior risk-adjusted returns in
    range-bound markets due to theta collection.
  proposed_mechanism: Theta decay provides consistent tailwind; range detection enables
    tactical deployment
  applicable_markets_and_regimes:
  - ranging
  - low_volatility
  assumptions:
  - market_stays_in_range
  - IV_does_not_spike
  data_requirements:
  - price
  - implied_volatility
  - range_metrics
  baseline_or_null_hypothesis: Short strategies return match buy-and-hold
  validation_approach: backtest_with_gamma_and_theta_attribution
  transaction_cost_and_fill_considerations: requires_execution_cost_modeling
  robustness_checks:
  - extreme_move_stress
  - earnings_blackout
