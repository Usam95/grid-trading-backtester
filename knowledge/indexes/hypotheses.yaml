  - Bollinger Band reversal happens within 5-20 days
  data_requirements:
  - Daily OHLCV, volume data for regime detection
  - 20-day rolling ADF test per security
  - MFI calculation from volume data
  baseline_or_null_hypothesis: Mean-reversion returns (mean revert – buy dips – sell
    rallies) produce zero alpha without MFI filter.
  validation_approach: 'In-sample: identify regime parameters; out-of-sample: apply
    only to securities where rolling ADF detects mean reversion; measure alpha vs
    buy-and-hold.'
  transaction_cost_and_fill_considerations: High turnover (mean reversion generates
    frequent signals); commission impact material; slippage critical on oversold entries
    (lower liquidity).
  robustness_checks:
  - Vary Bollinger Band width (1, 1.5, 2 sigma)
  - Vary MFI threshold (70/30, 80/20, 90/10)
  - 'Test on regime-subset: include only securities with ADF p-value < 0.1'
  rejection_criteria: Mean-reversion signals produce alpha < 2% annualized; slippage
    on entry > 15 bps; hit rate < 55%.
  failure_modes:
  - Regime identification lags actual regime change; system trades against new trend
  - Volume dries up on mean-reversion triggers (MFI divergence coincides with liquidity
    drop)
  - Correlation spike during reversions reduces diversification
  freshness_concerns: MFI formula and effective thresholds may shift with trading
    technology and behavioral changes
  unresolved_questions:
  - What is the optimal lookback for regime detection?
  - How sensitive is the strategy to transaction costs at different order sizes?
  _book_id: algorithmic-trading-with-interactive-brokers-python
  _audit_grade: A
- id: IBKRPY-H-003
  title: SimpleAlgo Sentiment-Based Candidate Selection Reduces False Signals
  status: proposed
  derived_from:
  - IBKRPY-C14-011
  - IBKRPY-C14-022
  statement: Filtering candidates by investor sentiment (before applying breakout
    signal) reduces false breakout signals by >20% without material reduction in true
    positives.
  proposed_mechanism: Sentiment reflects market regime; optimistic sentiment coincides
    with continuation patterns; pessimistic sentiment often precedes reversals.
  applicable_markets_and_regimes: US equities during trending (bullish) sentiment
    periods; may not apply during crash regimes.
  assumptions:
  - Sentiment is measurable and predictive of breakout persistence
  - Sentiment data source is reliable and available
  data_requirements:
  - Investor sentiment index (Investors Intelligence, VIX term structure, put/call
    ratio, or social sentiment)
  - Alignment of sentiment timing with order execution
  baseline_or_null_hypothesis: 'Breakout without sentiment filter: X% hit rate; breakout
    with sentiment filter: >X% hit rate with >70% of original signal volume.'
  validation_approach: 'Backtest breakout strategy on two branches: (1) no sentiment
    filter, (2) with sentiment filter; measure hit rate, average trade duration, and
    Sharpe.'
  transaction_cost_and_fill_considerations: Sentiment filtering reduces order volume;
    lower volume may improve fill quality on breakout entries.
  robustness_checks:
  - Test with multiple sentiment data sources
  - Vary sentiment threshold; measure vs hit rate
  rejection_criteria: Hit rate improvement < 5% or signal volume reduction > 40%.
  failure_modes:
  - Sentiment data is lagging (published with >1-day delay); orders placed on stale
    sentiment
  - Sentiment regime shift; historical correlation breaks down
  freshness_concerns: Social media sentiment (Twitter, Reddit) available post-2015;
    historical data sparse; retail trader sentiment may have shifted post-2020
  unresolved_questions:
  - 'Which sentiment measure is most predictive: VIX, put/call, institutional flows,
    or social media?'
  - 'What is the optimal rebalance frequency for sentiment filters: daily, hourly?'
  _book_id: algorithmic-trading-with-interactive-brokers-python
  _audit_grade: A
- id: IBKRPY-H-004
  title: Order Transmit Field as Execution Safety Gate Prevents Systemic Failures
  status: proposed
  derived_from:
  - IBKRPY-C10-017
  statement: Requiring transmit=False during order construction and validation, followed
    by explicit transmit=True only after approval, prevents unintended large orders
    and systemic failures.
  proposed_mechanism: Safety gate delays execution; allows multi-step validation (price
    check, quantity check, account balance check) before irreversible market submission.
  applicable_markets_and_regimes: All live trading strategies; essential for high-volume
    systems.
  assumptions:
  - Order construction and validation are separable and can be staged
  - Validation latency (<1ms) is acceptable relative to market opportunities
  data_requirements:
  - Order validation rules (max size, max price delta, account balance)
  baseline_or_null_hypothesis: Systems without staged validation occasionally execute
    unintended large orders; systems with transmit staging have zero unintended orders.
  validation_approach: 'Code review + integration testing: inject malformed/extreme
    orders and verify they are rejected before transmit=True.'
  transaction_cost_and_fill_considerations: Negligible (validation is offline); ensures
    orders execute at intended price/size.
  robustness_checks:
  - 'Fault injection tests: corrupt order fields, verify rejection'
  - 'Load tests: verify validation latency remains <1ms at 1000 orders/sec'
  rejection_criteria: Any unintended order reaches market; validation latency > 10ms.
  failure_modes:
  - Validation code has bugs; malformed orders pass validation
  - Validation is bypassed due to developer error or timeout
  - Order fields mutated after validation but before transmit
  freshness_concerns: null
  unresolved_questions:
  - What are the most effective validation rules to prevent accidental errors?
  _book_id: algorithmic-trading-with-interactive-brokers-python
  _audit_grade: A
- id: IBKRPY-H-005
  title: Connection Error Recovery in Multithreaded TWS API Requires Explicit Handling
  status: proposed
  derived_from:
  - IBKRPY-C6-018
  statement: TWS API client applications must implement explicit connection recovery
    (reconnection, state sync, callback thread cleanup) to achieve 99.9% uptime in
    live trading.
  proposed_mechanism: Connection loss detected via callback timeout or error callback;
    recovery initiates reconnection and resynchronizes pending orders and fills.
  applicable_markets_and_regimes: All live trading; essential for continuous operation.
  assumptions:
  - IB connection failures are recoverable; order state is recoverable from IB
  - Local state can be reconciled with broker state after reconnection
  data_requirements:
  - Local order log (orderId, contract, order fields, timestamps)
  - Connection heartbeat mechanism
  baseline_or_null_hypothesis: 'Without explicit recovery: mean time to failure (MTTF)
    ~4 hours; with recovery: MTTF > 30 days.'
  validation_approach: 'Chaos testing: inject connection failures (network drop, TWS
    restart) every 5min for 24 hours; measure recovery time and state consistency.'
  transaction_cost_and_fill_considerations: Recovery delay may cause missed order
    cancellations or duplicate fills if state reconciliation fails.
  robustness_checks:
  - 'Test recovery under various scenarios: network drop, TWS restart, API version
    change'
  - Measure reconciliation time and accuracy
  rejection_criteria: MTTF < 24 hours or state inconsistency detected.
  failure_modes:
  - Callback thread hangs during recovery; connection remains dead
  - Order state diverges between local log and broker; duplicate or missed fills
  - Reconnection succeeds but fills from disconnection period lost
  freshness_concerns: IB API versioning; recovery protocol may change
  unresolved_questions:
  - What is the maximum acceptable recovery time (RTO)?
  - How should orphaned orders (submitted but not confirmed before disconnect) be
    handled?
  _book_id: algorithmic-trading-with-interactive-brokers-python
  _audit_grade: A
- id: IBKRPY-H-006
  title: Commission and Slippage Materially Reduce Strategy Alpha
  status: proposed
  derived_from:
  - IBKRPY-C2-025
  statement: Realistic transaction costs (IB commissions + market slippage) reduce
    strategy net alpha by 30-60% compared to backtests ignoring costs.
  proposed_mechanism: Each trade incurs bidask spread, commissions, and market impact;
    high-frequency strategies more sensitive to costs.
  applicable_markets_and_regimes: All strategies; higher impact on mean-reversion
    and signal strategies with frequent trading.
  assumptions:
  - Commission structure has not changed materially since book publication
  - Slippage scales with order size and market conditions
  data_requirements:
  - Current IB commission schedule (as of 2024)
  - Historical bid-ask spreads for test universe
  baseline_or_null_hypothesis: Zero-cost strategy produces alpha=A%; with realistic
    costs, alpha=A% * 0.4-0.7.
  validation_approach: Backtest with and without costs; measure alpha difference.
  transaction_cost_and_fill_considerations: This is the core hypothesis; costs are
    material and must be validated empirically.
  robustness_checks:
  - Vary commission by 25-50% (account for negotiated rates)
  - Vary slippage by market condition (trending vs choppy)
  rejection_criteria: Cost impact < 10% of alpha (indicates strategy robust to costs).
  failure_modes:
  - Live slippage exceeds backtest assumption; net returns negative
  - Commission structure changes unfavorably
  freshness_concerns: Commission and slippage are time-series dependent; book cites
    2019 rates
  unresolved_questions:
  - What are the effective slippage rates by order size and market condition?
  - Can execution algorithms (TWAP, VWAP) reduce slippage below backtest assumptions?
  _book_id: algorithmic-trading-with-interactive-brokers-python
  _audit_grade: A
- id: BGTTRADING-HYP-001
  title: Scalping is profitable with transaction costs below 5 bps
  status: proposed
  derived_from:
  - BGTTRADING-FX-004
  statement: Forex scalping strategy (5-10 pip targets, tight stops) achieves positive
    returns net of transaction costs when spreads < 2 pips and slippage < 1 pip
  proposed_mechanism: High-win-rate strategy (>60%) with 5-10 pip targets and stops;
    large volume compensates for small per-trade gains
  applicable_markets_and_regimes: Forex majors (EUR/USD, GBP/USD) during high-liquidity
    hours (overlapping London-NY session)
  assumptions:
  - Spreads < 2 pips
  - Slippage < 1 pip
  - Broker allows scalping
  - Win rate >55%
  data_requirements:
  - Bid-ask tick data
  - Broker execution statistics
  - Slippage measurements
  baseline_or_null_hypothesis: Scalping returns = random walk; transaction costs exceed
    alpha
  validation_approach: Backtest with realistic spreads/slippage; forward test with
    demo account; measure win rate and average win/loss ratio
  transaction_cost_and_fill_considerations: Spreads 2-3 pips, slippage 1-2 pips typical;
    profitability threshold tight
  robustness_checks: Test across spreads 1.5-3 pips; vary slippage; test across pairs
    and time periods
  rejection_criteria: Backtest Sharpe < 0.5; real forward test Sharpe < 0.3; win rate
    < 55%
  failure_modes:
  - Spreads widen during high volatility
  - Slippage increases
  - Broker restricts scalping
  freshness_concerns: Broker environment and spreads change; current data may not
    reflect live execution
  unresolved_questions:
  - What win rate is sustainable live?
  - How do market regimes affect scalping?
