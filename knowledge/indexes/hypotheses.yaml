- id: MLMODEL-H1
  title: HFT infrastructure investment improves profitability through reduced latency
    and better execution
  status: proposed
  derived_from:
  - MLMODEL-C4-001
  statement: Investing in colocation, direct market access, and low-latency execution
    infrastructure enables profitable arbitrage and reactive strategies
  proposed_mechanism: Latency advantage enables faster reaction to price signals;
    reduces adverse selection; attracts order flow
  applicable_markets_and_regimes: Equities futures, crypto spot/futures in high-volume
    markets with tight spreads
  assumptions:
  - Technology cost is recovered through improved fill quality and reduced slippage
  - Market structure remains conducive to speed-based arbitrage
  - Regulatory environment permits latency-driven strategies
  data_requirements:
  - Execution latency benchmarks
  - Fill quality metrics (slippage, latency-adjusted returns)
  - Market microstructure data
  baseline_or_null_hypothesis: Faster infrastructure provides no measurable edge;
    latency effects offset by higher costs
  validation_approach: Compare backtest performance with latency assumptions vs. without;
    validate with paper trading period; measure actual latency and fill improvements
  transaction_cost_and_fill_considerations: Must account for colocation fees, hardware
    depreciation, and diminishing returns as latency decreases
  robustness_checks:
  - Sensitivity to latency thresholds
  - Performance across market regimes (normal, stressed, regime-shift)
  - Latency arms race scenario (cost escalation without alpha gains)
  rejection_criteria:
  - Live trading results show no improvement vs. baseline
  - Latency-adjusted backtest performance is not significantly better
  - Regulatory changes eliminate latency-based advantages
  failure_modes:
  - Technology becomes commoditized, eliminating alpha
  - Black swan events bypass risk controls
  - Regulatory restrictions target HFT
  freshness_concerns: Market microstructure and technology landscape evolve; competitive
    advantage likely decreases over time
  unresolved_questions:
  - How does alpha decay as more participants adopt similar infrastructure?
  - What is the optimal latency threshold for profitability?
  - How do regulatory restrictions impact HFT viability long-term?
  _book_id: igi-epub-test-book-85x11
  _audit_grade: A
- id: MLMODEL-H2
  title: Machine learning models can identify profitable price patterns in high-frequency
    futures markets
  status: proposed
  derived_from:
  - MLMODEL-C14-001
  statement: LSTM and XGBoost classifiers trained on high-frequency futures data can
    predict directional moves with >55% accuracy, generating alpha after transaction
    costs
  proposed_mechanism: ML models learn non-linear patterns in price/volume/microstructure
    data; patterns reflect market microstructure and sentiment shifts
  applicable_markets_and_regimes: Futures markets with high liquidity and rapid price
    discovery (ES, NQ, crypto perpetuals)
  assumptions:
  - Training data captures representative market regimes
  - Model does not overfit to historical period
  - Patterns generalize to out-of-sample data
  data_requirements:
  - High-frequency OHLCV data
  - Order book snapshots or microstructure proxies
  - Features: momentum, volatility, bid-ask spread, order flow imbalance
  baseline_or_null_hypothesis: ML model accuracy equals random guessing (50%); no
    alpha after costs
  validation_approach: Walk-forward testing with monthly retraining; measure out-of-sample
    accuracy and Sharpe ratio; compare with random and buy-and-hold baselines
  transaction_cost_and_fill_considerations: Must include futures commissions, bid-ask
    spread costs, and slippage from order execution
  robustness_checks:
  - Sensitivity to feature importance and engineering choices
  - Performance across bull/bear/ranging markets
  - Stress test with crisis data (March 2020, etc.)
  - Parameter sensitivity
  rejection_criteria:
  - Out-of-sample accuracy <52%
  - Sharpe ratio <1.0 after costs
  - Model performance degrades significantly in new market regimes
  failure_modes:
  - Regime shifts invalidate learned patterns
  - Crowding of similar strategies reduces alpha
  - Data quality issues or look-ahead bias inflate backtest results
  freshness_concerns: Model performance likely decays as market participants adopt
    similar strategies and market microstructure evolves
  unresolved_questions:
  - How quickly does model performance decay out-of-sample?
  - Are patterns driven by microstructure or fundamental factors?
  - Can model adapt to regime shifts via online learning?
  _book_id: igi-epub-test-book-85x11
  _audit_grade: A
- id: MLMODEL-H3
  title: Sentiment analysis from financial news improves short-term stock price predictions
  status: proposed
  derived_from:
  - MLMODEL-C16-001
  statement: NLP sentiment scores from news articles and social media correlate with
    1-5 day ahead stock returns; combining sentiment with price momentum improves
    signal quality
  proposed_mechanism: Market participants react to news; sentiment captures early
    reaction; price adjusts gradually as information diffuses
  applicable_markets_and_regimes: Large-cap equities with significant media coverage
    and retail interest; works best during volatile regimes
  assumptions:
  - Sentiment data is timely and representative
  - Market has not fully incorporated news sentiment
  - Sentiment effect is not crowded out by other traders
  data_requirements:
  - Financial news feed with timestamps
  - Social media sentiment (Twitter, Reddit, StockTwits)
  - Cross-reference with stock pricing
  baseline_or_null_hypothesis: Sentiment has no predictive power for returns; buy-and-hold
    outperforms sentiment-based trading
  validation_approach: Backtest sentiment-based signals with realistic latency; measure
    information decay (1hr, 1day, 1week); compare with random sentiment labels
  transaction_cost_and_fill_considerations: Sentiment signals typically require frequent
    rebalancing; must account for trading costs, slippage, and realistic execution
    timing
  robustness_checks:
  - Performance across different stock sectors
  - Sensitivity to sentiment provider and model
  - Impact of news sentiment vs. social media sentiment
  - Effectiveness during normal vs. crisis regimes
  rejection_criteria:
  - Out-of-sample Sharpe ratio <0.5
  - Sentiment alpha disappears after transaction costs
  - Signal effectiveness decreases significantly over time
  failure_modes:
  - Sentiment crowding reduces alpha
  - Sarcasm and context misclassification by NLP model
  - Fake news or market manipulation via coordinated sentiment
  - Regime shifts disconnect sentiment from returns
  freshness_concerns: Sentiment alpha highly likely to decay as more traders adopt
    similar signals; sentiment crowding is an established market phenomenon
  unresolved_questions:
  - How much of sentiment alpha is due to crowding vs. genuine predictive power?
  - Do different market sectors respond differently to sentiment?
  - Can machine learning detect and adapt to sentiment crowding?
  _book_id: igi-epub-test-book-85x11
  _audit_grade: A
- id: MLMODEL-H4
  title: Volatility transmission models predict multi-market spillover effects and
    improve risk management
  status: proposed
  derived_from:
  - MLMODEL-C15-001
  statement: Dynamic conditional correlation (DCC) and GARCH models capture volatility
    spillovers between markets; improving risk forecasts and enabling hedging strategies
  proposed_mechanism: Volatility shocks propagate between markets with measurable
    delays; models predict spillover magnitude and timing
  applicable_markets_and_regimes: Portfolio hedging across equities/futures/crypto;
    effective during crisis regimes with high spillovers
  assumptions:
  - Volatility spillover patterns are stable
  - Market linkages persist over time
  - Models capture the key transmission channels
  data_requirements:
  - Daily/intraday volatility estimates for multiple markets
  - Returns series for correlation estimation
  - Macro indicators for regime identification
  baseline_or_null_hypothesis: Spillover models provide no improvement over constant
    correlation; simple risk models suffice
  validation_approach: Compare volatility forecasting accuracy (RMSE, MAE) vs. baseline
    models; validate on crisis periods (March 2020, SVB collapse)
  transaction_cost_and_fill_considerations: Hedging costs via futures or options;
    spillover-based rebalancing must not exceed hedge efficiency gains
  robustness_checks:
  - Sensitivity to lag structure in spillover models
  - Performance during regime shifts
  - Cross-validation on different time periods
  rejection_criteria:
  - Out-of-sample volatility forecast RMSE not significantly better than baseline
  - Hedging strategy does not reduce portfolio loss during crises
  failure_modes:
  - Non-linear spillovers not captured by linear models
  - Structural breaks in market linkages
  - Black swan events with unprecedented correlations
  freshness_concerns: Market structure changes (new exchanges, trading venues, regulations)
    may alter spillover patterns
  unresolved_questions:
  - How persistent are spillover patterns across years?
  - Can machine learning detect and predict structural breaks?
  - Do spillovers differ for crypto vs. traditional markets?
  _book_id: igi-epub-test-book-85x11
  _audit_grade: A
- id: MLMODEL-H5
  title: Fairness-aware ML models for credit decisions improve risk profiles and reduce
    regulatory exposure
  status: proposed
  derived_from:
  - MLMODEL-C1-001
  statement: Constraining credit ML models for fairness (via reweighting, constraint-based
    optimization, or preprocessing) reduces default disparities without significantly
    harming predictive accuracy
  proposed_mechanism: Fair ML prevents models from learning demographic-correlated
    proxies for credit risk; reduces disparate impact and default rate gaps
  applicable_markets_and_regimes: Financial institutions subject to fair lending regulations;
    applicable to portfolio credit risk assessment
  assumptions:
  - Fairness metrics are well-defined and legally defensible
  - Fair models do not introduce hidden biases
  - Regulatory enforcement is consistent
  data_requirements:
  - Labeled credit default data with demographic variables
  - Feature engineering for model-agnostic fairness metrics
  - Historical outcomes to measure disparities
  baseline_or_null_hypothesis: Fairness constraints reduce accuracy without improving
    real-world outcomes; trade-off is not worth regulatory cost
  validation_approach: Compare accuracy and fairness metrics (demographic parity,
    equalized odds) of fair vs. unconstrained models; measure default rates by demographic
    group
  transaction_cost_and_fill_considerations: Regulatory compliance cost, monitoring
    overhead, potential decrease in profit from rejected applicants
  robustness_checks:
  - Sensitivity to fairness constraint strength
  - Performance across different demographic groups
  - Generalization to new data
  rejection_criteria:
  - Accuracy loss exceeds regulatory tolerance
  - Fairness constraints can be circumvented via proxy variables
  failure_modes:
  - Proxy discrimination circumvents fairness measures
  - Unfair models cause regulatory action and reputational harm
  - Fairness-accuracy trade-off is too steep
  freshness_concerns: Regulatory definitions of fairness and disparate impact evolve;
    compliance requirements increase over time
  unresolved_questions:
  - How do different fairness definitions (demographic parity, equalized odds, individual
    fairness) affect model performance?
  - Can fairness be maintained while using high-dimensional features?
  - How can hidden biases in synthetic features be detected?
  _book_id: igi-epub-test-book-85x11
  _audit_grade: A
- id: LEARNALGO-H1
  title: Supply-demand equilibrium drives short-term price movements in liquid markets
  status: proposed
  derived_from:
  - LEARNALGO-C1-002
  statement: Price discovery efficiency (driven by market participant information
    access and speed) enables mean-reversion strategies to exploit temporary deviations
    from equilibrium
  proposed_mechanism: When supply/demand imbalance causes price deviation, faster
    participants identify and trade the deviation, reverting price toward equilibrium.
    Modern markets execute this mechanism faster due to technology.
  validation_approach: Backtest mean-reversion strategy on liquid equities; measure
    outperformance vs. buy-and-hold. Verify correlation between strategy returns and
    volatility (regime proxy).
  applicable_markets_and_regimes: Equities, liquid futures; most effective in low-volatility
    regimes
  assumptions:
  - Equilibrium price model (bid-ask midpoint) is valid
  - Execution latency < 10ms for signal capture
  data_requirements: Real-time order book snapshots, trade data, price tick data
  robustness_checks:
  - Out-of-sample walk-forward test over 2+ years
  - Stress test during flash crashes (high volatility spikes)
  failure_modes:
  - 'Regime shift: mean-reversion fails in trending markets'
  - 'Liquidity evaporation: large orders face market impact'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H2
  title: Momentum strategies capture trending price behavior via volatility-scaled
    position sizing
  status: proposed
  derived_from:
  - LEARNALGO-C4-001
  statement: Momentum strategy risk-adjusted returns improve when position size scales
    inversely with realized volatility, stabilizing portfolio volatility across market
    conditions
  proposed_mechanism: Larger positions in low-volatility regimes, smaller positions
    in high-volatility regimes, maintains constant portfolio volatility target. Reduces
    drawdowns during volatility spikes.
  validation_approach: Implement strategy with and without volatility scaling. Compare
    Sharpe ratios, max drawdowns.
  applicable_markets_and_regimes: Equities, crypto spot; trending markets
  assumptions:
  - Historical volatility predicts near-term realized volatility
  - Position scaling does not trigger liquidity constraints
  data_requirements: Daily returns, intraday volatility estimates, position sizes
  robustness_checks:
  - Compare different volatility estimators (realized, GARCH, Parkinson)
  failure_modes:
  - 'Volatility clustering: static scaling insufficient during regime transitions'
  - 'Survivor bias: backtesting on surviving stocks excludes delistings'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H3
  title: Statistical arbitrage via cointegration identifies tradeable mean-reverting
    spreads
  status: proposed
  derived_from:
  - LEARNALGO-C5-001
  - LEARNALGO-C5-002
  statement: Cointegration tests identify pairs with stable price spreads; trading
    when spreads deviate from historical mean captures predictable price corrections
  proposed_mechanism: Cointegrated pairs share long-term equilibrium relation; temporary
    deviations revert predictably. TWAP/VWAP execution captures this reversion.
  validation_approach: Identify cointegrated pairs (ADF test on residuals). Backtest
    mean-reversion entry on spread deviation.
  applicable_markets_and_regimes: Equities pairs (same sector), crypto spot pairs
  assumptions:
  - Cointegration relation remains stable over backtest period
  - Bid-ask spreads do not exceed expected mean-reversion profit
  data_requirements: Minute-bar price data, order book data, exchange execution reports
  robustness_checks:
  - Re-estimate cointegration quarterly; drop stale pairs
  - Test transaction costs at realistic scale
  failure_modes:
  - 'Structural break: cointegration relation deteriorates'
  - 'Overfitting: selecting pairs with spurious past correlations'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H4
  title: Technical indicators (SMA, RSI, MACD) generate valid signals only in mean-reverting
    regimes
  status: proposed
  derived_from:
  - LEARNALGO-C2-001
  - LEARNALGO-C2-002
  statement: Overbought/oversold signals produce false positives during trending markets;
    signal reliability improves with regime detection filters
  proposed_mechanism: RSI overbought threshold (70) assumes mean-reversion; in trending
    markets, prices remain overbought. Volatility-based regime filter identifies suitable
    signal regimes.
  validation_approach: Backtest RSI strategy with and without regime filter. Measure
    precision on 50+ equities across market regimes.
  applicable_markets_and_regimes: Equities, cryptocurrencies; regime-dependent
  assumptions:
  - Indicator parameters (RSI period=14, SMA period=20) generalize across instruments
  - Volatility regime proxy (Bollinger Band width) is predictive
  data_requirements: Daily OHLCV data, volatility estimates
  robustness_checks:
  - Cross-validate on out-of-sample periods
  - Test sensitivity to indicator parameter choices
  failure_modes:
  - 'Parameter overfitting: optimal RSI period varies across regimes'
  - 'Regime identification lag: regime filter signals too late'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H5
  title: Machine learning models trained on technical indicators overfit without rigorous
    out-of-sample validation
  status: proposed
  derived_from:
  - LEARNALGO-C3-002
  statement: Supervised learning models require walk-forward cross-validation and
    strict temporal separation to avoid data leakage and forward-bias
  proposed_mechanism: Data leakage creates artificially high backtest returns. Walk-forward
    validation ensures model trains only on past data, validates on unseen future
    periods.
  validation_approach: 'Implement walk-forward test: partition data into 10 windows;
    train on window N, test on window N+1. Compare walk-forward Sharpe vs. simple
    backtest (should be 30-50% lower).'
  applicable_markets_and_regimes: All equities and crypto; all regimes
  assumptions:
  - Model performance stationary across windows
  - Feature engineering does not leak future information
  data_requirements: Historical price, volume, technical indicators; 3+ years minimum
  robustness_checks:
  - Inspect train/test date separation programmatically
  - Ablate features; verify each contributes predictive power
  failure_modes:
  - 'Overfitting collapse: backtest shows 2.0+ Sharpe, live trading generates losses'
  - 'Regime non-stationarity: model trained on bull market fails in bear market'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H6
  title: Position sizing inversely scaled to drawdown risk reduces portfolio volatility
    and improves Sharpe ratio
  status: proposed
  derived_from:
  - LEARNALGO-C6-001
  statement: Kelly Criterion or fractional Kelly sizing adapts position size based
    on strategy win rate and payoff distribution
  proposed_mechanism: Larger positions when drawdown risk is low, smaller positions
    when drawdown risk is high. Maintains constant portfolio volatility target.
  validation_approach: 'Backtest: fixed size vs. volatility-scaled vs. Kelly-sized.
    Compare Sharpe ratios, max drawdowns. Paper trade for 1+ months to validate live
    execution.'
  applicable_markets_and_regimes: Equities, futures, crypto; all regimes
  assumptions:
  - Historical volatility predicts near-term realized volatility
  - Position scaling does not trigger liquidity constraints
  data_requirements: Strategy returns, daily equity curve, historical max drawdown
    estimates
  robustness_checks:
  - 'Stress test: market gap events (opening limit down)'
  - Test with realistic portfolio constraints (max leverage, margin buffer)
  failure_modes:
  - 'Estimation error: estimated drawdown underestimates true risk'
  - 'Regime change: historical volatility irrelevant in new regime'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H7
  title: Real-time risk controls (position limits, Greeks hedging) prevent catastrophic
    losses but introduce execution constraints
  status: proposed
  derived_from:
  - LEARNALGO-C6-002
  statement: Automated position limits and circuit breaker logic reduce tail risk
    but may force suboptimal exits and trading halts
  proposed_mechanism: Risk controls trigger automatic order cancellation or liquidation
    on breach. Reduces worst-case loss but introduces execution slippage and opportunity
    cost.
  validation_approach: Simulate risk control breaches in backtest; measure frequency
    of triggers and slippage. Compare max drawdown with/without controls. Live trade
    with conservative limits.
  applicable_markets_and_regimes: All; critical for derivatives
  assumptions:
  - Risk limit thresholds calibrated to acceptable tail loss
  - Order cancellation/liquidation executes without excessive slippage
  data_requirements: Intraday P&L, position tracking, market depth data
  robustness_checks:
  - 'Stress test: simultaneous limit breaches across multiple strategies'
  - Measure correlation between limit triggers and market stress events
  failure_modes:
  - 'Circuit breaker whipsaw: limit trigger during volatile move, then reverses'
  - 'Inadequate limits: controls breached by larger-than-expected moves'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H8
  title: Modular system architecture with decoupled data/signal/execution layers enables
    independent testing and rapid strategy iteration
  status: proposed
  derived_from:
  - LEARNALGO-C7-001
  statement: Separating signal generation from execution via OMS gateway allows testing
    without live connectivity and testing different execution algorithms
  proposed_mechanism: Data layer provides normalized market data; signal layer generates
    orders; execution layer routes to exchanges. Each layer testable independently.
  validation_approach: Implement trading system with modular layers. Measure signal
    latency isolated, backtest consistency, time to deploy new strategy.
  applicable_markets_and_regimes: All; foundational architecture principle
  assumptions:
  - OMS gateway latency < 10ms
  - Data layer normalization is correct and complete
  data_requirements: System architecture documentation, deployment metrics
  robustness_checks:
  - 'Chaos engineering: inject order rejections, network delays, feed gaps'
  - 'Load test: 1000s of concurrent orders, measure latency distribution'
  failure_modes:
  - 'Coupling creep: data layer becomes entangled with signal layer'
  - 'Execution gateway bottleneck: OMS latency exceeds strategy signal decay'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H9
  title: FIX protocol reliable message delivery and sequencing essential for order
    integrity in high-frequency trading
  status: proposed
  derived_from:
  - LEARNALGO-C8-001
  statement: FIX message sequencing ensures order lifecycle consistency; message loss
    causes duplicate fills or order rejections
  proposed_mechanism: FIX sequence numbers enable client-side reconstruction of lost
    messages; heartbeat monitoring detects connection loss. Client must implement
    idempotent order handling.
  validation_approach: Deploy FIX connectivity to exchange. Inject message losses
    and sequence gaps. Verify no duplicate fills and complete order lifecycle tracking.
  applicable_markets_and_regimes: Derivatives (futures, options); equities; critical
    for compliance
  assumptions:
  - FIX exchange implementation follows FIX specification
  - Network is non-Byzantine
  data_requirements: FIX message logs, execution reports, order history reconciliation
  robustness_checks:
  - 'Stress test: simultaneous network glitches and order rate spikes'
  - 'Compliance audit: verify audit trail matches regulatory requirements'
  failure_modes:
  - 'Sequence number wraparound: exchanges and client disagree on sequence'
  - 'Heartbeat timeout false positive: triggers reconnection despite live connection'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H10
  title: Event-driven backtester produces realistic results vs. for-loop simplified
    simulator
  status: proposed
  derived_from:
  - LEARNALGO-C9-001
  statement: Event-driven simulation models partial fills and execution latency realistic
    to live trading, while for-loop backtester assumes instant execution
  proposed_mechanism: Event-driven simulates order book state and matches orders against
    LOB. For-loop skips LOB dynamics.
  validation_approach: Implement same strategy in for-loop and event-driven backtester.
    Compare returns, max drawdown. Verify event-driven aligns with paper trading.
  applicable_markets_and_regimes: All; most critical for high-frequency strategies
  assumptions:
  - Order book reconstruction captures liquidity accurately
  - Latency model is calibrated to live network
  data_requirements: Tick-by-tick market data with timestamps, order book snapshots,
    latency calibration data
  robustness_checks:
  - Cross-validate event-driven results vs. paper trading
  - 'Sensitivity analysis: vary latency assumptions ±50%'
  failure_modes:
  - 'Order book reconstruction errors: missing trades or stale quotes'
  - 'Latency model mismatch: assumed latency much lower than real'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H11
  title: Transaction cost estimation (commissions, slippage, bid-ask spread) must
    scale with order size and market conditions
  status: proposed
  derived_from:
  - LEARNALGO-C9-002
  statement: Accurate transaction cost modeling is essential to bridging backtest-to-live
    gap; costs scale non-linearly with order size
  proposed_mechanism: 'Commission: flat or basis-point fee. Slippage: fraction of
    average true range (ATR); large orders face worse execution. Bid-ask spread captured
    from market data.'
  validation_approach: Measure realized costs in paper trading (3+ months); calibrate
    model to match observed slippage. Apply to backtest; verify results within 5-10%
    of paper trading.
  applicable_markets_and_regimes: All; critical for frequent strategies
  assumptions:
  - Market impact scales linearly with order size
  - Bid-ask spread representative of typical execution
  data_requirements: Paper trading execution reports, market data with spreads, realized
    fills
  robustness_checks:
  - Test cost model on different asset classes
  - 'Sensitivity: vary commission/slippage ±50%'
  failure_modes:
  - 'Backtest-to-live gap: costs underestimated, live trading unprofitable'
  - 'Overly pessimistic costs: backtest shows poor returns but live is better'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H12
  title: Profit decay (alpha decay) in live trading requires continuous strategy re-optimization
    and diversification
  status: proposed
  derived_from:
  - LEARNALGO-C10-001
  - LEARNALGO-C10-002
  statement: Strategy returns decline as exposures become crowded; monitoring alpha
    decay enables timely re-optimization or strategy retirement
  proposed_mechanism: Track strategy Sharpe ratio daily; detect slope change in cumulative
    alpha. When Sharpe < 0.5, trigger parameter re-optimization.
  validation_approach: Deploy 2+ strategies in parallel; monitor Sharpe daily. Disable
    and re-optimize when Sharpe drops below threshold for 5+ days.
  applicable_markets_and_regimes: All live trading; mandatory for deployed strategies
  assumptions:
  - Sharpe ratio is stable estimator over 20+ trading days
  - Re-optimization does not overfit to recent performance
  data_requirements: Daily P&L, rolling Sharpe estimates, regime indicators
  robustness_checks:
  - 'Walk-forward test: re-optimize quarterly with out-of-sample validation'
  - 'Test regime identification: VIX spikes, correlation matrix changes'
  failure_modes:
  - 'Overfitting during re-optimization: parameter tweaks reduce live Sharpe further'
  - 'Strategy crowding: alpha decays faster than re-optimization can adapt'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: LEARNALGO-H13
  title: Portfolio diversification across strategies, asset classes, and time horizons
    reduces concentration risk
  status: proposed
  derived_from:
  - LEARNALGO-C10-003
  statement: Combining momentum, mean-reversion, and arbitrage strategies with uncorrelated
    assets reduces correlation and smooths portfolio volatility
  proposed_mechanism: Low-correlation strategies offset drawdowns; uncorrelated asset
    classes hedge each other. True diversification requires correlation < 0.3.
  validation_approach: Backtest single strategy vs. diversified portfolio. Measure
    correlation matrix stability. Stress test replay of 2008, 2020 crashes.
  applicable_markets_and_regimes: All portfolios; most critical during market dislocations
  assumptions:
  - Historical correlations stationary across regimes
  - Diversification benefit persists in tail events
  data_requirements: Strategy returns, asset class returns, correlation matrix, stress
    scenario data
  robustness_checks:
  - 'Principal component analysis: verify correlation structure'
  - 'Extreme value theory: model tail dependencies'
  failure_modes:
  - 'Correlation breakdown: asset classes correlate to 0.9 during stress'
  - 'Strategy crowding: common exposures cause synchronized drawdowns'
  _book_id: learn-algorithmic-trading-build-and-deploy-algorithmic-tradi-2019
  _audit_grade: A
- id: MLPRO-H01
  title: Deep in-the-money call options with high delta (70+) reduce theta decay and
    provide stock-like exposure with lower capital cost
  status: proposed
  derived_from:
  - MLPRO-C25-006
  - MLPRO-C30-011
  statement: Buying 70-delta calls provides approximately 80% of a 1-dollar stock
    move at much lower cost than owning shares; theta decay is minimal for deep ITM
    calls.
  proposed_mechanism: High delta means option price moves nearly 1:1 with stock; intrinsic
    value dominates extrinsic value, reducing theta sensitivity.
  applicable_markets_and_regimes: Trending markets; high-liquidity equities with tight
    option spreads.
  assumptions:
  - Option spreads remain narrow; liquidity is sufficient to enter/exit without significant
    slippage
  - Deep ITM calls have delta >= 0.7 and theta decay < 5% of premium per day
  - Comparison assumes equivalent directional conviction vs stock ownership
  data_requirements:
  - Historical option prices (bid/ask) by strike and expiration
  - Stock price time series
  - Implied volatility surface by date and strike
  baseline_or_null_hypothesis: Deep ITM calls have no alpha advantage over stock;
    payoff differences are explained by execution costs and bid/ask spreads.
  validation_approach: 'Backtest: compare cumulative returns, Sharpe ratio, and max
    drawdown of deep ITM call strategy vs stock ownership on same underlying over
    2+ year period. Measure execution costs (slippage, commissions) per trade.'
  transaction_cost_and_fill_considerations: Option spreads wider than stock spreads;
    slippage on entry/exit may exceed stock; commission per contract must be accounted.
  robustness_checks:
  - Vary delta threshold (60, 70, 80); measure alpha sensitivity
  - Test across market caps (mega-cap vs mid-cap); liquidity impact
  - Compare across volatility regimes (VIX > 30 vs < 15)
  rejection_criteria: Deep ITM call strategy underperforms stock on Sharpe ratio after
    costs; theta decay exceeds predicted levels; max drawdown >= stock drawdown.
  failure_modes:
  - Unexpected early assignment on dividend dates disrupts position
  - Wide option spreads in volatile markets eliminate leverage advantage
  - Call options expire worthless if stock gaps down overnight
  freshness_concerns: Commission structures and market maker behavior have evolved
    since book publication (2020). Current option pricing and spreads should be measured.
  unresolved_questions:
  - Does delta of 70 remain stable across volatility regimes?
  - How does strategy perform during market crashes (VIX > 50)?
  - Are deep ITM calls less liquid than ATM options, causing hidden slippage?
  _book_id: machine-learning-for-algorithm-trading-master-as-a-pro-appli
  _audit_grade: C
- id: MLPRO-H02
  title: Technical indicators (RSI, MACD, Bollinger Bands) with standard parameters
    can generate profitable trading signals
  status: proposed
  derived_from:
  - MLPRO-C37-016
  - MLPRO-C38-017
  statement: RSI overbought/oversold (>70 / <30), MACD crossovers, and Bollinger Band
    mean-reversion signals identify profitable entry/exit points.
  proposed_mechanism: Indicators capture momentum and mean-reversion regimes; overbought
    conditions precede reversals; divergences between price and indicator identify
    exhaustion.
  applicable_markets_and_regimes: Trending markets; oscillating/choppy markets; all
    timeframes (day/swing).
  assumptions:
  - Standard indicator parameters (14-day RSI, 20-day BB, 12/26-day MACD) are optimal
    or near-optimal
  - Overbought threshold of 70 and oversold of 30 have consistent predictive value
  - Indicators are computed on closing prices; intraday data is not required
  data_requirements:
  - Daily or intraday OHLCV data
  - Indicator time series (RSI, MACD, BB) computed from price history
  baseline_or_null_hypothesis: Technical indicators have no predictive power; signals
    are statistically equivalent to random entry/exit.
  validation_approach: 'Backtest: systematically vary indicator parameters and thresholds;
    measure Sharpe, win rate, and max drawdown. Test signal timing: measure correlation
    between overbought/oversold and forward returns. Compare vs buy-and-hold.'
  transaction_cost_and_fill_considerations: High-frequency indicator crossovers can
    generate excessive turnover; must include realistic commission and slippage per
    trade.
  robustness_checks:
  - 'Vary lookback periods: RSI 10/14/20, BB 15/20/25, MACD 8/12/26'
  - 'Test on different asset classes: large-cap stocks, small-cap, ETFs'
  - 'Walk-forward validation: train parameters on past year, test on next quarter'
  rejection_criteria: Indicator signals have Sharpe < 1.0; win rate < 55%; max drawdown
    > buy-and-hold; parameters are not robust to out-of-sample data.
  failure_modes:
  - Overbought/oversold thresholds fail during persistent trends (bull/bear markets)
  - Indicator signals lag price; whipsaw trades incur losses on false signals
  - Parameter overfitting on historical data; poor out-of-sample performance
  freshness_concerns: Technical analysis patterns may have degraded due to algorithmic
    trading adoption and increased market efficiency (as of 2020+).
  unresolved_questions:
  - Are standard parameters (14-day RSI) empirically optimal or just convention?
  - Do indicator signals work differently in crypto vs equities vs forex?
  - How do indicator signals interact with fundamental factors?
  _book_id: machine-learning-for-algorithm-trading-master-as-a-pro-appli
  _audit_grade: C
- id: MLPRO-H03
  title: Modular ML pipeline decomposition allows independent validation of detection,
    classification, and tracking components
  status: proposed
  derived_from:
  - MLPRO-C11-003
  - MLPRO-C11-004
  statement: Complex ML systems (e.g., CNN for signal detection) should decompose
    into isolated stages (feature extraction, detection, classification, aggregation);
    each stage's precision/recall can be measured independently, enabling diagnosis
    of end-to-end failures.
  proposed_mechanism: Component validation identifies which stage is the bottleneck;
    errors in early stages cascade to downstream outputs; measuring each stage isolates
    root causes.
  applicable_markets_and_regimes: Any ML-based signal generation (CNN price patterns,
    NLP sentiment, RL portfolio optimization).
  assumptions:
  - Stages can be independently measured without full-pipeline execution
  - Error propagation through stages is conditional and not strongly correlated
  data_requirements:
  - Labeled data for each stage (e.g., true parking spaces, true vehicles, true occupancy)
  - Intermediate outputs (features, detections) at each stage
  baseline_or_null_hypothesis: Component validation adds no value; end-to-end backtest
    is sufficient.
  validation_approach: 'Build test suite that measures precision/recall at each stage
    of signal pipeline. Example: CNN signal generation pipeline has (1) feature extraction
    (test: are features correlated with signal?), (2) model prediction (test: accuracy
    on held-out data), (3) trade logic (test: does trade execute as intended?). Measure
    stage-level metrics independently.'
  transaction_cost_and_fill_considerations: 'Test must include realistic market microstructure:
    order execution latency, partial fills, price slippage.'
  robustness_checks:
  - 'Test with degraded inputs: add noise, missing data, outliers'
  - Measure stage performance on different time periods (bull/bear/sideways markets)
  - Compare vs single-stage monolithic approach
  rejection_criteria: End-to-end backtest has poor Sharpe; cannot identify which component
    is responsible; component metrics are uncorrelated with final P&L.
  failure_modes:
  - Early-stage errors (e.g., wrong feature engineering) propagate and cannot be easily
    corrected in later stages
  - Component validation tools themselves are buggy, providing false confidence
  freshness_concerns: None; modular design principle is timeless.
  unresolved_questions:
  - What is the optimal number of stages for trading ML pipelines?
  - How to measure uncertainty propagation across stages?
  _book_id: machine-learning-for-algorithm-trading-master-as-a-pro-appli
  _audit_grade: C
- id: MLPRO-H04
  title: Options assignment risk can be managed by avoiding short naked calls and
    using defined-risk strategies (spreads, collars)
  status: proposed
  derived_from:
  - MLPRO-C31-012
  - MLPRO-C27-008
  statement: Unexpected assignment of short option positions disrupts portfolio reconciliation.
    Avoiding naked short calls and using spreads/collars keeps assignment risk bounded
    and predictable.
  proposed_mechanism: Defined-risk strategies (spreads, collars) limit max loss and
    max assignment quantity; simple position-keeping rules prevent surprise inventory
    changes.
  applicable_markets_and_regimes: Options strategies in U.S. equities with assignment
    rules defined by OCC.
  assumptions:
  - Assignment happens on predictable dates (ex-dividend, near-expiration) or for
    deep-ITM options
  - Assignment risk can be fully hedged or accepted within capital limits
  data_requirements:
  - Dividend calendar; ex-dividend dates for holdings
  - Options contract specifications; assignment rules by broker
  baseline_or_null_hypothesis: Assignment risk is immaterial; position management
    systems can absorb random assignment without operational impact.
  validation_approach: 'Live system test: simulate scenarios where short options are
    assigned overnight. Measure reconciliation time, hedging slippage, and capital
    utilization after assignment. Compare: naked short calls vs spreads on same underlying.'
  transaction_cost_and_fill_considerations: Assignment may force unplanned hedges;
    measure cost of forced liquidation or hedge.
  robustness_checks:
  - Test on high-dividend-yield stocks (frequent assignments)
  - Test on volatile underlyings (high chance of assignment near expiration)
  - Test during market gaps (overnight news causes morning assignment surprises)
  rejection_criteria: Assignment risk exceeds acceptable levels (e.g., >5% of portfolio
    per day); reconciliation takes >1 hour; forced hedges exceed stop-loss limits.
  failure_modes:
  - Multiple assignment events on same day overwhelm reconciliation system
  - Early assignment happens unexpectedly on non-ex-dividend dates
  freshness_concerns: OCC assignment rules and dividend calendar are current; broker-specific
    rules may differ.
  unresolved_questions:
  - Can assignment risk be fully eliminated for options strategies?
  - How to integrate assignment risk into VaR/stress testing?
  _book_id: machine-learning-for-algorithm-trading-master-as-a-pro-appli
  _audit_grade: C
- id: MLAT-H-001
  title: Look-ahead bias materially inflates backtest returns on equity signals
  status: proposed
  derived_from:
  - MLAT-C8-001
  statement: Point-in-time data validation (accounting for restatements, splits, asynchronous
    EPS/price timing) will reduce backtested returns by 5–20% on typical equity factors.
  proposed_mechanism: Correlated trades on information not yet publicly available
    at decision time artificially compress slippage and improve entry/exit prices.
  applicable_markets_and_regimes: Equities; all market regimes
  assumptions:
  - Data provider defaults to non-point-in-time data
  - Earnings releases lag market data availability
  - Stock splits are not synchronized with fundamental data
  data_requirements:
  - Point-in-time fundamental data (earnings, splits) with release timestamps
  - Market data with exact trade timestamps
  - Historical announcement calendars
  baseline_or_null_hypothesis: Point-in-time validation has negligible effect on backtest
    returns (< 1%)
  validation_approach: Rerun backtest with conservative lag assumptions (e.g., +1
    trading day for EPS); compare returns with/without look-ahead bias controls; audit
    data timestamps against SEC filing dates
  transaction_cost_and_fill_considerations: Slippage assumptions may overestimate
    post-lag performance gains; reduced returns may not cover transaction costs
  robustness_checks:
  - Test multiple lag assumptions (1 day, 2 days, 5 days)
  - Verify on multiple factor types (value, momentum, quality)
  - Compare across market cap segments
  rejection_criteria: If lag adjustment reduces returns < 1%, hypothesis is rejected
  failure_modes: Over-conservative lag assumptions hide real signal
  freshness_concerns: Data provider APIs may have changed availability terms since
    2020
  unresolved_questions:
  - What is the actual lag for each data provider?
  - How much of the lag is intentional (reporting schedule) vs. accidental?
  _book_id: machine-learning-for-algorithmic-trading-predictive-models-t-2020
  _audit_grade: A
- id: MLAT-H-002
  title: Survivorship bias accounts for 2–5% annual return in equity backtests
  status: proposed
  derived_from:
  - MLAT-C8-002
  statement: Including delisted, bankrupt, and acquired securities in backtest universe
    will reduce compound annual returns by 2–5% compared to survivorship-biased universe.
  proposed_mechanism: Failed/delisted stocks exhibit worse performance than average
    survivors; including them lowers portfolio returns and increases observed drawdowns.
  applicable_markets_and_regimes: US equities; all market regimes; stronger during
    recessions
  assumptions:
  - Historical constituent lists are available
  - Delisting events are properly timestamped
  data_requirements:
  - Historical S&P 500 / Russell 3000 constituent lists with entry/exit dates
  - Delisting codes and dates
  - Price data for delisted securities
  baseline_or_null_hypothesis: Survivorship bias has negligible effect (< 0.5% CAGR)
  validation_approach: Run factor backtest on full (delisted-inclusive) universe and
    on current constituents only (survivorship-biased); compare Sharpe, max drawdown,
    CAGR; measure fraction of portfolio weight in delisted securities at each point
    in time
  transaction_cost_and_fill_considerations: Delisted securities may have wide bid-ask
    spreads, low volume; must handle orphaned positions (delisting, bankruptcy)
  robustness_checks:
  - Sensitivity to different constituents indices (Russell, CRSP)
  - Measure by decile (small-cap stocks have higher bankruptcy rate)
  rejection_criteria: If delisted-adjusted returns differ < 0.5% from biased returns
  failure_modes: Over-correction by assigning zero return to delisted securities
  freshness_concerns: Delisting rates may change; regulatory environment evolves
  unresolved_questions:
  - How to model bankruptcy/acquisition returns (recovery value)?
  - Should delisted securities be excluded or marked at zero?
  _book_id: machine-learning-for-algorithmic-trading-predictive-models-t-2020
  _audit_grade: A
- id: MLAT-H-003
  title: Ensemble methods (RF, GBM) generalize better than linear models on cross-asset
    equity signals
  status: proposed
  derived_from:
  - MLAT-C11-001
  - MLAT-C12-001
  statement: Gradient boosting models (XGBoost, LightGBM) will achieve 10–20% lower
    out-of-sample prediction error than linear regression on predicting equity returns
    using nonlinear factors (volatility, seasonality, sentiment).
  proposed_mechanism: Nonlinear interactions among factors (e.g., high-momentum +
    low-volatility bias) are not captured by linear models; GBM learns these interactions.
  applicable_markets_and_regimes: Equities; more pronounced in high-volatility regimes
  assumptions:
  - Sufficient historical data to avoid overfitting (~500+ days)
  - Hyperparameter tuning is rigorous (cross-validation on OOS data)
  - Nonlinear relationships are stable across train/test split
  data_requirements:
  - At least 3 years of daily equity price + factor data
  - Multiple factor types (price-based, volume, sentiment, macro)
  baseline_or_null_hypothesis: Linear and ensemble models have equivalent OOS error
    (< 1% difference)
  validation_approach: Train linear regression, RF, GBM on same feature set; evaluate
    on hold-out test set using walk-forward methodology; measure MSE, IC, Sharpe ratio
    of predictions; stress-test on market regime transitions
  transaction_cost_and_fill_considerations: More frequent/volatile predictions from
    GBM may increase transaction costs; must account for slippage in signal comparison
  robustness_checks:
  - Test across different market cap segments (micro, small, large)
  - Vary feature engineering approach
  - Sensitivity to hyperparameter tuning budget
  rejection_criteria: If GBM error > linear error or within 1% margin
  failure_modes: GBM overfits to noise; poor performance on new data
  freshness_concerns: GBM implementations and hyperparameter tuning best practices
    evolve
  unresolved_questions:
  - How much of GBM advantage is due to feature engineering vs. algorithm?
  - Does advantage persist with adaptive regimes?
  _book_id: machine-learning-for-algorithmic-trading-predictive-models-t-2020
  _audit_grade: A
- id: MLAT-H-004
  title: Time-series CV with walk-forward testing improves backtest reliability
  status: proposed
  derived_from:
  - MLAT-C6-001
  statement: Walk-forward (expanding window) cross-validation will reveal 20–40% lower
    signal performance on truly out-of-sample data compared to random-fold cross-validation.
  proposed_mechanism: Random-fold CV allows future information to leak into training;
    walk-forward respects temporal causality and reveals true generalization.
  applicable_markets_and_regimes: All equity strategies; all regimes
  assumptions:
  - Walk-forward window is sized appropriately (e.g., 252 days train, 21 days test)
  - Signal does not have seasonality that repeats exactly
  data_requirements:
  - Continuous time-series of at least 5 years
  - No missing data points
  baseline_or_null_hypothesis: Random-fold and walk-forward CV yield similar results
    (< 5% difference)
  validation_approach: Implement both random-fold and walk-forward CV on same signal;
    compare average out-of-sample IC, Sharpe, win rate; measure agreement between
    CV results and live performance
  transaction_cost_and_fill_considerations: Walk-forward may reveal realistic slippage
    from model changes
  robustness_checks:
  - Test on multiple factor types
  - Vary train/test window lengths
  - Test on different market regimes
  rejection_criteria: If walk-forward and random-fold results differ < 5%
  failure_modes: Walk-forward window too small; insufficient OOS data for reliable
    estimate
  freshness_concerns: No acute freshness concern
  unresolved_questions:
  - What is the optimal train/test window ratio for daily equity signals?
  _book_id: machine-learning-for-algorithmic-trading-predictive-models-t-2020
  _audit_grade: A
- id: MLAT-H-005
  title: Alternative data signal decays as competition increases
  status: proposed
  derived_from:
  - MLAT-C3-001
  - MLAT-C4-001
  statement: Alternative data factors (satellite imagery, credit card transactions,
    web traffic) exhibit predictive power decay of 50%+ over 12–24 months as market
    participants discover and exploit the same signals.
  proposed_mechanism: Alpha is competed away; factors become crowded; market adapts
    to widespread use of alternative data
  applicable_markets_and_regimes: Equities; most pronounced in mega-cap stocks with
    heavy quant coverage
  assumptions:
  - Multiple firms are developing signals from the same data source
  - Information takes 1–2 years to fully diffuse
  data_requirements:
  - 3+ years of alternative data + returns history
  - Proxy for market adoption (e.g., fund inflows, academic publications)
  baseline_or_null_hypothesis: Alternative data signal is stable over time (signal
    decay < 10%)
  validation_approach: Measure rolling 6/12/24-month IC of alternative data factor;
    compare to traditional factor decay rates; correlate factor decay with market
    adoption signals
  transaction_cost_and_fill_considerations: Accelerating decay reduces viability of
    strategy over time
  robustness_checks:
  - Test on multiple alternative data sources
  - Measure decay timing relative to public awareness
  rejection_criteria: If decay < 20% over 24 months
  failure_modes: Decay may be due to seasonality or regime shift, not crowding
  freshness_concerns: Alternative data landscape changes rapidly; new providers emerge
  unresolved_questions:
  - Is decay linear or accelerating?
  - Can signals be refreshed by adding new features?
  _book_id: machine-learning-for-algorithmic-trading-predictive-models-t-2020
  _audit_grade: A
- id: NEXTGEN-HYP-001
  title: Electronic trading latency advantage enables algorithmic profitability
  status: proposed
  derived_from:
  - NEXTGEN-C1-001
  statement: Algorithmic trading strategies generate alpha via speed advantages (sub-100ms
    execution) that preclude profitable human intervention.
  proposed_mechanism: Algorithms detect market microstructure patterns, execute orders,
    and capture profit before human traders perceive opportunity.
  applicable_markets_and_regimes: equities (high-volume, electronic-trading dominant);
    crypto_spot (continuous trading)
  assumptions:
  - Latency advantage persists with increasing algo adoption
  - Execution infrastructure remains stable
  data_requirements: order book tick data (≤1ms), execution latency telemetry, order
    flow toxicity metrics
  baseline_or_null_hypothesis: Algorithmic speed provides no edge; returns explained
    by noise or bias
  validation_approach: Backtest with realistic latency models; measure Sharpe vs.
    human-speed baseline (1000ms)
  transaction_cost_and_fill_considerations: Market impact = a*sqrt(size/ADV); adverse
    selection = b*vix*imbalance
  robustness_checks: Vary execution latency ±20ms; stress 10x volume; simulate broker
    API failures
  rejection_criteria: Backtest Sharpe <0.5 after latency penalty
  failure_modes: Latency increases unexpectedly; broker connectivity failure; competing
    algos exploit patterns
  freshness_concerns: Algo adoption increased; latency advantages may have eroded;
    market structure changed
  unresolved_questions: What is minimum latency threshold? How much does circuit-breaker
    insertion cost?
  _book_id: next-gen-algorithmic-trading-strategies-tools-and-techniques
  _audit_grade: B
- id: NEXTGEN-HYP-002
  title: Technical indicator ensembles generate above-benchmark stock signals
  status: proposed
  derived_from:
  - NEXTGEN-C4-001
  - NEXTGEN-C6-001
  statement: Combining three+ uncorrelated indicators via ensemble voting produces
    >55% signal accuracy on 5-day stock holds.
  proposed_mechanism: Each indicator captures different microstructure (momentum,
    reversion, volatility); ensemble voting filters noise.
  applicable_markets_and_regimes: equities, trending markets (ADX >25)
  assumptions:
  - Historical indicator parameters remain optimal
  - Indicator signals are approximately uncorrelated
  data_requirements: 3+ years daily OHLCV; RSI, MACD, Bollinger Band parameters
  baseline_or_null_hypothesis: Indicator ensemble performance equals buy-and-hold
    benchmark
  validation_approach: Walk-forward on 5-year data (1-year train, 1-month test); measure
    Sharpe and Calmar
  transaction_cost_and_fill_considerations: 5bps commission + 2bps spread per trade;
    avoid penny stocks
  robustness_checks: Vary ensemble voting threshold; test on sector subsets; test
    2023-2024 data
  rejection_criteria: Walk-forward Sharpe <0.8 after costs; max drawdown >30%; win
    rate <52%
  failure_modes: Indicators lag during crashes; ensemble overfits voting; signals
    correlated
  freshness_concerns: Technical analysis effectiveness declined due to algo saturation
  unresolved_questions: What ensemble voting rule is optimal? How frequently reoptimize
    parameters?
  _book_id: next-gen-algorithmic-trading-strategies-tools-and-techniques
  _audit_grade: B
- id: NEXTGEN-HYP-003
  title: Walk-forward validation reduces overfitting by >40%
  status: proposed
  derived_from:
  - NEXTGEN-C5-001
  - NEXTGEN-C5-002
  statement: Rolling walk-forward windows show <30% Sharpe degradation vs. >50% for
    single train/test split.
  proposed_mechanism: Rolling windows simulate regime changes; repeated reoptimization
    captures drift; no look-ahead bias
  applicable_markets_and_regimes: all markets, all regimes (non-stationary markets
    benefit most)
  assumptions:
  - Market regimes stationary within rolling windows
  - Parameters reoptimized frequently to track regimes
  data_requirements: 3+ years daily OHLCV; parameter optimization history
  baseline_or_null_hypothesis: Walk-forward validation provides no additional value
  validation_approach: Compare single train/test split vs. 12-month rolling walk-forward;
    measure degradation
  transaction_cost_and_fill_considerations: Include realistic costs in both methods
  robustness_checks: Vary window size (6-month, 12-month, 24-month); measure information
    decay
  rejection_criteria: Degradation <10% (no overfitting); out-of-sample Sharpe <0.5
  failure_modes: Reoptimization lags regime changes; window resets introduce shock
  freshness_concerns: Validation methodology stable; low freshness risk
  unresolved_questions: What is optimal train/test ratio? Should overlapping windows
    be used?
  _book_id: next-gen-algorithmic-trading-strategies-tools-and-techniques
  _audit_grade: B
- id: NEXTGEN-HYP-004
  title: Slippage model with market impact improves backtest fidelity by >20%
  status: proposed
  derived_from:
  - NEXTGEN-C8-002
  statement: Realistic slippage (impact + adverse selection) reduces backtest/live
    correlation error by >20% vs. flat models.
  proposed_mechanism: Market impact scales with order size; adverse selection correlates
    with volatility and imbalance.
  applicable_markets_and_regimes: equities (illiquid/mid-cap); high-volatility periods
  assumptions:
  - Impact elasticity stable (impact ~ sqrt(size/volume))
  - Adverse selection uncorrelated with entry price
  data_requirements: high-frequency order-book snapshots; historical fill data; per-trade
    size/price
  baseline_or_null_hypothesis: Flat-rate slippage equals realistic model
  validation_approach: Backtest with (a) flat, (b) sqrt impact only, (c) full model;
    compare to live execution
  transaction_cost_and_fill_considerations: Base spread + market impact + adverse
    selection
  robustness_checks: Stress impact elasticity ±30%; test different market cap buckets
  rejection_criteria: Backtest/live correlation <0.6; impact estimate ±50% of empirical
  failure_modes: Impact model breaks during flash crash; adverse selection overfits
    historical imbalances
  freshness_concerns: Market microstructure shifted (maker-taker fees, RegSHO); impact
    function changed
  unresolved_questions: How to estimate elasticity without order book data? Can ML
    improve adverse selection prediction?
  _book_id: next-gen-algorithmic-trading-strategies-tools-and-techniques
  _audit_grade: B
- id: NEXTGEN-HYP-005
  title: Portfolio diversification reduces 95% drawdown by 30%+
  status: proposed
  derived_from:
  - NEXTGEN-C9-001
  statement: 4+ uncorrelated strategies (correlation <0.3) achieve 95% VaR 30-40%
    lower than best single strategy.
  proposed_mechanism: Return correlation inversely affects portfolio volatility; uncorrelated
    strategies hedge during regimes.
  applicable_markets_and_regimes: multi-asset (equities + crypto + bonds); normal
    markets
  assumptions:
  - Correlation structure stable within 1-year windows
  - Strategies deployable simultaneously without conflicts
  data_requirements: daily returns for 4+ strategies (3+ years each); rolling 252-day
    correlation matrix
  baseline_or_null_hypothesis: Diversification provides no drawdown benefit
  validation_approach: Backtest portfolio vs. best single; measure 95% VaR on rolling
    windows
  transaction_cost_and_fill_considerations: Rebalancing costs if strategies drift
  robustness_checks: Stress correlation breakdown; test with 2-3 strategies; backtest
    2008/2020/2022 crises
  rejection_criteria: Drawdown reduction <15%; correlation spike >0.8 during tail
    events
  failure_modes: Systemic event causes all strategies to fail (correlation → 1.0)
  freshness_concerns: Correlation structures shifted due to index ETF adoption
  unresolved_questions: What is minimum correlation threshold? Should tail-hedge assets
    be added?
  _book_id: next-gen-algorithmic-trading-strategies-tools-and-techniques
  _audit_grade: B
- id: NEXTGEN-HYP-006
  title: Broker API latency <50ms permits HFT-grade execution
  status: proposed
  derived_from:
  - NEXTGEN-C7-001
  - NEXTGEN-C8-001
  statement: Sub-100ms strategies require broker API p99 <50ms to achieve <1bps slippage
    on mid-cap equities.
  proposed_mechanism: 'Latency chain: signal → API call → routing → matching → confirmation.
    Must total <50ms.'
  applicable_markets_and_regimes: equities (mid-cap, liquid); high-volume periods
  assumptions:
  - Network latency stable (<10ms)
  - Broker processing <20ms
  - Order book doesn't gap during execution window
  data_requirements: broker API latency telemetry (p50, p99); order book movement
    speed
  baseline_or_null_hypothesis: API latency has no impact on execution slippage
  validation_approach: Measure broker latencies over 1 month; correlate with execution
    slippage
  transaction_cost_and_fill_considerations: Include network, broker, exchange, feedback
    loop latencies
  robustness_checks: Test during high-volatility (latency spikes); stress broker failover
  rejection_criteria: API p99 >100ms; correlation between latency and slippage <0.5
  failure_modes: API latency increases unexpectedly; order rejected, retry loop adds
    latency
  freshness_concerns: Broker infrastructure and latency profiles change frequently
  unresolved_questions: What is typical broker p99 latency in 2024? Can latency be
    reliably predicted?
  _book_id: next-gen-algorithmic-trading-strategies-tools-and-techniques
  _audit_grade: B
- id: OVAP-H001
  title: Term structure slope predicts implied vol direction
  status: proposed
  derived_from:
  - OVAP-C20-I021
  statement: When implied vol term curve is steep (long-dated > short-dated vol),
    realized vol increases over next period
  proposed_mechanism: Market expects increasing realized volatility when pricing long-dated
    options at higher vols than short-dated
  applicable_markets_and_regimes: Equities, index options; most reliable in liquid
    markets
  assumptions:
  - Implied vol surface is accurately priced
  - Term structure reflects forward expectations
  data_requirements:
  - implied_vol_term_structure
  - realized_vol_forward
  - market_dates
  baseline_or_null_hypothesis: Term structure is uninformative; realized vol moves
    randomly independent of curve slope
  validation_approach: 'Backtest: compute term structure slope at trade entry; measure
    realized vol over forward window; correlate'
  transaction_cost_and_fill_considerations: Vol strategies have tight spreads but
    require precise timing; entry costs ~1-2 vol points
  robustness_checks:
  - Subsample by vol regime
  - Subsample by asset class
  - Subsample by vol level
  - Vary forward window (5/10/20 days)
  rejection_criteria: Null hypothesis cannot be rejected if p-value > 0.10 or correlation
    < 0.3
  failure_modes:
  - Regime change breaks correlation
  - Supply/demand overwhelms forward expectations
  - Model misspecification
  freshness_concerns: Implied vol surface calibration methods have evolved; broker
    APIs changed since 2014
  unresolved_questions:
  - Why does market misprice term structure?
  - Is there alpha after transaction costs?
  - Regime-dependent validity?
  _book_id: option-volatility-and-pricing-advanced-trading-strategies-an-2014
  _audit_grade: A
- id: OVAP-H002
  title: Realized vol mean-reverts within regimes
  status: proposed
  derived_from:
  - OVAP-C19-I019
  - OVAP-C9-I008
  statement: High realized vol today is followed by high realized vol tomorrow within
    same regime; regime changes cause vol jumps
  proposed_mechanism: Volatility clustering implies positive autocorrelation within
    regime; regime changes are discontinuous
  applicable_markets_and_regimes: All equities; varies by market regime (calm vs crisis)
  assumptions:
  - Realized vol can be accurately computed
  - Regimes can be identified/detected
  data_requirements:
  - realized_volatility_daily
  - regime_markers
  - market_dates
  baseline_or_null_hypothesis: Realized vol is iid random; no persistence across time
  validation_approach: Compute rolling realized vol; measure autocorrelation at lag
    1; test within regime vs across regimes
  transaction_cost_and_fill_considerations: Vol trading costs are implicit in bid-ask
    spreads; no direct transaction cost
  robustness_checks:
  - Subsample by regime type
  - Vary lookback window for vol
  - Test multiple lags (1-5)
  - Cross-validate with GARCH
  rejection_criteria: Reject if lag-1 autocorrelation < 0.3 (insufficient persistence)
    or > 0.95 (too strong, model issues)
  failure_modes:
  - Regime detection fails during transition periods
  - Autocorrelation overstated by survivor bias
  freshness_concerns: Market structure and information flow have changed; regime detection
    methods need updating
  unresolved_questions:
  - Optimal regime detection method?
  - Alpha from this signal alone?
  - Subpopulation-specific?
  _book_id: option-volatility-and-pricing-advanced-trading-strategies-an-2014
  _audit_grade: A
- id: OVAP-H003
  title: Calendar spreads profit from near-term theta decay
  status: proposed
  derived_from:
  - OVAP-C12-I012
  - OVAP-C9-I007
  statement: Near-term options decay faster than long-dated options; calendar spreads
    (sell near, buy far) capture this theta edge
  proposed_mechanism: Theta decay accelerates as expiration approaches; non-linear
    schedule allows consistent capture via rolling calendar spreads
  applicable_markets_and_regimes: Index options, equity options, most liquid underlyings
  assumptions:
  - Vol surface remains stable
  - Execution costs can be absorbed into spread width
  - Liquidity permits entry/exit
  data_requirements:
  - option_prices_multiple_expirations
  - bid_ask_spreads
  - execution_fills
  baseline_or_null_hypothesis: Near-term theta advantage is offset by bid-ask and
    execution costs; zero edge
  validation_approach: Backtest rolling calendar spreads; measure profit per spread
    vs cost; calculate max drawdown
  transaction_cost_and_fill_considerations: Calendar spreads require two legs; minimum
    cost ~2-4 vol points for entry+exit+slippage
  robustness_checks:
  - Subsample by underlying moneyness
  - Subsample by vol regime
  - Vary rebalance frequency
  - Test different strike spacing
  rejection_criteria: Reject if Sharpe ratio < 0.5 or if edge disappears after including
    realistic transaction costs
  failure_modes:
  - Vol spike eliminates theta edge
  - Slippage on entry/exit overwhelms profit
  - Liquidity evaporates near expiration
  freshness_concerns: Options market structure (competition, APIs, execution technology)
    has changed significantly since 2014
  unresolved_questions:
  - Optimal roll frequency?
  - Best moneyness selection?
  - Scalable position size?
  _book_id: option-volatility-and-pricing-advanced-trading-strategies-an-2014
  _audit_grade: A
- id: OVAP-H004
  title: Long straddles profit from vol expansion
  status: proposed
  derived_from:
  - OVAP-C9-I007
  - OVAP-C13-I030
  statement: When implied vol is low, buying straddles (call+put) captures vol expansion;
    profit when realized vol > implied vol
  proposed_mechanism: Long gamma position benefits from realized vol exceeding implied
    vol; straddle is convex in spot movements
  applicable_markets_and_regimes: Equities, indices; best in low-vol environments
    (before regime change)
  assumptions:
  - Implied vol is underpriced relative to future realized vol
  - Rehedging can be executed at reasonable cost
  data_requirements:
  - realized_vol_forecast
  - implied_vol_surface
  - hedging_costs
  baseline_or_null_hypothesis: Implied vol correctly prices expected realized vol;
    no edge from long straddle
  validation_approach: 'Backtest: buy straddles when implied vol < target threshold;
    measure P&L when realized vol high'
  transaction_cost_and_fill_considerations: Straddle costs are high on entry (bid-ask);
    rehedging costs accumulate daily
  robustness_checks:
  - Subsample by vol level
  - Subsample by strike moneyness
  - Vary holding period
  - Test stop-loss levels
  rejection_criteria: Reject if Sharpe ratio < 0.4 or edge disappears after including
    gamma hedging costs
  failure_modes:
  - Vol contracts instead of expanding
  - Rehedging losses exceed convexity gains
  - Liquidity deteriorates
  freshness_concerns: Options execution and hedging infrastructure have evolved; costs
    differ significantly from 2014
  unresolved_questions:
  - How to forecast vol reliably?
  - Optimal hedge frequency?
  - Position sizing given tail risk?
  _book_id: option-volatility-and-pricing-advanced-trading-strategies-an-2014
  _audit_grade: A
- id: OVAP-H005
  title: American put early exercise signal responds to ex-dividend dates
  status: proposed
  derived_from:
  - OVAP-C16-I015
  - OVAP-C16-I016
  statement: American puts exercise early spike near ex-dividend dates; exercisers
    rationally compare intrinsic vs continuation value
  proposed_mechanism: Dividends reduce stock price on ex-date; American put holders
    exercise before ex-date to avoid value destruction
  applicable_markets_and_regimes: Dividend-paying equities; most pronounced for high-yielding
    names
  assumptions:
  - Exercisers are rational
  - Dividend calendars are predictable
  - Continuation values can be modeled
  data_requirements:
  - american_put_prices
  - exercise_notifications
  - dividend_dates
  - stock_prices
  baseline_or_null_hypothesis: Early exercise happens randomly; no correlation with
    ex-dividend timing
  validation_approach: Measure correlation between early exercise frequency and ex-dividend
    calendar; test time-series pattern
  transaction_cost_and_fill_considerations: Exercise is internal; replicate costs
    for hedging are material
  robustness_checks:
  - Subsample by dividend yield
  - Subsample by days-to-expiration
  - Subsample by put moneyness
  rejection_criteria: Reject if correlation < 0.6 or no significant spike within 5
    days of ex-date
  failure_modes:
  - Dividend policy changes annually
  - Traders unaware of optimal exercise
  - Broker systems prevent early exercise
  freshness_concerns: Dividend dates and policies change; ex-date rules depend on
    market jurisdiction
  unresolved_questions:
  - Trader awareness of rational exercise strategy?
  - Impact on portfolio Greeks?
  - Predictability?
  _book_id: option-volatility-and-pricing-advanced-trading-strategies-an-2014
  _audit_grade: A
- id: OVAP-H006
  title: Gamma-hedged position P&L scales with realized-minus-implied vol gap
  status: proposed
  derived_from:
  - OVAP-C8-I006
  - OVAP-C5-I026
  statement: Long option hedged to zero gamma (rehedged frequently) P&L = 0.5 * gamma
    * (realized_vol - implied_vol)^2 * time
  proposed_mechanism: Gamma scalping captures the realized vol if market realizes
    higher vol than implied; loss if vol contracts
  applicable_markets_and_regimes: All options; works in trending and ranging markets
    if vol assumption holds
  assumptions:
  - Hedging executed at theoretical prices
  - Continuous or frequent rebalancing possible
  - Vol surface stable
  data_requirements:
  - option_greeks
  - rehedging_fills
  - realized_vol
  - implied_vol
  baseline_or_null_hypothesis: Hedged option P&L is zero (ignoring bid-ask and costs)
  validation_approach: Backtest long option + rehedge; measure actual P&L vs predicted
    by formula; compute Sharpe ratio
  transaction_cost_and_fill_considerations: Rehedging costs are the primary P&L drag;
    costs increase with rehedge frequency
  robustness_checks:
  - Vary hedge frequency (daily/hourly)
  - Subsample by option type
  - Subsample by regime
  - Test edge case (gap events)
  rejection_criteria: Reject if realized P&L correlation to (RV - IV)^2 < 0.6
  failure_modes:
  - Gap moves break hedging assumptions
  - Slippage on hedge fills overwhelms edge
  - Bid-ask too wide to trade profitably
  freshness_concerns: Options execution technology and algorithms have advanced; commission/spread
    environment changed
  unresolved_questions:
  - Optimal hedge frequency for profitability?
  - How to handle gaps?
  - Scalable in live trading?
  _book_id: option-volatility-and-pricing-advanced-trading-strategies-an-2014
  _audit_grade: A
- id: OPTBEG-HYP-001
  title: 1% Risk Rule Maximizes Long-Term Capital Preservation
  status: proposed
  derived_from:
  - OPTBEG-C7-001
  - OPTBEG-C7-002
  statement: Limiting risk per trade to 1% of account capital maximizes survival through
    consecutive loss streaks while maintaining compounding growth potential
  proposed_mechanism: 'Mathematical: (1.0 - 0.01)^100 ≈ 0.37, meaning 100 consecutive
    1% losses leave ~37% of capital. With wins interspersed, capital compounds; strategy
    should survive rare drawdown sequences that would wipe out aggressive sizing.'
  applicable_markets_and_regimes: Any liquid market with traceable stop-loss levels;
    intraday equities, options, futures; less suitable for highly gapped markets or
    thinly traded assets
  assumptions:
  - Stop-loss orders execute at or near specified price
  - Slippage bounded to <2% of trade risk
  - No flash crashes or circuit breaker halts forcing positions open longer
  - Account capital sufficient to margin position
  data_requirements:
  - Historical market data with open/close/high/low for stop-loss calibration
  - Transaction cost model (commissions, spread, slippage)
  - Account equity curve tracking
  baseline_or_null_hypothesis: Traders using no position-sizing rule or fixed-dollar
    sizing suffer equivalent or worse drawdowns and capital depletion faster
  validation_approach: Backtest strategy portfolio over 5-year period with simulated
    1% rule vs. fixed-dollar sizing vs. no-rule control; measure max drawdown, time-to-ruin
    on synthetic loss sequences, median recovery time post-drawdown
  transaction_cost_and_fill_considerations: Spread + commission must remain <0.5%
    of position value; wider spreads require adjusted position sizes downward; after-hours/pre-market
    gaps violate assumption
  robustness_checks:
  - 'Vary market regime: trending vs. choppy vs. gaps'
  - 'Vary transaction costs: +/-50% from baseline'
  - 'Vary win rate: 40%, 50%, 60%'
  - Test partial fill (10% slippage through stop)
  rejection_criteria:
  - Observed max drawdown of 1% rule portfolio exceeds no-rule portfolio by >20% in
    same regime
  - Time-to-recover (break-even after drawdown) for 1% rule > 3x longer than no-rule
    in any tested regime
  - Win rate required to breakeven at 1% sizing > 60% (suggests inadequate edge)
  failure_modes:
  - Gap openings overnight eliminate stop-loss protection; realized loss > 1%
  - Correlation shock (e.g., market-wide selloff) causes simultaneous loss triggers
    across correlated positions
  - 'Leverage cascades: Even 1% position loss amplified by forced liquidation under
    margin call'
  freshness_concerns: 2020 publication; market structure and volatility regimes may
    differ materially from backtesting period; apply regime-detection before live
    trading
  unresolved_questions:
  - Does 1% rule remain optimal for options (where Greeks introduce non-linear risk)
    or only for spot/linear products?
  - How does 1% rule interact with multi-leg strategies (spreads) where position size
    is indirect?
  - 'Is 1% rule too conservative for systematic traders with >60% win rate? Trade-off:
    slower compounding?'
  _book_id: options-trading-for-beginners-a-crash-course-on-how-to-build-2021
  _audit_grade: C
- id: OPTBEG-HYP-002
  title: Covered Call Premium Collection Outperforms Buy-and-Hold in Sideways Markets
  status: proposed
  derived_from:
  - OPTBEG-C10-001
  - OPTBEG-C16-001
  statement: Selling covered calls against owned shares generates alpha (premium income)
    in range-bound or slightly declining markets; returns exceed buy-and-hold on 12-month
    timeframes with <5% downside risk
  proposed_mechanism: Own 100 shares at ; sell 1 call at  strike for  premium; profit
    = max(0, ST - 50) + 2 [for ST <= 55], where ST=stock price at expiry. If ST ends
    between -55, call expires worthless; trader keeps  + dividends + any upside to  =
    + per share (14%+ annualized if 3-month expiry).
  applicable_markets_and_regimes: Stocks with high implied volatility (IV > 50th percentile)
    and low realized vol; dividend-paying stocks; sideways or slight downtrend markets;
    NOT trending bull markets (upside capped)
  assumptions:
  - Stock assigned at expiry if stock price > strike (deterministic if ITM)
  - No early assignment before expiry (American options risk)
  - Dividends not affected by call ownership
  - IV mean reverts; no volatility collapse
  data_requirements:
  - Historical option prices (bid/ask) for strike selection
  - Realized volatility vs. implied volatility decomposition
  - Historical assignment patterns for that underlying
  - Dividend yield and ex-date calendar
  baseline_or_null_hypothesis: Buy-and-hold equities outperform covered calls in bull
    markets; covered calls underperform by ~(call_premium - dividends - buy_and_hold_appreciation)
  validation_approach: Backtest on S&P 500 sector ETFs over 10-year period; compare
    covered-call portfolio (monthly rolls) vs. buy-and-hold on total return, Sharpe
    ratio, max drawdown; stratify by market regime (bull/bear/sideways)
  transaction_cost_and_fill_considerations: Options bid-ask spread costs 0.5-2% of
    premium per roll; commission per leg reduces net premium by 0.1-0.5%; wide-bid-ask
    on ITM calls erodes exit fill quality
  robustness_checks:
  - 'Vary strike selection: ATM vs. 5% OTM vs. 10% OTM'
  - 'Vary roll timing: 14, 21, 30 DTE'
  - Test on high-vol names (tech) vs. low-vol names (utilities)
  - Test during VIX spikes (IV compression); post-compression (collapse)
  rejection_criteria:
  - Covered call total return < buy-and-hold by >3% annualized in sideways regime
  - Sharpe ratio of covered calls worse than buy-and-hold in tested regimes
  - Realized assignment rate differs from theoretical by >25% (indicates model break)
  failure_modes:
  - Stock gaps down below strike on earnings; early assignment at loss
  - 'IV crush post-earnings: premium collected decays faster than time value alone'
  - Stock rallies sharply above strike; opportunity cost (upside cap) hurts relative
    performance
  - Dividend cut; net income drops
  freshness_concerns: Options market structure, IV levels, and broker assignments
    may differ from 2020. Modern zero-commission brokers may have changed call premium
    levels.
  unresolved_questions:
  - Is covered call strategy more profitable on beaten-down dividend stocks vs. stable
    blue chips?
  - Can covered calls hedge portfolio downside better than protective puts?
  - Does early assignment happen often enough to materially reduce returns?
  _book_id: options-trading-for-beginners-a-crash-course-on-how-to-build-2021
  _audit_grade: C
- id: OPTBEG-HYP-003
  title: Fear-Driven Position Abandonment Creates Whipsaws; Discipline Rules Reduce
    This
  status: proposed
  derived_from:
  - OPTBEG-C9-001
  - OPTBEG-C9-002
  statement: Traders who exit positions prematurely due to emotional fear realize
    losses on reversals; mechanical stop-loss / profit-target rules reduce whipsaws
    by 20-40% vs. discretionary traders
  proposed_mechanism: Trader sets 1% stop-loss and 2% target upfront; signal triggers
    entry. If price dips 0.5%, fear triggers early exit at breakeven or small loss.
    Price then reverses to target, but trader missed it. Over many trades, whipsaws
    accumulate; mechanical rules keep trader in winning trades longer.
  applicable_markets_and_regimes: Swing trading (2-10 day holds); trend-following
    strategies; all markets; more acute in choppy/mean-reverting regimes
  assumptions:
  - Trader has pre-defined entry signal (technical/fundamental)
  - Stop-loss and target are mechanistic (not moved emotionally)
  - Time-in-trade is short enough (<10 days) that fear dominates conviction
  data_requirements:
  - Trade log with entry/exit price, reason for exit (plan vs. fear), realized P&L
  - Marked-to-market price at each exit point
  - 'Counterfactual: where would price go if position held to target?'
  baseline_or_null_hypothesis: Discretionary traders perform as well as rule-based
    traders; fear exits have equivalent payoff distribution
  validation_approach: Run backtest of swing trading strategy with fixed rules vs.
    simulated 'fear exits' (exit early at 50% of max loss, 50% of time at random);
    measure realized P&L, win rate, average win/loss ratio
  transaction_cost_and_fill_considerations: Extra exits incur higher commissions;
    early exits may hit worse spreads (liquidity dries up intraday); re-entry commissions
    also add up
  robustness_checks:
  - 'Vary fear trigger: early exit at 25%, 50%, 75% of target'
  - 'Test on different market regimes: trending vs. choppy'
  - 'Test on different timeframes: scalp (1h) vs. swing (5 days)'
  rejection_criteria:
  - Fear-exit strategy outperforms rule-based by >5% in any tested regime (suggests
    rules are too tight)
  - Whipsaw frequency in rule-based strategy > 50% of all trades
  failure_modes:
  - Rules are too loose; real drawdowns exceed tolerance despite mechanical stops
  - 'Market structure breaks (halts, limit-up/down): rule can''t exit'
  - Correlations shift; mechanical rules miss new regime (requires adaptation)
  freshness_concerns: Behavioral finance research supports this; human psychology
    stable; however, market volatility and regime shifts change optimal rule settings
  unresolved_questions:
  - Do professional traders (humans or algos) with long backtested experience overcome
    fear?
  - Is fear-driven exit worse for options (nonlinear Greeks) or equities?
  _book_id: options-trading-for-beginners-a-crash-course-on-how-to-build-2021
  _audit_grade: C
- id: OPTBEG-HYP-004
  title: Leverage Beyond 1:1 Amplifies Drawdown Length; Recovery Time Scales Exponentially
  status: proposed
  derived_from:
  - OPTBEG-C21-001
  - OPTBEG-C9-002
  statement: Margin leverage (e.g., 2:1, 3:1) increases max drawdown and time-to-recovery
    exponentially; a 30% drawdown on 2:1 leverage = 60% account loss; recovery to
    breakeven requires >8x longer than unlevered equivalent
  proposed_mechanism: With 2:1 leverage, a 1% daily loss = 2% account loss. A 15%
    market correction = 30% account loss. If trader has 1.5:1 margin requirement,
    margin call triggers at ~33% loss. Forced liquidation at market-impact prices
    often triggers further loss spiral.
  applicable_markets_and_regimes: All leverage scenarios; most acute during volatility
    spikes (March 2020, Oct 1987); less acute in low-vol environments
  assumptions:
  - Margin requirement fixed (not variable)
  - Liquidation happens at current market price, not favorable
  - No emergency funding available to meet margin call
  data_requirements:
  - Historical drawdown paths (daily) for asset class
  - Margin requirement schedule by broker
  - Time series of price levels post-liquidation (realized slippage)
  baseline_or_null_hypothesis: 'Leverage scales linear with risk: 2x leverage = 2x
    drawdown. No nonlinear amplification.'
  validation_approach: Simulate 1000 random walk paths (GBM) with 1%, 2%, 3% leverage;
    measure actual max drawdown vs. expected, time-to-ruin, recovery time; test across
    vol levels (10%, 30%, 50% annual)
  transaction_cost_and_fill_considerations: Margin interest (e.g., 1-3% annualized)
    compounds losses during leverage buildout; liquidation happens at market impact
    price, not mid
  robustness_checks:
  - 'Vary leverage levels: 1.5x, 2x, 3x, 4x'
  - 'Vary volatility regime: quiet, normal, spike'
  - 'Vary margin requirement: tight vs. loose'
  rejection_criteria:
  - Observed time-to-recovery for 2x leverage < 2x time for 1x (suggests leverage
    not materially harmful)
  - Observed max drawdown < 1.5x expected for 1.5x leverage (suggests model too conservative)
  failure_modes:
  - Broker liquidates at absolute worst price (flash crash); actual loss > theoretical
  - 'Correlated positions: all liquidated simultaneously (worse slippage)'
  - Margin call threshold differs per broker/asset; assumptions break down
  freshness_concerns: Margin requirements tightened post-2008 and post-2020; repo
    market dynamics changed; leverage behavior may differ in modern market structure
  unresolved_questions:
  - Can dynamic deleveraging (reducing leverage on drawdown) prevent spiral?
  - Does options leverage (via spreads) have different recovery dynamics than futures
    margin?
  _book_id: options-trading-for-beginners-a-crash-course-on-how-to-build-2021
  _audit_grade: C
- id: PYALGO-HYP-001
  title: Vectorized backtesting edge estimate inflated by 20-50% vs event-based due
    to slippage and commission underestimation
  status: proposed
  derived_from:
  - PYALGO-C4-001
  - PYALGO-C4-002
  statement: A simple SMA crossover strategy backtested vectorized will show Sharpe
    ratio 20-50% higher than identical strategy backtested event-based with realistic
    slippage (1-5 ticks) and commissions (0.1-0.5 bps).
  proposed_mechanism: Vectorized assumes single close price and fixed commission;
    event-based simulates tick-level entry/exit allowing slippage fill; slippage consumes
    30-50% of small edges.
  applicable_markets_and_regimes:
  - regime: trending
    note: SMA edges largest in trending; slippage impact 30-40%
  - regime: mean-reverting
    note: Edges smaller; slippage impact 50-70%
  - instrument: liquid equities (SPY, QQQ)
    note: Slippage 1-2 ticks
  - instrument: small-cap equities
    note: Slippage 5-20 ticks; vectorized severely overestimates
  assumptions:
  - 'Slippage model: 1-2 ticks for liquid, 5-10 for less liquid'
  - 'Commission: 0.1-0.5 bps per round-trip'
  - Daily data; no intraday regimes
  data_requirements:
  - Tick-level OHLCV or order book for slippage estimation
  - Executed fill prices from live trading or venue data
  baseline_or_null_hypothesis: Edge and Sharpe equal between vectorized and event-based;
    slippage/commission negligible.
  validation_approach: Backtest identical SMA strategy on same data using both vectorized
    and event-based frameworks; measure Sharpe, max drawdown, and trade timing differences.
    Correlate with live results if available.
  transaction_cost_and_fill_considerations: Entry slippage liquidity-dependent; limit
    orders safer than market for small size. Exit slippage amplified during adverse
    moves (gap down). Commission 0.5 bps * 100 trades/year = 0.5% drag on 5% edge.
  robustness_checks:
  - 'Vary slippage model: constant, volatility-proportional, order-size-dependent'
  - Test on trending vs mean-reverting subperiods
  - Test on different liquidity tiers (large-cap vs micro-cap)
  rejection_criteria:
  - If event-based Sharpe > vectorized Sharpe by < 5%, slippage model may be too pessimistic
    or edge robust
  - If rejection occurs on large-cap but not small-cap, liquidity-dependent edge confirmed
  failure_modes:
  - If vectorized edge disappears in backtest (Sharpe < 0), edge is spurious; test
    with bootstrap or subsample
  - If event-based Sharpe < 0 but vectorized > 1.0, over-fitting or lookahead bias
    in vectorized implementation suspected
  freshness_concerns: Slippage and commission rates change with venue rules and market
    structure. Equity markets (1-2 ticks slippage) stable; crypto (5-50 ticks) volatile.
  unresolved_questions:
  - How much of edge is attributable to timing vs alpha signal?
  - Does fractional Kelly (0.5x) reduce sensitivity to slippage overestimation?
  _book_id: python-for-algorithmic-trading-2020
  _audit_grade: A
- id: PYALGO-HYP-002
  title: Linear regression market prediction model unstable across regime change;
    coefficients flip sign
  status: proposed
  derived_from:
  - PYALGO-C5-001
  - PYALGO-C5-002
  statement: Linear regression model trained on 2015-2019 data predicting daily future
    returns will have flipped sign coefficients (mean-reversion → momentum or vice
    versa) when tested on 2020+ data; Sharpe collapses from in-sample 0.5+ to out-of-sample
    < 0.
  proposed_mechanism: Equity market regime in 2015-2019 was mean-reverting (short-term
    momentum reversals); post-2020 regime became more trending (correlation persistence).
    Regression coefficients were optimized for mean-reversion; when trend regime dominates,
    coefficients become counterintuitive.
  applicable_markets_and_regimes:
  - regime: mean-reversion (2015-2019)
    note: Negative coefficients on short-term momentum; positive on reversal signals
  - regime: trending (2020+)
    note: Positive coefficients on momentum; negative on reversal signals
  - instrument: large-cap equities (S&P 500 constituents)
    note: Regime shifts every 3-7 years; expect coefficient instability
  assumptions:
  - Regression model includes momentum features (returns_t-1, ..., returns_t-5)
  - Target is forward return (return_t+1)
  - Model trained on 5+ years of data (in-sample optimization)
  data_requirements:
  - Daily OHLCV for 10+ year period
  - Regime classification or regime-switching indicator (VIX, market correlation)
  baseline_or_null_hypothesis: Coefficients stable across regimes; forward returns
    predictable with constant model.
  validation_approach: Train model on 2015-2019; test on 2020-2022. Measure coefficient
    signs and magnitudes. Repeat train/test on rolling 5-year windows; track coefficient
    stability. Correlate coefficient flips with regime changes (detected via rolling
    Sharpe or correlation).
  transaction_cost_and_fill_considerations: If model flips regime-dependent signals,
    trading costs amplify losses as model churns between contradictory signals. Consider
    regime-switching model or ensemble of regime-specific models instead of single
    OLS.
  robustness_checks:
  - Bootstrap resampling to measure coefficient confidence intervals
  - Lasso/Ridge regression to compare L1/L2-regularized coefficients vs OLS
  - Train/test on alternative regime definitions (sorted by Sharpe, returns, volatility)
  rejection_criteria:
  - If coefficients stable and out-of-sample Sharpe > 0.2, hypothesis rejected; model
    is robust to regime
  - If in-sample Sharpe >> out-of-sample Sharpe but both positive, overfitting suspected
    rather than regime change
  failure_modes:
  - If test-set Sharpe highly negative despite statistical significance of coefficients,
    model captures noise
  - If coefficients flip but out-of-sample Sharpe rises, regime change is beneficial
    (momentum now dominant)
  freshness_concerns: Market regime depends on macroeconomic conditions (rates, inflation,
    risk-on/risk-off); subject to structural change. Machine learning models non-stationary
    by nature; assume all models require periodic retraining (quarterly or annual).
  unresolved_questions:
  - Can regime-detection model (e.g. HMM) predict regime switches in advance? (Forward-looking
    regime switching)
  - Is the correlation of features to forward returns spurious due to common exposure
    to market beta?
  _book_id: python-for-algorithmic-trading-2020
  _audit_grade: A
- id: PYALGO-HYP-003
  title: Kelly Criterion position sizing optimal IF win probability estimated accurately;
    1-2% error in p causes 2-5x wrong leverage
  status: proposed
  derived_from:
  - PYALGO-C10-001
  - PYALGO-C10-002
  statement: If true win probability is 52% but estimated at 50.5% due to overfitting
    or small sample, Kelly formula f* = (0.505*1 - 0.495) / 1 = 1% produces leverage
    1x; if overstated to 53%, f* = 3%, leverage 3x; Kelly allocation highly sensitive
    to p estimate error.
  proposed_mechanism: Kelly formula is linear in (p*b - q); small errors in p (from
    overfitting, data snooping, regime change) cause large errors in f*. Leverage
    ramps non-linearly with edge; strategy using f* suffers 10x larger drawdowns if
    p is wrong.
  applicable_markets_and_regimes:
  - regime: high-edge strategies (p > 55%)
    note: Kelly sizing safe; error in p from 57% → 55% causes 50% leverage reduction
      but strategy still profitable
  - regime: low-edge strategies (p = 50-52%)
    note: Kelly sizing catastrophic; 1% error in p flips strategy from 3x leverage
      to 0.3x or unprofitable
  - instrument: equities with SMA edges (typically p=51-53%)
    note: Overfitting risk high; Kelly over-leverages frequently
  assumptions:
  - Win probability p estimated from backtest sample (N = 100-500 trades)
  - Trade samples are i.i.d. (independence assumption violated in regimes)
  - B (payoff ratio) known accurately
  data_requirements:
  - Trade-by-trade record with entry, exit, P&L
  - Out-of-sample test period to validate p estimate
  baseline_or_null_hypothesis: Win probability is stationary and accurately estimated
    from backtest; Kelly sizing optimal and stable.
  validation_approach: 'Estimate p from in-sample backtest (2010-2018). Validate p
    on out-of-sample period (2019-2022). Measure divergence between in-sample Kelly
    allocation and out-of-sample-optimal allocation. Backtest: apply in-sample Kelly
    to out-of-sample data; measure realized Sharpe vs expected.'
  transaction_cost_and_fill_considerations: Commissions reduce effective edge by 0.2-0.5%;
    Kelly allocation should discount by this amount. If commission affects payoff
    ratio b, Kelly formula changes significantly.
  robustness_checks:
  - Use fractional Kelly (0.5x, 0.25x) to reduce leverage sensitivity
  - Bootstrap confidence intervals on p; report Kelly range (25th-75th percentile)
  - Test Kelly on independent asset class to validate p generalization
  rejection_criteria:
  - If out-of-sample p within 95% confidence interval of in-sample p, hypothesis rejected;
    p is stable
  - If out-of-sample Sharpe > in-sample even with different leverage, p estimate and
    Kelly allocation both conservative
  failure_modes:
  - If out-of-sample p < 50%, strategy was fundamentally unprofitable; Kelly returns
    negative or zero leverage
  - If leverage-search finds optimal leverage 0.5x Kelly or 2x Kelly, Kelly formula
    violated; examine payoff ratio or trade dependence
  freshness_concerns: Win probability is regime-dependent; Kelly must be recomputed
    quarterly or annually. Structural market changes (regulation, latency, competition)
    alter win probability; Kelly requires model updates.
  unresolved_questions:
  - How to estimate p when trades are correlated (clusters of wins/losses)? Standard
    Kelly assumes independence.
  - Should Kelly account for utility penalty for drawdown (e.g. reduce f* to limit
    max drawdown < 20%)?
  _book_id: python-for-algorithmic-trading-2020
  _audit_grade: A
- id: PYALGO-HYP-004
  title: Oanda API latency and rate limits cause real-world slippage 2-10x worse than
    simulated in event-based backtest
  status: proposed
  derived_from:
  - PYALGO-C8-001
  - PYALGO-C10-001
  statement: Oanda streaming quotes have 50-200ms latency; order placement has 100-500ms
    latency; in-sample backtest assumes deterministic execution at quoted price; live
    execution slippage 2-10x larger due to latency, rate limiting (max 200 orders/min),
    and competing traders.
  proposed_mechanism: When trading robot receives signal at time t, Oanda quote may
    be 50-200ms stale. Order placed at t+50ms; execution happens at t+200ms. Price
    moved 2-10 bips against position. Rate limiting causes queue delays if robot places
    too many orders.
  applicable_markets_and_regimes:
  - regime: high-volatility
    note: 50ms latency translates to 2-5 bips slippage; if position sizing high, can
      wipe out edge
  - regime: low-liquidity hours (Asia morning)
    note: Wider spreads; slippage 5-20 bips
  - instrument: major pairs (EUR/USD, USD/JPY)
    note: Tight spreads but high latency; slippage 2-3 bips
  - instrument: emerging market pairs (USDCAD, USDBRL)
    note: Wider spreads; slippage 5-10 bips
  assumptions:
  - Oanda streaming quotes 50-200ms latent
  - Order execution 100-500ms latent
  - Rate limit 200 orders/minute (hard limit)
  data_requirements:
  - Oanda API response time logs (timestamp quote vs timestamp execution)
  - Live order fill prices vs quoted prices at order entry time
  baseline_or_null_hypothesis: Oanda latency and rate limits negligible; backtest
    slippage models accurate for live execution.
  validation_approach: Deploy strategy on Oanda sandbox; measure actual order latency,
    fill price vs quoted price, and rate limit hit frequency. Compare with event-based
    backtest assuming instant execution. Backtest same strategy with latency model
    (50-200ms) and rate limiting (200 orders/min); measure Sharpe vs live results.
  transaction_cost_and_fill_considerations: Order latency impacts both entry and exit;
    exit latency can turn losing trade into breakeven or vice versa. Rate limiting
    means robot cannot scalp more than 200 times/day; strategy must batch orders or
    be longer-term.
  robustness_checks:
  - 'Vary latency model: fixed 100ms, variable 50-200ms, correlated with volatility'
  - 'Test rate-limit queue behavior: FIFO vs priority; measure queue depth and delay'
  - 'Measure fill price distribution: percentiles (10th, 50th, 90th) of slippage'
  rejection_criteria:
  - If live slippage < backtest slippage by > 20%, backtest model too pessimistic;
    adjust model
  - If live Sharpe > (backtest Sharpe - 30%), latency and rate limiting impact negligible
  failure_modes:
  - If rate limiter triggered during drawdown, robot forced to wait; drawdown worsens
  - If streaming connection drops and reconnects, quote gap causes whipsaw fills
  freshness_concerns: Oanda latency infrastructure and rate limits change; verify
    current settings via API. Competing trading traffic affects latency; high-volatility
    periods have increased latency.
  unresolved_questions:
  - How much of trading edge is attributable to latency arbitrage vs fundamental alpha?
  - Can latency be reduced by co-locating in Oanda data center or using FIX protocol?
  _book_id: python-for-algorithmic-trading-2020
  _audit_grade: A
- id: QFADV-H1
  title: Signal generation complexity reduces alpha through overfitting
  status: proposed
  derived_from:
  - QFADV-C4-004
  - QFADV-C4-002
  statement: "Trading algorithms using complex signal generation models (neural networks,\
    \ \nensemble methods) achieve higher in-sample performance than simple models,\
    \ \nbut out-of-sample performance degradation is larger due to overfitting to\
    \ \nhistorical market patterns.\n"
  proposed_mechanism: "Complex models fit both signal and noise in training data.\
    \ When applied to \nnew regimes, noise-fitting components fail while signal components\
    \ remain. \nNet effect: lower Sharpe ratio and higher drawdowns in live trading.\n"
  applicable_markets_and_regimes:
  - Equities with moderate volatility
  - Crypto spot with high volatility
  - Trending and range-bound regimes
  assumptions:
  - Historical data representative of future distributions
  - Model regularization insufficient for regime change
  - Training period captures representative market conditions
  data_requirements:
  - 5+ years historical price and volume data
  - Out-of-sample test periods not used in training
  - Cross-validation using walk-forward methodology
  baseline_or_null_hypothesis: "Simple moving average or momentum models show similar\
    \ out-of-sample \nperformance to complex models when properly cross-validated.\n"
  validation_approach: '1. Compare in-sample R² between simple and complex models

    2. Measure out-of-sample performance degradation

    3. Apply walk-forward testing with expanding windows

    4. Stress test during regime changes (2008, 2020, 2022)

    '
  transaction_cost_and_fill_considerations: "Complex models may generate more frequent\
    \ signals with smaller expected moves, \nmaking transaction costs more impactful.\
    \ Paper trading should include realistic \nslippage and commissions.\n"
  robustness_checks:
  - Different train/test splits
  - Different historical periods
  - Parameter sensitivity analysis
  - Stress testing with synthetic regimes
  rejection_criteria: "If walk-forward out-of-sample Sharpe ratio >= simple model\
    \ Sharpe ratio \nacross 3+ independent periods, hypothesis rejected.\n"
  failure_modes:
  - Overfitting penalty absorbed by transaction costs making model non-viable
  - Catastrophic loss during unexpected regime
  freshness_concerns: "Market microstructure evolves. Parameters optimal in 2020 may\
    \ be suboptimal \nin 2024. Continuous reoptimization required.\n"
  unresolved_questions:
  - What regularization strength prevents overfitting?
  - How frequently should models be reoptimized?
  - Does ensemble complexity provide diversification benefit?
  _book_id: quantitative-finance-advanced-analysis-with-python-a-compreh-2024
  _audit_grade: B
- id: QFADV-H2
  title: Backtesting implementation fidelity critical to forward performance
  status: proposed
  derived_from:
  - QFADV-C6-001
  - QFADV-C8-001
  statement: "Backtesting results provide optimistic estimates of live performance\
    \ when \nimplementation does not faithfully replicate: order execution latency,\
    \ \nmarket microstructure dynamics, realistic slippage, or fee structures.\n"
  proposed_mechanism: "Backtester approximations (constant-slippage, no-latency, perfect-fill\
    \ \nassumptions) systematically overestimate profitability. Live implementation\
    \ \nmust use realistic models of microstructure.\n"
  applicable_markets_and_regimes:
  - High-frequency strategies most sensitive
  - Illiquid assets or periods of stress
  - Volatile regimes where slippage increases
  assumptions:
  - Order execution behavior can be accurately modeled
  - Historical microstructure representative of future
  data_requirements:
  - Tick-level order book data
  - Actual execution latency measurements
  - Fee schedule for each venue
  baseline_or_null_hypothesis: "Backtester with simplified assumptions (constant slippage,\
    \ instant fill) \nproduces Sharpe ratio within 10% of live results.\n"
  validation_approach: '1. Compare paper trading results to live trading results

    2. Decompose performance attribution: signal vs execution quality

    3. Measure realized slippage against backtested assumption

    4. Compare actual fills to simulated order execution

    '
  transaction_cost_and_fill_considerations: 'This hypothesis directly addresses transaction
    costs and fill quality.

    '
  robustness_checks:
  - Test with different broker APIs
  - Measure latency impact under network congestion
  - Stress test during low liquidity periods
  rejection_criteria: "If paper trading Sharpe ratio within 15% of live Sharpe ratio\
    \ over 90-day \nperiod, hypothesis rejected.\n"
  failure_modes:
  - Systemic underestimation of slippage in all strategies
  - Unforeseen microstructure changes
  freshness_concerns: "Market structure evolving (tick sizes, market fragmentation,\
    \ dark pools). \nModels should be refreshed annually.\n"
  unresolved_questions:
  - What slippage model best captures behavior across regimes?
  - How to model predatory HFT detection and avoidance?
  _book_id: quantitative-finance-advanced-analysis-with-python-a-compreh-2024
  _audit_grade: B
- id: QFADV-H3
  title: Sentiment signals from public data degrade rapidly as adoption increases
  status: proposed
  derived_from:
  - QFADV-C7-003
  - QFADV-C9-003
  statement: "Trading signals derived from news sentiment or social media sentiment\
    \ \nshow significant predictive power when initially deployed, but alpha \ndecays\
    \ as more market participants adopt similar strategies.\n"
  proposed_mechanism: "Early sentiment-signal adopters capture alpha by acting before\
    \ consensus \nforms. As adoption spreads, signal timing lags market moves. Eventually\
    \ \nsignal becomes coincident with price moves rather than leading indicator.\n"
  applicable_markets_and_regimes:
  - Equities with event-driven catalysts
  - Crypto with high sentiment sensitivity
  assumptions:
  - Sentiment data predictive of prices
  - Strategy adoption creates crowding
  - Signal decay monotonic over time
  data_requirements:
  - High-frequency sentiment data (Twitter, news wires)
  - Price data at sentiment update granularity
  - Multi-year historical data to measure decay
  baseline_or_null_hypothesis: "Sentiment signal Sharpe ratio is constant across time\
    \ periods; no decay \nwith strategy adoption.\n"
  validation_approach: '1. Measure signal predictive power in rolling windows (3-month,
    6-month)

    2. Compare early vs recent performance of same signal

    3. Correlate strategy popularity with signal decay

    4. Identify inflection point where alpha turns negative

    '
  transaction_cost_and_fill_considerations: "High-frequency sentiment trading may\
    \ incur frequent small transaction costs, \nrequiring alpha threshold before strategy\
    \ becomes viable.\n"
  robustness_checks:
  - Different sentiment data sources
  - Different time periods
  - Different assets
  rejection_criteria: "If sentiment signal maintains Sharpe ratio > 1.0 across 5+\
    \ years in \nout-of-sample data, hypothesis rejected.\n"
  failure_modes:
  - Sentiment data source becomes unreliable or unavailable
  - Regulatory restriction on sentiment data usage
  freshness_concerns: "High freshness risk. Current sentiment data (2024) may have\
    \ different \npredictive power than historical data. Continuous monitoring required.\n"
  unresolved_questions:
  - At what adoption level does alpha fully disappear?
  - What alternative sentiment sources might provide longer-lived edge?
  _book_id: quantitative-finance-advanced-analysis-with-python-a-compreh-2024
  _audit_grade: B
- id: QFADV-H4
  title: Risk assessment parameters must adapt to regime for algorithm stability
  status: proposed
  derived_from:
  - QFADV-C1-001
  - QFADV-C8-002
  statement: "Trading algorithms with fixed risk parameters (position size limits,\
    \ \ndrawdown stops, volatility targets) experience unstable behavior during \n\
    market regime changes. Algorithms with adaptive risk parameters maintain \nstability\
    \ across regimes.\n"
  proposed_mechanism: "Fixed risk parameters appropriate for normal regimes become\
    \ too loose \nduring volatility spikes and too tight during calm periods. Adaptive\
    \ \nparameters adjust to current regime volatility/correlation, maintaining \n\
    consistent risk exposure.\n"
  applicable_markets_and_regimes:
  - All strategies
  - Relevant during regime transitions
  assumptions:
  - Regime can be detected from recent data
  - Risk parameters can be dynamically adjusted
  - Regime detection does not introduce latency issues
  data_requirements:
  - Volatility time series
  - Correlation matrices
  - Drawdown histories across regimes
  baseline_or_null_hypothesis: "Fixed risk parameters produce stable performance across\
    \ market regimes \nwithout adaptation.\n"
  validation_approach: '1. Backtest fixed-parameter algorithm across 2008, 2020, 2022
    stress periods

    2. Measure maximum drawdown vs regime volatility

    3. Compare to adaptive algorithm performance in same periods

    4. Validate regime detection accuracy during transitions

    '
  transaction_cost_and_fill_considerations: "Frequent parameter adjustment might increase\
    \ market impact if position \nsizes change dramatically. Gradual transitions recommended.\n"
  robustness_checks:
  - Different regime detection methods
  - Different adaptation schedules
  - Stress test during flash crashes
  rejection_criteria: "If fixed-parameter algorithm maintains Sharpe ratio within\
    \ 20% of adaptive \nalgorithm across all stress periods, hypothesis rejected.\n"
  failure_modes:
  - Regime detection lag causes pro-cyclical risk adjustments
  - Parameter adaptation triggers market impact
  freshness_concerns: "Regime detection models should be refreshed with recent data\
    \ to remain \npredictive.\n"
  unresolved_questions:
  - What regime detection method optimal?
  - How quickly to adapt parameters without excessive turnover?
  _book_id: quantitative-finance-advanced-analysis-with-python-a-compreh-2024
  _audit_grade: B
- id: SMIB-H-001
  title: Multi-timeframe alignment improves trade entry quality
  status: proposed
  derived_from:
  - SMIB-C1-009
  - SMIB-C1-010
  - SMIB-C1-016
  statement: 'Entries triggered when both daily (or lower) and weekly (or higher)
    timeframe indicators align

    (e.g., weekly uptrend + daily support bounce) have higher win rate and lower drawdown
    than

    entries on single timeframe alone.

    '
  proposed_mechanism: 'Multi-timeframe alignment acts as a regime filter. Higher-timeframe
    trend provides conviction

    and reduces false breakouts. Lower-timeframe entry removes noise and improves
    fill.

    '
  applicable_markets_and_regimes: 'Equities (US large-cap, mid-cap); trending and
    ranging market regimes.

    '
  assumptions:
  - Higher timeframe trend persists over lower timeframe entry period
  - Trader has discipline to wait for alignment
  - Charts are correctly drawn with support/resistance lines
  data_requirements:
  - OHLCV data at least daily; intraday data for lower timeframe entries
  - Marked turning points (valleys/peaks) for technical levels
  baseline_or_null_hypothesis: 'Single-timeframe entries (daily only or intraday only)
    are equally effective; or multi-timeframe

    alignment adds no signal value (p-value > 0.05).

    '
  validation_approach: '1. Backtest two-stage entry (weekly align + daily signal)
    vs. single-stage (daily signal only)

    2. Measure win rate, avg-win, avg-loss, and drawdown by alignment

    3. Control for survivor bias and market regime

    4. Test robustness across 50+ years of data and across different stock universes

    '
  transaction_cost_and_fill_considerations: 'Multi-timeframe waiting increases hold-time
    before entry; limit-order strategy partially mitigates entry slippage.

    '
  robustness_checks:
  - Sensitivity to turning-point detection method (visual vs. automated peak/valley)
  - Sensitivity to support/resistance line interpretation
  - Performance in high-volatility vs. low-volatility regimes
  rejection_criteria:
  - Win rate of multi-timeframe entries ≤ win rate of single-timeframe after transaction
    costs
  - Average drawdown of multi-timeframe entries > single-timeframe by >10%
  failure_modes:
  - Higher-timeframe trend reverses mid-trade; entry was false alignment
  - Price gaps through support level overnight; limit order never filled
  freshness_concerns: 'Multi-timeframe analysis relies on visual chart reading; modern
    automated detection methods may improve performance.

    '
  unresolved_questions:
  - What is the optimal timeframe ratio (e.g., daily+weekly vs. 1-hour+daily)?
  - Does alignment improve performance on stocks with poor liquidity or high spreads?
  _book_id: stock-market-investing-for-beginners-2020
  _audit_grade: B
- id: SMIB-H-002
  title: Dollar-cost averaging (DCA) accumulation over 7+ years produces positive
    returns in most regimes
  status: proposed
  derived_from:
  - SMIB-C1-004
  - SMIB-C1-005
  statement: 'Fixed-amount monthly investing over 7-14 years (spanning two economic
    cycles) produces positive

    terminal wealth and lower drawdown than lump-sum investing in the same period.

    '
  proposed_mechanism: 'DCA reduces sequence-of-returns risk by averaging entry price.
    Early entries into bear market

    capture low prices; later entries into recovery capture rebound.

    '
  applicable_markets_and_regimes: 'Equities (diversified index funds); cyclic regimes
    containing full bull + bear cycles.

    '
  assumptions:
  - Economic cycles are approximately 7-14 years
  - Market recovers to prior highs within 7-14 years
  - Investor does not panic-sell in bear market
  data_requirements:
  - Monthly closing prices for 7+ year periods
  - Test across multiple historical start dates to capture different regimes
  baseline_or_null_hypothesis: 'DCA produces no better risk-adjusted returns than
    lump-sum at start of period or quarterly rebalancing.

    '
  validation_approach: '1. Simulate DCA on S&P 500 monthly data from 1950-2024

    2. Compute terminal wealth, annualized return, max drawdown, Sharpe ratio vs.
    lump-sum alternatives

    3. Stratify by bear/bull regime entry date

    '
  transaction_cost_and_fill_considerations: 'Monthly transactions incur small bid-ask
    spreads; commissions are negligible for index funds.

    '
  robustness_checks:
  - Test across different DCA periods (weekly, quarterly, annual)
  - Test across different stock universes (small-cap, emerging)
  - Test sensitivity to market-timing (enter at bull peak vs. bear trough)
  rejection_criteria:
  - Lump-sum investing at start of 7-year window outperforms DCA by >20% annualized
  - DCA maximum drawdown is >20% worse than lump-sum
  failure_modes:
  - Permanent loss if company fails (single-stock DCA) or index enters secular bear
  - Inflation erodes purchasing power; real returns may be negative in stagflation
  freshness_concerns: 'Interest rates and inflation dynamics have changed since 2020;
    passive indexing has become even cheaper.

    '
  unresolved_questions:
  - Is 7 years empirically validated as the optimal minimum horizon, or is it heuristic?
  - Does DCA outperform trend-following or other dynamic allocation methods?
  _book_id: stock-market-investing-for-beginners-2020
  _audit_grade: B
- id: SMIB-H-003
  title: Stop-loss placement at support/resistance reduces drawdown without material
    impact on win rate
  status: proposed
  derived_from:
  - SMIB-C1-006
  - SMIB-C1-007
  statement: 'Placing stop-loss orders at technical support/resistance levels (rather
    than arbitrary percentages

    or tight mechanical stops) maintains acceptable win rate while reducing average
    loss size and maximum drawdown.

    '
  proposed_mechanism: 'Support/resistance levels reflect consensus trader psychology;
    stops placed beyond these levels avoid

    triggering on noise. Stops inside levels are hit by whipsaw, increasing false
    exits.

    '
  applicable_markets_and_regimes: 'Equities (liquid names with clear chart patterns);
    trending and ranging regimes.

    '
  assumptions:
  - Support/resistance levels are predictive of bounce or reversal
  - Stop orders are guaranteed to fill within specified price
  - Trader has discipline not to move stops emotionally
  data_requirements:
  - Daily+ OHLCV data; manually or algorithmically marked support/resistance levels
  baseline_or_null_hypothesis: 'Randomly-placed stops (e.g., 2% below entry) have
    similar risk-return profile to support/resistance stops.

    '
  validation_approach: '1. Backtest swing trades with stops at support (technical)
    vs. 2%/5%/10% fixed stops

    2. Measure win rate, average loss, max-loss, max-drawdown by stop type

    3. Control for holding period (longer holds warrant wider stops)

    '
  transaction_cost_and_fill_considerations: 'Support/resistance stops are wider; fewer
    false fills = lower slippage.

    '
  robustness_checks:
  - Sensitivity to support/resistance detection method (visual vs. automated)
  - Performance in high-volatility vs. calm periods
  - Performance across market cap and sector
  rejection_criteria:
  - Support/resistance stops have win rate <50% after slippage
  - Average loss at support/resistance stops is not materially smaller than fixed
    stops
  failure_modes:
  - 'Gap risk: market gaps through support overnight on bad news'
  - 'Whipsaw: stop hit, then price recovers and makes target'
  - 'Over-optimization: support/resistance detected too tightly'
  freshness_concerns: 'Market structure and liquidity patterns have evolved; support/resistance
    may be less sticky.

    '
  unresolved_questions:
  - What distance beyond support/resistance is optimal (1%, 2%, 5%)?
  - Do algorithmic methods improve support/resistance detection vs. manual charting?
  _book_id: stock-market-investing-for-beginners-2020
  _audit_grade: B
- id: SMIB-H-004
  title: Fundamental analysis as pre-filter, technical analysis as entry trigger,
    improves signal quality
  status: proposed
  derived_from:
  - SMIB-C1-001
  - SMIB-C1-008
  - SMIB-C1-009
  statement: 'A two-stage stock selection process—fundamental metrics to build watchlist,
    then technical

    setup to trigger entry—yields higher win rate and lower false-signal rate than
    either stage alone.

    '
  proposed_mechanism: 'Fundamental analysis filters for quality/value; technical analysis
    identifies favorable entry timing.

    Combination reduces entry into deteriorating names and improves entry price.

    '
  applicable_markets_and_regimes: 'Equities (mid/large-cap with good fundamentals);
    trending regimes.

    '
  assumptions:
  - Fundamental metrics are predictive of outperformance
  - Technical patterns are predictive of short-term price reversion or continuation
  data_requirements:
  - 'Fundamental data: P/E, ROE, revenue growth, debt ratios'
  - 'Technical data: daily+ OHLCV, support/resistance marks'
  baseline_or_null_hypothesis: 'Single-stage selection (fundamentals only, or technical
    only) is equally effective.

    '
  validation_approach: '1. Backtest: identify fundamentally good names; then (a) enter
    on technical setup, (b) random entry, (c) dollar-cost-average entry

    2. Measure win rate, avg-win, avg-loss, Sharpe, max-drawdown by method

    3. Control for selection bias

    '
  transaction_cost_and_fill_considerations: 'Technical entry may occur at better price
    than immediate lump-sum.

    '
  robustness_checks:
  - Sensitivity to fundamental screen parameters (P/E cutoff, growth threshold)
  - Sensitivity to technical pattern definition
  - Performance across different market regimes and sectors
  rejection_criteria:
  - Two-stage win rate ≤ single-stage after accounting for reduced trade count
  - Average loss on two-stage is materially higher than single-stage
  failure_modes:
  - Fundamental deterioration during hold period
  - Technical setup breaks in regime change
  - Watchlist becomes stale; missed names
  freshness_concerns: 'Real-time fundamental data availability and accuracy have improved
    since 2020.

    '
  unresolved_questions:
  - What fundamental metrics are most predictive for this approach?
  - How often should watchlist be refreshed?
  _book_id: stock-market-investing-for-beginners-2020
  _audit_grade: B
- id: SMIB-H-005
  title: Risk-first trade planning (define loss before defining target) improves discipline
    and reduces ruin risk
  status: proposed
  derived_from:
  - SMIB-C1-013
  statement: 'Traders who pre-define maximum acceptable loss per trade (stop level
    and position size) before

    entry achieve lower realized drawdown and fewer catastrophic losses than traders
    who plan targets first.

    '
  proposed_mechanism: 'Pre-defining loss removes emotional override and FOMO; trader
    enters with clear "no worse than X" frame.

    Planning target after loss-definition ensures risk-reward ratio is acceptable.

    '
  applicable_markets_and_regimes: 'All strategies and timeframes; all market regimes.

    '
  assumptions:
  - Traders can maintain psychological discipline
  - Pre-defined rules reduce emotional override
  data_requirements:
  - 'Trade log: entry, stop, target, actual stop-hit, actual exit'
  - 'Measure compliance: % of stops moved, % of trades that exceeded pre-defined loss'
  baseline_or_null_hypothesis: 'Traders with pre-defined stops have the same drawdown
    and ruin risk as those without.

    '
  validation_approach: '1. Survey trader logs: compare traders with strict stop-loss
    discipline vs. ad-hoc stop placement

    2. Measure realized drawdown, % of trades hitting stops, average-loss distribution

    3. Backtest: force adherence to pre-planned stops vs. allow dynamic re-planning

    '
  transaction_cost_and_fill_considerations: 'Stop slippage: stop-loss orders may fill
    worse than predefined stop price.

    '
  robustness_checks:
  - Sensitivity to trader type (discretionary vs. algorithmic)
  - Sensitivity to market regime (calm vs. gap-risk environments)
  rejection_criteria:
  - Disciplined traders have same or higher realized drawdown as non-disciplined
  - Stop slippage negates benefit of pre-planning
  failure_modes:
  - 'Gap risk: overnight gap through stop; much worse fill than planned'
  - Trader violates discipline under stress (moves stops)
  freshness_concerns: 'Psychological biases have not changed; trading psychology remains
    relevant.

    '
  unresolved_questions:
  - Can algorithmic position management enforce this discipline better than human?
  - How much does training/experience improve stop discipline?
  _book_id: stock-market-investing-for-beginners-2020
  _audit_grade: B
- id: SUPSTK-H1
  title: Backtester simulation fidelity directly impacts live strategy performance
  status: proposed
  derived_from:
  - SUPSTK-C3-004
  - SUPSTK-C6-005
  statement: Strategies backtest favorably under unrealistic assumptions (perfect
    fills, zero slippage, no market impact) but fail or underperform in live trading
    due to cost and liquidity realities
  proposed_mechanism: Backtest unfidelity creates optimism bias; live market impact
    and costs are substantial
  applicable_markets_and_regimes: All equity markets; particularly relevant in low-liquidity
    regimes and for high-turnover strategies
  assumptions:
  - Backtest simulation can be calibrated to match real execution
  - Historical market impact and liquidity patterns persist
  - Live trading conditions resemble backtest period
  data_requirements:
  - Historical tick-level market data with full order book
  - Actual execution fills and slippage from live trading
  - Historical bid-ask spreads and order book depth
  baseline_or_null_hypothesis: 'Backtest returns = live returns (null); hypothesis:
    live returns < backtest returns by X% due to costs'
  validation_approach: Compare backtest Sharpe, max drawdown, win rate vs live performance;
    calculate degradation factor
  transaction_cost_and_fill_considerations: Model order slippage, market impact (temporary
    and permanent), commissions, borrowing costs
  robustness_checks:
  - Vary cost assumptions ±20% and measure sensitivity
  - Test on out-of-sample periods
  - Stress test in low-liquidity market conditions
  rejection_criteria: Live returns exceed backtest by >10% or tracking error > 50%
    (indicates poor calibration)
  failure_modes:
  - 'Model drift: market microstructure changes'
  - 'Liquidity crises: historical patterns break down'
  - Technology failure causing execution mismatches
  freshness_concerns: Market structure changes (tick sizes, venue consolidation, circuit
    breakers) may invalidate historical cost models
  unresolved_questions:
  - How to model future market impact for novel strategies?
  - How sensitive are grid strategies to tick-size and venue changes?
  _book_id: super-stock-trading-pro-algorithmic-trading-with-python
  _audit_grade: B
- id: SUPSTK-H2
  title: 'Parameter optimization bias: in-sample overfitting leads to false positive
    strategies'
  status: proposed
  derived_from:
  - SUPSTK-C6-006
  statement: Strategies optimized on a fixed historical dataset yield inflated backtest
    returns due to overfitting to noise. Out-of-sample performance is significantly
    lower than in-sample
  proposed_mechanism: Optimizer fits parameters to historical noise, not signal; generalization
    to new data is poor
  applicable_markets_and_regimes: All asset classes; particularly acute for strategies
    with many parameters or high-frequency trading
  assumptions:
  - Historical data contains noise as well as signal
  - Future market conditions differ from optimization period
  - Parameters optimized in one regime will not work in others
  data_requirements:
  - In-sample (training) and out-of-sample (hold-out test) historical data
  - Multiple regime examples to validate across conditions
  baseline_or_null_hypothesis: 'In-sample Sharpe = out-of-sample Sharpe (null); hypothesis:
    out-of-sample Sharpe degrades by X%'
  validation_approach: Walk-forward analysis; hold-out test set; Monte Carlo random
    optimization; cross-validation
  transaction_cost_and_fill_considerations: Include transaction costs in both in-sample
    and out-of-sample backtests to ensure fair comparison
  robustness_checks:
  - 'Random search vs grid search: compare in/out-of-sample ratios'
  - Test on synthetic data with known signal-to-noise ratio
  - Monte Carlo permutation test
  rejection_criteria: Out-of-sample Sharpe < 50% of in-sample (indicates overfitting);
    strategy rejected
  failure_modes:
  - Trader overconfidence from inflated backtest metrics
  - Capital wasted on non-robust strategies
  - Live trading loss
  freshness_concerns: Market regimes shift over time; strategies robust in one era
    may not be in the next
  unresolved_questions:
  - How many out-of-sample test points are needed to reject overfitting?
  - How do grid and stock strategies differ in overfitting susceptibility?
  _book_id: super-stock-trading-pro-algorithmic-trading-with-python
  _audit_grade: B
- id: SUPSTK-H3
  title: Market-making strategies profit from spread capture but face inventory risk
  status: proposed
  derived_from:
  - SUPSTK-C7-007
  statement: Market-making algorithms profit by capturing bid-ask spreads through
    frequent quoting and inventory management, but face adverse selection and gap
    risk if market moves against inventory
  proposed_mechanism: Capture spread via rapid buy/sell cycles; hedge inventory via
    offsetting trades or time decay
  applicable_markets_and_regimes: Liquid equity markets, crypto spot markets; less
    effective in trending or volatile regimes
  assumptions:
  - Bid-ask spread remains stable
  - Inventory can be hedged quickly
  - Technology latency is low
  - No regulatory restrictions on quoting/cancellation
  data_requirements:
  - Full order book (top 10-20 levels) at high frequency
  - Executed trade fills and timing
  - Inventory tracking data
  baseline_or_null_hypothesis: 'Market-making zero PnL (null); hypothesis: positive
    expected PnL from spread capture'
  validation_approach: Backtest market-making algorithm on simulated order book; measure
    spread capture, inventory turnover, and adverse selection losses
  transaction_cost_and_fill_considerations: Commission per trade, borrowing costs,
    funding costs for inventory positions
  robustness_checks:
  - Stress test inventory size limits
  - Test in high-volatility periods
  - Vary quote cancellation rates
  rejection_criteria: Adverse selection losses exceed spread capture; strategy unprofitable
  failure_modes:
  - Gap move overnight or market halt; inventory blown up
  - Regulatory action against aggressive quoting
  - Technological failure leading to unhedged positions
  freshness_concerns: Exchanges have changed tick sizes and circuit breakers; venue
    consolidation affects spread patterns
  unresolved_questions:
  - How to optimally size inventory given volatility regime?
  - What inventory risk metrics are most predictive of blowup?
  _book_id: super-stock-trading-pro-algorithmic-trading-with-python
  _audit_grade: B
- id: SUPSTK-H4
  title: Reinforcement learning can discover trading policies but risks reward hacking
    and non-stationarity
  status: proposed
  derived_from:
  - SUPSTK-C9-008
  statement: RL agents can learn trading policies from simulated markets but face
    risks of reward hacking (gaming the reward function) and poor generalization to
    non-stationary live markets
  proposed_mechanism: RL agent learns via exploration and exploitation in simulated
    environment; may find spurious correlations or exploit flaws in simulation
  applicable_markets_and_regimes: All asset classes in principle; most tested in equity
    and crypto
  assumptions:
  - Simulation environment accurately models real markets
  - Reward function captures true trading objectives
  - Agent exploration is sufficient but controlled
  - Market regimes remain stationary during RL training
  data_requirements:
  - High-fidelity market microstructure simulator
  - Historical market data for environment validation
  - Regime classification to segment training data
  baseline_or_null_hypothesis: 'RL policy = random trading (null); hypothesis: RL
    policy outperforms baseline on out-of-sample data'
  validation_approach: Backtest RL policy on held-out test data; compare vs simple
    baseline strategies; measure reward in backtest vs live
  transaction_cost_and_fill_considerations: Include realistic slippage, commissions,
    and market impact in RL reward function
  robustness_checks:
  - Test on multiple market regimes
  - Verify reward not gaming (e.g., taking excessive leverage)
  - Out-of-distribution market conditions
  rejection_criteria: RL policy fails on out-of-sample or exhibits extreme behavior
    (high leverage, churning)
  failure_modes:
  - 'Simulation gap: RL learns patterns that don''t exist in real markets'
  - 'Reward hacking: agent exploits simulation unrealism'
  - 'Non-stationarity: policy trained on one regime fails in another'
  freshness_concerns: Market regimes shift; RL policies may not adapt in real-time
  unresolved_questions:
  - How to design RL reward functions that don't incentivize dangerous behavior?
  - How to efficiently retrain RL policies as markets evolve?
  _book_id: super-stock-trading-pro-algorithmic-trading-with-python
  _audit_grade: B
- id: SUPSTK-H5
  title: Event-driven execution architecture reduces latency vs polling-based systems
  status: proposed
  derived_from:
  - SUPSTK-C13-013
  statement: Event-driven systems that react to market data events (ticks, fills)
    have lower median latency and more consistent latency compared to polling-based
    systems
  proposed_mechanism: Event notification triggers order decisions immediately without
    waiting for next poll cycle
  applicable_markets_and_regimes: All asset classes; particularly important for high-frequency
    and grid strategies
  assumptions:
  - Event ordering is guaranteed
  - Event handler latency is predictable
  - No event loss in race conditions
  data_requirements:
  - Instrumentation of event latency (event time, handler start time, handler end
    time)
  - Comparison data from polling systems
  baseline_or_null_hypothesis: 'Event and polling latencies are equal (null); hypothesis:
    event latency < polling latency by X ms'
  validation_approach: Measure end-to-end order latency; compare percentile latencies
    (p50, p95, p99)
  transaction_cost_and_fill_considerations: Lower latency can reduce slippage and
    improve fill quality
  robustness_checks:
  - Test under high event frequency
  - Test under CPU contention
  - Measure tail latencies (p99, p99.9)
  rejection_criteria: Event latency >= polling latency or tail latencies unacceptable
    (e.g., p99 > 100ms)
  failure_modes:
  - Event ordering violation in asynchronous systems
  - Event loss or duplicate delivery
  - Event handler crash without recovery
  freshness_concerns: Modern trading technology constantly evolving; latency profiles
    change
  unresolved_questions:
  - How to guarantee event ordering and no-loss delivery in distributed systems?
  - What is acceptable latency for grid strategies?
  _book_id: super-stock-trading-pro-algorithmic-trading-with-python
  _audit_grade: B
- id: TAE-HYP-001
  title: RSI mean reversion at extremes
  status: proposed
  derived_from:
  - TAE-C13-001
  - TAE-C13-002
  statement: When RSI(14) > 70, price will revert downward by at least 1% within 5
    bars; when RSI < 30, price will revert upward by at least 1% within 5 bars.
  proposed_mechanism: Overbought/oversold conditions trigger profit-taking or short-covering.
  applicable_markets_and_regimes: Equities in range-bound or mean-reversion environments;
    ineffective in strong trends.
  assumptions:
  - RSI period = 14 bars
  - No gap fills or limit moves prevent mean reversion
  data_requirements:
  - OHLC bars
  - RSI(14) computed from close
  baseline_or_null_hypothesis: RSI at extreme levels has no predictive power; reversals
    occur at same frequency as non-extreme readings.
  validation_approach: 'Backtest: identify RSI > 70 and < 30 points; measure % reversals
    within 5 bars; compare win rate to random entry.'
  transaction_cost_and_fill_considerations: Entry slippage 1-2 ticks; exit at 1% profit
    may miss longer moves; tight stops needed to limit losses.
  robustness_checks:
  - Test on multiple timeframes (5min, 1H, daily)
  - Test on different asset classes
  - Vary RSI period and threshold
  rejection_criteria: If win rate < 50% or payoff ratio < 1.2 over >1000 trades, hypothesis
    rejected.
  failure_modes:
  - RSI whipsaw in strong trends
  - Slippage exceeds 1% profit target
  freshness_concerns: 2015 text; modern high-frequency trading may reduce mean reversion
    periods.
  unresolved_questions:
  - Are RSI extremes more predictive after specific market structure shifts?
  - Does regime (VIX, volatility) affect success rate?
  _book_id: technical-analysis-explained-2015
  _audit_grade: B
- id: TAE-HYP-002
  title: MA crossover trend identification
  status: proposed
  derived_from:
  - TAE-C11-001
  - TAE-CROSS-001
  statement: When SMA(10) crosses above SMA(50), initiate long; when SMA(10) crosses
    below SMA(50), initiate short. Hold until opposite crossover.
  proposed_mechanism: MA crossover signals trend initiation; golden cross (fast above
    slow) indicates bullish momentum.
  applicable_markets_and_regimes: Trending markets; breakdowns in range-bound/choppy
    conditions.
  assumptions:
  - 'SMA periods: 10 (fast), 50 (medium)'
  data_requirements:
  - OHLC bars; closing price for SMA
  baseline_or_null_hypothesis: MA crossovers have no predictive power; random entry
    yields same risk-adjusted returns.
  validation_approach: Backtest crossover signals; measure win rate, Sharpe, maximum
    drawdown vs buy-and-hold.
  transaction_cost_and_fill_considerations: Slippage 1-3 ticks on entry; MA lag means
    entry after trend already started.
  robustness_checks:
  - 'Test periods: (10,50), (20,100), (5,20)'
  - Compare SMA vs EMA
  rejection_criteria: If Sharpe < 0.5 or win rate < 45% over >500 trades, reject.
  failure_modes:
  - Late entry due to MA lag
  - Whipsaws in choppy markets
  freshness_concerns: Heavily studied; unlikely to be profitable alone in modern markets.
  unresolved_questions:
  - Does combining MA with volume confirmation improve results?
  _book_id: technical-analysis-explained-2015
  _audit_grade: B
- id: TAE-HYP-003
  title: Trendline break as reversal signal
  status: proposed
  derived_from:
  - TAE-C6-001
  - TAE-CROSS-001
  statement: When price closes below (in uptrend) or above (in downtrend) a 2+ bar
    trendline, reversal probability is >60%.
  proposed_mechanism: Trendline break signals loss of momentum; price authority shifts.
  applicable_markets_and_regimes: Defined trends; breaks in choppy/sideways markets
    are noise.
  assumptions:
  - Trendline drawn on swing lows (uptrend) or highs (downtrend)
  data_requirements:
  - OHLC bars; clear swing definitions
  baseline_or_null_hypothesis: Trendline breaks are noise; reversals occur at same
    frequency as before break.
  validation_approach: Identify trendlines; measure reversal success after break.
  transaction_cost_and_fill_considerations: Entry at break may be late; volatility
    spike increases slippage.
  robustness_checks:
  - Test on daily, weekly timeframes
  - Vary trendline parameters
  rejection_criteria: If reversal occurs < 60% of the time after break, reject.
  failure_modes:
  - False breaks (price pierces, recovers above trendline)
  freshness_concerns: Subjective trendline drawing; different analysts may draw differently.
  unresolved_questions:
  - Does automation improve consistency?
  _book_id: technical-analysis-explained-2015
  _audit_grade: B
- id: TAE-HYP-004
  title: Volume surge confirms breakout
  status: proposed
  derived_from:
  - TAE-C7-001
  - TAE-CROSS-001
  statement: Breakout with volume > 2x SMA(20) has >70% success rate (continues beyond
    entry + 1%).
  proposed_mechanism: High volume confirms conviction; breakout on low volume is suspect.
  applicable_markets_and_regimes: All market conditions; more reliable in liquid instruments.
  assumptions:
  - Support/resistance defined by prior swing highs/lows
  - Volume SMA = 20-day average
  data_requirements:
  - OHLC + Volume
  baseline_or_null_hypothesis: Volume at breakout uncorrelated with success.
  validation_approach: Identify breakouts; separate high-volume vs low-volume; measure
    win rates.
  transaction_cost_and_fill_considerations: High volume = better fills; slippage minimal.
  robustness_checks:
  - Test volume threshold (1.5x, 2x, 3x SMA)
  rejection_criteria: If high-volume breakouts < 70% success rate, reject.
  failure_modes:
  - Volume spike on failed breakout (head-fake)
  freshness_concerns: 'Modern markets: HFT may mask real volume.'
  unresolved_questions:
  - Does volume concentration matter more than aggregate volume?
  _book_id: technical-analysis-explained-2015
  _audit_grade: B
- id: TAE-HYP-005
  title: Head-and-shoulders pattern reversal
  status: proposed
  derived_from:
  - TAE-C8-001
  statement: After H&S pattern, neckline break predicts 60%+ reversal within 10 bars;
    target = H&S height.
  proposed_mechanism: Distribution at resistance; price exhaustion at head.
  applicable_markets_and_regimes: Trending markets near reversals.
  assumptions:
  - 'H&S criteria: shoulders at similar height, head clearly above, neckline horizontal'
  data_requirements:
  - OHLC bars; clear candlestick visualization helpful
  baseline_or_null_hypothesis: H&S patterns random; neckline break has no predictive
    power.
  validation_approach: Identify H&S patterns; measure reversal % and price target
    accuracy.
  transaction_cost_and_fill_considerations: Entry at neckline break; slippage and
    stop placement critical.
  robustness_checks:
  - Test on different timeframes
  - Vary shoulder symmetry tolerance
  rejection_criteria: If reversal < 60% or target accuracy < 50%, reject.
  failure_modes:
  - H&S may be false (followed by continuation)
  freshness_concerns: Heavily studied pattern; algorithmic recognition possible.
  unresolved_questions:
  - Does failed H&S predict continuation?
  _book_id: technical-analysis-explained-2015
  _audit_grade: B
- id: TAE-HYP-006
  title: Bollinger Band extreme reversion
  status: proposed
  derived_from:
  - TAE-C12-001
  statement: When price touches upper BB, next 5-bar close < open (reversal) in 65%+
    of cases.
  proposed_mechanism: Volatility-adjusted overbought/oversold; mean reversion to middle
    band.
  applicable_markets_and_regimes: Range-bound markets; ineffective in strong trends.
  assumptions:
  - 'BB parameters: SMA(20) + 2*StDev'
  data_requirements:
  - OHLC; volatility
  baseline_or_null_hypothesis: BB touches uncorrelated with mean reversion.
  validation_approach: Track BB touches; measure reversal frequency.
  transaction_cost_and_fill_considerations: Entry challenging (price already at extreme);
    tight stops needed.
  robustness_checks:
  - Test BB periods (10, 15, 20, 30)
  - Test multiples (1.5, 2, 2.5 SD)
  rejection_criteria: If reversal < 65%, reject.
  failure_modes:
  - Breakout through BB in strong trend
  freshness_concerns: Heavily studied; potential for regime shifts.
  unresolved_questions:
  - Does volatility level determine BB touch predictability?
  _book_id: technical-analysis-explained-2015
  _audit_grade: B
- id: TAE-HYP-007
  title: MACD signal crossover predicts trend change
  status: proposed
  derived_from:
  - TAE-C14-001
  statement: When MACD crosses above Signal line, trend up (win rate 55%+); when below,
    trend down (55%+).
  proposed_mechanism: MACD momentum change precedes price change.
  applicable_markets_and_regimes: All regimes; less effective in choppy/sideways.
  assumptions:
  - MACD = EMA(12) - EMA(26); Signal = EMA(9)
  data_requirements:
  - Closing prices for EMA computation
  baseline_or_null_hypothesis: MACD crossovers random; win rate = 50%.
  validation_approach: Backtest MACD crossover signals; measure win rate and payoff.
  transaction_cost_and_fill_considerations: Entry delay (~1 bar) due to lag in MACD
    computation.
  robustness_checks:
  - Test EMA periods
  rejection_criteria: If win rate < 55% or Sharpe < 0.3, reject.
  failure_modes:
  - False crosses in choppy markets
  freshness_concerns: Heavily studied; unlikely to be profitable alone.
  unresolved_questions:
  - Does MACD histogram divergence improve signals?
