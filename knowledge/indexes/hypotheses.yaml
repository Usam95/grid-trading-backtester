  - How do regimes affect returns?
  - What is the Sharpe ratio post-costs?
  _book_id: tiny-book-massive-returns-long-term-investing-and-timing-exc
  _audit_grade: C
- id: TBMR-HYP-003
  title: Backtesting results do not persist forward
  status: proposed
  derived_from:
  - TBMR-C10-010
  statement: Diamond Strategy backtest results significantly overestimate forward
    returns due to overfitting and regime shifts
  proposed_mechanism: Strategy parameters optimized on historical data that no longer
    reflect current market conditions
  applicable_markets_and_regimes: All assets and regimes
  assumptions:
  - No market structure changes
  - Historical cost assumptions remain valid
  data_requirements:
  - Out-of-sample test data
  - Forward-testing results
  - Parameter sensitivity analysis
  baseline_or_null_hypothesis: Backtest results accurately predict forward performance
  validation_approach: Compare backtest returns (in-sample) vs live trading results
    (out-of-sample); measure overfitting
  transaction_cost_and_fill_considerations: Backtests often underestimate real costs;
    use realistic slippage
  robustness_checks: Sensitivity analysis on key parameters; stress tests; regime-based
    return decomposition
  rejection_criteria: Forward Sharpe ratio > 90% of backtest Sharpe ratio indicates
    acceptable accuracy
  failure_modes:
  - Parameter overfitting
  - Regime shift renders strategy unprofitable
  - Regulatory changes reduce liquidity
  freshness_concerns: Old data (case studies span decades); strategy may be stale
  unresolved_questions:
