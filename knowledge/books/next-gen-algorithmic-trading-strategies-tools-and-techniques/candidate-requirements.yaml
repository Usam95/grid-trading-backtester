- id: NEXTGEN-REQ-001
  title: "Slippage model must include market impact and adverse selection"
  status: "proposed"
  derived_from:
    - NEXTGEN-C8-002
  derivation_type: "direct_book_recommendation"
  rationale: "Flat-rate slippage inflates backtest returns by 20-50%."
  applies_to:
    strategy:
      - grid
      - stock_signal
    lifecycle:
      - backtest
      - live
    asset_class:
      - equities
      - crypto_spot
    concern:
      - simulation
      - execution
      - reproducibility
  requirement: "Backtester shall model slippage as floor_spread + market_impact(order_size, depth) + adverse_selection(volatility, imbalance)."
  acceptance_tests: "Backtest slippage predictions match live fills within ±10bps 80% of time"
  failure_prevented: "Overstating strategy profitability"
  capability_enabled: "Accurate backtest vs. live comparison"
  assumptions:
    - "Historical order-book data available"
  open_questions: "Per-stock vs. sector model?"
  dependencies: null
  verification_needed: "Compare backtest vs. paper fills"
  priority_hint: "correctness"

- id: NEXTGEN-REQ-002
  title: "Strategy development shall enforce walk-forward validation"
  status: "proposed"
  derived_from:
    - NEXTGEN-C5-001
  derivation_type: "direct_book_recommendation"
  rationale: "Single train/test splits overestimate edge 40-60%."
  applies_to:
    strategy:
      - grid
      - stock_signal
      - shared
    lifecycle:
      - research
      - backtest
    asset_class:
      - shared
    concern:
      - simulation
      - reproducibility
      - alpha
  requirement: "All optimization pipelines shall use rolling walk-forward (1-year train, 3-month test) and report in-sample/out-of-sample Sharpe."
  acceptance_tests: "Reports include in-sample, out-of-sample, degradation %; degradation <35%"
  failure_prevented: "Deploying overfit strategies"
  capability_enabled: "Realistic performance estimates"
  assumptions:
    - "Market regimes stationary within 1-year windows"
  open_questions: "Optimal train/test ratio?"
  dependencies: null
  verification_needed: "Test on known overfit strategies"
  priority_hint: "correctness"

