  requirement: "All backtests shall designate final 10% as hold-out (no optimization). Report in-sample/out-of-sample metrics with degradation %."
  acceptance_tests: "Hold-out labeled; no optimization on hold-out; degradation <35%"
  failure_prevented: "False positives from overfitting"
  capability_enabled: "Confidence in edge validity"
  assumptions:
    - "Hold-out representative of future"
  open_questions: "Most recent or random hold-out?"
  dependencies: null
  verification_needed: "Compare metrics"
  priority_hint: "correctness"

