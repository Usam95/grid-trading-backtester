- id: NEXTGEN-REQ-010
  title: "Ensemble strategy shall monitor component correlation"
  status: "proposed"
  derived_from:
    - NEXTGEN-C6-001
  derivation_type: "direct_book_recommendation"
  rationale: "Correlated components provide no diversification."
  applies_to:
    strategy:
      - stock_signal
      - shared
    lifecycle:
      - backtest
      - live
    asset_class:
      - equities
      - shared
    concern:
      - alpha
      - risk
      - monitoring
  requirement: "Ensemble signals shall include 3+ base learners with target correlation <0.4 (rolling 252-day). If pairwise >0.6, replace correlated learner."
  acceptance_tests: "Base learner correlations reported; weekly monitoring in live; auto-rebalance if >0.6"
  failure_prevented: "Ensemble providing no diversification"
  capability_enabled: "Robust multi-model strategies"
  assumptions:
    - "Learners trained on different data/features"
  open_questions: "Pre-selected vs. emergent uncorrelated learners?"
  dependencies: null
  verification_needed: "Compare ensemble vs. individual learner Sharpe"
  priority_hint: "correctness"
