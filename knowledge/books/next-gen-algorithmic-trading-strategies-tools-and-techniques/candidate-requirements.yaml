  requirement: "Backtester shall support market (with slippage), limit (with fill-prob model), VWAP (intraday volume), TWAP (time-weighted fills) with realistic failures."
  acceptance_tests: "Market fills immediately; limit fills at limit price; VWAP within ±0.5%"
  failure_prevented: "Unrealistic execution assumptions"
  capability_enabled: "Accurate per-method performance"
  assumptions:
    - "Order book data available"
  open_questions: "Strategy-specific vs. global methods?"
  dependencies: null
  verification_needed: "Compare backtest vs. live VWAP/TWAP"
