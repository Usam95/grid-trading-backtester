- id: NEXTGEN-REQ-004
  title: "Risk monitor shall detect correlation breakdown and halt"
  status: "proposed"
  derived_from:
    - NEXTGEN-C9-002
  derivation_type: "agent_inference"
  rationale: "Diversification benefits evaporate during crises."
  applies_to:
    strategy:
      - portfolio
      - shared
    lifecycle:
      - live
    asset_class:
      - equities
      - shared
    concern:
      - risk
      - monitoring
      - operations
  requirement: "Portfolio monitor shall compute rolling 20-day correlations; if pairwise >0.7 or 10-day drawdown >15%, halt new entries and liquidate."
  acceptance_tests: "Correlation alert at >0.7; drawdown halt within 1min"
  failure_prevented: "Catastrophic losses during crisis"
  capability_enabled: "Early portfolio stress detection"
  assumptions:
    - "Correlation computation accurate"
  open_questions: "Market-regime adaptive thresholds?"
  dependencies: null
  verification_needed: "Backtest on 2008/2020/2022 crises"
  priority_hint: "safety"

