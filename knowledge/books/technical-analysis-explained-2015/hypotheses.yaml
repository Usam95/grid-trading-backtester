- id: "TAE-HYP-001"
  title: "RSI mean reversion at extremes"
  status: "proposed"
  derived_from:
    - "TAE-C13-001"
    - "TAE-C13-002"
  statement: "When RSI(14) > 70, price will revert downward by at least 1% within 5 bars; when RSI < 30, price will revert upward by at least 1% within 5 bars."
  proposed_mechanism: "Overbought/oversold conditions trigger profit-taking or short-covering."
  applicable_markets_and_regimes: "Equities in range-bound or mean-reversion environments; ineffective in strong trends."
  assumptions:
    - "RSI period = 14 bars"
    - "No gap fills or limit moves prevent mean reversion"
  data_requirements:
    - "OHLC bars"
    - "RSI(14) computed from close"
  baseline_or_null_hypothesis: "RSI at extreme levels has no predictive power; reversals occur at same frequency as non-extreme readings."
  validation_approach: "Backtest: identify RSI > 70 and < 30 points; measure % reversals within 5 bars; compare win rate to random entry."
  transaction_cost_and_fill_considerations: "Entry slippage 1-2 ticks; exit at 1% profit may miss longer moves; tight stops needed to limit losses."
  robustness_checks:
    - "Test on multiple timeframes (5min, 1H, daily)"
    - "Test on different asset classes"
    - "Vary RSI period and threshold"
  rejection_criteria: "If win rate < 50% or payoff ratio < 1.2 over >1000 trades, hypothesis rejected."
  failure_modes:
    - "RSI whipsaw in strong trends"
    - "Slippage exceeds 1% profit target"
  freshness_concerns: "2015 text; modern high-frequency trading may reduce mean reversion periods."
  unresolved_questions:
    - "Are RSI extremes more predictive after specific market structure shifts?"
    - "Does regime (VIX, volatility) affect success rate?"

- id: "TAE-HYP-002"
  title: "MA crossover trend identification"
  status: "proposed"
  derived_from:
    - "TAE-C11-001"
    - "TAE-CROSS-001"
  statement: "When SMA(10) crosses above SMA(50), initiate long; when SMA(10) crosses below SMA(50), initiate short. Hold until opposite crossover."
  proposed_mechanism: "MA crossover signals trend initiation; golden cross (fast above slow) indicates bullish momentum."
  applicable_markets_and_regimes: "Trending markets; breakdowns in range-bound/choppy conditions."
  assumptions:
    - "SMA periods: 10 (fast), 50 (medium)"
  data_requirements:
    - "OHLC bars; closing price for SMA"
  baseline_or_null_hypothesis: "MA crossovers have no predictive power; random entry yields same risk-adjusted returns."
  validation_approach: "Backtest crossover signals; measure win rate, Sharpe, maximum drawdown vs buy-and-hold."
  transaction_cost_and_fill_considerations: "Slippage 1-3 ticks on entry; MA lag means entry after trend already started."
  robustness_checks:
    - "Test periods: (10,50), (20,100), (5,20)"
    - "Compare SMA vs EMA"
  rejection_criteria: "If Sharpe < 0.5 or win rate < 45% over >500 trades, reject."
  failure_modes:
    - "Late entry due to MA lag"
    - "Whipsaws in choppy markets"
  freshness_concerns: "Heavily studied; unlikely to be profitable alone in modern markets."
  unresolved_questions:
    - "Does combining MA with volume confirmation improve results?"

- id: "TAE-HYP-003"
  title: "Trendline break as reversal signal"
  status: "proposed"
  derived_from:
    - "TAE-C6-001"
    - "TAE-CROSS-001"
  statement: "When price closes below (in uptrend) or above (in downtrend) a 2+ bar trendline, reversal probability is >60%."
  proposed_mechanism: "Trendline break signals loss of momentum; price authority shifts."
  applicable_markets_and_regimes: "Defined trends; breaks in choppy/sideways markets are noise."
  assumptions:
    - "Trendline drawn on swing lows (uptrend) or highs (downtrend)"
  data_requirements:
    - "OHLC bars; clear swing definitions"
  baseline_or_null_hypothesis: "Trendline breaks are noise; reversals occur at same frequency as before break."
  validation_approach: "Identify trendlines; measure reversal success after break."
  transaction_cost_and_fill_considerations: "Entry at break may be late; volatility spike increases slippage."
  robustness_checks:
    - "Test on daily, weekly timeframes"
    - "Vary trendline parameters"
  rejection_criteria: "If reversal occurs < 60% of the time after break, reject."
  failure_modes:
    - "False breaks (price pierces, recovers above trendline)"
  freshness_concerns: "Subjective trendline drawing; different analysts may draw differently."
  unresolved_questions:
    - "Does automation improve consistency?"

- id: "TAE-HYP-004"
  title: "Volume surge confirms breakout"
  status: "proposed"
  derived_from:
    - "TAE-C7-001"
    - "TAE-CROSS-001"
  statement: "Breakout with volume > 2x SMA(20) has >70% success rate (continues beyond entry + 1%)."
  proposed_mechanism: "High volume confirms conviction; breakout on low volume is suspect."
  applicable_markets_and_regimes: "All market conditions; more reliable in liquid instruments."
  assumptions:
    - "Support/resistance defined by prior swing highs/lows"
    - "Volume SMA = 20-day average"
  data_requirements:
    - "OHLC + Volume"
  baseline_or_null_hypothesis: "Volume at breakout uncorrelated with success."
  validation_approach: "Identify breakouts; separate high-volume vs low-volume; measure win rates."
  transaction_cost_and_fill_considerations: "High volume = better fills; slippage minimal."
  robustness_checks:
    - "Test volume threshold (1.5x, 2x, 3x SMA)"
  rejection_criteria: "If high-volume breakouts < 70% success rate, reject."
  failure_modes:
    - "Volume spike on failed breakout (head-fake)"
  freshness_concerns: "Modern markets: HFT may mask real volume."
  unresolved_questions:
    - "Does volume concentration matter more than aggregate volume?"

