- id: "TAE-REQ-011"
  title: "Implement multi-indicator confirmation rule"
  status: "proposed"
  derived_from:
    - "TAE-CROSS-001"
  derivation_type: "agent_inference"
  rationale: "Multi-indicator convergence (trendline + MA + MACD + volume) yields 70%+ win rate vs 55% single."
  applies_to:
    strategy: ["stock_signal", "shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities"]
    concern: ["alpha"]
  requirement: "Shall generate entry signal ONLY when 4+ confirmations within 2 bars: trendline break, MA crossover, MACD cross, volume >2x SMA(20)."
  acceptance_tests:
    - "System counts confirmations correctly"
    - "4-confirmation signals >= 70% win rate"
    - "1-2 confirmation signals <= 55% win rate"
    - "Entry delay < 2 bars"
  failure_prevented: "false_signal_execution"
  capability_enabled: "high_confidence_signal_filtering; alpha_enhancement"
  assumptions:
    - "All 4 confirmations within 2-bar window"
  open_questions:
    - "Should confirmations be weighted differently?"
  dependencies: ["Trendline, MA, MACD, volume all available"]
  verification_needed: "Backtest win rate by confirmation count; measure entry timing"
  priority_hint: "alpha"

