- id: "TAE-REQ-005"
  title: "Compute Bollinger Bands and detect extremes"
  status: "proposed"
  derived_from:
    - "TAE-C12-001"
  derivation_type: "direct_book_recommendation"
  rationale: "Bollinger Bands detect overbought/oversold with 65%+ reversion accuracy."
  applies_to:
    strategy: ["grid", "stock_signal", "shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities", "shared"]
    concern: ["alpha"]
  requirement: "Shall compute BB(SMA(20) ± 2*StDev); flag overbought when close > upper, oversold when < lower."
  acceptance_tests:
    - "BB values match standard TA libraries ±0.01%"
    - "Extreme detection on close outside band"
    - "Backtest mean reversion after extreme 65%+ accuracy"
  failure_prevented: "missing_mean_reversion_signals"
  capability_enabled: "overbought_oversold_detection; range_trading"
  assumptions:
    - "SMA(20) middle, ±2 StDev bands"
  open_questions:
    - "Should StDev period differ from MA?"
  dependencies: ["OHLC price data stream"]
  verification_needed: "Backtest BB extreme reversion across timeframes and assets"
  priority_hint: "operability"

- id: "TAE-REQ-006"
  title: "Compute RSI(14) and detect extremes"
  status: "proposed"
  derived_from:
    - "TAE-C13-001"
  derivation_type: "direct_book_recommendation"
  rationale: "RSI extremes (>70, <30) predict mean reversion per Pring."
  applies_to:
    strategy: ["grid", "stock_signal", "shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities"]
    concern: ["alpha"]
  requirement: "Shall compute RSI(14)=100-100/(1+RS); flag RSI>70 overbought, RSI<30 oversold."
  acceptance_tests:
    - "RSI values match standard libraries ±1 point"
    - "Overbought/oversold flags at correct thresholds"
    - "Backtest RSI extreme mean reversion 55%+ win rate"
  failure_prevented: "unsignaled_momentum_extremes"
  capability_enabled: "mean_reversion_signals; momentum_divergence_detection"
  assumptions:
    - "RSI period = 14 bars; thresholds 70/30"
  open_questions:
    - "Should thresholds adapt by asset class?"
  dependencies: ["OHLC price data stream"]
  verification_needed: "Unit test RSI formula against standard implementations"
  priority_hint: "correctness"

- id: "TAE-REQ-007"
