- id: "TAE-REQ-001"
  title: "Compute support and resistance levels"
  status: "proposed"
  derived_from:
    - "TAE-C5-001"
    - "TAE-CROSS-002"
  derivation_type: "direct_book_recommendation"
  rationale: "Pring identifies support/resistance as foundational. Book claims 65%+ test accuracy."
  applies_to:
    strategy: ["grid", "stock_signal", "shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities", "shared"]
    concern: ["alpha", "data"]
  requirement: "Shall compute support as prior swing lows, resistance as prior swing highs; update dynamically."
  acceptance_tests:
    - "Levels match manual inspection ±1%"
    - "Identifies S/R holds in >= 65% of tests"
  failure_prevented: "price_breakaway_without_warning"
  capability_enabled: "support_resistance_based_trading; risk_management"
  assumptions:
    - "Swing: high > prior 10 bars, low < prior 10 bars"
  open_questions:
    - "How many bars back for S/R history?"
  dependencies: ["OHLC data stream"]
  verification_needed: "Backtest 500+ tests measuring hold rate accuracy"
  priority_hint: "correctness"

- id: "TAE-REQ-002"
