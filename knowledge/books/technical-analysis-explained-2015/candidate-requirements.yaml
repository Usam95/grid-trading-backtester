    lifecycle: ["backtest", "live"]
    asset_class: ["equities"]
    concern: ["alpha"]
  requirement: "Shall identify divergences: price new high but MACD/OBV lower; flag as reversal signal."
  acceptance_tests:
    - "Divergence detection identifies peaks correctly"
    - "Backtest divergence 60%+ reversal accuracy within 10 bars"
  failure_prevented: "unsignaled_momentum_failure"
  capability_enabled: "reversal_signals; momentum_failure_detection"
  assumptions:
    - "Divergence: price HH but momentum LL (or vice versa)"
  open_questions:
    - "Auto-detect or accept manual input?"
  dependencies: ["OHLC, Volume; MACD/OBV/RSI indicators"]
  verification_needed: "Backtest divergence predictive power across assets and regimes"
  priority_hint: "research_quality"

