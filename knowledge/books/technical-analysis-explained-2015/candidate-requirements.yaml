    - "Break fires on first close outside"
    - "Backtest >= 55% win rate over 500+ trades"
  failure_prevented: "late_trend_reversal_detection"
  capability_enabled: "trend_reversal_signals; automated_entry_logic"
  assumptions:
    - "2+ touches define trendline"
    - "Close outside = break (not intrabar)"
  open_questions:
