notes: |
  This is Alexander Elder's companion study guide to The New Trading for a Living (2014).
  Format is Q&A with rating scales for self-assessment. Strong emphasis on individual psychology,
  risk management discipline, and cost structures. Conceptual and pedagogical in tone; not empirical.
  Core value for backtesting/execution frameworks; limited for data engineering or ML applications.
  Commission/slippage figures and broker platforms require freshness verification.
