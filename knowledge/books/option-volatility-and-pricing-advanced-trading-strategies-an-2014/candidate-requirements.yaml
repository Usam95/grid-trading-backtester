- id: "OVAP-R001"
  title: "Dynamic Greeks computation with real-time vol surface"
  status: "proposed"
  derived_from: ["OVAP-C8-I006", "OVAP-C8-I005"]
  derivation_type: "agent_inference"
  rationale: "Greeks depend on current implied vol surface; static vol breaks hedging. Requirement: system computes Greeks at every trade"
  applies_to:
    strategy: ["shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities", "crypto_spot"]
    concern: ["execution", "data", "reproducibility"]
  requirement: "System shall compute Delta, Gamma, Theta, Vega, Rho at <50ms latency using live vol surface; update interval <= 100ms"
  acceptance_tests: "Given live vol data, Greeks computed vs benchmark Black-Scholes; max error <0.1%; P&L drift <0.01% over hour"
  failure_prevented: "Position hedging failure; P&L gaps between reported and realized Greeks"
  capability_enabled: null
  assumptions: ["Vol surface is observable and stable within 100ms", "Underlying price/rates available", "Greeks model (BS) adequate"]
  open_questions: ["Handling overnight vol gaps?", "Integration with broker Greeks API?", "Extrapolation at vol surface edges?"]
  dependencies: ["data_pipeline_live_vol_surface", "market_data_integration", "backend_compute_platform"]
  verification_needed: "Unit test Greeks vs closed-form formulas; integration test vs broker API; backtest P&L reconciliation"
  priority_hint: "correctness"

- id: "OVAP-R002"
  title: "Transaction cost modeling for option entry/exit"
  status: "proposed"
  derived_from: ["OVAP-C5-I026", "OVAP-C4-I025"]
  derivation_type: "agent_inference"
  rationale: "Bid-ask spreads, commissions, and market impact consume 1-5% per round-trip. Backtester must model realistically or strategies appear profitable but fail in live"
  applies_to:
    strategy: ["stock_signal"]
    lifecycle: ["backtest"]
    asset_class: ["equities"]
    concern: ["simulation", "data"]
  requirement: "Backtester shall model bid-ask as function of spread, liquidity, contract size, moneyness; apply realistic commissions; measure fill slippage"
  acceptance_tests: "Compare backtest P&L vs live P&L; reconcile within 2%; verify strategy remains profitable after costs"
  failure_prevented: "False positive strategies; over-optimization; live trading losses"
  capability_enabled: null
  assumptions: ["Historical bid-ask data available", "Cost model valid across time periods", "Commissions do not change drastically"]
  open_questions: ["How to handle intraday volatility of spreads?", "Forward-test on live market?", "Cost model generalization?"]
  dependencies: ["historical_bid_ask_data_feeds", "market_microstructure_model", "fill_simulation_engine"]
  verification_needed: "Backtest on instruments with known live results; measure final P&L prediction error; stakeholder sign-off on cost assumptions"
  priority_hint: "correctness"

- id: "OVAP-R003"
  title: "Ratio spread position limits with margin checks"
  status: "proposed"
  derived_from: ["OVAP-C12-I012"]
  derivation_type: "agent_inference"
  rationale: "Ratio spreads (sell far, buy near at different quantities) create unlimited loss on adverse moves. Requires tight position limits and margin reconciliation"
  applies_to:
    strategy: ["shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities"]
    concern: ["risk", "monitoring"]
  requirement: "System shall enforce max position size limits on ratio spreads; compute worst-case margin requirement (max loss + buffer); reject orders exceeding limits"
  acceptance_tests: "Place ratio spread order; verify order rejected if margin insufficient; verify limits scale with account size"
  failure_prevented: "Account blowout from unexpected margin calls; losses on tail events"
  capability_enabled: null
  assumptions: ["Broker margin rules known and stable", "Worst-case loss can be computed", "Account funding is monitored"]
  open_questions: ["How to handle exotic spread combinations?", "Real-time margin sync with broker?", "Margin buffer sizing?"]
  dependencies: ["margin_calculator", "broker_integration", "position_database"]
  verification_needed: "Paper trade ratio spreads; verify limits enforced; stress test tail scenarios"
  priority_hint: "operability"

- id: "OVAP-R004"
  title: "American option exercise model with rational exerciser assumptions"
  status: "proposed"
  derived_from: ["OVAP-C16-I015", "OVAP-C16-I016"]
  derivation_type: "agent_inference"
  rationale: "American options behave differently from European; early exercise risk must be priced and hedged. Backtester requires American option pricing model"
  applies_to:
    strategy: ["stock_signal"]
    lifecycle: ["backtest"]
    asset_class: ["equities"]
    concern: ["simulation", "data"]
  requirement: "Backtester shall implement American option pricing with binomial/trinomial model or approximation (e.g., Barone-Adesi-Whaley); flag exercises and adjust P&L"
  acceptance_tests: "Price American put vs European; verify early exercise premium > 0; reconcile with benchmark (e.g., QuantLib)"
  failure_prevented: "Mispricing of American option P&L; hedging errors on early exercise"
  capability_enabled: null
  assumptions: ["Dividend dates are known", "Exercise is rational (intrinsic > continuation)", "Model parameters (rates, div yield) accurate"]
  open_questions: ["How to validate exercise model against market data?", "Computational cost at scale?", "Parameter sensitivity?"]
  dependencies: ["pricing_library", "dividend_data_feed", "backtest_engine"]
  verification_needed: "Unit test pricing vs benchmark; integration test with historical American option prices; paper trade comparison"
  priority_hint: "operability"

- id: "OVAP-R005"
  title: "Volatility clustering adjustment for risk forecasting"
  status: "proposed"
  derived_from: ["OVAP-C19-I019"]
  derivation_type: "agent_inference"
  rationale: "Realized vol exhibits clustering (high vol today => high vol tomorrow). Ignoring clustering under-estimates tail risk and margin requirements"
  applies_to:
    strategy: ["shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities"]
    concern: ["risk", "monitoring"]
  requirement: "Risk system shall compute conditional vol forecasts (e.g., GARCH, regime-conditional model) and use for VaR/margin; update daily"
  acceptance_tests: "Compute VaR using static vol vs GARCH vol; verify GARCH VaR is higher during vol spikes; backtest VaR accuracy"
  failure_prevented: "Underestimated margin requirements during crisis periods; unexpected liquidations"
  capability_enabled: null
  assumptions: ["Vol clustering is statistically significant and persistent", "GARCH/regime model parameters updatable", "Historical vol data available"]
  open_questions: ["Regime detection method?", "Parameter estimation window?", "Forecast horizon optimization?"]
  dependencies: ["volatility_forecasting_model", "risk_dashboard", "margin_engine"]
  verification_needed: "Backtest VaR forecast accuracy during known market stress events; compare vs 2008 crisis"
  priority_hint: "research_quality"

- id: "OVAP-R006"
  title: "Dynamic margin requirement calculation with gamma sensitivity"
  status: "proposed"
  derived_from: ["OVAP-C8-I006", "OVAP-C23-I023"]
  derivation_type: "agent_inference"
  rationale: "Gamma makes positions non-linear; static margin inadequate. Margin must scale with gamma and potential vol moves"
  applies_to:
    strategy: ["shared"]
    lifecycle: ["backtest", "live"]
    asset_class: ["equities"]
    concern: ["risk", "monitoring"]
  requirement: "Margin engine shall compute margin as function of Gamma + expected_vol_move + scenario_analysis; update in real-time; flag if insufficient"
  acceptance_tests: "Margin requirement increases when gamma is high; decreases when gamma is low; margin is sufficient in 99% of daily scenarios"
  failure_prevented: "Margin call surprises; forced liquidations at bad prices"
  capability_enabled: null
  assumptions: ["Daily vol moves are bounded (e.g., ±50 IV points)", "Gamma sensitivity is accurately modeled", "Broker accepts dynamic margin"]
  open_questions: ["Vol move scenarios to use?", "How to bound worst case?", "Broker coordination challenges?"]
  dependencies: ["greek_computation", "vol_scenario_generator", "broker_margin_api"]
  verification_needed: "Historical margin vs realized margin check; stress test with extreme vol moves"
  priority_hint: "operability"

