limitations_and_warnings:
  - "2012 publication; post-2008 crisis regulatory environment (Dodd-Frank, central clearing) differs materially from book's context."
  - "Broker APIs, margin requirements, commissions, and transaction costs have evolved; examples use historical rates."
  - "Volatility smile/skew models in the book are empirical observations; no discussion of stochastic volatility or jump models."
  - "Early exercise decisions (Chapter 8) depend on dividend scheduling and carry rates; requires live reconciliation."
  - "Interest-rate assumptions (rho) are low-rate era (2012); framework is sound but coefficient magnitudes have shifted."
  - "Index options, equity options examples may not reflect current market microstructure (tick sizes, spreads, liquidity concentrations)."

