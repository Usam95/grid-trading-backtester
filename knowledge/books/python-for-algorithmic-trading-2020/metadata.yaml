limitations_and_warnings:
  - "FXCM and Oanda API details are subject to rapid change; endpoint URLs, authentication schemes, and fee structures should be verified against current documentation before use."
  - "Code examples focus on pedagogical clarity over production robustness; missing error handling, logging, and state management common in live systems."
  - "Backtesting assumes zero slippage, fixed commissions, and no gaps; real market microstructure differs significantly."
  - "ML models use simple linear regression and logistic regression; no cross-validation, walk-forward validation, or out-of-sample testing methodology is detailed."
  - "Capital management examples use Kelly Criterion but do not address regime change, correlation drift, or drawdown constraints typical of live portfolios."
  - "No discussion of market impact, order routing, or latency effects beyond basic concepts."
