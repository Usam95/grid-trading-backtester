- id: OPTCOURSE-REQ-005
  title: Volatility surface representation
  status: proposed
  derived_from:
    - OPTCOURSE-ch2-002
    - OPTCOURSE-ch7-015
  derivation_type: direct_book_recommendation
  rationale: Flat IV assumptions underestimate tail risk and miscalculate Greeks; smile/skew is empirically stable
  applies_to:
    strategy:
      - stock_signal
    lifecycle:
      - backtest
      - live
    asset_class:
      - equities
    concern:
      - data
      - simulation
  requirement: Shall represent implied volatility surface (smile/skew) for accurate option pricing across strikes and maturities
  acceptance_tests:
    - iv_surface_calibration
    - greek_accuracy_across_strikes
    - tail_risk_modeling
  failure_prevented: Underestimation of tail risk; inaccurate Greeks in wings
  capability_enabled: Realistic backtesting and risk management
  assumptions:
    - market_data_includes_iv_surface
  open_questions:
    - volatility_term_structure_modeling
    - regime_dependent_smile_changes
  dependencies:
    - OPTCOURSE-REQ-001
  verification_needed: research_paper_validation
  priority_hint: correctness

- id: OPTCOURSE-REQ-006
  title: Execution slippage modeling
  status: proposed
  derived_from:
    - OPTCOURSE-ch13-025
  derivation_type: direct_book_recommendation
  rationale: Spread orders incur coordinated execution costs often underestimated in backtest; leads to overoptimistic P&L projections
  applies_to:
    strategy:
      - stock_signal
    lifecycle:
      - backtest
      - live
    asset_class:
      - equities
    concern:
      - execution
      - simulation
  requirement: Shall model bid-ask spread impact and fill probability for multi-leg orders based on underlying liquidity
  acceptance_tests:
    - spread_slippage_by_liquidity
    - multi_leg_coordination_cost
    - backtest_realism_validation
  failure_prevented: Overestimated backtest P&L due to execution cost underestimation
  capability_enabled: Realistic backtest and forward performance alignment
  assumptions:
    - market_microstructure_data_available
  open_questions:
    - dynamic_spread_modeling
    - liquidity_regime_detection
  dependencies: []
  verification_needed: empirical_data_analysis
  priority_hint: operability
