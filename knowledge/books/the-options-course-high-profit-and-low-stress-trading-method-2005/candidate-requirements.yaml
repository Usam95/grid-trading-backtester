- id: OPTCOURSE-REQ-001
  title: Greeks calculation accuracy
  status: proposed
  derived_from:
    - OPTCOURSE-ch6-011
    - OPTCOURSE-ch6-012
  derivation_type: direct_book_recommendation
  rationale: Greeks-based position sizing and risk management depend on calculation accuracy for reliable backtesting
  applies_to:
    strategy:
      - stock_signal
    lifecycle:
      - backtest
    asset_class:
      - equities
    concern:
      - simulation
      - data
  requirement: Shall calculate delta, gamma, theta, vega, rho with accuracy within 0.01% of market data for backtesting validation
  acceptance_tests:
    - validate_against_market_prices
    - compare_greek_values_to_bloomberg
  failure_prevented: Inaccurate Greeks lead to incorrect position sizing
  capability_enabled: Reliable Greeks-based risk management
  assumptions:
    - market_data_available
    - option_pricing_model_accuracy
  open_questions: []
  dependencies: []
  verification_needed: implementation_review
  priority_hint: correctness

- id: OPTCOURSE-REQ-002
  title: Position monitoring and alert system
  status: proposed
  derived_from:
    - OPTCOURSE-ch11-022
  derivation_type: direct_book_recommendation
  rationale: Adjustments require timely detection of adverse movement; real-time monitoring prevents forced liquidations
  applies_to:
    strategy:
      - stock_signal
    lifecycle:
      - live
    asset_class:
      - equities
    concern:
      - execution
      - monitoring
      - operations
  requirement: Shall monitor open positions and trigger alerts when price approaches strike levels, defined loss limits, or expiration windows
  acceptance_tests:
    - alert_triggers_at_price_thresholds
    - alert_latency_under_100ms
  failure_prevented: Missed adjustment opportunities; forced liquidations
  capability_enabled: Proactive position management
  assumptions:
    - market_data_real_time
    - notification_delivery_reliable
  open_questions: []
  dependencies: []
  verification_needed: integration_testing
  priority_hint: correctness

- id: OPTCOURSE-REQ-003
  title: Multi-leg order execution
  status: proposed
  derived_from:
    - OPTCOURSE-ch13-026
  derivation_type: direct_book_recommendation
  rationale: Partial fills create unintended directional exposure; atomic multi-leg orders minimize risk
  applies_to:
    strategy:
      - stock_signal
    lifecycle:
      - live
    asset_class:
      - equities
    concern:
      - execution
      - operations
  requirement: Shall support atomic execution of multi-leg spreads to minimize fill risk and execution slippage
  acceptance_tests:
    - all_or_nothing_fill_logic
    - partial_fill_rejection
    - leg_coordination_tests
  failure_prevented: Unintended directional exposure from partial fills
  capability_enabled: Safe multi-leg spread entry
  assumptions:
    - broker_api_supports_spreads
  open_questions:
    - fallback_to_sequential_legs_if_spread_unavailable
  dependencies: []
  verification_needed: broker_api_testing
  priority_hint: correctness

