notes: |
  Extraction completed per WORKER_PROMPT.md contract. Book provides comprehensive taxonomy of options strategies and risk management principles. No quantitative validation provided in original source; all hypotheses and requirements are proposed candidates requiring empirical verification. 
  
  Regime detection and volatility forecasting are key dependencies for live deployment; book treatment is heuristic-based, not algorithmic. Recommend robust statistical regime detection and IV surface modeling as implementation priorities.
  
  Broker and margin rule specifics (Chapter 12, 14) are 2005-dated; must be cross-checked against current regulations and broker documentation before use.
