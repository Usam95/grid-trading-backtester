[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridlab"
version = "1.0.0"
description = "gridlab — a correct, fast, extensible grid-trading backtesting engine (spot & futures)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "gridlab" }]
keywords = ["backtesting", "grid-trading", "quant", "crypto", "trading"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
fast = ["numba>=0.58"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]
all = ["numba>=0.58", "pytest>=7.0", "pytest-cov>=4.0", "hypothesis>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gridlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
