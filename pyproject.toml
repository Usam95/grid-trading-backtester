[tool.uv]
required-version = "==0.11.16"
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "gridlab",
    "gridlab-studio",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "hypothesis>=6.0",
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "gridlab/tests",
    "gridlab-studio/tests",
]
pythonpath = [
    "gridlab/src",
    "gridlab-studio",
]
addopts = "-q"

