[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridlab-studio"
version = "1.0.0"
description = "A beautiful, informative web studio for the gridlab grid-trading backtester."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gridlab" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "gridlab",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
gridlab-studio = "backend.app:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.sources]
gridlab = { workspace = true }
