<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>gridlab studio — grid trading backtester</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white'>⊞</text></svg>" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">⊞</div>
        <div>
          <div class="brand-name">gridlab <span style="color:var(--brand-3)">studio</span></div>
          <div class="brand-sub">grid-trading research</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="nav-spacer"></div>
      <div class="sidebar-foot">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <span>Powered by <b>gridlab</b></span>
          <button class="btn-icon" id="theme-toggle" title="Toggle theme">◐</button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="btn-icon hidden" id="menu-btn">☰</button>
        <div>
          <h2 id="page-title">Strategy Lab</h2>
          <div class="sub" id="page-sub">Configure, simulate, and dissect a grid strategy</div>
        </div>
        <div class="topbar-spacer"></div>
        <div id="topbar-actions"></div>
      </header>
      <div class="content" id="view"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
