    function current(){const p=new URLSearchParams(location.search).get('variant')?.toUpperCase();return variants.includes(p)?p:'A'}
    function render(v){const safe=variants.includes(v)?v:'A';history.replaceState(null,'',`${location.pathname}?variant=${safe}`);document.getElementById('app').innerHTML=safe==='A'?layoutA():safe==='B'?layoutB():layoutC();document.getElementById('variantTitle').textContent=`${safe} · ${titles[safe]}`;document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===safe));document.querySelectorAll('.command').forEach(b=>b.addEventListener('click',showToast));window.scrollTo({top:0,behavior:'instant'})}
    let toastTimer;function showToast(e){const t=document.querySelector('.toast');t.querySelector('span').textContent=`“${e.currentTarget.textContent}” was not sent. This route has no API client.`;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),8000)}
    document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.variant)));
    document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const i=variants.indexOf(current());render(variants[(i+Number(b.dataset.step)+variants.length)%variants.length])}));
    addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const i=variants.indexOf(current());render(variants[(i+(e.key==='ArrowRight'?1:-1)+variants.length)%variants.length])}});
    addEventListener('popstate',()=>render(current()));render(current());
